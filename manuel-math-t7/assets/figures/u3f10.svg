<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Réduire une expression littérale</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">5x + 3 + 2x = 7x + 3 : on regroupe les termes en x.</text><rect x="80" y="155" width="340" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="250" y="209" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">5x + 3 + 2x</text><line x1="435" y1="200" x2="525" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="525,200 512.3937405670625,206.08951747755722 512.3937405670625,193.91048252244278" fill="#2E7D32"/><text x="480" y="175" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">regrouper</text><rect x="540" y="155" width="290" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="685" y="209" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">7x + 3</text><text x="455" y="295" font-family="DejaVu Serif" font-size="23" fill="#333" font-weight="normal" text-anchor="middle">5x et 2x sont des termes semblables ; 3 reste seul.</text></svg>