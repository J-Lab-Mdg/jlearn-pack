<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Produire une expression littérale</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le périmètre d’un carré de côté c : P = 4 × c = 4c.</text><rect x="140" y="165" width="160" height="160" fill="white" stroke="#1F4E79" stroke-width="4"/><text x="220" y="360" font-family="DejaVu Serif" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">c</text><text x="110" y="254" font-family="DejaVu Serif" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">c</text><rect x="440" y="205" width="380" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="630" y="259" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">P = c + c + c + c = 4c</text></svg>