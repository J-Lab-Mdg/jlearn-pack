<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Produit de puissances de même base</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">2³ × 2² = (2 × 2 × 2) × (2 × 2) = 2⁵ = 32.</text><rect x="70" y="155" width="270" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="205" y="209" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">2 × 2 × 2</text><text x="355" y="210" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="bold" text-anchor="start">×</text><rect x="385" y="155" width="200" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="485" y="209" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">2 × 2</text><text x="610" y="210" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="bold" text-anchor="start">=</text><rect x="645" y="155" width="160" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="725" y="209" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="middle">2⁵</text><text x="205" y="280" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="normal" text-anchor="middle">3 facteurs</text><text x="485" y="280" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="normal" text-anchor="middle">2 facteurs</text><text x="725" y="280" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">3 + 2 = 5 facteurs</text></svg>