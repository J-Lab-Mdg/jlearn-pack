<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer la valeur d’une expression</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">A = 3a + 2b pour a = 4 et b = 1,5 : A = 12 + 3 = 15.</text><rect x="80" y="155" width="280" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="220" y="209" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">A = 3a + 2b</text><rect x="390" y="155" width="310" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="545" y="209" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">3 × 4 + 2 × 1,5</text><rect x="730" y="155" width="190" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="825" y="209" font-family="DejaVu Serif" font-size="29" fill="#222" font-weight="normal" text-anchor="middle">A = 15</text><text x="235" y="285" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">a = 4, b = 1,5</text></svg>