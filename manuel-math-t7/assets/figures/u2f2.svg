<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="325"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Puissances d’un nombre décimal</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">(0,5)² = 0,5 × 0,5 = 0,25 et (1,2)² = 1,2 × 1,2 = 1,44.</text><rect x="80" y="155" width="390" height="95" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="275" y="211.5" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">(0,5)² = 0,25</text><rect x="530" y="155" width="390" height="95" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="725" y="211.5" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">(1,2)² = 1,44</text><text x="275" y="295" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">plus petit que 0,5</text><text x="725" y="295" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">plus grand que 1,2</text></svg>