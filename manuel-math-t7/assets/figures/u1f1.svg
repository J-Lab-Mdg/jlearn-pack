<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Décomposer un nombre décimal</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">7,35 = 7 + 0,35 : la partie entière et la partie décimale se séparent.</text><rect x="70" y="155" width="250" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="195" y="209" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="middle">7,35</text><text x="355" y="210" font-family="DejaVu Serif" font-size="36" fill="#222" font-weight="bold" text-anchor="start">=</text><rect x="400" y="155" width="180" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="490" y="209" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="middle">7</text><text x="610" y="210" font-family="DejaVu Serif" font-size="36" fill="#222" font-weight="bold" text-anchor="start">+</text><rect x="650" y="155" width="220" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="760" y="209" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="middle">0,35</text><text x="490" y="285" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="normal" text-anchor="middle">partie entière</text><text x="760" y="285" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="normal" text-anchor="middle">partie décimale</text></svg>