<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les puissances de 10</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">10¹ = 10, 10² = 100, 10³ = 1 000 : chaque marche multiplie par 10.</text><rect x="80" y="335" width="195" height="85" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="177" y="373" font-family="DejaVu Serif" font-size="30" fill="#2E7D32" font-weight="bold" text-anchor="middle">10¹</text><text x="177" y="405" font-family="DejaVu Serif" font-size="23" fill="#333" font-weight="normal" text-anchor="middle">= 10</text><rect x="295" y="280" width="195" height="140" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="392" y="318" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">10²</text><text x="392" y="350" font-family="DejaVu Serif" font-size="23" fill="#333" font-weight="normal" text-anchor="middle">= 100</text><rect x="510" y="225" width="195" height="195" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="607" y="263" font-family="DejaVu Serif" font-size="30" fill="#2E7D32" font-weight="bold" text-anchor="middle">10³</text><text x="607" y="295" font-family="DejaVu Serif" font-size="23" fill="#333" font-weight="normal" text-anchor="middle">= 1 000</text><rect x="725" y="170" width="195" height="250" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="822" y="208" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">10⁴</text><text x="822" y="240" font-family="DejaVu Serif" font-size="23" fill="#333" font-weight="normal" text-anchor="middle">= 10 000</text><line x1="180" y1="460" x2="880" y2="460" stroke="#B25000" stroke-width="4"/><polygon points="880,460 867.3937405670625,466.08951747755725 867.3937405670625,453.91048252244275" fill="#B25000"/><text x="530" y="495" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">× 10 à chaque marche</text></svg>