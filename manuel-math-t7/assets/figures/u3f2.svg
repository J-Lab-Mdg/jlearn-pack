<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer astucieusement</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">7 × 103 = 7 × (100 + 3) = 700 + 21 = 721.</text><rect x="80" y="155" width="280" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="220" y="209" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">7 × 103</text><line x1="375" y1="200" x2="450" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="450,200 437.39374056706254,206.08951747755722 437.39374056706254,193.91048252244278" fill="#2E7D32"/><rect x="465" y="155" width="310" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="620" y="209" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">7 × 100 + 7 × 3</text><text x="815" y="213" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="start">= 721</text></svg>