<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Propriétés des puissances</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">n et m sont des entiers positifs non nuls.</text><rect x="80" y="150" width="840" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="199" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">aⁿ × aᵐ = aⁿ⁺ᵐ    (2³ × 2² = 2⁵)</text><rect x="80" y="250" width="840" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="500" y="299" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">(aⁿ)ᵐ = aⁿˣᵐ    ((2³)² = 2⁶)</text><rect x="80" y="350" width="840" height="80" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="399" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">aⁿ × bⁿ = (a × b)ⁿ    (2³ × 5³ = 10³ = 1 000)</text></svg>