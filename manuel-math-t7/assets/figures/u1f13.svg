<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer une échelle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Échelle 1/500 : 4 cm sur le plan représentent 2 000 cm = 20 m dans la réalité.</text><rect x="80" y="155" width="300" height="140" fill="white" stroke="#1F4E79" stroke-width="3"/><line x1="110" y1="265" x2="350" y2="265" stroke="#C2185B" stroke-width="5"/><text x="230" y="250" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">4 cm</text><text x="230" y="185" font-family="DejaVu Serif" font-size="23" fill="#1F4E79" font-weight="normal" text-anchor="middle">plan 1/500</text><line x1="410" y1="225" x2="560" y2="225" stroke="#2E7D32" stroke-width="4"/><polygon points="560,225 547.3937405670625,231.08951747755722 547.3937405670625,218.91048252244278" fill="#2E7D32"/><text x="485" y="195" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">× 500</text><rect x="580" y="155" width="340" height="140" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="750" y="215" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="normal" text-anchor="middle">réalité</text><text x="750" y="260" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">2 000 cm = 20 m</text></svg>