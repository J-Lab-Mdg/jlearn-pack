<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Développer une expression littérale</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">4(2x + 3) = 4 × 2x + 4 × 3 = 8x + 12.</text><rect x="80" y="155" width="300" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="230" y="209" font-family="DejaVu Serif" font-size="29" fill="#222" font-weight="normal" text-anchor="middle">4(2x + 3)</text><line x1="395" y1="200" x2="470" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="470,200 457.39374056706254,206.08951747755722 457.39374056706254,193.91048252244278" fill="#2E7D32"/><rect x="485" y="155" width="330" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="650" y="209" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">4 × 2x + 4 × 3</text><text x="650" y="295" font-family="DejaVu Serif" font-size="29" fill="#C2185B" font-weight="bold" text-anchor="middle">= 8x + 12</text></svg>