<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="325"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comprendre la puissance d’un nombre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">2³ = 2 × 2 × 2 = 8 : trois facteurs tous égaux à 2.</text><rect x="70" y="155" width="290" height="95" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="215" y="211.5" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="middle">2 × 2 × 2</text><line x1="375" y1="203" x2="460" y2="203" stroke="#2E7D32" stroke-width="4"/><polygon points="460,203 447.39374056706254,209.08951747755722 447.39374056706254,196.91048252244278" fill="#2E7D32"/><rect x="475" y="155" width="130" height="95" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="540" y="211.5" font-family="DejaVu Serif" font-size="36" fill="#222" font-weight="normal" text-anchor="middle">2³</text><line x1="620" y1="203" x2="700" y2="203" stroke="#2E7D32" stroke-width="4"/><polygon points="700,203 687.3937405670625,209.08951747755722 687.3937405670625,196.91048252244278" fill="#2E7D32"/><rect x="715" y="155" width="130" height="95" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="780" y="211.5" font-family="DejaVu Serif" font-size="36" fill="#222" font-weight="normal" text-anchor="middle">8</text><text x="540" y="295" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="normal" text-anchor="middle">exposant 3 = nombre de facteurs</text></svg>