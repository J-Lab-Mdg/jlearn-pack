<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Factoriser une somme</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">3x + 3y = 3(x + y) : le facteur commun 3 se met en évidence.</text><rect x="80" y="155" width="290" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="225" y="209" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">3x + 3y</text><line x1="385" y1="200" x2="475" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="475,200 462.39374056706254,206.08951747755722 462.39374056706254,193.91048252244278" fill="#2E7D32"/><text x="430" y="175" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">facteur 3</text><rect x="490" y="155" width="290" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="635" y="209" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">3(x + y)</text></svg>