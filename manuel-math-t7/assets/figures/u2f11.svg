<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Chaîne d’opérations avec parenthèses</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">5 × (7 − 3) + 4 : parenthèses d’abord, puis multiplication, puis addition.</text><rect x="80" y="150" width="340" height="75" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="250" y="196.5" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">5 × (7 − 3) + 4</text><text x="460" y="195" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="start">① 7 − 3 = 4</text><rect x="80" y="245" width="340" height="75" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="250" y="291.5" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">5 × 4 + 4</text><text x="460" y="290" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="start">② 5 × 4 = 20</text><rect x="80" y="340" width="340" height="75" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="250" y="386.5" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">20 + 4 = 24</text><text x="460" y="385" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="start">③ addition finale</text></svg>