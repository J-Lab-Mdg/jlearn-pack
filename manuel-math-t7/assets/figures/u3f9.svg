<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Résoudre une équation du premier degré</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">3x + 5 = 26 : on isole x étape par étape.</text><rect x="80" y="150" width="340" height="70" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="250" y="194" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">3x + 5 = 26</text><text x="460" y="193" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="start">① − 5 des deux côtés</text><rect x="80" y="240" width="340" height="70" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="250" y="284" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">3x = 21</text><text x="460" y="283" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="start">② ÷ 3 des deux côtés</text><rect x="80" y="330" width="340" height="70" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="250" y="374" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">x = 7</text><text x="460" y="373" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="start">③ vérification : 3 × 7 + 5 = 26 ✓</text></svg>