<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="366"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La distributivité en situation</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">5 cahiers à 1 200 Ar et 5 stylos à 800 Ar :</text><text x="44" y="121" font-family="DejaVu Serif" font-size="23" fill="#333">5 × (1 200 + 800) = 5 × 2 000 = 10 000 Ar.</text><rect x="70" y="186" width="400" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="270" y="240" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5 × 1 200 + 5 × 800</text><text x="505" y="244" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="bold" text-anchor="start">=</text><rect x="545" y="186" width="300" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="695" y="240" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">5 × 2 000</text><text x="500" y="331" font-family="DejaVu Serif" font-size="27" fill="#C2185B" font-weight="bold" text-anchor="middle">dépense totale : 10 000 Ar</text></svg>