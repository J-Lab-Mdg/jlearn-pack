<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les propriétés de l’égalité</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une égalité est une balance : on ajoute ou enlève la même chose des deux côtés.</text><line x1="500" y1="175" x2="500" y2="265" stroke="#555" stroke-width="6"/><polygon points="455,305 545,305 500,265" fill="#BBB" stroke="#555" stroke-width="3"/><line x1="240" y1="200" x2="760" y2="200" stroke="#555" stroke-width="6"/><line x1="240" y1="200" x2="240" y2="220" stroke="#555" stroke-width="4"/><line x1="760" y1="200" x2="760" y2="220" stroke="#555" stroke-width="4"/><rect x="150" y="220" width="180" height="60" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="240" y="259" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">x + 3</text><rect x="670" y="220" width="180" height="60" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="760" y="259" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">10</text><text x="500" y="365" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">on enlève 3 de chaque côté  →  x = 7</text></svg>