<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Substituer la variable</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Pour x = 5 : 2x + 7 = 2 × 5 + 7 = 17.</text><rect x="80" y="155" width="270" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="215" y="209" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">2x + 7</text><line x1="365" y1="200" x2="450" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="450,200 437.39374056706254,206.08951747755722 437.39374056706254,193.91048252244278" fill="#2E7D32"/><text x="407" y="175" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">x = 5</text><rect x="465" y="155" width="300" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="615" y="209" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">2 × 5 + 7</text><text x="800" y="213" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="start">= 17</text></svg>