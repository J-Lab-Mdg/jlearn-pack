<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La notion de variable</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">La machine « double et ajoute 1 » : x devient 2x + 1.</text><rect x="80" y="180" width="150" height="80" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="155" y="229" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="middle">x</text><line x1="245" y1="220" x2="330" y2="220" stroke="#2E7D32" stroke-width="4"/><polygon points="330,220 317.39374056706254,226.08951747755722 317.39374056706254,213.91048252244278" fill="#2E7D32"/><rect x="345" y="160" width="300" height="120" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="3.5"/><text x="495" y="210" font-family="DejaVu Serif" font-size="27" fill="#1565C0" font-weight="bold" text-anchor="middle">× 2 puis + 1</text><text x="495" y="250" font-family="DejaVu Serif" font-size="20" fill="#666" font-weight="normal" text-anchor="middle">machine</text><line x1="660" y1="220" x2="745" y2="220" stroke="#2E7D32" stroke-width="4"/><polygon points="745,220 732.3937405670625,226.08951747755722 732.3937405670625,213.91048252244278" fill="#2E7D32"/><rect x="760" y="180" width="180" height="80" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="850" y="229" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">2x + 1</text><text x="155" y="315" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="start">x = 3 → 7 ;  x = 10 → 21</text></svg>