<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La distributivité simple</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">3 × (4 + 2) = 3 × 4 + 3 × 2 : le grand rectangle est la somme des deux petits.</text><rect x="120" y="185" width="220" height="165" fill="#F8BBD0" stroke="#1F4E79" stroke-width="3"/><rect x="340" y="185" width="110" height="165" fill="#C8E6C9" stroke="#1F4E79" stroke-width="3"/><line x1="175" y1="185" x2="175" y2="350" stroke="#1F4E79" stroke-width="1.5"/><line x1="230" y1="185" x2="230" y2="350" stroke="#1F4E79" stroke-width="1.5"/><line x1="285" y1="185" x2="285" y2="350" stroke="#1F4E79" stroke-width="1.5"/><line x1="340" y1="185" x2="340" y2="350" stroke="#1F4E79" stroke-width="1.5"/><line x1="395" y1="185" x2="395" y2="350" stroke="#1F4E79" stroke-width="1.5"/><line x1="120" y1="240" x2="450" y2="240" stroke="#1F4E79" stroke-width="1.5"/><line x1="120" y1="295" x2="450" y2="295" stroke="#1F4E79" stroke-width="1.5"/><text x="230" y="170" font-family="DejaVu Serif" font-size="26" fill="#C2185B" font-weight="bold" text-anchor="middle">4</text><text x="395" y="170" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">2</text><text x="95" y="276.5" font-family="DejaVu Serif" font-size="26" fill="#1F4E79" font-weight="bold" text-anchor="middle">3</text><text x="620" y="230" font-family="DejaVu Serif" font-size="27" fill="#C2185B" font-weight="bold" text-anchor="start">3 × 4 = 12</text><text x="620" y="275" font-family="DejaVu Serif" font-size="27" fill="#2E7D32" font-weight="bold" text-anchor="start">3 × 2 = 6</text><text x="620" y="325" font-family="DejaVu Serif" font-size="27" fill="#B25000" font-weight="bold" text-anchor="start">total : 18</text></svg>