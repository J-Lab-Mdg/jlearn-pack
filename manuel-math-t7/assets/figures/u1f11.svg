<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comparer et ordonner des nombres relatifs</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">−3 &lt; −1,5 &lt; 0 &lt; +2 : plus on va vers la droite, plus le nombre est grand.</text><line x1="80" y1="195" x2="920" y2="195" stroke="#1F4E79" stroke-width="4"/><line x1="80" y1="181" x2="80" y2="209" stroke="#1F4E79" stroke-width="3"/><text x="80" y="241" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">−4</text><line x1="200" y1="181" x2="200" y2="209" stroke="#1F4E79" stroke-width="3"/><text x="200" y="241" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">−3</text><line x1="320" y1="181" x2="320" y2="209" stroke="#1F4E79" stroke-width="3"/><text x="320" y="241" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">−2</text><line x1="440" y1="181" x2="440" y2="209" stroke="#1F4E79" stroke-width="3"/><text x="440" y="241" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">−1</text><line x1="560" y1="181" x2="560" y2="209" stroke="#1F4E79" stroke-width="3"/><text x="560" y="241" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">0</text><line x1="680" y1="181" x2="680" y2="209" stroke="#1F4E79" stroke-width="3"/><text x="680" y="241" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">+1</text><line x1="800" y1="181" x2="800" y2="209" stroke="#1F4E79" stroke-width="3"/><text x="800" y="241" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">+2</text><line x1="920" y1="181" x2="920" y2="209" stroke="#1F4E79" stroke-width="3"/><text x="920" y="241" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">+3</text><circle cx="200" cy="195" r="9" fill="#C2185B"/><text x="200" y="163" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">−3</text><circle cx="380" cy="195" r="9" fill="#2E7D32"/><text x="380" y="163" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">−1,5</text><circle cx="560" cy="195" r="9" fill="#C2185B"/><text x="560" y="163" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">0</text><circle cx="800" cy="195" r="9" fill="#2E7D32"/><text x="800" y="163" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">+2</text><line x1="700" y1="265" x2="900" y2="265" stroke="#B25000" stroke-width="4"/><polygon points="900,265 887.3937405670625,271.08951747755725 887.3937405670625,258.91048252244275" fill="#B25000"/><text x="800" y="300" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="normal" text-anchor="middle">de plus en plus grand</text></svg>