<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Chaîne d’opérations sans parenthèses</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">2,5 + 7,8 + 7,5 = (2,5 + 7,5) + 7,8 = 10 + 7,8 = 17,8.</text><rect x="80" y="155" width="340" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="250" y="209" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">2,5 + 7,8 + 7,5</text><line x1="435" y1="207" x2="550" y2="207" stroke="#2E7D32" stroke-width="4"/><polygon points="550,207 537.3937405670625,213.08951747755722 537.3937405670625,200.91048252244278" fill="#2E7D32"/><text x="492" y="183" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">regrouper</text><rect x="565" y="155" width="240" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="685" y="209" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">10 + 7,8</text><text x="865" y="210" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="start">= 17,8</text></svg>