<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La règle des signes pour l’addition</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Partir de 0, avancer de +3, reculer de 5 : (+3) + (−5) = −2.</text><line x1="80" y1="245" x2="920" y2="245" stroke="#1F4E79" stroke-width="4"/><line x1="80" y1="231" x2="80" y2="259" stroke="#1F4E79" stroke-width="3"/><text x="80" y="291" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">−4</text><line x1="185" y1="231" x2="185" y2="259" stroke="#1F4E79" stroke-width="3"/><text x="185" y="291" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">−3</text><line x1="290" y1="231" x2="290" y2="259" stroke="#1F4E79" stroke-width="3"/><text x="290" y="291" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">−2</text><line x1="395" y1="231" x2="395" y2="259" stroke="#1F4E79" stroke-width="3"/><text x="395" y="291" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">−1</text><line x1="500" y1="231" x2="500" y2="259" stroke="#1F4E79" stroke-width="3"/><text x="500" y="291" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">0</text><line x1="605" y1="231" x2="605" y2="259" stroke="#1F4E79" stroke-width="3"/><text x="605" y="291" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">+1</text><line x1="710" y1="231" x2="710" y2="259" stroke="#1F4E79" stroke-width="3"/><text x="710" y="291" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">+2</text><line x1="815" y1="231" x2="815" y2="259" stroke="#1F4E79" stroke-width="3"/><text x="815" y="291" font-fami