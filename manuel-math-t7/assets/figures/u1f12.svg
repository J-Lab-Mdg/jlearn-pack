<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Échelle, pourcentage, taux et rendement</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Quatre outils pour comparer des quantités dans la vie courante.</text><rect x="60" y="150" width="420" height="110" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="270" y="214" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="270" y="190" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">Échelle</text><text x="270" y="230" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">1 cm sur la carte = 1 km réel</text><rect x="520" y="150" width="420" height="110" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="730" y="214" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="730" y="190" font-family="DejaVu Serif" font-size="26" fill="#C2185B" font-weight="bold" text-anchor="middle">Pourcentage</text><text x="730" y="230" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">35 % des élèves = 35 sur 100</text><rect x="60" y="285" width="420" height="110" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="270" y="349" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="270" y="325" font-family="DejaVu Serif" font-size="26" fill="#1565C0" font-weight="bold" text-anchor="middle">Taux</text><text x="270" y="365" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">3 000 Ar d’intérêt pour 100 000 Ar</text><rect x="520" y="285" width="420" height="110" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="730" y="349" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="730" y="325" font-family="DejaVu Serif" font-size="26" fill="#B25000" font-weight="bold" text-anchor="middle">Rendement</text><text x="730" y="365" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">4 t de riz par hectare</text></svg>