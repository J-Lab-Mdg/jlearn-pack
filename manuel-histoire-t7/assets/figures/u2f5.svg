<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="399"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Rome : trois régimes successifs</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">De la légende de Romulus à la chute de 476.</text><rect x="40" y="155" width="290" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="185" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">Royauté étrusque</text><text x="185" y="245" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">−600 à −509</text><text x="185" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">des rois gouvernent</text><line x1="330" y1="182" x2="355" y2="182" stroke="#B25000" stroke-width="4"/><polygon points="355,182 342.39374056706254,188.08951747755722 342.39374056706254,175.91048252244278" fill="#B25000"/><rect x="355" y="155" width="290" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">République</text><text x="500" y="245" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="middle">−509 à −27</text><text x="500" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">sénat et magistrats élus</text><line x1="645" y1="182" x2="670" y2="182" stroke="#B25000" stroke-width="4"/><polygon points="670,182 657.3937405670625,188.08951747755722 657.3937405670625,175.91048252244278" fill="#B25000"/><rect x="670" y="155" width="290" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="815" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">Empire</text><text x="815" y="245" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">27 à 476</text><text x="815" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">un empereur tout-puissant</text><text x="500" y="331" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">res publica = « la chose publique » : l’État appartient aux citoyens</text><text x="500" y="367" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">la Méditerranée devient le centre de l’Empire : routes, légions, villes</text></svg>