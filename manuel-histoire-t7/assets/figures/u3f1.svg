<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le Moyen-Âge : 476 à 1492</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Mille ans entre l’Antiquité et les Temps modernes.</text><line x1="70" y1="185" x2="930" y2="185" stroke="#1F4E79" stroke-width="5"/><rect x="70" y="209" width="443.54330708661416" height="48" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><rect x="513.5433070866142" y="209" width="416.45669291338584" height="48" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="291.7716535433071" y="239" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">Haut Moyen Âge (Vᵉ-XIᵉ s.)</text><text x="721.7716535433071" y="239" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">Bas Moyen Âge (XIᵉ-XVᵉ s.)</text><text x="70" y="173" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">476</text><text x="513.5433070866142" y="173" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">XIᵉ siècle</text><text x="930" y="173" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">1492</text><text x="70" y="289" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="start">chute de Rome :</text><text x="70" y="315" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="start">début du Moyen Âge</text><text x="930" y="289" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="end">arrivée de Colomb en Amérique :</text><text x="930" y="315" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="end">fin du Moyen Âge</text><rect x