<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’Église au Moyen Âge</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une organisation en deux clergés — et des rôles partout.</text><rect x="350" y="150" width="300" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="184" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">le pape et les cardinaux</text><line x1="420" y1="200" x2="300" y2="236" stroke="#1F4E79" stroke-width="3.5"/><polygon points="300,236 310.3247966718892,226.5449181027267 313.82441661447996,238.21031791136252" fill="#1F4E79"/><line x1="580" y1="200" x2="700" y2="236" stroke="#2E7D32" stroke-width="3.5"/><polygon points="700,236 686.17558338552,238.21031791136252 689.6752033281108,226.5449181027267" fill="#2E7D32"/><rect x="90" y="240" width="400" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="290" y="274" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">clergé séculier : évêques, curés</text><rect x="510" y="240" width="400" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="710" y="274" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">clergé régulier : abbés, moines</text><text x="290" y="322" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="normal" text-anchor="middle">vit au milieu des fidèles</text><text x="710" y="322" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">vit dans les monastères</text><rect x="80" y="355" width="200" height="48" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="180" y="388" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">assistance</text><text x="305" y="386" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="start">aide aux pauvres et aux malades, hôpitaux</text><rect x="80" y="415" width="200" height="48" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="180" y="448" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">culture</text><text x="305" y="446" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="start">écoles, manuscrits copiés par les moines</text><rect x="80" y="475" width="200" height="48" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="180" y="508" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">économie</text><text x="305" y="506" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="start">la dîme, la vente d’indulgences</text><rect x="80" y="535" width="200" height="48" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="180" y="568" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">société</text><text x="305" y="566" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="start">baptême, mariage, funérailles — toute la vie</text></svg>