<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="497"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’identité culturelle malgache</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Des groupes de population aux caractères uniques de la nation.</text><rect x="60" y="155" width="880" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="191" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">des groupes de population : Antandroy, Bara, Betsileo, Merina, Sakalava, Vezo…</text><line x1="500" y1="209" x2="500" y2="239" stroke="#888" stroke-width="3.5"/><polygon points="500,239 493.91048252244275,226.39374056706254 506.08951747755725,226.39374056706254" fill="#888"/><rect x="60" y="243" width="880" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="279" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">chaque groupe : son héritage culturel, sa culture matérielle, ses coutumes</text><line x1="500" y1="297" x2="500" y2="327" stroke="#888" stroke-width="3.5"/><polygon points="500,327 493.91048252244275,314.39374056706254 506.08951747755725,314.39374056706254" fill="#888"/><rect x="60" y="331" width="880" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="367" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">identité culturelle malgache : caractères uniques partagés par toute l’île</text><rect x="60" y="417" width="205" height="48" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="162.5" y="450" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">langue malgache</text><rect x="285" y="417" width="205" height="48" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="387.5" y="450" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">respect des razana</text><rect x="510" y="417" width="205" height="48" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="612.5" y="450" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">fihavanana</text><rect x="735" y="417" width="205" height="48" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="837.5" y="450" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">riz et zébu</text></svg>