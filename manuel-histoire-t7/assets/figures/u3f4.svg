<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les cinq piliers de l’Islam</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Les cinq obligations du croyant musulman.</text><rect x="35" y="150" width="170" height="150" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="120" y="198" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">1. chahâda</text><text x="120" y="240" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">la profession</text><text x="120" y="264" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">de foi</text><rect x="225" y="150" width="170" height="150" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="310" y="198" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">2. la prière</text><text x="310" y="240" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">cinq fois par</text><text x="310" y="264" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">jour</text><rect x="415" y="150" width="170" height="150" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="198" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">3. le jeûne</text><text x="500" y="240" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">le mois de</text><text x="500" y="264" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">Ramadan</text><rect x="605" y="150" width="170" height="150" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><t