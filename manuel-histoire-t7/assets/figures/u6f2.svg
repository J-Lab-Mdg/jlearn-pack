<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="526"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Ethnie, tribu ou groupe de population ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Trois concepts à distinguer — et la conclusion du programme.</text><rect x="60" y="150" width="340" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="187" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">concept</text><rect x="400" y="150" width="540" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="670" y="187" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">définition</text><rect x="60" y="206" width="340" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="243" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">ethnie</text><rect x="400" y="206" width="540" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="670" y="243" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">peuple à langue et culture propres</text><rect x="60" y="262" width="340" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">tribu</text><rect x="400" y="262" width="540" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="670" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">groupe uni par un ancêtre commun</text><rect x="60" y="318" width="340" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="355" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">groupe de population</text><rect x="400" y="318" width="540" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="670" y="355" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">habitants d’une même région</text><rect x="100" y="402" width="800" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="439" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">à Madagascar : ni ethnie ni tribu — une seule langue, un seul peuple</text><text x="500" y="494" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">on parle donc de « groupes de population » : Merina, Vezo, Bara…</text></svg>