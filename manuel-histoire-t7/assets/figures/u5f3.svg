<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="492"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les héritages occidentaux</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Trois plans d’héritages, de la marine à l’école.</text><rect x="60" y="150" width="280" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="200" y="186" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">plan</text><rect x="340" y="150" width="600" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="186" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">héritages laissés</text><rect x="60" y="204" width="280" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="200" y="240" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">économique</text><rect x="340" y="204" width="600" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="240" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">marine marchande, commerce, industrie</text><rect x="60" y="258" width="280" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="200" y="294" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">politique</text><rect x="340" y="258" width="600" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="294" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">État, institutions, valeurs républicaines</text><rect x="60" y="312" width="280" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="200" y="348" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">socio-culturel</text><rect x="340" y="312" width="600" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="348" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">christianisme, école, armée de métier</text><rect x="60" y="366" width="280" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="200" y="402" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="340" y="366" width="600" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="402" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">alphabet latin et écriture latine</text><text x="500" y="460" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">depuis 1823, le malgache s’écrit en alphabet latin — celui de ce manuel !</text></svg>