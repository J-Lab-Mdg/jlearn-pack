<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="421"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Un seul peuple, une belle diversité</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Ce qui rassemble tous les Malgaches — et ce qui varie.</text><rect x="70" y="155" width="400" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="270" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">RESSEMBLANCES</text><rect x="530" y="155" width="400" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="730" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">DIFFÉRENCES</text><text x="270" y="255" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">une même croyance ancienne</text><text x="270" y="291" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">une même langue malgache</text><text x="270" y="327" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">zébu et riziculture partout</text><text x="730" y="255" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">variétés régionales de la langue</text><text x="730" y="291" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">habits, coiffures, coutumes</text><text x="730" y="327" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">morphologies variées</text><text x="500" y="389" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">la nation malgache : un sentiment national né du brassage des migrations</text></svg>