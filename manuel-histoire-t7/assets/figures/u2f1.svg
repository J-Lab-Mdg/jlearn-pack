<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’Antiquité : −3 000 à 476</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Quatre grandes civilisations sur une même frise.</text><line x1="70" y1="180" x2="930" y2="180" stroke="#1F4E79" stroke-width="5"/><text x="70" y="166" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">−3 000</text><text x="930" y="166" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">476</text><rect x="70" y="226" width="130" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="70" y="216" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="start">Mésopotamie (−3 400 à −2 900)</text><line x1="70" y1="180" x2="70" y2="226" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="6,5"/><rect x="230" y="310" width="390" height="40" rx="8" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="230" y="300" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="start">Égypte (−2 700 à −1 100)</text><line x1="230" y1="180" x2="230" y2="310" stroke="#1F4E79" stroke-width="1.5" stroke-dasharray="6,5"/><rect x="700" y="394" width="70" height="40" rx="8" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="700" y="384" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="start">Grèce (−500 à −323)</text><line x1="700" y1="180" x2="700" y2="394" stroke="#C2185B" stroke-width="1.5" stroke-dasharray="6,5"/><rect x="650" y="478" width="280" height="40" rx="8" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="650" y="468" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="start">Rome (−753 à 476)</text><line x1="650" y1="180" x2="650" y2="478" stroke="#B25000" stroke-width="1.5" stroke-dasharray="6,5"/><text x="500" y="572" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">plus la barre est à gauche, plus la civilisation est ancienne</text></svg>