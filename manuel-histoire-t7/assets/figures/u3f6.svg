<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La division de l’Islam au VIIᵉ siècle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une querelle de succession aux conséquences durables.</text><rect x="300" y="150" width="400" height="50" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="184" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">mort de Mahomet (632)</text><rect x="250" y="230" width="500" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="264" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">qui doit diriger les croyants ?</text><line x1="500" y1="200" x2="500" y2="230" stroke="#888" stroke-width="3.5"/><polygon points="500,230 493.91048252244275,217.39374056706254 506.08951747755725,217.39374056706254" fill="#888"/><line x1="380" y1="280" x2="260" y2="320" stroke="#2E7D32" stroke-width="3.5"/><polygon points="260,320 270.0336732668711,310.23652721754826 273.88502228296795,321.7905742658387" fill="#2E7D32"/><line x1="620" y1="280" x2="740" y2="320" stroke="#C2185B" stroke-width="3.5"/><polygon points="740,320 726.114977717032,321.7905742658387 729.9663267331289,310.23652721754826" fill="#C2185B"/><rect x="60" y="325" width="400" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="260" y="359" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">les sunnites</text><rect x="540" y="325" width="400" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="740" y="359" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">les chiites</text><text x="260" y="408" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">suivent la sunna (tradition) ;</text><text x="260" y="434" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">le calife choisi par la communauté</text><text x="740" y="408" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">fidèles à Ali, gendre de Mahomet ;</text><text x="740" y="434" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">le chef doit être de sa famille</text><text x="500" y="480" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">cette scission du monde musulman dure encore aujourd’hui</text></svg>