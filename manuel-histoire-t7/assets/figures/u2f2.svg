<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Qu’est-ce qu’une civilisation ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Les éléments constitutifs — et l’exemple mésopotamien.</text><rect x="60" y="150" width="440" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="184" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">un espace géographique</text><rect x="60" y="212" width="440" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="246" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">une organisation politique et sociale</text><rect x="60" y="274" width="440" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="308" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">des valeurs culturelles et religieuses</text><rect x="60" y="336" width="440" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="370" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">une organisation économique</text><line x1="500" y1="175" x2="545" y2="175" stroke="#C2185B" stroke-width="3.5"/><polygon points="545,175 532.3937405670625,181.08951747755722 532.3937405670625,168.91048252244278" fill="#C2185B"/><rect x="550" y="150" width="400" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="750" y="184" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">entre Tigre et Euphrate</text><line x1="500" y1="237" x2="545" y2="237" stroke="#C2185B" stroke-width="3.5"/><polygon points="545,237 532.3937405670625,243.08951747755722 532.3937405670625,230.91048252244278" fill="#C2185B"/><rect x="550" y="212" width="400" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="750" y="246" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">rois, prêtres, scribes ; la ville d’Uruk</text><line x1="500" y1="299" x2="545" y2="299" stroke="#C2185B" stroke-width="3.5"/><polygon points="545,299 532.3937405670625,305.08951747755725 532.3937405670625,292.91048252244275" fill="#C2185B"/><rect x="550" y="274" width="400" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="750" y="308" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">dieux multiples, ziggourats</text><line x1="500" y1="361" x2="545" y2="361" stroke="#C2185B" stroke-width="3.5"/><polygon points="545,361 532.3937405670625,367.08951747755725 532.3937405670625,354.91048252244275" fill="#C2185B"/><rect x="550" y="336" width="400" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="750" y="370" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">irrigation, artisanat, échanges</text><text x="500" y="430" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">vers −3 500 à Uruk : pictogrammes puis cunéiformes — l’écriture est née</text></svg>