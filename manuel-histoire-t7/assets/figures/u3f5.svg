<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="399"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les conquêtes musulmanes</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une expansion fulgurante en à peine plus d’un siècle.</text><rect x="40" y="155" width="290" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="185" y="191" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Au temps de Mahomet</text><text x="185" y="245" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">630-632</text><text x="185" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">l’Arabie est unie</text><line x1="330" y1="182" x2="355" y2="182" stroke="#B25000" stroke-width="4"/><polygon points="355,182 342.39374056706254,188.08951747755722 342.39374056706254,175.91048252244278" fill="#B25000"/><rect x="355" y="155" width="290" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="191" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Les 4 premiers califes</text><text x="500" y="245" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="middle">632-656</text><text x="500" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">Syrie, Égypte, Perse</text><line x1="645" y1="182" x2="670" y2="182" stroke="#B25000" stroke-width="4"/><polygon points="670,182 657.3937405670625,188.08951747755722 657.3937405670625,175.91048252244278" fill="#B25000"/><rect x="670" y="155" width="290" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="815" y="191" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Les califes omeyyades</text><text x="815" y="245" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">661-750</text><text x="815" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">de l’Espagne à l’Indus</text><text x="500" y="331" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">calife = successeur de Mahomet, chef religieux et politique</text><text x="500" y="367" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">en 750, l’empire musulman s’étend sur trois continents</text></svg>