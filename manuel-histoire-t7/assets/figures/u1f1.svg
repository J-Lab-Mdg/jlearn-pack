<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les cinq étapes du projet d’Histoire orale</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">De l’idée au rendez-vous : la démarche du programme, dans l’ordre.</text><rect x="150" y="150" width="700" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="186" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1. choisir un thème délimité (temps, espace)</text><line x1="500" y1="204" x2="500" y2="222" stroke="#C2185B" stroke-width="4"/><polygon points="500,222 493.91048252244275,209.39374056706254 506.08951747755725,209.39374056706254" fill="#C2185B"/><rect x="150" y="222" width="700" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="258" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">2. élaborer le questionnaire sur le thème</text><line x1="500" y1="276" x2="500" y2="294" stroke="#C2185B" stroke-width="4"/><polygon points="500,294 493.91048252244275,281.39374056706254 506.08951747755725,281.39374056706254" fill="#C2185B"/><rect x="150" y="294" width="700" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="330" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">3. identifier les personnes ressources</text><line x1="500" y1="348" x2="500" y2="366" stroke="#C2185B" stroke-width="4"/><polygon points="500,366 493.91048252244275,353.39374056706254 506.08951747755725,353.39374056706254" fill="#C2185B"/><rect x="150" y="366" width="700" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="402" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">4. déterminer le lieu de rencontre</text><line x1="500" y1="420" x2="500" y2="438" stroke="#C2185B" stroke-width="4"/><polygon points="500,438 493.91048252244275,425.39374056706254 506.08951747755725,425.39374056706254" fill="#C2185B"/><rect x="150" y="438" width="700" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="474" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">5. demander un rendez-vous</text><text x="500" y="530" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">puis : mener l’enquête, noter ou enregistrer, vérifier et restituer</text></svg>