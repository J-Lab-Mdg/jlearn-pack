<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="399"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’Égypte des pharaons</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Trois empires le long du Nil.</text><rect x="40" y="155" width="290" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="185" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">Ancien Empire</text><text x="185" y="245" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">−2700 à −2200</text><text x="185" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">les grandes pyramides</text><line x1="330" y1="182" x2="355" y2="182" stroke="#B25000" stroke-width="4"/><polygon points="355,182 342.39374056706254,188.08951747755722 342.39374056706254,175.91048252244278" fill="#B25000"/><rect x="355" y="155" width="290" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">Moyen Empire</text><text x="500" y="245" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="middle">−2050 à −1800</text><text x="500" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">conquêtes et canaux</text><line x1="645" y1="182" x2="670" y2="182" stroke="#B25000" stroke-width="4"/><polygon points="670,182 657.3937405670625,188.08951747755722 657.3937405670625,175.91048252244278" fill="#B25000"/><rect x="670" y="155" width="290" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="815" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">Nouvel Empire</text><text x="815" y="245" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">−1600 à −1100</text><text x="815" y="277" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="middle">l’apogée du pharaon</text><text x="500" y="331" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">le pharaon : roi, chef religieux et chef des armées — un pouvoir total</text><text x="500" y="367" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">« L’Égypte est un don du Nil » : la crue dépose le limon qui fertilise les champs</text></svg>