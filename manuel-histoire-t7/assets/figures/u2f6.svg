<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="494"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’héritage antique à Madagascar</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Ce que les civilisations antiques nous ont légué.</text><rect x="70" y="150" width="330" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="235" y="186" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">domaine</text><rect x="400" y="150" width="530" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="186" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">héritage visible aujourd’hui</text><rect x="70" y="204" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="235" y="240" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">infrastructures</text><rect x="400" y="204" width="530" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="240" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">routes pavées, irrigation, charrue</text><rect x="70" y="258" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="235" y="294" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">système militaire</text><rect x="400" y="258" width="530" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="294" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">organisation des soldats</text><rect x="70" y="312" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="235" y="348" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">culture et loisirs</text><rect x="400" y="312" width="530" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="348" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Jeux olympiques, théâtres</text><rect x="70" y="366" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="235" y="402" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">vie politique</text><rect x="400" y="366" width="530" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="402" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">démocratie et République</text><text x="500" y="462" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">voter, débattre, être citoyen : des idées nées à Athènes et à Rome</text></svg>