<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="518"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La société féodale</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Chacun doit service et fidélité à celui du dessus.</text><rect x="330" y="150" width="340" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="186" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">le roi (suzerain suprême)</text><line x1="500" y1="204" x2="500" y2="220" stroke="#888" stroke-width="3"/><polygon points="500,220 493.91048252244275,207.39374056706254 506.08951747755725,207.39374056706254" fill="#888"/><rect x="270" y="220" width="460" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="256" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">les seigneurs (suzerains)</text><line x1="500" y1="274" x2="500" y2="290" stroke="#888" stroke-width="3"/><polygon points="500,290 493.91048252244275,277.39374056706254 506.08951747755725,277.39374056706254" fill="#888"/><rect x="210" y="290" width="580" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="326" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">les vassaux et chevaliers</text><line x1="500" y1="344" x2="500" y2="360" stroke="#888" stroke-width="3"/><polygon points="500,360 493.91048252244275,347.39374056706254 506.08951747755725,347.39374056706254" fill="#888"/><rect x="150" y="360" width="700" height="54" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="396" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">les paysans : serfs et vilains</text><text x="500" y="454" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">le clergé prie pour tous ; le vassal reçoit un fief contre fidélité et service</text><text x="500" y="486" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">serf : attaché à la terre — vilain : paysan libre mais chargé de redevances</text></svg>