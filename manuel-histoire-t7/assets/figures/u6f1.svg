<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Du clan au Royaume de Madagascar</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Quatre étapes de l’organisation politique, du Vᵉ au XIXᵉ siècle.</text><rect x="80" y="150" width="460" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="310" y="186" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">le clan</text><text x="570" y="172" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="start">Vᵉ-XVIᵉ siècle</text><text x="570" y="200" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="start">un chef de clan guide les familles</text><line x1="310" y1="204" x2="310" y2="252" stroke="#888" stroke-width="3.5"/><polygon points="310,252 303.91048252244275,239.39374056706254 316.08951747755725,239.39374056706254" fill="#888"/><rect x="80" y="252" width="460" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="310" y="288" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">les confédérations claniques</text><text x="570" y="274" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="start"></text><text x="570" y="302" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="start">des clans unis sous un roitelet</text><line x1="310" y1="306" x2="310" y2="354" stroke="#888" stroke-width="3.5"/><polygon points="310,354 303.91048252244275,341.39374056706254 316.08951747755725,341.39374056706254" fill="#888"/><rect x="80" y="354" width="460" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="310" y="390" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">les royaumes malgaches</text><text x="570" y="376" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="start">1500-1810</text><text x="570" y="404" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="start">plusieurs royaumes régionaux rivaux</text><line x1="310" y1="408" x2="310" y2="456" stroke="#888" stroke-width="3.5"/><polygon points="310,456 303.91048252244275,443.39374056706254 316.08951747755725,443.39374056706254" fill="#888"/><rect x="80" y="456" width="460" height="54" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="310" y="492" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">le Royaume de Madagascar</text><text x="570" y="478" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="start">1810-1896</text><text x="570" y="506" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="start">un seul État depuis Radama Iᵉʳ</text><text x="500" y="568" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">une marche progressive vers l’unité politique de l’île</text></svg>