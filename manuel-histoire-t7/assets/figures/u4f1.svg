<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="584"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les vagues de migration vers Madagascar</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Qui est arrivé, et quand — la frise du peuplement.</text><rect x="60" y="150" width="560" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="340" y="184" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Austronésiens (ancêtres des Vazimba)</text><text x="650" y="182" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="start">IIIᵉ-IVᵉ siècle</text><line x1="340" y1="200" x2="340" y2="214" stroke="#999" stroke-width="3"/><polygon points="340,214 333.91048252244275,201.39374056706254 346.08951747755725,201.39374056706254" fill="#999"/><rect x="60" y="214" width="560" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="340" y="248" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Africains</text><text x="650" y="246" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="start">VIIᵉ-VIIIᵉ siècle</text><line x1="340" y1="264" x2="340" y2="278" stroke="#999" stroke-width="3"/><polygon points="340,278 333.91048252244275,265.39374056706254 346.08951747755725,265.39374056706254" fill="#999"/><rect x="60" y="278" width="560" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="340" y="312" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Indonésiens et Malaisiens</text><text x="650" y="310" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="start">VIIᵉ siècle</text><line x1="340" y1="328" x2="340" y2="342" stroke="#999" stroke-width="3"/><polygon points="340,342 333.91048252244275,329.39374056706254 346.08951747755725,329.39374056706254" fill="#999"/><rect x="60" y="342" width="560" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="340" y="376" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Islamisés (Antalaotra, Antemoro…)</text><text x="650" y="374" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="start">IXᵉ siècle</text><line x1="340" y1="392" x2="340" y2="406" stroke="#999" stroke-width="3"/><polygon points="340,406 333.91048252244275,393.39374056706254 346.08951747755725,393.39374056706254" fill="#999"/><rect x="60" y="406" width="560" height="50" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="340" y="440" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Européens (Portugais, Français…)</text><text x="650" y="438" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="start">XVᵉ siècle</text><line x1="340" y1="456" x2="340" y2="470" stroke="#999" stroke-width="3"/><polygon points="340,470 333.91048252244275,457.39374056706254 346.08951747755725,457.39374056706254" fill="#999"/><rect x="60" y="470" width="560" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="340" y="504" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Indiens et Indopakistanais</text><text x="650" y="502" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="start">XIXᵉ siècle</text><text x="500" y="552" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">plusieurs vagues, un seul peuple : l’unité dans la diversité</text></svg>