<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="494"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Paléolithique et Néolithique</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Deux manières de vivre — comparaison terme à terme.</text><rect x="60" y="150" width="230" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="175" y="186" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle"></text><rect x="290" y="150" width="330" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="455" y="186" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Paléolithique</text><rect x="620" y="150" width="330" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="785" y="186" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Néolithique</text><rect x="60" y="204" width="230" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="175" y="240" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">outils</text><rect x="290" y="204" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="455" y="240" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">pierre taillée, primitifs</text><rect x="620" y="204" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="785" y="240" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">pierre polie, améliorés</text><rect x="60" y="258" width="230" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="175" y="294" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">nourriture</text><rect x="290" y="258" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="455" y="294" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">chasse et cueillette</text><rect x="620" y="258" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="785" y="294" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">agriculture, élevage</text><rect x="60" y="312" width="230" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="175" y="348" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">habitat</text><rect x="290" y="312" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="455" y="348" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">nomade (grottes, abris)</text><rect x="620" y="312" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="785" y="348" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">sédentaire (villages)</text><rect x="60" y="366" width="230" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="175" y="402" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">découverte</text><rect x="290" y="366" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="455" y="402" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">le feu</text><rect x="620" y="366" width="330" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="785" y="402" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">poterie, tissage</text><text x="500" y="462" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-