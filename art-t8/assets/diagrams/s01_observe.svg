<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C0392B"/></marker><radialGradient id="ball" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#bdbdbd"/><stop offset="100%" stop-color="#4a4a4a"/></radialGradient></defs><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="130" fill="#1F4E79"/><text x="40" y="46" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#fff">Deux familles de formes</text><text x="40" y="118" font-family="DejaVu Sans, Arial" font-size="25" fill="#EAF2F8">Observation — arrondies et anguleuses</text><rect x="60" y="150" width="620" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="60" y="150" width="620" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="76" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Formes arrondies (organiques)</text><circle cx="200" cy="300" r="70" fill="none" stroke="#222" stroke-width="4" /><ellipse cx="430" cy="300" rx="90" ry="60" fill="none" stroke="#222" stroke-width="4"/><path d="M140 470 Q230 400 320 470 T500 470" fill="none" stroke="#222" stroke-width="4"/><text x="120" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F4E79" text-anchor="start">Cercle, ovale, courbe libre</text><text x="120" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#555" text-anchor="start">Objets : ballon, orange, pot, roue</text><rect x="720" y="150" width="620" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="720" y="150" width="620" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="736" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Formes anguleuses (géométriques)</text><rect x="790" y="240" width="130" height="130" fill="none" stroke="#222" stroke-width="4" /><path d="M1010 390 L1085 240 L1160 390 Z" fill="none" stroke="#222" stroke-width="4"/><rect x="790" y="430" width="220" height="110" fill="none" stroke="#222" stroke-width="4"/><text x="780" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F4E79" text-anchor="start">Carré, triangle, rectangle</text><text x="780" y="645" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#555" text-anchor="start">Objets : maison, cahier, toit,</text><text x="780" y="680" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#555" text-anchor="start">voile</text><rect x="40" y="730" width="1320" height="160" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="2"/><text x="60" y="764" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#1F4E79">Consigne / phrase clé</text><text x="60" y="802" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">Regardez les deux familles de formes. Pour chaque forme, dites à voix haute un</text><text x="60" y="840" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">objet qu’elle pourrait devenir.</text></svg>