<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="120" fill="#15558B"/><text x="54" y="52" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">MUSIQUE : MONOPHONIE ET POLYPHONIE</text><text x="54" y="94" font-family="Arial,sans-serif" font-size="24" fill="#fff">Étape d · Comparer les hauteurs</text><rect x="55" y="155" width="610" height="535" fill="#F7F9FB"/><rect x="735" y="155" width="610" height="535" fill="#FBFCF9"/><text x="90" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15558B">REPÈRE</text><text x="765" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#179B61">À VÉRIFIER</text><line x1="700" y1="170" x2="700" y2="675" stroke="#D59A24" stroke-width="3"/><g transform="translate(180 350) scale(.5)"><path d="M90 340 C130 270 170 410 210 340 S290 270 330 340 S410 410 450 340" fill="none" stroke="#15558B" stroke-width="7"/><path d="M90 500 C120 440 150 560 180 500 S240 440 270 500 S330 560 360 500 S420 440 450 500" fill="none" stroke="#179B61" stroke-width="7"/><path d="M500 310 L500 530 M550 310 L550 530 M600 310 L600 530" stroke="#D59A24" stroke-width="10"/></g><text x="90" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Écouter aigu, médium ou grave dans</text><text x="90" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">chaque exemple sans confondre</text><text x="90" y="412" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">hauteur et polyphonie.</text><text x="765" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Je distingue nombre de sons et</text><text x="765" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">hauteur.</text><line x1="55" y1="735" x2="1345" y2="735" stroke="#D59A24" stroke-width="3"/><text x="70" y="790" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#15558B">À RETENIR</text><text x="250" y="790" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">J’écoute. Je distingue un son de plusieurs sons ensemble. Je classe les</text><text x="250" y="824" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">instruments et je justifie mes choix.</text></svg>