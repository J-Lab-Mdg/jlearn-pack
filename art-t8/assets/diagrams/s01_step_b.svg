nt-size="27" font-weight="700" fill="#2E7D32" text-anchor="middle">3. Je pose les valeurs</text><text x="120" y="645" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#1F4E79" text-anchor="start">Exemple du PE T8 : « cercle : ballon ». Les lignes ajoutées appartiennent à</text><text x="120" y="680" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#1F4E79" text-anchor="start">l’objet.</text><rect x="40" y="730" width="1320" height="160" rx="14" fill="#F4F8FB" stroke="#2E7D32" stroke-width="2"/><text x="60" y="764" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#2E7D32">Consigne / phrase clé</text><text x="60" y="802" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">Demande-toi : sans le titre, est-ce qu’un camarade reconnaît mon objet ?</text></svg>