<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="120" fill="#15558B"/><text x="54" y="52" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">DANSE : UNE SÉQUENCE URBAINE</text><text x="54" y="94" font-family="Arial,sans-serif" font-size="24" fill="#fff">Observer avant d’agir · Séquence urbaine</text><rect x="55" y="155" width="610" height="535" fill="#F7F9FB"/><rect x="735" y="155" width="610" height="535" fill="#FBFCF9"/><text x="90" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15558B">REPÈRE</text><text x="765" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#179B61">À VÉRIFIER</text><line x1="700" y1="170" x2="700" y2="675" stroke="#D59A24" stroke-width="3"/><g transform="translate(180 350) scale(.5)"><circle cx="300" cy="275" r="32" fill="#D59A24"/><path d="M300 310 L300 430 M300 350 L220 390 M300 350 L380 390 M300 430 L240 520 M300 430 L370 520" fill="none" stroke="#15558B" stroke-width="12" stroke-linecap="round"/><path d="M465 285 Q560 320 485 370 Q420 410 520 460" fill="none" stroke="#179B61" stroke-width="7" stroke-dasharray="15 12"/></g><text x="90" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Choisir deux gestes simples et sûrs.</text><text x="90" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Repérer sur quels temps ils</text><text x="90" y="412" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">commencent.</text><text x="765" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Répéter chaque fragment lentement.</text><text x="765" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Assembler les fragments sans courir</text><text x="765" y="412" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">ni se bousculer.</text><line x1="55" y1="735" x2="1345" y2="735" stroke="#D59A24" stroke-width="3"/><text x="70" y="790" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#15558B">À RETENIR</text><text x="250" y="790" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">Je compte huit temps. J’apprends deux gestes. Je les relie, je garde ma place et</text><text x="250" y="824" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">je termine avec mon groupe.</text></svg>