<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="120" fill="#15558B"/><text x="54" y="52" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">DESSIN : UN PORTRAIT D’APRÈS MODÈLE</text><text x="54" y="94" font-family="Arial,sans-serif" font-size="24" fill="#fff">Étape a · Observer et choisir les repères</text><rect x="55" y="155" width="610" height="535" fill="#F7F9FB"/><rect x="735" y="155" width="610" height="535" fill="#FBFCF9"/><text x="90" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15558B">REPÈRE</text><text x="765" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#179B61">À VÉRIFIER</text><line x1="700" y1="170" x2="700" y2="675" stroke="#D59A24" stroke-width="3"/><g transform="translate(180 350) scale(.5)"><ellipse cx="310" cy="390" rx="110" ry="145" fill="none" stroke="#15558B" stroke-width="6"/><path d="M200 365 Q310 350 420 365 M310 250 L310 530 M260 400 Q275 420 290 400 M330 400 Q345 420 360 400 M290 470 Q310 485 330 470" fill="none" stroke="#179B61" stroke-width="5"/><circle cx="270" cy="400" r="6" fill="#D59A24"/><circle cx="350" cy="400" r="6" fill="#D59A24"/></g><text x="90" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Repérer l’orientation, l’axe, la</text><text x="90" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">ligne des yeux et les écarts entre</text><text x="90" y="412" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">nez et bouche.</text><text x="765" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Je regarde les distances avant de</text><text x="765" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">dessiner.</text><line x1="55" y1="735" x2="1345" y2="735" stroke="#D59A24" stroke-width="3"/><text x="70" y="790" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#15558B">À RETENIR</text><text x="250" y="790" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">J’observe le modèle. Je trace l’axe et les repères. Je place les éléments,</text><text x="250" y="824" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">j’ajoute deux gris et j’efface les repères.</text></svg>