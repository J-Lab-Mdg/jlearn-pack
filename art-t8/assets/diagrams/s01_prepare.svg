<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C0392B"/></marker><radialGradient id="ball" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#bdbdbd"/><stop offset="100%" stop-color="#4a4a4a"/></radialGradient></defs><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="130" fill="#1F4E79"/><text x="40" y="46" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#fff">Choisir sa forme, essayer trois gris</text><text x="40" y="118" font-family="DejaVu Sans, Arial" font-size="25" fill="#EAF2F8">Préparation — à compléter sur le brouillon</text><rect x="60" y="150" width="620" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="60" y="150" width="620" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="76" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Ma forme de départ (brouillon)</text><rect x="120" y="230" width="500" height="380" rx="14" fill="#fff" stroke="#222" stroke-width="3"/><rect x="155" y="265" width="430" height="310" rx="4" fill="#fff" stroke="#555" stroke-width="3"/><circle cx="370" cy="420" r="110" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="9 7"/><text x="130" y="650" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F4E79" text-anchor="start">Cadre léger = marge régulière</text><rect x="720" y="150" width="620" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="720" y="150" width="620" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="736" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Mon nuancier : trois gris à essayer</text><rect x="770" y="250" width="150" height="120" rx="6" fill="#E4E4E4" stroke="#222" stroke-width="3"/><text x="845" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F4E79" text-anchor="middle">Clair</text><rect x="950" y="250" width="150" height="120" rx="6" fill="#9E9E9E" stroke="#222" stroke-width="3"/><text x="1025" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F4E79" text-anchor="middle">Moyen</text><rect x="1130" y="250" width="150" height="120" rx="6" fill="#4A4A4A" stroke="#222" stroke-width="3"/><text x="1205" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F4E79" text-anchor="middle">Foncé</text><text x="845" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#555" text-anchor="middle">Pression</text><text x="845" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#555" text-anchor="middle">légère</text><text x="1025" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#555" text-anchor="middle">Pression</text><text x="1025" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#555" text-anchor="middle">moyenne</text><text x="1205" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#555" text-anchor="middle">Traits</text><text x="1205" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#555" text-anchor="middle">serrés</text><text x="770" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#1F4E79" text-anchor="start">Le clair n’est pas le blanc du</text><text x="770" y="635" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#1F4E79" text-anchor="start">papier ; le foncé n’est pas un aplat</text><text x="770" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#1F4E79" text-anchor="start">noir.</text><rect x="40" y="730" width="1320" height="160" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="2"/><text x="60" y="764" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#1F4E79">Consigne / phrase clé</text><text x="60" y="802" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">Sur le brouillon, trace la forme que tu as choisie, puis remplis trois cases :</text><text x="60" y="840" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">pression légère, moyenne, puis traits serrés.</text></svg>