<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="120" fill="#15558B"/><text x="54" y="52" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">MUSIQUE : CHANTER ET INSTRUMENT À VENT</text><text x="54" y="94" font-family="Arial,sans-serif" font-size="24" fill="#fff">Étape d · Reprendre et ajuster</text><rect x="55" y="155" width="610" height="535" fill="#F7F9FB"/><rect x="735" y="155" width="610" height="535" fill="#FBFCF9"/><text x="90" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15558B">REPÈRE</text><text x="765" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#179B61">À VÉRIFIER</text><line x1="700" y1="170" x2="700" y2="675" stroke="#D59A24" stroke-width="3"/><g transform="translate(180 350) scale(.5)"><rect x="110" y="365" width="380" height="54" rx="25" fill="#EAF3EA" stroke="#15558B" stroke-width="6"/><path d="M155 365v54 M205 365v54 M255 365v54 M305 365v54 M355 365v54 M405 365v54" stroke="#179B61" stroke-width="6"/><path d="M510 365 L575 365 L600 392 L575 419 L510 419Z" fill="#EAF3EA" stroke="#D59A24" stroke-width="6"/><path d="M90 300 Q60 390 90 480 M625 300 Q655 390 625 480" fill="none" stroke="#179B61" stroke-width="4" stroke-dasharray="12 10"/></g><text x="90" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Répéter une fois, corriger le départ</text><text x="90" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">ou le volume, puis présenter la</text><text x="90" y="412" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">phrase ensemble.</text><text x="765" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">J’écoute les autres pendant que je</text><text x="765" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">joue.</text><line x1="55" y1="735" x2="1345" y2="735" stroke="#D59A24" stroke-width="3"/><text x="70" y="790" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#15558B">À RETENIR</text><text x="250" y="790" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">Je prépare le souffle. Je marque la pulsation. Je donne le départ, je chante et</text><text x="250" y="824" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">j’ajoute l’instrument au bon moment.</text></svg>