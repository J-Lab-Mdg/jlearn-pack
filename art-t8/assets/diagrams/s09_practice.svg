<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="120" fill="#15558B"/><text x="54" y="52" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">PEINTURE : COLORIER À IMITER</text><text x="54" y="94" font-family="Arial,sans-serif" font-size="24" fill="#fff">À toi de faire · Imiter un second modèle</text><rect x="55" y="155" width="610" height="535" fill="#F7F9FB"/><rect x="735" y="155" width="610" height="535" fill="#FBFCF9"/><text x="90" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15558B">REPÈRE</text><text x="765" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#179B61">À VÉRIFIER</text><line x1="700" y1="170" x2="700" y2="675" stroke="#D59A24" stroke-width="3"/><g transform="translate(180 350) scale(.5)"><rect x="100" y="300" width="150" height="150" fill="#F2C94C"/><rect x="300" y="300" width="150" height="150" fill="#E6A078"/><rect x="500" y="300" width="150" height="150" fill="#7DA6C6"/><path d="M180 490 L570 490" stroke="#15558B" stroke-width="4"/><circle cx="190" cy="510" r="8" fill="#D59A24"/><circle cx="390" cy="510" r="8" fill="#179B61"/><circle cx="590" cy="510" r="8" fill="#15558B"/></g><text x="90" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Choisis une petite image. Repère</text><text x="90" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">quatre zones, teste les couleurs sur</text><text x="90" y="412" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">une chute, colorie les grandes</text><text x="765" y="260" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Quatre zones repérées.</text><text x="765" y="336" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Mélanges testés à part.</text><text x="765" y="412" font-family="Arial,sans-serif" font-size="25" fill="#252525" font-weight="400">Grandes surfaces propres.</text><line x1="55" y1="735" x2="1345" y2="735" stroke="#D59A24" stroke-width="3"/><text x="70" y="790" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#15558B">À RETENIR</text><text x="250" y="790" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">Je repère les zones. Je teste les couleurs. Je colorie du clair au foncé. Je</text><text x="250" y="824" font-family="Arial,sans-serif" font-size="26" fill="#252525" font-weight="400">compare et je corrige.</text></svg>