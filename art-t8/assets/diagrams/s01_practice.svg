<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C0392B"/></marker><radialGradient id="ball" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#bdbdbd"/><stop offset="100%" stop-color="#4a4a4a"/></radialGradient></defs><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="130" fill="#C0392B"/><text x="40" y="46" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#fff">Une autre forme, un autre objet</text><text x="40" y="118" font-family="DejaVu Sans, Arial" font-size="25" fill="#EAF2F8">Production de transfert</text><rect x="60" y="150" width="800" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="60" y="150" width="800" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="76" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Pratique : une autre forme, un autre objet</text><path d="M180 480 L280 280 L380 480 Z" fill="none" stroke="#555" stroke-width="4"/><line x1="420" y1="400" x2="520" y2="400" stroke="#C0392B" stroke-width="5" marker-end="url(#arr)"/><path d="M600 500 L700 300 L800 500 Z" fill="url(#ball)" stroke="#222" stroke-width="4"/><rect x="676" y="500" width="48" height="38" fill="#6E6E6E" stroke="#222" stroke-width="3"/><ellipse cx="780" cy="546" rx="95" ry="18" fill="#8A8A8A" opacity="0.5"/><text x="280" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#555" text-anchor="middle">Triangle de départ</text><text x="690" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#1F4E79" text-anchor="middle">Objet + gris + ombre</text><text x="460" y="655" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#555" text-anchor="middle">Autres idées : voile, toit, sapin.</text><rect x="900" y="150" width="440" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="900" y="150" width="440" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="916" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Mes quatre critères</text><text x="925" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">1. Forme de départ</text><text x="925" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">identifiable : arrondie ou</text><text x="925" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">anguleuse.</text><text x="925" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">2. Objet imaginé</text><text x="925" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">reconnaissable grâce aux</text><text x="925" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">lignes ajoutées.</text><text x="925" y="450" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">3. Trois tons de gris</text><text x="925" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">lisibles : clair, moyen,</text><text x="925" y="516" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">foncé.</text><text x="925" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">4. Ombre portée du côté</text><text x="925" y="588" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#1F4E79" text-anchor="start">opposé à la lumière.</text><rect x="40" y="730" width="1320" height="160" rx="14" fill="#F4F8FB" stroke="#C0392B" stroke-width="2"/><text x="60" y="764" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#C0392B">Consigne / phrase clé</text><text x="60" y="802" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">Choisis une forme différente de celle de la leçon. Transforme-la en un objet</text><text x="60" y="840" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">imaginé de ton choix. Ajoute les lignes qui le rendent reconnaissable, pose trois</text><text x="60" y="878" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">tons de gris et une ombre portée, puis présente ton dessin.</text></svg>