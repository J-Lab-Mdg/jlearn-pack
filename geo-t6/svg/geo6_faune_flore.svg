  <text x="730" y="360" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">Les plantes uniques :</text>
  <text x="730" y="388" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">orchidées, baobabs, ravinala</text>
  <text x="500" y="470" text-anchor="middle" font-size="21" fill="#C00000" font-weight="bold">Endémique : un animal ou une plante qui n'existe qu'ici et nulle part ailleurs.</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">La plupart des animaux et des plantes de Madagascar sont endémiques : un trésor à protéger.</text>
