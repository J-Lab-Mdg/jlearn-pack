      <path d="M 14 10 Q 40 20 34 44" stroke="#8D6E63" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>
  <text x="170" y="350" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">Les lémuriens,</text>
  <text x="170" y="378" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">les rois de la forêt</text>
  
    <g transform="translate(430,260)">
