  <text x="765" y="152" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Les six régions du Centre :</text>
  <text x="680" y="150" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">1. Analamanga — Antananarivo</text><text x="680" y="196" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">2. Vakinankaratra — Antsirabe</text><text x="680" y="242" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">3. Itasy — Miarinarivo</text><text x="680" y="288" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">4. Bongolava — Tsiroanomandidy</text><text x="680" y="334" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">5. Amoron'i Mania — Ambositra</text><text x="680" y="380" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">6. Haute Matsiatra — Fianarantsoa</text>
