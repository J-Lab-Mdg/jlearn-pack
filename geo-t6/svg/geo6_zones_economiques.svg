<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les sept grandes zones économiques de Madagascar</text>
  
    <rect x="30" y="100" width="440" height="88" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="2"/>
    <g transform="translate(80,150) scale(2)"><line x1="0" y1="0" x2="0" y2="-26" stroke="#C0A16B" stroke-width="2"/><ellipse cx="0" cy="-26" rx="5" ry="8" fill="#FFD54F"/><ellipse cx="-5" cy="-18" rx="4" ry="7" fill="#FFD54F"/><ellipse cx="5" cy="-18" rx="4" ry="7" fill="#FFD54F"/><ellipse cx="-5" cy="-10" rx="4" ry="6" fill="#FFD54F"/><ellipse cx="5" cy="-10" rx="4" ry="6" fill="#FFD54F"/></g><text x="220" y="134" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">LA ZONE AGRICOLE</text><text x="220" y="164" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">riz, maïs, manioc, vanille, café</text>
  
    <rect x="530" y="100" width="440" height="88" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="2"/>
    <g transform="translate(580,145) scale(2)"><ellipse cx="0" cy="0" rx="20" ry="10" fill="#0288D1"/><path d="M 18 0 L 30 -9 L 30 9 Z" fill="#0288D1"/><circle cx="-10" cy="-2" r="2.5" fill="#FFF"/></g><text x="720" y="134" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">LA ZONE DE PÊCHE</text><text x="720" y="164" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">poissons, crevettes, langoustes</text>
  
    <rect x="30" y="204" width="440" height="88" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="2"/>
    <g transform="translate(80,240) scale(1)"><rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/><circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/></g><text x="220" y="238" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">LA ZONE FORESTIÈRE</text><text x="220" y="268" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">bois de chauffe, bois d'œuvre</text>
  
    <rect x="530" y="204" width="440" height="88" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="2"/>
    <g transform="translate(580,235) scale(1.6)"><path d="M 0 -14 L 12 -4 L 0 14 L -12 -4 Z" fill="#7C4DFF" stroke="#4527A0" stroke-width="2"/><path d="M -12 -4 L 12 -4" stroke="#4527A0" stroke-width="1.5"/></g><text x="720" y="238" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">LA ZONE MINIÈRE</text><text x="720" y="268" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">nickel, chromite, ilménite, saphirs</text>
  
    <rect x="30" y="308" width="440" height="88" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="2"/>
    <g transform="translate(80,330) scale(1.6)"><path d="M -14 0 L 14 0 L 11 24 L -11 24 Z" fill="#FFE0B2" stroke="#8D6E63" stroke-width="2"/><path d="M -8 0 Q 0 -12 8 0" fill="none" stroke="#8D6E63" stroke-width="2"/></g><text x="220" y="342" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">LA ZONE ARTISANALE</text><text x="220" y="372" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">paniers de raphia, sculptures, tissus</text>
  
    <rect x="530" y="308" width="440" height="88" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="2"/>
    <g transform="translate(580,340) scale(0.6)"><rect x="-30" y="-8" width="20" height="34" fill="#90A4AE" stroke="#546E7A" stroke-width="2"/><rect x="-6" y="-28" width="16" height="54" fill="#B0BEC5" stroke="#546E7A" stroke-width="2"/><rect x="14" y="2" width="18" height="24" fill="#A1887F" stroke="#6D4C41" stroke-width="2"/><rect x="-4" y="-20" width="6" height="6" fill="#FFF"/><rect x="4" y="-20" width="6" height="6" fill="#FFF"/><rect x="-4" y="-10" width="6" height="6" fill="#FFF"/><rect x="4" y="-10" width="6" height="6" fill="#FFF"/></g><text x="720" y="342" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">LA ZONE INDUSTRIELLE</text><text x="720" y="372" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">usines textiles, agroalimentaires, minières</text>
  
    <rect x="290" y="412" width="440" height="88" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="2"/>
    <g transform="translate(340,450) scale(1.2)"><path d="M -30 0 A 30 30 0 0 1 30 0 Z" fill="#FF7043" stroke="#D84315" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="34" stroke="#6D4C41" stroke-width="3"/></g><text x="480" y="446" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">LA ZONE TOURISTIQUE</text><text x="480" y="476" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">plages, parcs, collines royales</text>
  <text x="500" y="560" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Chaque zone vit de l'activité qui y domine ; ensemble, elles font vivre le pays.</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Sept zones, sept richesses : voilà l'économie malgache.</text>
</svg>