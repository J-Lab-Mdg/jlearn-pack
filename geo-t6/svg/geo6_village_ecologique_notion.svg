<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><defs><marker id="af" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#546E7A"/></marker>
<marker id="afR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C00000"/></marker>
<marker id="afV" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1E7B34"/></marker>
<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Qu'est-ce qu'un village écologique ?</text>
  
    <rect x="35" y="110" width="290" height="240" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
    <g transform="translate(180,165) scale(2.4)"><path d="M 0 -18 C 10 -4 14 2 14 8 A 14 14 0 1 1 -14 8 C -14 2 -10 -4 0 -18 Z" fill="#4FC3F7" stroke="#0277BD" stroke-width="2"/></g>
    <text x="180" y="220" text-anchor="middle" font-size="20" fill="#1E7B34" font-weight="bold">L'EAU PROTÉGÉE</text>
    <text x="180" y="260" text-anchor="middle" font-size="17" fill="#263238">source clôturée,</text>
    <text x="180" y="290" text-anchor="middle" font-size="17" fill="#263238">linge lavé loin,</text>
    <text x="180" y="320" text-anchor="middle" font-size="17" fill="#263238">eau claire pour tous</text>
  
    <rect x="355" y="110" width="290" height="240" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
    <g transform="translate(500,160) scale(1.7)"><rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/><circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/></g>
    <text x="500" y="220" text-anchor="middle" font-size="20" fill="#1E7B34" font-weight="bold">LA TERRE GÉRÉE</text>
    <text x="500" y="260" text-anchor="middle" font-size="17" fill="#263238">colline replantée,</text>
    <text x="500" y="290" text-anchor="middle" font-size="17" fill="#263238">déchets triés,</text>
    <text x="500" y="320" text-anchor="middle" font-size="17" fill="#263238">rien au vent</text>
  
    <rect x="675" y="110" width="290" height="240" rx="18" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
    <g transform="translate(820,160) scale(1.5)"><circle cx="0" cy="-16" r="6" fill="#1E7B34"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#1E7B34" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#1E7B34" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#1E7B34" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#1E7B34" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#1E7B34" stroke-width="4" stroke-linecap="round"/></g>
    <text x="820" y="220" text-anchor="middle" font-size="20" fill="#1E7B34" font-weight="bold">LES RÈGLES COMMUNES</text>
    <text x="820" y="260" text-anchor="middle" font-size="17" fill="#263238">le Dina accepté</text>
    <text x="820" y="290" text-anchor="middle" font-size="17" fill="#263238">par tous, appliqué</text>
    <text x="820" y="320" text-anchor="middle" font-size="17" fill="#263238">par le fokontany</text>
  <text x="500" y="415" text-anchor="middle" font-size="22" fill="#263238" font-weight="bold">Un village qui gère et valorise ses ressources (eau, forêt, terre)</text>
  <text x="500" y="450" text-anchor="middle" font-size="22" fill="#263238" font-weight="bold">selon des règles de vie communautaires,</text>
  <text x="500" y="485" text-anchor="middle" font-size="22" fill="#263238" font-weight="bold">pour le bien des générations futures.</text>
  <line x1="500" y1="505" x2="500" y2="505" stroke="#546E7A" stroke-width="5" marker-end="url(#af)"/>
  <text x="500" y="560" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Penser à demain : voilà la règle du village écologique.</text>
</svg>