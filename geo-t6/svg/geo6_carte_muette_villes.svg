  <text x="720" y="400" text-anchor="middle" font-size="18" fill="#263238" font-weight="bold">À retenir :</text>
  <text x="720" y="436" text-anchor="middle" font-size="17" fill="#263238">« La ville où siège le chef-lieu de ma région</text>
