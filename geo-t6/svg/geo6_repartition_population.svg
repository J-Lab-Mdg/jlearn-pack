  <text x="304.4" y="266.4" text-anchor="middle" font-size="16" fill="#795548" font-weight="bold">Hautes Terres</text>
  <text x="381.4" y="262" text-anchor="start" font-size="16" fill="#795548" font-weight="bold">Côte est</text>
  <text x="339.6" y="169.6" text-anchor="start" font-size="16" fill="#795548" font-weight="bold">Nord</text>
  <text x="238.4" y="416" text-anchor="end" font-size="15" fill="#795548">Ouest et Sud :</text>
  <text x="238.4" y="438" text-anchor="end" font-size="15" fill="#795548">peu peuplés</text>
  <rect x="600" y="130" width="360" height="150" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="3"/>
  <text x="780" y="165" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">LÉGENDE</text>
  <rect x="625" y="190" width="30" height="24" fill="#FBC02D" stroke="#C0A16B" stroke-width="2"/>
  <text x="790" y="208" text-anchor="start" font-size="18" fill="#263238">zones fortement peuplées</text>
  <rect x="625" y="230" width="30" height="24" fill="#FFF9C4" stroke="#C0A16B" stroke-width="2"/>
  <text x="790" y="248" text-anchor="start" font-size="18" fill="#263238">zones peu peuplées</text>
  <rect x="600" y="310" width="360" height="230" rx="14" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="780" y="345" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">OÙ SONT LES HABITANTS ?</text>
  <text x="780" y="390" text-anchor="middle" font-size="18" fill="#263238">Environ 30 millions de Malgaches,</text>
  <text x="780" y="418" text-anchor="middle" font-size="18" fill="#263238" font-weight="bold">surtout sur les Hautes Terres</text>
  <text x="780" y="446" text-anchor="middle" font-size="17" fill="#263238">centrales (Antananarivo, Antsirabe),</text>
  <text x="780" y="474" text-anchor="middle" font-size="17" fill="#263238">sur la côte est (Toamasina)</text>
  <text x="780" y="502" text-anchor="middle" font-size="17" fill="#263238">et dans le nord (Antsiranana).</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">La répartition de la population malgache est très inégale.</text>
