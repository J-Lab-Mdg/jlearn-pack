<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><defs><marker id="af" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#546E7A"/></marker>
<marker id="afR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C00000"/></marker>
<marker id="afV" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1E7B34"/></marker>
<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">L'implantation des équipements : traditions et raison</text>
  <defs><pattern id="hach" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="14" stroke="#EF6C00" stroke-width="3" opacity="0.5"/></pattern></defs><rect x="40" y="100" width="200" height="140" fill="url(#hach)" stroke="#EF6C00" stroke-width="2.5"/>
  <text x="140" y="150" text-anchor="middle" font-size="15" fill="#E65100" font-weight="bold">LA COLLINE</text>
  <text x="140" y="172" text-anchor="middle" font-size="15" fill="#E65100" font-weight="bold">DES ANCÊTRES</text>
  <text x="140" y="200" text-anchor="middle" font-size="13" fill="#263238" font-style="italic">tombes, bosquet :</text>
  <text x="140" y="220" text-anchor="middle" font-size="13" fill="#263238" font-style="italic">FADY, on ne touche pas</text>
  <rect x="300" y="100" width="400" height="140" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
  <g transform="translate(380,165) scale(1.3)"><path d="M 0 -18 C 10 -4 14 2 14 8 A 14 14 0 1 1 -14 8 C -14 2 -10 -4 0 -18 Z" fill="#4FC3F7" stroke="#0277BD" stroke-width="2"/></g>
  <text x="560" y="150" text-anchor="middle" font-size="16" fill="#01579B" font-weight="bold">LE POINT D'EAU</text>
  <text x="560" y="178" text-anchor="middle" font-size="14" fill="#263238">au centre des maisons :</text>
  <text x="560" y="200" text-anchor="middle" font-size="14" fill="#263238">cent pas au plus</text>
  <rect x="750" y="100" width="210" height="140" rx="18" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
  <text x="855" y="150" text-anchor="middle" font-size="16" fill="#263238" font-weight="bold">L'ÉCOLE</text>
  <text x="855" y="178" text-anchor="middle" font-size="14" fill="#263238">au calme, loin</text>
  <text x="855" y="200" text-anchor="middle" font-size="14" fill="#263238">du marché</text>
  <g transform="translate(800,235) scale(0.9)"><rect x="-16" y="-6" width="32" height="22" fill="#FFF9C4" stroke="#8D6E63" stroke-width="2"/><path d="M -20 -6 L 0 -22 L 20 -6 Z" fill="#C0553B" stroke="#8D6E63" stroke-width="2"/></g>
  <rect x="300" y="270" width="220" height="120" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="410" y="315" text-anchor="middle" font-size="15" fill="#1B5E20" font-weight="bold">L'ESPACE CULTUREL</text>
  <text x="410" y="345" text-anchor="middle" font-size="14" fill="#263238">face à la colline</text>
  <text x="410" y="367" text-anchor="middle" font-size="14" fill="#263238">des ancêtres</text>
  <g transform="translate(370,300) scale(0.9)"><circle cx="-6" cy="8" r="6" fill="#37474F"/><path d="M 0 8 L 0 -12 Q 8 -14 10 -8 Q 6 -8 4 -4 L 4 8" fill="none" stroke="#37474F" stroke-width="3"/></g>
  <rect x="570" y="270" width="220" height="120" rx="18" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  <text x="680" y="315" text-anchor="middle" font-size="15" fill="#E65100" font-weight="bold">LES SANITAIRES</text>
  <text x="680" y="345" text-anchor="middle" font-size="14" fill="#263238">en contrebas</text>
  <text x="680" y="367" text-anchor="middle" font-size="14" fill="#263238">des sources</text>
  <line x1="680" y1="250" x2="680" y2="285" stroke="#0277BD" stroke-width="4" marker-end="url(#afB)"/>
  <path d="M 560 240 Q 680 210 800 240" fill="none" stroke="#4FC3F7" stroke-width="10" stroke-linecap="round"/>
  <text x="680" y="225" text-anchor="middle" font-size="13" fill="#0277BD" font-style="italic">la source</text>
  <line x1="250" y1="170" x2="330" y2="170" stroke="#EF6C00" stroke-width="4" marker-end="url(#af)"/>
  <text x="290" y="155" text-anchor="middle" font-size="13" fill="#E65100">regardent</text>
  <rect x="40" y="430" width="920" height="80" rx="18" fill="#F3E5F5" stroke="#90A4AE" stroke-width="3"/>
  <text x="500" y="462" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">Les traditions (fady, lieux sacrés) et la raison placent chaque équipement</text>
  <text x="500" y="490" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">à sa juste place : le village moderne reste le village des ancêtres.</text>
  <text x="500" y="570" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">L'assemblée approuve le plan à main levée, puis il entre au grand cahier.</text>
</svg>