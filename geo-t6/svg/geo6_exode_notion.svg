  <text x="500" y="290" text-anchor="middle" font-size="16" fill="#263238" font-style="italic">valise, natte, sacs :</text>
  <text x="500" y="314" text-anchor="middle" font-size="16" fill="#263238" font-style="italic">on ne revient plus vivre au village</text>
  <text x="500" y="480" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">L'exode rural, c'est le départ définitif des campagnes vers les villes.</text>
  <text x="500" y="510" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">(Ne pas confondre avec le mouvement pendulaire : l'aller-retour quotidien.)</text>
