  <text x="765" y="152" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Les six régions du Sud :</text>
  <text x="680" y="150" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">1. Ihorombe — Ihosy</text><text x="680" y="196" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">2. Vatovavy — Mananjary</text><text x="680" y="242" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">3. Fitovinany — Manakara</text><text x="680" y="288" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">4. Atsimo-Andrefana — Toliara</text><text x="680" y="334" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">5. Androy — Ambovombe</text><text x="680" y="380" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">6. Anosy — Taolanaro</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Le Grand Sud : six régions, de Ihosy jusqu'au cap sud de Taolanaro.</text>
