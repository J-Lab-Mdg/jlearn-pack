<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Population et ressources : la grande balance</text>
  <text x="500" y="95" text-anchor="middle" font-size="19" fill="#546E7A" font-style="italic">Que se passe-t-il quand un plateau s'alourdit plus vite que l'autre ?</text>
  <line x1="200" y1="130" x2="200" y2="420" stroke="#37474F" stroke-width="12" stroke-linecap="round"/>
  <line x1="800" y1="130" x2="800" y2="420" stroke="#37474F" stroke-width="12" stroke-linecap="round"/>
  <line x1="500" y1="140" x2="500" y2="440" stroke="#37474F" stroke-width="14" stroke-linecap="round"/>
  <line x1="150" y1="160" x2="850" y2="140" stroke="#546E7A" stroke-width="6"/>
  <line x1="120" y1="165" x2="280" y2="165" stroke="#37474F" stroke-width="8" stroke-linecap="round"/>
  <line x1="720" y1="145" x2="880" y2="145" stroke="#37474F" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="130" r="10" fill="#C00000" stroke="#7f0000" stroke-width="2"/><circle cx="800" cy="110" r="10" fill="#2E7D32" stroke="#7f0000" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-size="20" fill="#C00000" font-weight="bold">LA POPULATION</text>
  <text x="200" y="235" text-anchor="middle" font-size="18" fill="#263238">augmente vite :</text>
  <text x="200" y="263" text-anchor="middle" font-size="18" fill="#263238">plus de bouches</text>
  <text x="200" y="291" text-anchor="middle" font-size="18" fill="#263238">à nourrir, plus de</text>
  <text x="200" y="319" text-anchor="middle" font-size="18" fill="#263238">maisons à bâtir.</text>
  <text x="200" y="380" text-anchor="middle" font-size="18" fill="#263238" font-style="italic">Elle descend,</text>
  <text x="200" y="405" text-anchor="middle" font-size="18" fill="#263238" font-style="italic">toujours plus lourde.</text>
  <text x="800" y="180" text-anchor="middle" font-size="20" fill="#2E7D32" font-weight="bold">LES RESSOURCES</text>
  <text x="800" y="215" text-anchor="middle" font-size="18" fill="#263238">la terre, l'eau,</text>
  <text x="800" y="243" text-anchor="middle" font-size="18" fill="#263238">la forêt, les poissons…</text>
  <text x="800" y="300" text-anchor="middle" font-size="18" fill="#263238" font-style="italic">Elles ne peuvent pas</text>
  <text x="800" y="328" text-anchor="middle" font-size="18" fill="#263238" font-style="italic">augmenter aussi vite :</text>
  <text x="800" y="356" text-anchor="middle" font-size="18" fill="#C00000" font-style="italic">c'est le déséquilibre.</text>
  <text x="500" y="500" text-anchor="middle" font-size="21" fill="#C00000" font-weight="bold">Le déséquilibre : la population grandit plus vite que les ressources.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Quand les hommes deviennent trop nombreux pour les ressources, la vie devient difficile.</text>
</svg>