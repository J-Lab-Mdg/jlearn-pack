<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les causes et les conséquences des migrations</text>
  <defs><marker id="af" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#546E7A"/></marker>
<marker id="afR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C00000"/></marker>
<marker id="afV" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1E7B34"/></marker>
<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs>
  <text x="250" y="105" text-anchor="middle" font-size="20" fill="#E65100" font-weight="bold">LES CAUSES DU DÉPART</text>
  
    <rect x="50" y="125" width="400" height="100" rx="14" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
    <text x="250" y="163" text-anchor="middle" font-size="18" fill="#E65100" font-weight="bold">CAUSES ÉCONOMIQUES</text>
    <text x="250" y="193" text-anchor="middle" font-size="15" fill="#263238">chercher du travail, une terre, suivre les études</text>
  
    <rect x="50" y="245" width="400" height="100" rx="14" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
    <text x="250" y="283" text-anchor="middle" font-size="18" fill="#E65100" font-weight="bold">CAUSES SOCIOCULTURELLES</text>
    <text x="250" y="313" text-anchor="middle" font-size="15" fill="#263238">le mariage, rejoindre sa famille, la coutume</text>
  
    <rect x="50" y="365" width="400" height="100" rx="14" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
    <text x="250" y="403" text-anchor="middle" font-size="18" fill="#E65100" font-weight="bold">CATASTROPHES NATURELLES</text>
    <text x="250" y="433" text-anchor="middle" font-size="15" fill="#263238">cyclones, sécheresses, inondations</text>
  <text x="750" y="105" text-anchor="middle" font-size="20" fill="#01579B" font-weight="bold">LES CONSÉQUENCES</text>
  
    <rect x="550" y="125" width="400" height="100" rx="14" fill="#E3F2FD" stroke="#90A4AE" stroke-width="3"/>
    <text x="750" y="163" text-anchor="middle" font-size="18" fill="#01579B" font-weight="bold">LA VILLE GRANDIT VITE</text>
    <text x="750" y="193" text-anchor="middle" font-size="15" fill="#263238">accroissement de la population urbaine</text>
  
    <rect x="550" y="245" width="400" height="100" rx="14" fill="#E3F2FD" stroke="#90A4AE" stroke-width="3"/>
    <text x="750" y="283" text-anchor="middle" font-size="18" fill="#01579B" font-weight="bold">DOMINATION DES ÉMIGRANTS</text>
    <text x="750" y="313" text-anchor="middle" font-size="15" fill="#263238">les nouveaux venus dépassent les enfants du pays</text>
  
    <rect x="550" y="365" width="400" height="100" rx="14" fill="#E3F2FD" stroke="#90A4AE" stroke-width="3"/>
    <text x="750" y="403" text-anchor="middle" font-size="18" fill="#01579B" font-weight="bold">LES CAMPAGNES SE VIDENT</text>
    <text x="750" y="433" text-anchor="middle" font-size="15" fill="#263238">les jeunes partent : c'est l'exode rural (unité 4)</text>
  <line x1="460" y1="315" x2="540" y2="315" stroke="#546E7A" stroke-width="7" marker-end="url(#af)"/>
  <text x="500" y="505" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">Les hommes partent pour vivre mieux ; les villes d'accueil gonflent, les villages s'effeuillent.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Comprendre les causes et les conséquences des migrations.</text>
</svg>