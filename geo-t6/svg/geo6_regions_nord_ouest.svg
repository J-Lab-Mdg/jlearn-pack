  <text x="765" y="152" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Les sept régions du Nord et de l'Ouest :</text>
  <text x="680" y="150" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">1. DIANA — Antsiranana</text><text x="680" y="196" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">2. SAVA — Sambava</text><text x="680" y="242" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">3. Sofia — Antsohihy</text><text x="680" y="288" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">4. Betsiboka — Maevatanana</text><text x="680" y="334" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">5. Boeny — Mahajanga</text><text x="680" y="380" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">6. Melaky — Maintirano</text><text x="680" y="426" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">7. Menabe — Morondava</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Le Nord et l'Ouest : sept régions du Diégo-Suarez à Morondava.</text>
