<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Situer sa région : délimitation et superficie</text>
  <rect x="40" y="90" width="480" height="470" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/>
  <g transform="translate(330 330) scale(2.1) translate(-50 -100)"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z" fill="#F5F5F5" stroke="#5D4037" stroke-width="1.4285714285714286" stroke-linejoin="round"/></g>
  <line x1="270" y1="435" x2="392" y2="435" stroke="#C00000" stroke-width="3.5" stroke-dasharray="10 6"/>
  <circle cx="319.5" cy="319.5" r="7" fill="#C00000" stroke="#7f0000" stroke-width="2"/>
  <text x="319.5" y="294.3" text-anchor="middle" font-size="15" fill="#C00000" font-weight="bold">…ma région…</text>
  <text x="280" y="545" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">Trace la frontière de ta région et écris son nom.</text>
  <rect x="560" y="120" width="410" height="330" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="3"/>
  <text x="765" y="155" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Pour situer ma région</text>
  <text x="585" y="200" text-anchor="start" font-size="19" fill="#263238">1. Son nom : ……………………………</text>
  <text x="585" y="240" text-anchor="start" font-size="19" fill="#263238">2. Son chef-lieu : ………………………</text>
  <text x="585" y="280" text-anchor="start" font-size="19" fill="#263238">3. Ses régions voisines : ……………</text>
  <text x="585" y="320" text-anchor="start" font-size="19" fill="#263238">4. Sa superficie : ……… km²</text>
  <text x="585" y="360" text-anchor="start" font-size="19" fill="#263238">5. Mon district : ………………………</text>
  <text x="585" y="400" text-anchor="start" font-size="19" fill="#263238">6. Ma commune : ………………………</text>
  <text x="585" y="435" text-anchor="start" font-size="19" fill="#263238">7. Mon fokontany : ………………………</text>
  <text x="765" y="490" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold">Madagascar : 587 000 km² — 24 régions de tailles différentes</text>
  <text x="500" y="595" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">La superficie est la mesure de l'étendue d'une région ; la délimitation est sa frontière sur la carte.</text>
</svg>