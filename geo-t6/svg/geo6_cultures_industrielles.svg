<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Cultures industrielles et agriculture malgache</text>
  <rect x="40" y="100" width="440" height="250" rx="18" fill="#FFF3E0" stroke="#90A4AE" stroke-width="3"/>
  <text x="260" y="138" text-anchor="middle" font-size="19" fill="#E65100" font-weight="bold">LES CULTURES INDUSTRIELLES</text>
  <text x="260" y="190" text-anchor="middle" font-size="17" fill="#263238">la canne à sucre → l'usine sucrière</text>
  <text x="260" y="222" text-anchor="middle" font-size="17" fill="#263238">le coton → la filature textile</text>
  <text x="260" y="265" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">De grands champs pour les usines,</text>
  <text x="260" y="291" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">surtout sur la côte ouest et au nord.</text>
  <rect x="520" y="100" width="440" height="250" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="740" y="138" text-anchor="middle" font-size="19" fill="#1B5E20" font-weight="bold">L'AGRICULTURE MALGACHE</text>
  <text x="740" y="190" text-anchor="middle" font-size="17" fill="#263238">• des petites parcelles</text>
  <text x="740" y="222" text-anchor="middle" font-size="17" fill="#263238">• la houe et l'angady, à la main</text>
  <text x="740" y="254" text-anchor="middle" font-size="17" fill="#263238">• tout dépend de la pluie</text>
  <text x="740" y="300" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">Artisanale : elle nourrit pourtant</text>
  <text x="740" y="326" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">la grande majorité du pays.</text>
  <rect x="40" y="380" width="920" height="110" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
  <text x="500" y="415" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">L'avenir : semis en lignes, compost, irrigation —</text>
  <text x="500" y="448" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">produire plus sans attendre tout du ciel.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">De grands champs pour les usines ; de petites parcelles pour les familles.</text>
</svg>