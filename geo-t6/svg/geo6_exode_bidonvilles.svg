    </g>
  
    <g transform="translate(140,320) scale(1.2)">
      <rect x="-20" y="-10" width="40" height="26" fill="#A1887F" stroke="#6D4C41" stroke-width="2"/>
      <path d="M -24 -10 L 0 -26 L 24 -10 Z" fill="#78909C" stroke="#6D4C41" stroke-width="2"/>
    </g>
    <g transform="translate(230,315) scale(1.3)">
      <rect x="-20" y="-10" width="40" height="26" fill="#BCAAA4" stroke="#6D4C41" stroke-width="2"/>
      <path d="M -24 -10 L 0 -26 L 24 -10 Z" fill="#78909C" stroke="#6D4C41" stroke-width="2"/>
