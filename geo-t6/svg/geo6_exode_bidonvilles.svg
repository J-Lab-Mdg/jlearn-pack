      <rect x="-20" y="-10" width="40" height="26" fill="#BCAAA4" stroke="#6D4C41" stroke-width="2"/>
      <path d="M -24 -10 L 0 -26 L 24 -10 Z" fill="#78909C" stroke="#6D4C41" stroke-width="2"/>
    </g>
  
    <g transform="translate(500,225) scale(1)">
      <rect x="-20" y="-10" width="40" height="26" fill="#BCAAA4" stroke="#6D4C41" stroke-width="2"/>
      <path d="M -24 -10 L 0 -26 L 24 -10 Z" fill="#78909C" stroke="#6D4C41" stroke-width="2"/>
    </g>
  <circle cx="120" cy="400" r="12" fill="#4FC3F7" stroke="#0277BD" stroke-width="3"/>
  <text x="150" y="406" text-anchor="start" font-size="15" fill="#263238">l'unique fontaine, à 10 minutes</text>
  <rect x="70" y="425" width="470" height="14" fill="#4FC3F7" stroke="#0277BD" stroke-width="2"/>
  <text x="305" y="455" text-anchor="middle" font-size="15" fill="#0277BD" font-style="italic">le canal : en saison des pluies, il monte jusqu'aux portes</text>
  <text x="305" y="200" text-anchor="middle" font-size="15" fill="#546E7A">planches, tôles, cartons :</text>
  <text x="305" y="178" text-anchor="middle" font-size="15" fill="#546E7A">des maisons précaires, serrées</text>
  <rect x="600" y="125" width="360" height="340" rx="18" fill="#FFEBEE" stroke="#90A4AE" stroke-width="3"/>
  <text x="780" y="165" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold">LES DANGERS QUOTIDIENS</text>
  <text x="780" y="215" text-anchor="middle" font-size="17" fill="#263238">• L'insalubrité : déchets, eau sale,</text>
  <text x="780" y="243" text-anchor="middle" font-size="17" fill="#263238">  maladies des enfants.</text>
  <text x="780" y="290" text-anchor="middle" font-size="17" fill="#263238">• Les incendies : bois et carton</text>
  <text x="780" y="318" text-anchor="middle" font-size="17" fill="#263238">  s'enflamment en quelques minutes.</text>
  <text x="780" y="365" text-anchor="middle" font-size="17" fill="#263238">• Les inondations : l'eau du canal</text>
  <text x="780" y="393" text-anchor="middle" font-size="17" fill="#263238">  emporte les maigres biens.</text>
  <text x="780" y="440" text-anchor="middle" font-size="15" fill="#546E7A" font-style="italic">Une chambre minuscule, une seule latrine</text>
  <text x="780" y="462" text-anchor="middle" font-size="15" fill="#546E7A" font-style="italic">pour des dizaines de foyers.</text>
  <text x="500" y="520" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Le bidonville : des maisons précaires, sans eau, sans égouts, sans sécurité.</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">La ville qui attire ne peut pas loger tous ses arrivants.</text>
</svg>