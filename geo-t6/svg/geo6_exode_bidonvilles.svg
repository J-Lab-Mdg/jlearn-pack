<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Conséquence (4) : les bidonvilles autour des villes</text>
  <text x="500" y="100" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">Des milliers d'arrivants par mois, pas assez de logements : les quartiers poussent à la hâte.</text>
  <rect x="40" y="125" width="520" height="340" rx="18" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
  
