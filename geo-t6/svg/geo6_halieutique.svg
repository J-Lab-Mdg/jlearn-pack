<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les ressources halieutiques de Madagascar</text>
  <rect x="50" y="100" width="900" height="220" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
  <text x="500" y="140" text-anchor="middle" font-size="20" fill="#01579B" font-style="italic">« Halieutique » veut dire : tout ce qui vient de la pêche</text>
  
  <g transform="translate(150,240) scale(2)">
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="#0288D1"/>
    <path d="M 18 0 L 30 -9 L 30 9 Z" fill="#0288D1"/>
    <circle cx="-10" cy="-2" r="2.5" fill="#FFFFFF"/>
  </g>
  <g transform="translate(320,250) scale(1.6)">
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="#039BE5"/>
    <path d="M 18 0 L 30 -9 L 30 9 Z" fill="#039BE5"/>
    <circle cx="-10" cy="-2" r="2.5" fill="#FFFFFF"/>
  </g>
  <g transform="translate(470,235) scale(2)">
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="#0288D1"/>
    <path d="M 18 0 L 30 -9 L 30 9 Z" fill="#0288D1"/>
    <circle cx="-10" cy="-2" r="2.5" fill="#FFFFFF"/>
  </g>
  
  <g transform="translate(640,250) scale(1.6)">
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="#26C6DA"/>
    <path d="M 18 0 L 30 -9 L 30 9 Z" fill="#26C6DA"/>
    <circle cx="-10" cy="-2" r="2.5" fill="#FFFFFF"/>
  </g>
  <g transform="translate(800,235) scale(2)">
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="#039BE5"/>
    <path d="M 18 0 L 30 -9 L 30 9 Z" fill="#039BE5"/>
    <circle cx="-10" cy="-2" r="2.5" fill="#FFFFFF"/>
  </g>
  <text x="500" y="300" text-anchor="middle" font-size="19" fill="#263238">les poissons de mer et de rivière, les crevettes, les langoustes, les crabes</text>
  <rect x="50" y="360" width="440" height="140" rx="18" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  <text x="270" y="400" text-anchor="middle" font-size="20" fill="#E65100" font-weight="bold">LA PÊCHE ARTISANALE</text>
  <text x="270" y="438" text-anchor="middle" font-size="18" fill="#263238">Les pêcheurs et leurs pirogues</text>
  <text x="270" y="466" text-anchor="middle" font-size="18" fill="#263238">nourrissent les villages du bord de mer.</text>
  <rect x="510" y="360" width="440" height="140" rx="18" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  <text x="730" y="400" text-anchor="middle" font-size="20" fill="#E65100" font-weight="bold">LA PÊCHE INDUSTRIELLE</text>
  <text x="730" y="438" text-anchor="middle" font-size="18" fill="#263238">Les grands bateaux pêchent loin,</text>
  <text x="730" y="466" text-anchor="middle" font-size="18" fill="#263238">et les produits partent vers les villes.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Les eaux de Madagascar regorgent de poissons : une richesse qui se renouvelle si on ne surpêche pas.</text>
</svg>