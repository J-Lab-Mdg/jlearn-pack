<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">La nouvelle technologie et l'intelligence artificielle</text>
  <g transform="translate(160,210) scale(1.8)"><rect x="-12" y="-22" width="24" height="44" rx="4" fill="#37474F" stroke="#263238" stroke-width="2"/><rect x="-9" y="-17" width="18" height="30" fill="#4FC3F7"/><circle cx="0" cy="17" r="3" fill="#FFF"/></g><g transform="translate(390,210) scale(1.6)"><rect x="-22" y="-18" width="44" height="30" rx="3" fill="#37474F"/><rect x="-18" y="-14" width="36" height="22" fill="#4FC3F7"/><rect x="-8" y="14" width="16" height="6" fill="#78909C"/></g><g transform="translate(620,210) scale(1.6)"><rect x="-14" y="-8" width="28" height="26" rx="4" fill="#78909C" stroke="#455A64" stroke-width="2"/><rect x="-10" y="-26" width="20" height="16" rx="3" fill="#90A4AE" stroke="#455A64" stroke-width="2"/><circle cx="-4" cy="-18" r="2.5" fill="#C62828"/><circle cx="4" cy="-18" r="2.5" fill="#C62828"/><line x1="0" y1="-26" x2="0" y2="-34" stroke="#455A64" stroke-width="2"/><circle cx="0" cy="-36" r="3" fill="#FFD54F"/><line x1="-14" y1="0" x2="-26" y2="8" stroke="#455A64" stroke-width="3"/><line x1="14" y1="0" x2="26" y2="8" stroke="#455A64" stroke-width="3"/></g>
  <text x="160" y="280" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">le téléphone :</text>
  <text x="160" y="308" text-anchor="middle" font-size="15" fill="#263238">voir loin,</text>
  <text x="160" y="332" text-anchor="middle" font-size="15" fill="#263238">payer, écrire</text>
  <text x="390" y="280" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">l'ordinateur :</text>
  <text x="390" y="308" text-anchor="middle" font-size="15" fill="#263238">écrire, calculer,</text>
  <text x="390" y="332" text-anchor="middle" font-size="15" fill="#263238">dessiner</text>
  <text x="620" y="280" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">le robot :</text>
  <text x="620" y="308" text-anchor="middle" font-size="15" fill="#263238">souder, emballer</text>
  <text x="620" y="332" text-anchor="middle" font-size="15" fill="#263238">sans se fatiguer</text>
  <text x="870" y="205" text-anchor="middle" font-size="17" fill="#01579B" font-weight="bold">INTERNET</text>
  <text x="870" y="235" text-anchor="middle" font-size="15" fill="#263238">le grand réseau</text>
  <text x="870" y="259" text-anchor="middle" font-size="15" fill="#263238">qui relie tout</text>
  <rect x="40" y="370" width="440" height="120" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="260" y="405" text-anchor="middle" font-size="17" fill="#1B5E20" font-weight="bold">AVANTAGES</text>
  <text x="260" y="440" text-anchor="middle" font-size="15" fill="#263238">parler loin, apprendre vite,</text>
  <text x="260" y="465" text-anchor="middle" font-size="15" fill="#263238">soigner, traduire, produire</text>
  <rect x="520" y="370" width="440" height="120" rx="18" fill="#FFEBEE" stroke="#90A4AE" stroke-width="3"/>
  <text x="740" y="405" text-anchor="middle" font-size="17" fill="#C00000" font-weight="bold">INCONVÉNIENTS</text>
  <text x="740" y="440" text-anchor="middle" font-size="15" fill="#263238">coût, dépendance, emplois</text>
  <text x="740" y="465" text-anchor="middle" font-size="15" fill="#263238">remplacés, erreurs à vérifier</text>
  <text x="500" y="530" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">L'intelligence artificielle apprend et aide — mais la machine aide, l'homme décide.</text>
  <text x="500" y="558" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Rester le maître de l'outil : voilà la règle.</text>
</svg>