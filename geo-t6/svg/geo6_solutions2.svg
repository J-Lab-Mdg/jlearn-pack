<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les solutions (2) : agir sur les hommes et les structures</text>
  <rect x="50" y="110" width="290" height="310" rx="18" fill="#E3F2FD" stroke="#90A4AE" stroke-width="3"/>
  <text x="195" y="150" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">DES FAMILLES</text>
  <text x="195" y="185" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">QUI GRANDISSENT</text>
  <text x="195" y="220" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">LENTEMENT</text>
  <text x="195" y="275" text-anchor="middle" font-size="17" fill="#263238">Des familles moins</text>
  <text x="195" y="303" text-anchor="middle" font-size="17" fill="#263238">nombreuses peuvent</text>
  <text x="195" y="331" text-anchor="middle" font-size="17" fill="#263238">mieux nourrir et</text>
  <text x="195" y="359" text-anchor="middle" font-size="17" fill="#263238">instruire chaque</text>
  <text x="195" y="387" text-anchor="middle" font-size="17" fill="#263238">enfant.</text>
  <rect x="355" y="110" width="290" height="310" rx="18" fill="#E3F2FD" stroke="#90A4AE" stroke-width="3"/>
  <text x="500" y="150" text-anchor="middle" font-size="17" fill="#01579B" font-weight="bold">DES INFRASTRUCTURES</text>
  <text x="500" y="182" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">SOCIALES SOLIDES</text>
  <text x="500" y="235" text-anchor="middle" font-size="17" fill="#263238">Écoles, centres de</text>
  <text x="500" y="263" text-anchor="middle" font-size="17" fill="#263238">santé, adductions</text>
  <text x="500" y="291" text-anchor="middle" font-size="17" fill="#263238">d'eau, routes :</text>
  <text x="500" y="319" text-anchor="middle" font-size="17" fill="#263238">le village résiste</text>
  <text x="500" y="347" text-anchor="middle" font-size="17" fill="#263238">mieux aux coups</text>
  <text x="500" y="375" text-anchor="middle" font-size="17" fill="#263238">du sort.</text>
  <rect x="660" y="110" width="290" height="310" rx="18" fill="#E3F2FD" stroke="#90A4AE" stroke-width="3"/>
  <text x="805" y="150" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">DES PRATIQUES</text>
  <text x="805" y="185" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">MODERNES</text>
  <text x="805" y="240" text-anchor="middle" font-size="17" fill="#263238">Remplacer le tavy</text>
  <text x="805" y="268" text-anchor="middle" font-size="17" fill="#263238">par de vrais champs ;</text>
  <text x="805" y="296" text-anchor="middle" font-size="17" fill="#263238">cuire avec du gaz ou</text>
  <text x="805" y="324" text-anchor="middle" font-size="17" fill="#263238">des foyers économes</text>
  <text x="805" y="352" text-anchor="middle" font-size="17" fill="#263238">au lieu du bois ;</text>
  <text x="805" y="380" text-anchor="middle" font-size="17" fill="#263238">bien gérer ensemble.</text>
  <text x="500" y="490" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Familles, infrastructures, pratiques : les trois appuis du village résilient.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Agir sur les hommes et les structures : le pays devient plus fort face aux problèmes.</text>
</svg>