  <text x="265" y="365" text-anchor="middle" font-size="16" fill="#263238">labour, repiquage, récolte, digues :</text>
  <text x="265" y="390" text-anchor="middle" font-size="16" fill="#263238">les jeunes faisaient tout.</text>
