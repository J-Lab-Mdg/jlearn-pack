  <text x="500" y="435" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">Il reste les anciens, seuls face aux champs : « À soixante ans, je n'ai plus la force de tout faire. »</text>
  <text x="500" y="495" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold">Sans main-d'œuvre, les récoltes baissent et les services ferment.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Le départ des bras valides laisse les champs à l'abandon.</text>
