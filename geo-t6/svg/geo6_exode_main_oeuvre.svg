  <text x="735" y="340" text-anchor="middle" font-size="16" fill="#C00000">herbes sauvages, digues cassées :</text>
  <text x="735" y="365" text-anchor="middle" font-size="16" fill="#C00000">plus personne pour cultiver.</text>
  
  <g transform="translate(300,450) scale(1.5)">
