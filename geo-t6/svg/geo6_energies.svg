<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les ressources énergétiques</text>
  <rect x="50" y="100" width="440" height="300" rx="18" fill="#FFF3E0" stroke="#90A4AE" stroke-width="3"/>
  <text x="270" y="140" text-anchor="middle" font-size="20" fill="#E65100" font-weight="bold">LES ÉNERGIES FOSSILES</text>
  <text x="270" y="200" text-anchor="middle" font-size="18" fill="#263238">Le pétrole et le gaz, extraits du sous-sol</text>
  <text x="270" y="235" text-anchor="middle" font-size="18" fill="#263238">Le charbon, des roches noires qui brûlent</text>
  <text x="270" y="300" text-anchor="middle" font-size="18" fill="#263238">Elles font marcher les moteurs,</text>
  <text x="270" y="330" text-anchor="middle" font-size="18" fill="#263238">les usines et les centrales.</text>
  <text x="270" y="385" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold">⚠ Une fois brûlées, elles sont finies.</text>
  <rect x="510" y="100" width="440" height="300" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
  <text x="730" y="140" text-anchor="middle" font-size="20" fill="#01579B" font-weight="bold">LES ÉNERGIES QUI DURENT</text>
  <circle cx="620" cy="240" r="30" fill="#FFD54F" stroke="#F9A825" stroke-width="3"/><line x1="656" y1="240" x2="666" y2="240" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="645.4558441227157" y1="265.4558441227157" x2="652.5269119345812" y2="272.52691193458116" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="620" y1="276" x2="620" y2="286" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="594.5441558772843" y1="265.4558441227157" x2="587.4730880654188" y2="272.52691193458116" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="584" y1="240" x2="574" y2="240" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="594.5441558772843" y1="214.54415587728428" x2="587.4730880654188" y2="207.4730880654188" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="620" y1="204" x2="620" y2="194" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="645.4558441227157" y1="214.54415587728428" x2="652.5269119345812" y2="207.4730880654188" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="310" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">Le soleil</text>
  
  <g transform="translate(740,235) scale(2.2)">
    <path d="M 0 -18 C 10 -4 14 4 14 10 A 14 14 0 1 1 -14 10 C -14 4 -10 -4 0 -18 Z" fill="#29B6F6" stroke="#0277BD" stroke-width="2"/>
  </g>
  <text x="740" y="310" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">L'eau des</text>
  <text x="740" y="332" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">barrages</text>
  
  <g transform="translate(860,240) scale(1.2)">
    <rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/>
    <circle cx="0" cy="0" r="18" fill="#388E3C"/><circle cx="-13" cy="8" r="13" fill="#388E3C"/><circle cx="13" cy="8" r="13" fill="#388E3C"/>
  </g>
  <text x="860" y="310" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">Le bois et</text>
  <text x="860" y="332" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">les plantes</text>
  <text x="500" y="470" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Pétrole, gaz et charbon s'épuisent ; soleil, eau et forêts se renouvellent.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Les énergies fossiles sont non renouvelables ; les énergies propres se renouvellent.</text>
</svg>