  <text x="500" y="300" text-anchor="middle" font-size="22" fill="#5D4037" font-weight="bold">Comme le balancier</text>
  <text x="500" y="332" text-anchor="middle" font-size="22" fill="#5D4037" font-weight="bold">d'une horloge :</text>
  <text x="500" y="364" text-anchor="middle" font-size="20" fill="#263238" font-style="italic">un va-et-vient quotidien</text>
  <text x="500" y="525" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">Le mouvement pendulaire n'est pas une migration : on ne change pas de logement.</text>
  <text x="500" y="550" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Domicile le soir, travail en ville le jour : le trajet pendulaire se répète chaque jour.</text>
