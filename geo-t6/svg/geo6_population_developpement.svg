<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Population et développement socioéconomique</text>
  <defs><marker id="af" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#546E7A"/></marker>
<marker id="afR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C00000"/></marker>
<marker id="afV" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1E7B34"/></marker>
<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs>
  <rect x="280" y="95" width="440" height="80" rx="16" fill="#01579B"/>
  <text x="500" y="130" text-anchor="middle" font-size="19" fill="#FFFFFF" font-weight="bold">UNE POPULATION JEUNE ET NOMBREUSE</text>
  <text x="500" y="157" text-anchor="middle" font-size="16" fill="#FFFFFF" font-style="italic">beaucoup d'enfants, beaucoup de bras demain</text>
  <line x1="390" y1="185" x2="260" y2="240" stroke="#C00000" stroke-width="6" marker-end="url(#af)"/>
  <line x1="610" y1="185" x2="740" y2="240" stroke="#1E7B34" stroke-width="6" marker-end="url(#af)"/>
  <rect x="60" y="250" width="400" height="210" rx="16" fill="#FFEBEE" stroke="#C00000" stroke-width="3"/>
  <text x="260" y="290" text-anchor="middle" font-size="20" fill="#C00000" font-weight="bold">SANS PRÉPARATION</text>
  <text x="260" y="335" text-anchor="middle" font-size="18" fill="#263238">écoles qui débordent,</text>
  <text x="260" y="365" text-anchor="middle" font-size="18" fill="#263238">jeunes sans travail,</text>
  <text x="260" y="395" text-anchor="middle" font-size="18" fill="#263238">pauvreté et insécurité :</text>
  <text x="260" y="430" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold">le développement freine.</text>
  <rect x="540" y="250" width="400" height="210" rx="16" fill="#E8F5E9" stroke="#1E7B34" stroke-width="3"/>
  <text x="740" y="290" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">AVEC ÉCOLES ET EMPLOIS</text>
  <text x="740" y="335" text-anchor="middle" font-size="18" fill="#263238">des enfants instruits,</text>
  <text x="740" y="365" text-anchor="middle" font-size="18" fill="#263238">des jeunes bien formés,</text>
  <text x="740" y="395" text-anchor="middle" font-size="18" fill="#263238">des travailleurs créatifs :</text>
  <text x="740" y="430" text-anchor="middle" font-size="18" fill="#1B5E20" font-weight="bold">une force pour le pays.</text>
  <text x="500" y="510" text-anchor="middle" font-size="22" fill="#263238" font-weight="bold">Former la jeunesse, c'est préparer l'avenir.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">La même population : un poids ou une force, selon qu'on la prépare.</text>
</svg>