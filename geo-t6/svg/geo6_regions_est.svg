  <text x="765" y="152" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Les cinq régions de l'Est :</text>
  <text x="680" y="150" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">1. Ambatosoa — Maroantsetra</text><text x="680" y="196" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">2. Analanjirofo — Fenoarivo-Atsinanana</text><text x="680" y="242" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">3. Atsinanana — Toamasina</text><text x="680" y="288" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">4. Alaotra-Mangoro — Ambatondrazaka</text><text x="680" y="334" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">5. Atsimo-Atsinanana — Farafangana</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">L'Est de Madagascar, face à l'océan Indien : cinq régions au climat pluvieux.</text>
