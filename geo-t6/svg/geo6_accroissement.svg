<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Comment la population évolue-t-elle ?</text>
  
    <rect x="40" y="110" width="250" height="110" rx="14" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
    <text x="165" y="150" text-anchor="middle" font-size="18" fill="#263238" font-weight="bold">POPULATION</text>
    <text x="165" y="185" text-anchor="middle" font-size="16" fill="#263238">d'aujourd'hui</text>
  <text x="315" y="175" text-anchor="middle" font-size="40" fill="#1B5E20" font-weight="bold">+</text>
  
    <rect x="340" y="110" width="250" height="110" rx="14" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
    <text x="465" y="150" text-anchor="middle" font-size="18" fill="#263238" font-weight="bold">LES NAISSANCES</text>
    <text x="465" y="185" text-anchor="middle" font-size="16" fill="#263238">la natalité</text>
  <text x="615" y="175" text-anchor="middle" font-size="40" fill="#C00000" font-weight="bold">−</text>
  
    <rect x="640" y="110" width="250" height="110" rx="14" fill="#FFEBEE" stroke="#90A4AE" stroke-width="3"/>
    <text x="765" y="150" text-anchor="middle" font-size="18" fill="#263238" font-weight="bold">LES DÉCÈS</text>
    <text x="765" y="185" text-anchor="middle" font-size="16" fill="#263238">la mortalité</text>
  <text x="915" y="172" text-anchor="middle" font-size="34" fill="#263238" font-weight="bold">=</text>
  <text x="500" y="265" text-anchor="middle" font-size="21" fill="#01579B" font-weight="bold">POPULATION DE DEMAIN</text>
  <rect x="60" y="310" width="880" height="170" rx="18" fill="#FAFAFA" stroke="#90A4AE" stroke-width="3"/>
  <text x="110" y="350" text-anchor="start" font-size="19" fill="#1B5E20" font-weight="bold">NATALITÉ</text>
  <rect x="250" y="332" width="560" height="26" rx="6" fill="#66BB6A"/>
  <text x="830" y="351" text-anchor="start" font-size="17" fill="#1B5E20" font-style="italic">forte</text>
  <text x="110" y="410" text-anchor="start" font-size="19" fill="#C00000" font-weight="bold">MORTALITÉ</text>
  <rect x="250" y="392" width="220" height="26" rx="6" fill="#E57373"/>
  <text x="490" y="411" text-anchor="start" font-size="17" fill="#C00000" font-style="italic">en baisse</text>
  <line x1="480" y1="455" x2="760" y2="455" stroke="#01579B" stroke-width="6" marker-end="url(#af)"/>
  <text x="620" y="442" text-anchor="middle" font-size="19" fill="#01579B" font-weight="bold">l'écart = ACCROISSEMENT NATUREL</text>
  <text x="500" y="510" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">L'accroissement naturel est fort : la population double en une génération.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Natalité moins mortalité : voilà l'accroissement naturel.</text>
</svg>