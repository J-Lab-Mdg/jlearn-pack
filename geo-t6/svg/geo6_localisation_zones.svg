  <text x="334.6" y="248" text-anchor="middle" font-size="15" fill="#33691E" font-weight="bold">agriculture</text>
  <text x="412.8" y="248" text-anchor="start" font-size="15" fill="#0277BD" font-weight="bold">pêche</text>
  <text x="422" y="367.6" text-anchor="start" font-size="14" fill="#2E7D32" font-weight="bold">forêt de l'est</text>
  <text x="284" y="358.4" text-anchor="end" font-size="13" fill="#4527A0" font-weight="bold">saphirs</text>
  <text x="330" y="427.4" text-anchor="middle" font-size="13" fill="#4527A0" font-weight="bold">nickel</text>
  <text x="336.9" y="128.4" text-anchor="middle" font-size="13" fill="#D84315" font-weight="bold">Nosy Be</text>
  <rect x="620" y="110" width="350" height="130" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="3"/>
  <text x="795" y="143" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">LÉGENDE</text>
  <text x="645" y="178" text-anchor="start" font-size="16" fill="#263238">agricole   pêche   forêt</text>
  <text x="645" y="208" text-anchor="start" font-size="16" fill="#263238">minière   touristique</text>
  <text x="645" y="231" text-anchor="start" font-size="15" fill="#546E7A" font-style="italic">artisanale et industrielle : les villes</text>
  <rect x="620" y="270" width="350" height="250" rx="14" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="795" y="305" text-anchor="middle" font-size="19" fill="#1B5E20" font-weight="bold">LA RÈGLE</text>
  <text x="795" y="345" text-anchor="start" font-size="17" fill="#263238">La nature décide :</text>
  <text x="795" y="375" text-anchor="start" font-size="16" fill="#263238">pluie → riz et forêt,</text>
  <text x="795" y="403" text-anchor="start" font-size="16" fill="#263238">mer → pêche,</text>
  <text x="795" y="431" text-anchor="start" font-size="16" fill="#263238">sous-sol → mines.</text>
  <text x="795" y="470" text-anchor="start" font-size="17" fill="#263238">Les hommes ajoutent :</text>
  <text x="795" y="498" text-anchor="start" font-size="16" fill="#263238">villes → usines, artisanat.</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Chaque activité occupe la région que la nature et les hommes lui offrent.</text>
</svg>