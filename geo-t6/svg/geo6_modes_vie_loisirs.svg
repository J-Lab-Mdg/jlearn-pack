<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><defs><marker id="af" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#546E7A"/></marker>
<marker id="afR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C00000"/></marker>
<marker id="afV" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1E7B34"/></marker>
<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Une journée au village : entraide le matin, loisirs le soir</text>
  <rect x="35" y="100" width="440" height="300" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <circle cx="100" cy="150" r="22" fill="#FFD54F" stroke="#F9A825" stroke-width="3"/><line x1="128" y1="150" x2="138" y2="150" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="119.79898987322333" y1="169.79898987322332" x2="126.87005768508881" y2="176.8700576850888" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="178" x2="100" y2="188" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="80.20101012677668" y1="169.79898987322332" x2="73.1299423149112" y2="176.8700576850888" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="72" y1="150" x2="62" y2="150" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="80.20101012677667" y1="130.20101012677668" x2="73.12994231491119" y2="123.1299423149112" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="122" x2="100" y2="112" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="119.79898987322332" y1="130.20101012677668" x2="126.8700576850888" y2="123.12994231491119" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/>
  <text x="280" y="130" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">LE MATIN — L'ENTRAIDE</text>
  <g transform="translate(110,210) scale(1.2)"><rect x="-16" y="-6" width="32" height="22" fill="#FFE0B2" stroke="#8D6E63" stroke-width="2"/><path d="M -20 -6 L 0 -22 L 20 -6 Z" fill="#C0553B" stroke="#8D6E63" stroke-width="2"/></g><text x="250" y="205" text-anchor="middle" font-size="15" fill="#263238">relever le toit</text><text x="250" y="228" text-anchor="middle" font-size="15" fill="#263238">de la veuve Ravao</text>
  <g transform="translate(110,300) scale(1.1)"><circle cx="0" cy="-16" r="6" fill="#1B5E20"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#1B5E20" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/></g><text x="250" y="295" text-anchor="middle" font-size="15" fill="#263238">battre le riz ensemble</text><text x="250" y="318" text-anchor="middle" font-size="15" fill="#263238">au rythme des pilons</text>
  <g transform="translate(110,380) scale(0.9)"><rect x="-14" y="-8" width="28" height="26" rx="3" fill="#78909C" stroke="#455A64" stroke-width="2"/><rect x="-17" y="-12" width="34" height="5" rx="2" fill="#455A64"/><line x1="-6" y1="-2" x2="-6" y2="14" stroke="#455A64" stroke-width="2"/><line x1="6" y1="-2" x2="6" y2="14" stroke="#455A64" stroke-width="2"/></g><text x="250" y="375" text-anchor="middle" font-size="15" fill="#263238">garder le dépôt</text><text x="250" y="398" text-anchor="middle" font-size="15" fill="#263238">du tri</text>
  <rect x="525" y="100" width="440" height="300" rx="18" fill="#F3E5F5" stroke="#90A4AE" stroke-width="3"/>
  <text x="745" y="130" text-anchor="middle" font-size="20" fill="#6A1B9A" font-weight="bold">LE SOIR — LES LOISIRS</text>
  <g transform="translate(600,200) scale(1.1)"><circle cx="0" cy="-16" r="6" fill="#6A1B9A"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#6A1B9A" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#6A1B9A" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#6A1B9A" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#6A1B9A" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#6A1B9A" stroke-width="4" stroke-linecap="round"/></g><text x="745" y="195" text-anchor="middle" font-size="15" fill="#263238">le kabary des anciens,</text><text x="745" y="218" text-anchor="middle" font-size="15" fill="#263238">l'art de bien parler</text>
  <g transform="translate(600,290) scale(1)"><rect x="-8" y="-24" width="16" height="48" rx="8" fill="#D7A86E" stroke="#8D6E63" stroke-width="2"/><line x1="-5" y1="-20" x2="-5" y2="20" stroke="#5D4037" stroke-width="1.5"/><line x1="0" y1="-20" x2="0" y2="20" stroke="#5D4037" stroke-width="1.5"/><line x1="5" y1="-20" x2="5" y2="20" stroke="#5D4037" stroke-width="1.5"/><circle cx="-8" cy="-24" r="3" fill="#FFD54F"/><circle cx="8" cy="-24" r="3" fill="#FFD54F"/></g><text x="745" y="285" text-anchor="middle" font-size="15" fill="#263238">le valiha de l'oncle Rivo</text><text x="745" y="308" text-anchor="middle" font-size="15" fill="#263238">fait danser les filles</text>
  <circle cx="600" cy="370" r="14" fill="#C0553B" stroke="#5D4037" stroke-width="3"/><text x="745" y="365" text-anchor="middle" font-size="15" fill="#263238">les enfants courent</text><text x="745" y="388" text-anchor="middle" font-size="15" fill="#263238">après le ballon de raphia</text>
  <line x1="490" y1="250" x2="510" y2="250" stroke="#546E7A" stroke-width="5" marker-end="url(#af)"/>
  <text x="500" y="470" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Travailler ensemble, s'amuser ensemble :</text>
  <text x="500" y="502" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">voilà la richesse sociale du village.</text>
  <text x="500" y="560" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">L'entraide fait les gros travaux ; les loisirs reposent les corps et rapprochent les familles.</text>
</svg>