<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Le tourisme et ses impacts</text>
  <text x="180" y="105" text-anchor="middle" font-size="18" fill="#0277BD" font-weight="bold">BALNÉAIRE</text>
  <rect x="60" y="140" width="240" height="90" rx="12" fill="#4FC3F7" opacity="0.6"/>
  <circle cx="90" cy="175" r="14" fill="#FFD54F" stroke="#F9A825" stroke-width="3"/><line x1="110" y1="175" x2="120" y2="175" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="104.14213562373095" y1="189.14213562373095" x2="111.21320343559643" y2="196.21320343559643" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="90" y1="195" x2="90" y2="205" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="75.85786437626905" y1="189.14213562373095" x2="68.78679656440357" y2="196.21320343559643" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="70" y1="175" x2="60" y2="175" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="75.85786437626905" y1="160.85786437626905" x2="68.78679656440357" y2="153.78679656440357" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="90" y1="155" x2="90" y2="145" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="104.14213562373095" y1="160.85786437626905" x2="111.21320343559643" y2="153.78679656440357" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/>
  <text x="180" y="195" text-anchor="middle" font-size="16" fill="#263238">les plages de Nosy Be</text>
  <text x="180" y="250" text-anchor="middle" font-size="15" fill="#546E7A" font-style="italic">le soleil et la mer chaude</text>
  <text x="500" y="105" text-anchor="middle" font-size="18" fill="#E65100" font-weight="bold">CULTUREL</text>
  <g transform="translate(470,200) scale(1.6)"><rect x="-16" y="-6" width="32" height="22" fill="#FFD8B5" stroke="#8D6E63" stroke-width="2"/><path d="M -20 -6 L 0 -22 L 20 -6 Z" fill="#C0553B" stroke="#8D6E63" stroke-width="2"/></g><g transform="translate(540,215) scale(1.2)"><rect x="-16" y="-6" width="32" height="22" fill="#FFD8B5" stroke="#8D6E63" stroke-width="2"/><path d="M -20 -6 L 0 -22 L 20 -6 Z" fill="#C0553B" stroke="#8D6E63" stroke-width="2"/></g>
  <text x="500" y="250" text-anchor="middle" font-size="15" fill="#546E7A" font-style="italic">collines royales, traditions</text>
  <text x="820" y="105" text-anchor="middle" font-size="18" fill="#1B5E20" font-weight="bold">ÉCOLOGIQUE</text>
  <g transform="translate(760,220) scale(1.4)"><path d="M -7 30 L -5 -20 L 5 -20 L 7 30 Z" fill="#8D6E63"/><circle cx="-14" cy="-24" r="9" fill="#66BB6A"/><circle cx="0" cy="-30" r="10" fill="#66BB6A"/><circle cx="14" cy="-24" r="9" fill="#66BB6A"/></g><g transform="translate(860,225) scale(1.1)"><rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/><circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/></g>
  <text x="820" y="250" text-anchor="middle" font-size="15" fill="#546E7A" font-style="italic">parcs, lémuriens, baobabs</text>
  <rect x="40" y="290" width="920" height="140" rx="18" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  <text x="500" y="325" text-anchor="middle" font-size="19" fill="#E65100" font-weight="bold">LA CHAÎNE DES MÉTIERS</text>
  <text x="500" y="365" text-anchor="middle" font-size="19" fill="#263238" font-weight="bold">guide → hôtel → restaurant → chauffeur → artisan</text>
  <text x="500" y="400" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">chaque ariary dépensé par un visiteur fait vivre une famille</text>
  <text x="500" y="480" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Et l'argent étranger qui entre — les devises — reste au pays.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Protéger la nature, c'est protéger les emplois du tourisme.</text>
</svg>