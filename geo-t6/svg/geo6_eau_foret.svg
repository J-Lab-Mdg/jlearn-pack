<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les ressources renouvelables : l'eau et les forêts</text>
  <rect x="50" y="100" width="440" height="380" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
  <text x="270" y="140" text-anchor="middle" font-size="21" fill="#01579B" font-weight="bold">L'EAU, LA RESSOURCE DE LA VIE</text>
  
  <g transform="translate(160,230) scale(3)">
    <path d="M 0 -18 C 10 -4 14 4 14 10 A 14 14 0 1 1 -14 10 C -14 4 -10 -4 0 -18 Z" fill="#29B6F6" stroke="#0277BD" stroke-width="2"/>
  </g>
  <text x="330" y="210" text-anchor="start" font-size="18" fill="#263238">Les rivières et les fleuves</text>
  <text x="330" y="244" text-anchor="start" font-size="18" fill="#263238">Les lacs et les nappes d'eau</text>
  <text x="330" y="278" text-anchor="start" font-size="18" fill="#263238">La pluie qui arrose les champs</text>
  <text x="270" y="350" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">On boit, on lave, on irrigue</text>
  <text x="270" y="380" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">les rizières, on fait tourner</text>
  <text x="270" y="410" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">les barrages.</text>
  <rect x="510" y="100" width="440" height="380" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="730" y="140" text-anchor="middle" font-size="21" fill="#1B5E20" font-weight="bold">LA FORÊT, LA RESSOURCE VERTE</text>
  
  <g transform="translate(600,240) scale(1.6)">
    <rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/>
    <circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/>
  </g>
  <g transform="translate(680,260) scale(1.3)">
    <rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/>
    <circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/>
  </g>
  <g transform="translate(760,240) scale(1.6)">
    <rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/>
    <circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/>
  </g>
  <g transform="translate(840,260) scale(1.3)">
    <rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/>
    <circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/>
  </g>
  <text x="730" y="350" text-anchor="middle" font-size="18" fill="#263238">Le bois pour construire et cuire,</text>
  <text x="730" y="380" text-anchor="middle" font-size="18" fill="#263238">les plantes pour se soigner,</text>
  <text x="730" y="410" text-anchor="middle" font-size="18" fill="#263238">les fruits et le miel de la forêt.</text>
  <text x="500" y="520" text-anchor="middle" font-size="22" fill="#1B5E20" font-weight="bold">Ressource renouvelable : elle se renouvelle, si on la protège.</text>
  <text x="500" y="550" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">L'eau et la forêt se renouvellent naturellement — à condition de ne pas les détruire.</text>
</svg>