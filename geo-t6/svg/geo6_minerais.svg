<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les ressources minières de Madagascar</text>
  <rect x="40" y="90" width="480" height="470" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/>
  <g transform="translate(330 330) scale(2.1) translate(-50 -100)"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z" fill="#EFEBE9" stroke="#2E7D32" stroke-width="1.4285714285714286" stroke-linejoin="round"/></g>
  <circle cx="340.5" cy="250.2" r="7" fill="#6A1B9A" stroke="#7f0000" stroke-width="2"/>
  <text x="367.8" y="235.5" text-anchor="start" font-size="16" fill="#6A1B9A" font-weight="bold">nickel</text>
  <circle cx="315.3" cy="183" r="7" fill="#C00000" stroke="#7f0000" stroke-width="2"/>
  <text x="288" y="170.4" text-anchor="end" font-size="16" fill="#C00000" font-weight="bold">chromite</text>
  <circle cx="351" cy="481.2" r="7" fill="#00695C" stroke="#7f0000" stroke-width="2"/>
  <text x="380.4" y="498" text-anchor="start" font-size="16" fill="#00695C" font-weight="bold">ilménite</text>
  <circle cx="283.8" cy="367.8" r="7" fill="#E65100" stroke="#7f0000" stroke-width="2"/>
  <text x="258.6" y="351" text-anchor="end" font-size="16" fill="#E65100" font-weight="bold">saphirs</text>
  <text x="280" y="545" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">Une fois extraits, les minerais ne reviennent plus.</text>
  <rect x="560" y="120" width="410" height="330" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="3"/>
  <text x="765" y="155" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">Les principaux minerais</text>
  <text x="585" y="205" text-anchor="start" font-size="19" fill="#263238">• Le nickel et le cobalt, à l'est du pays</text>
  <text x="585" y="245" text-anchor="start" font-size="19" fill="#263238">• La chromite, au nord-ouest</text>
  <text x="585" y="285" text-anchor="start" font-size="19" fill="#263238">• L'ilménite, sur la côte sud-est</text>
  <text x="585" y="325" text-anchor="start" font-size="19" fill="#263238">• Les saphirs, dans le Sud</text>
  <text x="585" y="365" text-anchor="start" font-size="19" fill="#263238">• Le graphite, la mica, le sel…</text>
  <text x="765" y="415" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">Ils servent à fabriquer :</text>
  <text x="765" y="442" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">métaux, bijoux, pièces de voitures…</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Ressource non renouvelable : une fois extraite du sol, elle s'épuise et ne revient plus.</text>
</svg>