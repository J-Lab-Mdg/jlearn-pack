<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">L'élevage extensif et l'élevage intensif</text>
  <rect x="40" y="100" width="440" height="340" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="260" y="138" text-anchor="middle" font-size="18" fill="#1B5E20" font-weight="bold">EXTENSIF : LES GRANDS ESPACES</text>
  <g transform="translate(100,220) scale(1)"><rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/><circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/></g><g transform="translate(420,210) scale(0.9)"><rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/><circle cx="0" cy="0" r="18" fill="#66BB6A"/><circle cx="-13" cy="8" r="13" fill="#66BB6A"/><circle cx="13" cy="8" r="13" fill="#66BB6A"/></g>
  <g transform="translate(160,300) scale(1.3)"><ellipse cx="0" cy="0" rx="24" ry="13" fill="#8D6E63"/><circle cx="26" cy="-10" r="8" fill="#8D6E63"/><path d="M 20 -16 L 26 -26 L 32 -16" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><path d="M -24 -2 Q -34 -14 -26 -20" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><line x1="-12" y1="12" x2="-12" y2="24" stroke="#5D4037" stroke-width="4"/><line x1="10" y1="12" x2="10" y2="24" stroke="#5D4037" stroke-width="4"/></g><g transform="translate(260,315) scale(1.1)"><ellipse cx="0" cy="0" rx="24" ry="13" fill="#8D6E63"/><circle cx="26" cy="-10" r="8" fill="#8D6E63"/><path d="M 20 -16 L 26 -26 L 32 -16" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><path d="M -24 -2 Q -34 -14 -26 -20" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><line x1="-12" y1="12" x2="-12" y2="24" stroke="#5D4037" stroke-width="4"/><line x1="10" y1="12" x2="10" y2="24" stroke="#5D4037" stroke-width="4"/></g><g transform="translate(350,295) scale(1.2)"><ellipse cx="0" cy="0" rx="24" ry="13" fill="#8D6E63"/><circle cx="26" cy="-10" r="8" fill="#8D6E63"/><path d="M 20 -16 L 26 -26 L 32 -16" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><path d="M -24 -2 Q -34 -14 -26 -20" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><line x1="-12" y1="12" x2="-12" y2="24" stroke="#5D4037" stroke-width="4"/><line x1="10" y1="12" x2="10" y2="24" stroke="#5D4037" stroke-width="4"/></g>
  <text x="260" y="365" text-anchor="middle" font-size="17" fill="#263238">les zébus paissent seuls,</text>
  <text x="260" y="393" text-anchor="middle" font-size="17" fill="#263238">gardés par un berger</text>
  <text x="260" y="425" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">peu de soins, de grands espaces</text>
  <rect x="520" y="100" width="440" height="340" rx="18" fill="#E3F2FD" stroke="#90A4AE" stroke-width="3"/>
  <text x="740" y="138" text-anchor="middle" font-size="18" fill="#01579B" font-weight="bold">INTENSIF : LES SOINS</text>
  <rect x="600" y="170" width="280" height="140" rx="10" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/>
  <g transform="translate(660,250) scale(1)"><ellipse cx="0" cy="0" rx="24" ry="13" fill="#8D6E63"/><circle cx="26" cy="-10" r="8" fill="#8D6E63"/><path d="M 20 -16 L 26 -26 L 32 -16" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><path d="M -24 -2 Q -34 -14 -26 -20" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><line x1="-12" y1="12" x2="-12" y2="24" stroke="#5D4037" stroke-width="4"/><line x1="10" y1="12" x2="10" y2="24" stroke="#5D4037" stroke-width="4"/></g><g transform="translate(740,255) scale(1)"><ellipse cx="0" cy="0" rx="24" ry="13" fill="#8D6E63"/><circle cx="26" cy="-10" r="8" fill="#8D6E63"/><path d="M 20 -16 L 26 -26 L 32 -16" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><path d="M -24 -2 Q -34 -14 -26 -20" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><line x1="-12" y1="12" x2="-12" y2="24" stroke="#5D4037" stroke-width="4"/><line x1="10" y1="12" x2="10" y2="24" stroke="#5D4037" stroke-width="4"/></g><g transform="translate(820,250) scale(1)"><ellipse cx="0" cy="0" rx="24" ry="13" fill="#8D6E63"/><circle cx="26" cy="-10" r="8" fill="#8D6E63"/><path d="M 20 -16 L 26 -26 L 32 -16" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><path d="M -24 -2 Q -34 -14 -26 -20" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><line x1="-12" y1="12" x2="-12" y2="24" stroke="#5D4037" stroke-width="4"/><line x1="10" y1="12" x2="10" y2="24" stroke="#5D4037" stroke-width="4"/></g>
  <text x="740" y="340" text-anchor="middle" font-size="17" fill="#263238">l'étable : nourriture apportée,</text>
  <text x="740" y="368" text-anchor="middle" font-size="17" fill="#263238">vaccins, traite, propreté</text>
  <text x="740" y="405" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">peu de place, beaucoup de production</text>
  <text x="500" y="490" text-anchor="middle" font-size="18" fill="#263238" font-weight="bold">Extensif : la tradition des grands espaces. Intensif : le lait, les œufs, les poulets des villes.</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Deux élevages, deux mondes — et l'avenir entre les deux.</text>
</svg>