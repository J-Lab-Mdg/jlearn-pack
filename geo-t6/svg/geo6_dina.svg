<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><defs><marker id="af" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#546E7A"/></marker>
<marker id="afR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C00000"/></marker>
<marker id="afV" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1E7B34"/></marker>
<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Le Dina : règle, faute, réparation, réconciliation</text>
  <rect x="120" y="85" width="760" height="40" rx="18" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  <text x="500" y="112" text-anchor="middle" font-size="18" fill="#E65100" font-weight="bold">LE DINA : les règles de vie écrites et acceptées par toute la communauté</text>
  
    <rect x="45" y="130" width="280" height="220" rx="18" fill="#FFEBEE" stroke="#90A4AE" stroke-width="3"/>
    <g transform="translate(185,175) scale(1.3)"><rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/><circle cx="0" cy="0" r="18" fill="#8D6E63"/><circle cx="-13" cy="8" r="13" fill="#8D6E63"/><circle cx="13" cy="8" r="13" fill="#8D6E63"/></g>
    <text x="185" y="165" text-anchor="middle" font-size="15" fill="#546E7A" font-weight="bold">ÉTAPE 1</text>
    <text x="185" y="200" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold">LA FAUTE</text>
    <text x="185" y="240" text-anchor="middle" font-size="16" fill="#263238">couper un arbre</text>
    <text x="185" y="270" text-anchor="middle" font-size="16" fill="#263238">de la source</text>
  <line x1="330" y1="240" x2="390" y2="240" stroke="#C00000" stroke-width="5" marker-end="url(#afR)"/>
  
    <rect x="400" y="130" width="280" height="220" rx="18" fill="#FFF3E0" stroke="#90A4AE" stroke-width="3"/>
    <g transform="translate(540,175) scale(1.2)"><ellipse cx="0" cy="0" rx="24" ry="13" fill="#8D6E63"/><circle cx="26" cy="-10" r="8" fill="#8D6E63"/><path d="M 20 -16 L 26 -26 L 32 -16" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><path d="M -24 -2 Q -34 -14 -26 -20" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/><line x1="-12" y1="12" x2="-12" y2="24" stroke="#5D4037" stroke-width="4"/><line x1="10" y1="12" x2="10" y2="24" stroke="#5D4037" stroke-width="4"/></g>
    <text x="540" y="165" text-anchor="middle" font-size="15" fill="#546E7A" font-weight="bold">ÉTAPE 2</text>
    <text x="540" y="200" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold">LA RÉPARATION</text>
    <text x="540" y="240" text-anchor="middle" font-size="16" fill="#263238">payer un zébu</text>
    <text x="540" y="270" text-anchor="middle" font-size="16" fill="#263238">à la communauté</text>
  <line x1="685" y1="240" x2="745" y2="240" stroke="#1E7B34" stroke-width="5" marker-end="url(#afV)"/>
  
    <rect x="760" y="130" width="280" height="220" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
    <g transform="translate(830,180) scale(1.2)"><circle cx="0" cy="-16" r="6" fill="#1B5E20"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#1B5E20" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/></g>
    <text x="900" y="165" text-anchor="middle" font-size="15" fill="#546E7A" font-weight="bold">ÉTAPE 3</text>
    <text x="900" y="200" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold">LA RÉCONCILIATION</text>
    <text x="900" y="240" text-anchor="middle" font-size="16" fill="#263238">poignée de main :</text>
    <text x="900" y="270" text-anchor="middle" font-size="16" fill="#263238">la paix revient</text>
  <g transform="translate(900,180) scale(1.2)"><circle cx="0" cy="-16" r="6" fill="#1B5E20"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#1B5E20" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/></g>
  <line x1="855" y1="185" x2="875" y2="185" stroke="#1B5E20" stroke-width="3" marker-end="url(#afV)"/>
  <text x="500" y="400" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">La sanction du Dina n'humilie personne : le coupable répare,</text>
  <text x="500" y="432" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">puis le village se réconcilie et tourne la page.</text>
  <text x="500" y="500" text-anchor="middle" font-size="17" fill="#263238">Affiché au bureau du fokontany, le Dina protège l'eau, la forêt et la paix.</text>
  <text x="500" y="560" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Réparer plutôt que punir : voilà l'esprit du Dina.</text>
</svg>