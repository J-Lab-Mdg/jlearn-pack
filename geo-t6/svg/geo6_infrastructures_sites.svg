  <g transform="translate(300,390) scale(0.5)"><rect x="-30" y="-8" width="20" height="34" fill="#90A4AE" stroke="#546E7A" stroke-width="2"/><rect x="-6" y="-28" width="16" height="54" fill="#B0BEC5" stroke="#546E7A" stroke-width="2"/><rect x="14" y="2" width="18" height="24" fill="#A1887F" stroke="#6D4C41" stroke-width="2"/><rect x="-4" y="-20" width="6" height="6" fill="#FFF"/><rect x="4" y="-20" width="6" height="6" fill="#FFF"/><rect x="-4" y="-10" width="6" height="6" fill="#FFF"/><rect x="4" y="-10" width="6" height="6" fill="#FFF"/></g><text x="390" y="380" text-anchor="middle" font-size="14" fill="#263238" font-weight="bold">les ateliers et</text><text x="390" y="402" text-anchor="middle" font-size="14" fill="#263238" font-weight="bold">le dépôt frais</text>
  <text x="295" y="440" text-anchor="middle" font-size="15" fill="#546E7A" font-style="italic">faire circuler les richesses</text>
