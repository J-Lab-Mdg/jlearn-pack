<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Aménager sans abîmer : infrastructures et sites naturels</text>
  <rect x="35" y="100" width="520" height="330" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
