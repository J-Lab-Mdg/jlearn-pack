  <text x="780" y="440" text-anchor="middle" font-size="15" fill="#546E7A" font-style="italic">haie vive, sentier balisé, Dina</text>
  <text x="500" y="490" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Aménager ce qui rapporte (route, marché, ateliers),</text>
  <text x="500" y="520" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">protéger ce qui est sacré et beau (cascade, source, forêt).</text>
  <text x="500" y="575" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Les visiteurs viennent justement parce que les trésors sont restés sauvages.</text>
