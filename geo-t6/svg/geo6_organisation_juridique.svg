  <g transform="translate(70,215) scale(1.1)"><circle cx="0" cy="-16" r="6" fill="#E65100"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#E65100" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#E65100" stroke-width="4" stroke-linecap="round"/></g><text x="140" y="220" text-anchor="middle" font-size="15" fill="#263238">l'ancien instituteur</text>
  <g transform="translate(70,265) scale(1.1)"><circle cx="0" cy="-16" r="6" fill="#E65100"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#E65100" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#E65100" stroke-width="4" stroke-linecap="round"/></g><text x="140" y="270" text-anchor="middle" font-size="15" fill="#263238">la sage-femme</text>
  <g transform="translate(70,315) scale(1.1)"><circle cx="0" cy="-16" r="6" fill="#E65100"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#E65100" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#E65100" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#E65100" stroke-width="4" stroke-linecap="round"/></g><text x="140" y="320" text-anchor="middle" font-size="15" fill="#263238">le rép. des jeunes</text>
  <rect x="560" y="380" width="400" height="110" rx="18" fill="#F3E5F5" stroke="#90A4AE" stroke-width="3"/>
  <text x="760" y="415" text-anchor="middle" font-size="17" fill="#6A1B9A" font-weight="bold">LES MISSIONS DU FOKONTANY</text>
  <text x="760" y="448" text-anchor="middle" font-size="15" fill="#263238">état civil, paix sociale, travaux</text>
  <text x="760" y="473" text-anchor="middle" font-size="15" fill="#263238">communs, application du Dina</text>
  <rect x="60" y="380" width="440" height="110" rx="18" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
  <text x="280" y="412" text-anchor="middle" font-size="16" fill="#263238" font-weight="bold">LA STRUCTURE ADMINISTRATIVE DE BASE</text>
  <text x="280" y="445" text-anchor="middle" font-size="15" fill="#263238">le quartier, le hameau, le village :</text>
  <text x="280" y="470" text-anchor="middle" font-size="15" fill="#263238">la plus petite cellule du pays</text>
  <text x="500" y="545" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Les notables conseillent, le chef applique, l'assemblée décide.</text>
