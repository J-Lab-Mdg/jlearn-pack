<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><defs><marker id="af" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#546E7A"/></marker>
<marker id="afR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C00000"/></marker>
<marker id="afV" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1E7B34"/></marker>
<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">L'organisation juridique : le fokontany et l'assemblée</text>
  <rect x="280" y="95" width="440" height="80" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="500" y="128" text-anchor="middle" font-size="21" fill="#1B5E20" font-weight="bold">L'ASSEMBLÉE DES HABITANTS</text>
  <text x="500" y="158" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">discute et décide à main levée</text>
  <line x1="500" y1="185" x2="500" y2="240" stroke="#1E7B34" stroke-width="5" marker-end="url(#afV)"/>
  <text x="560" y="218" text-anchor="middle" font-size="15" fill="#1E7B34">élit et approuve</text>
  <rect x="280" y="250" width="440" height="90" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
  <g transform="translate(360,300) scale(1.5)"><circle cx="0" cy="-16" r="6" fill="#01579B"/><line x1="0" y1="-10" x2="0" y2="6" stroke="#01579B" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="6" x2="-6" y2="18" stroke="#01579B" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="6" x2="6" y2="18" stroke="#01579B" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="-8" y2="0" stroke="#01579B" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-6" x2="8" y2="0" stroke="#01579B" stroke-width="4" stroke-linecap="round"/></g>
  <text x="555" y="290" text-anchor="middle" font-size="21" fill="#01579B" font-weight="bold">LE CHEF DU FOKONTANY</text>
  <text x="555" y="320" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">organise et applique les décisions</text>
  <text x="555" y="345" text-anchor="middle" font-size="15" fill="#546E7A" font-style="italic">ex. : Rakotomalala</text>
  <line x1="280" y1="295" x2="220" y2="295" stroke="#546E7A" stroke-width="5" marker-end="url(#af)"/>
  <text x="250" y="280" text-anchor="middle" font-size="15" fill="#546E7A">conseillent</text>
