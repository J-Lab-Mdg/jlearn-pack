<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Émigrer, immigrer : deux mots pour un seul voyage</text>
  <defs><marker id="af" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#546E7A"/></marker>
<marker id="afR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C00000"/></marker>
<marker id="afV" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1E7B34"/></marker>
<marker id="afB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#01579B"/></marker></defs>
  <text x="500" y="130" text-anchor="middle" font-size="21" fill="#C00000" font-weight="bold">ÉMIGRATION : le départ, vu du lieu d'origine</text>
  <rect x="50" y="160" width="300" height="220" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/>
  <text x="200" y="200" text-anchor="middle" font-size="18" fill="#1B5E20" font-weight="bold">LE LIEU D'ORIGINE</text>
  
  <g transform="translate(120,290) scale(1)">
    <rect x="-16" y="-6" width="32" height="22" fill="#FFE0B2" stroke="#8D6E63" stroke-width="2"/>
    <path d="M -20 -6 L 0 -22 L 20 -6 Z" fill="#C0553B" stroke="#8D6E63" stroke-width="2"/>
  </g>
  <g transform="translate(190,295) scale(0.8)">
    <rect x="-16" y="-6" width="32" height="22" fill="#FFE0B2" stroke="#8D6E63" stroke-width="2"/>
    <path d="M -20 -6 L 0 -22 L 20 -6 Z" fill="#C0553B" stroke="#8D6E63" stroke-width="2"/>
  </g>
  <g transform="translate(270,290) scale(0.9)">
    <rect x="-4" y="8" width="8" height="20" fill="#6D4C41"/>
    <circle cx="0" cy="0" r="18" fill="#2E7D32"/><circle cx="-13" cy="8" r="13" fill="#2E7D32"/><circle cx="13" cy="8" r="13" fill="#2E7D32"/>
  </g>
  <text x="200" y="360" text-anchor="middle" font-size="16" fill="#263238" font-style="italic">le village qui perd</text>
  <text x="200" y="385" text-anchor="middle" font-size="16" fill="#263238" font-style="italic">un habitant</text>
  <line x1="370" y1="270" x2="630" y2="270" stroke="#546E7A" stroke-width="7" marker-end="url(#af)"/>
  
  <g transform="translate(500,245) scale(1.7)">
    <circle cx="0" cy="-16" r="6" fill="#5D4037"/>
    <line x1="0" y1="-10" x2="0" y2="6" stroke="#5D4037" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="-6" y2="18" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="6" y2="18" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-6" x2="-8" y2="0" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-6" x2="8" y2="0" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="500" y="330" text-anchor="middle" font-size="19" fill="#5D4037" font-weight="bold">la migration</text>
  <text x="500" y="358" text-anchor="middle" font-size="16" fill="#263238" font-style="italic">quitter son lieu habituel</text>
  <text x="500" y="382" text-anchor="middle" font-size="16" fill="#263238" font-style="italic">pour s'installer ailleurs</text>
  <rect x="650" y="160" width="300" height="220" rx="18" fill="#E3F2FD" stroke="#90A4AE" stroke-width="3"/>
  <text x="800" y="200" text-anchor="middle" font-size="18" fill="#01579B" font-weight="bold">LE LIEU D'ACCUEIL</text>
  
  <g transform="translate(730,300) scale(0.9)">
    <rect x="-34" y="-8" width="22" height="36" fill="#90A4AE" stroke="#546E7A" stroke-width="2"/>
    <rect x="-8" y="-30" width="18" height="58" fill="#B0BEC5" stroke="#546E7A" stroke-width="2"/>
    <rect x="14" y="2" width="20" height="26" fill="#A1887F" stroke="#6D4C41" stroke-width="2"/>
    <rect x="-1" y="-4" width="6" height="6" fill="#FFFFFF"/><rect x="7" y="-4" width="6" height="6" fill="#FFFFFF"/><rect x="15" y="-4" width="6" height="6" fill="#FFFFFF"/><rect x="-1" y="4" width="6" height="6" fill="#FFFFFF"/><rect x="7" y="4" width="6" height="6" fill="#FFFFFF"/><rect x="15" y="4" width="6" height="6" fill="#FFFFFF"/>
    <rect x="-4" y="4" width="6" height="6" fill="#FFFFFF"/><rect x="4" y="4" width="6" height="6" fill="#FFFFFF"/><rect x="-4" y="14" width="6" height="6" fill="#FFFFFF"/><rect x="4" y="14" width="6" height="6" fill="#FFFFFF"/><rect x="-4" y="24" width="6" height="6" fill="#FFFFFF"/><rect x="4" y="24" width="6" height="6" fill="#FFFFFF"/>
  </g>
  <g transform="translate(860,310) scale(0.9)">
    <rect x="-16" y="-6" width="32" height="22" fill="#BBDEFB" stroke="#8D6E63" stroke-width="2"/>
    <path d="M -20 -6 L 0 -22 L 20 -6 Z" fill="#C0553B" stroke="#8D6E63" stroke-width="2"/>
  </g>
  <text x="800" y="360" text-anchor="middle" font-size="16" fill="#263238" font-style="italic">la ville qui gagne</text>
  <text x="800" y="385" text-anchor="middle" font-size="16" fill="#263238" font-style="italic">un habitant</text>
  <text x="500" y="440" text-anchor="middle" font-size="21" fill="#01579B" font-weight="bold">IMMIGRATION : l'arrivée, vue du lieu d'accueil</text>
  <text x="500" y="490" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Le même voyageur : émigrant au départ, immigrant à l'arrivée.</text>
  <text x="500" y="545" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Un seul voyage, deux regards : celui qui part et celui qui arrive.</text>
</svg>