<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comprendre et utiliser une échelle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Sur le plan au 1 : 1 000, la route mesure 7 cm ; en vrai : 7 × 1 000 = 7 000 cm = 70 m.</text><rect x="90" y="150" width="280" height="140" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><line x1="110" y1="260" x2="350" y2="180" stroke="#B25000" stroke-width="6"/><text x="230" y="315" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">plan : 7 cm</text><line x1="400" y1="220" x2="560" y2="220" stroke="#2E7D32" stroke-width="4"/><polygon points="560,220 547.3937405670625,226.08951747755722 547.3937405670625,213.91048252244278" fill="#2E7D32"/><text x="480" y="195" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">× 1 000</text><line x1="600" y1="260" x2="930" y2="170" stroke="#B25000" stroke-width="12"/><text x="770" y="315" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">réalité : 7 000 cm = 70 m</text></svg>