<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="295"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Multiplier par 0,25 et 0,75</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">160 × 0,25 = 160 ÷ 4 = 40 ; 160 × 0,75 = 40 × 3 = 120.</text><rect x="80" y="150" width="720" height="65" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="80" y="150" width="180" height="65" fill="#F8BBD0"/><line x1="260" y1="150" x2="260" y2="215" stroke="#1F4E79" stroke-width="2"/><line x1="440" y1="150" x2="440" y2="215" stroke="#1F4E79" stroke-width="2"/><line x1="620" y1="150" x2="620" y2="215" stroke="#1F4E79" stroke-width="2"/><rect x="80" y="150" width="720" height="65" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="170" y="191" font-family="DejaVu Serif" font-size="27" fill="#C2185B" font-weight="bold" text-anchor="middle">40</text><text x="350" y="191" font-family="DejaVu Serif" font-size="27" fill="#777" font-weight="normal" text-anchor="middle">40</text><text x="530" y="191" font-family="DejaVu Serif" font-size="27" fill="#777" font-weight="normal" text-anchor="middle">40</text><text x="710" y="191" font-family="DejaVu Serif" font-size="27" fill="#777" font-weight="normal" text-anchor="middle">40</text><text x="840" y="193" font-family="DejaVu Serif" font-size="28" fill="#1F4E79" font-weight="bold" text-anchor="start">160</text><text x="80" y="260" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="start">× 0,25 → 1 part = 40      × 0,75 → 3 parts = 120</text></svg>