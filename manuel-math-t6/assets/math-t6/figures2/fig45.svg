<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer des angles dans un quadrilatère</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">80° + 95° + 110° = 285° ; le quatrième angle vaut 360° − 285° = 75°.</text><polygon points="220,385 780,385 690,170 330,195" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3.5"/><text x="265" y="365" font-family="DejaVu Serif" font-size="25" fill="#B25000" font-weight="bold" text-anchor="start">80°</text><text x="700" y="365" font-family="DejaVu Serif" font-size="25" fill="#2E7D32" font-weight="bold" text-anchor="start">95°</text><text x="630" y="220" font-family="DejaVu Serif" font-size="25" fill="#1F4E79" font-weight="bold" text-anchor="start">110°</text><circle cx="362" cy="227" r="26" fill="none" stroke="#C2185B" stroke-width="3"/><text x="400" y="237" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="start">?</text></svg>