<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="255"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Convertir des mesures dans des problèmes</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">2 m 35 cm = 200 cm + 35 cm = 235 cm ; 1 h 30 min = 90 min ; 2,5 L = 2 500 mL.</text><rect x="90" y="155" width="200" height="62" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="190" y="195" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">2 m 35 cm</text><line x1="305" y1="186" x2="395" y2="186" stroke="#2E7D32" stroke-width="4"/><polygon points="395,186 382.39374056706254,192.08951747755722 382.39374056706254,179.91048252244278" fill="#2E7D32"/><rect x="405" y="155" width="280" height="62" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="545" y="195" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">200 cm + 35 cm</text><text x="720" y="197" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="start">=  235 cm</text></svg>