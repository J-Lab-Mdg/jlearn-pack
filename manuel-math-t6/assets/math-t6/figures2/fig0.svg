<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="295"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comprendre une fraction dans différentes situations</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une bande est partagée en 8 parts égales et 3 parts sont coloriées : la fraction coloriée est 3/8.</text><rect x="80" y="155" width="720" height="70" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="80" y="155" width="90" height="70" fill="#F8BBD0"/><rect x="170" y="155" width="90" height="70" fill="#F8BBD0"/><rect x="260" y="155" width="90" height="70" fill="#F8BBD0"/><line x1="170" y1="155" x2="170" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="260" y1="155" x2="260" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="350" y1="155" x2="350" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="440" y1="155" x2="440" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="530" y1="155" x2="530" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="620" y1="155" x2="620" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="710" y1="155" x2="710" y2="225" stroke="#1F4E79" stroke-width="2"/><rect x="80" y="155" width="720" height="70" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="840" y="203" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="start">3/8</text></svg>