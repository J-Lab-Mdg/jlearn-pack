<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Choisir une unité de longueur appropriée</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">La fourmi se mesure en mm, le cahier en cm, la salle en m et la route en km.</text><rect x="90" y="155" width="195" height="120" rx="12" fill="#E8F5E9" fill-opacity="0.6" stroke="#C2185B" stroke-width="3"/><text x="187" y="205" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">fourmi</text><text x="187" y="250" font-family="DejaVu Serif" font-size="34" fill="#C2185B" font-weight="bold" text-anchor="middle">mm</text><rect x="315" y="155" width="195" height="120" rx="12" fill="#E8F5E9" fill-opacity="0.6" stroke="#B25000" stroke-width="3"/><text x="412" y="205" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">cahier</text><text x="412" y="250" font-family="DejaVu Serif" font-size="34" fill="#B25000" font-weight="bold" text-anchor="middle">cm</text><rect x="540" y="155" width="195" height="120" rx="12" fill="#E8F5E9" fill-opacity="0.6" stroke="#1F4E79" stroke-width="3"/><text x="637" y="205" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">salle</text><text x="637" y="250" font-family="DejaVu Serif" font-size="34" fill="#1F4E79" font-weight="bold" text-anchor="middle">m</text><rect x="765" y="155" width="195" height="120" rx="12" fill="#E8F5E9" fill-opacity="0.6" stroke="#2E7D32" stroke-width="3"/><text x="862" y="205" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">route</text><text x="862" y="250" font-family="DejaVu Serif" font-size="34" fill="#2E7D32" font-weight="bold" text-anchor="middle">km</text></svg>