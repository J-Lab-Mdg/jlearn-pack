<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="305"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Représenter les fractions sur une droite numérique</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Pour placer 5/8, on partage l’unité en huit segments égaux et on avance de cinq graduations depuis 0.</text><line x1="80" y1="185" x2="880" y2="185" stroke="#1F4E79" stroke-width="4"/><line x1="80" y1="171" x2="80" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="80" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">0</text><line x1="180" y1="171" x2="180" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="180" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">1/8</text><line x1="280" y1="171" x2="280" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="280" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">2/8</text><line x1="380" y1="171" x2="380" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="380" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">3/8</text><line x1="480" y1="171" x2="480" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="480" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">4/8</text><line x1="580" y1="171" x2="580" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="580" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">5/8</text><line x1="680" y1="171" x2="680" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="680" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">6/8</text><line x1="780" y1="171" x2="780" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="780" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">7/8</text><line x1="880" y1="171" x2="880" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="880" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">1</text><circle cx="580" cy="185" r="9" fill="#C2185B"/><text x="580" y="157" font-family="DejaVu Serif" font-size="27" fill="#C2185B" font-weight="bold" text-anchor="middle">5/8</text></svg>