<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comprendre la priorité des opérations</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Dans 18 − 3 × 4, on calcule d’abord 3 × 4 = 12, puis 18 − 12 = 6.</text><text x="200" y="190" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="start">18  −</text><rect x="330" y="153" width="150" height="54" rx="8" fill="#F8BBD0" fill-opacity="0.45" stroke="#C2185B" stroke-width="3"/><text x="405" y="190" font-family="DejaVu Serif" font-size="34" fill="#C2185B" font-weight="bold" text-anchor="middle">3 × 4</text><text x="515" y="190" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="normal" text-anchor="start">① d’abord la multiplication</text><line x1="405" y1="220" x2="405" y2="255" stroke="#2E7D32" stroke-width="4"/><polygon points="405,255 398.91048252244275,242.39374056706254 411.08951747755725,242.39374056706254" fill="#2E7D32"/><text x="200" y="295" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="start">18  −  12  =  6</text><text x="515" y="295" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="normal" text-anchor="start">② ensuite la soustraction</text></svg>