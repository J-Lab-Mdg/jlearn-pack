<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Représenter une relation par manipulation ou dessin</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Rangs de 3, 5, 7, 9 bâtonnets : on ajoute 2 à chaque rang ; la règle est y = 2x + 1.</text><line x1="100" y1="155" x2="100" y2="225" stroke="#B25000" stroke-width="7"/><line x1="118" y1="155" x2="118" y2="225" stroke="#B25000" stroke-width="7"/><line x1="136" y1="155" x2="136" y2="225" stroke="#B25000" stroke-width="7"/><text x="118" y="265" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">rang 1 : 3</text><text x="285" y="195" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">+2</text><line x1="320" y1="155" x2="320" y2="225" stroke="#B25000" stroke-width="7"/><line x1="338" y1="155" x2="338" y2="225" stroke="#B25000" stroke-width="7"/><line x1="356" y1="155" x2="356" y2="225" stroke="#B25000" stroke-width="7"/><line x1="374" y1="155" x2="374" y2="225" stroke="#B25000" stroke-width="7"/><line x1="392" y1="155" x2="392" y2="225" stroke="#B25000" stroke-width="7"/><text x="356" y="265" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">rang 2 : 5</text><text x="505" y="195" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">+2</text><line x1="540" y1="155" x2="540" y2="225" stroke="#B25000" stroke-width="7"/><line x1="558" y1="155" x2="558" y2="225" stroke="#B25000" stroke-width="7"/><line x1="576" y1="155" x2="576" y2="225" stroke="#B25000" stroke-width="7"/><line x1="594" y1="155" x2="594" y2="225" stroke="#B25000" stroke-width="7"/><line x1="612" y1="155" x2="612" y2="225" stroke="#B25000" stroke-width="7"/><line x1="630" y1="155" x2="630" y2="225"