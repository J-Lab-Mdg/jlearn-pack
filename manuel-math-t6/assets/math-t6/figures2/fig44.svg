<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer un angle manquant dans un triangle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">50° + 65° = 115° ; le troisième angle vaut 180° − 115° = 65°.</text><polygon points="180,375 760,375 560,165" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3.5"/><path d="M 250 375 A 70 70 0 0 0 229 333" fill="none" stroke="#B25000" stroke-width="3"/><text x="275" y="353" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="start">50°</text><path d="M 690 375 A 70 70 0 0 1 724 321" fill="none" stroke="#2E7D32" stroke-width="3"/><text x="625" y="350" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="start">65°</text><circle cx="560" cy="201" r="26" fill="none" stroke="#C2185B" stroke-width="3"/><text x="595" y="195" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="start">?</text></svg>