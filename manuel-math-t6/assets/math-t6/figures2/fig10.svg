<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Déterminer les multiples, le PPCM et le PGCD</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Multiples de 4 : 4, 8, 12, 16… Multiples de 6 : 6, 12, 18, 24… PPCM(4, 6) = 12.</text><text x="70" y="175" font-family="DejaVu Serif" font-size="26" fill="#1F4E79" font-weight="bold" text-anchor="start">Multiples de 4 :</text><circle cx="320" cy="167" r="26" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="320" y="176" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">4</text><circle cx="410" cy="167" r="26" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="410" y="176" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">8</text><circle cx="500" cy="167" r="26" fill="#F8BBD0" stroke="#C2185B" stroke-width="3"/><text x="500" y="176" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">12</text><circle cx="590" cy="167" r="26" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="590" y="176" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">16</text><circle cx="680" cy="167" r="26" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="680" y="176" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">20</text><circle cx="770" cy="167" r="26" fill="#F8BBD0" stroke="#C2185B" stroke-width="3"/><text x="770" y="176" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">24</text><text x="70" y="250" font-family="DejaVu Serif" font-size="26" fill="#1F4E79" font-weight="bold" text-anchor="start">Multiples de 6 :</text><circle cx="320" cy="242" r="26" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="320" y="251" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">6</text><circle cx="410" cy="242" r="26" fill="#F8BBD0" stroke="#C2185B" stroke-width="3"/><text x="410" y="251" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">12</text><circle cx="500" cy="242" r="26" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="500" y="251" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">18</text><circle cx="590" cy="242" r="26" fill="#F8BBD0" stroke="#C2185B" stroke-width="3"/><text x="590" y="251" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">24</text><text x="70" y="320" font-family="DejaVu Serif" font-size="27" fill="#C2185B" font-weight="bold" text-anchor="start">Premier multiple commun : PPCM = 12</text></svg>