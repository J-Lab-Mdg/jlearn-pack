<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="295"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer un pourcentage</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">25 % de 80 = 80 × 25 ÷ 100 = 20 : un quart de 80.</text><rect x="80" y="150" width="720" height="65" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="80" y="150" width="180" height="65" fill="#F8BBD0"/><line x1="260" y1="150" x2="260" y2="215" stroke="#1F4E79" stroke-width="2"/><line x1="440" y1="150" x2="440" y2="215" stroke="#1F4E79" stroke-width="2"/><line x1="620" y1="150" x2="620" y2="215" stroke="#1F4E79" stroke-width="2"/><rect x="80" y="150" width="720" height="65" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="170" y="191" font-family="DejaVu Serif" font-size="27" fill="#C2185B" font-weight="bold" text-anchor="middle">20</text><text x="350" y="191" font-family="DejaVu Serif" font-size="27" fill="#999" font-weight="normal" text-anchor="middle">20</text><text x="530" y="191" font-family="DejaVu Serif" font-size="27" fill="#999" font-weight="normal" text-anchor="middle">20</text><text x="710" y="191" font-family="DejaVu Serif" font-size="27" fill="#999" font-weight="normal" text-anchor="middle">20</text><text x="840" y="193" font-family="DejaVu Serif" font-size="28" fill="#1F4E79" font-weight="bold" text-anchor="start">80</text><text x="80" y="260" font-family="DejaVu Serif" font-size="27" fill="#C2185B" font-weight="bold" text-anchor="start">1 part sur 4 = 25 % = 20</text></svg>