<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer l’aire d’un parallélogramme</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">A = base × hauteur = 9 × 4 = 36 cm² : la hauteur est perpendiculaire à la base.</text><polygon points="220,340 670,340 770,160 320,160" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3.5"/><line x1="520" y1="160" x2="520" y2="340" stroke="#C2185B" stroke-width="3" stroke-dasharray="8,6"/><path d="M 520 320 L 540 320 L 540 340" fill="none" stroke="#C2185B" stroke-width="2.5"/><text x="445" y="380" font-family="DejaVu Serif" font-size="26" fill="#1F4E79" font-weight="bold" text-anchor="middle">base = 9 cm</text><text x="535" y="258" font-family="DejaVu Serif" font-size="25" fill="#C2185B" font-weight="bold" text-anchor="start">h = 4 cm</text></svg>