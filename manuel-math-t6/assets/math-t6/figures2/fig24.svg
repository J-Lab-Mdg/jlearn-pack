<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="305"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Diviser par 0,50, 0,25 et 0,75</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">36 ÷ 0,50 = 36 × 2 = 72 : il y a 72 moitiés dans 36.</text><rect x="110" y="155" width="220" height="65" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="220" y="196.5" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">36 ÷ 0,50</text><line x1="360" y1="187" x2="520" y2="187" stroke="#2E7D32" stroke-width="4"/><polygon points="520,187 507.39374056706254,193.08951747755722 507.39374056706254,180.91048252244278" fill="#2E7D32"/><text x="440" y="163" font-family="DejaVu Serif" font-size="27" fill="#2E7D32" font-weight="bold" text-anchor="middle">× 2</text><rect x="550" y="155" width="160" height="65" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="630" y="196.5" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">72</text><text x="110" y="270" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="start">Diviser par une moitié revient à multiplier par 2.</text></svg>