<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Classer les quadrilatères</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le carré vérifie à la fois les propriétés du rectangle et celles du losange.</text><ellipse cx="380" cy="290" rx="330" ry="135" fill="#D6E6F5" fill-opacity="0.55" stroke="#1F4E79" stroke-width="3"/><ellipse cx="620" cy="290" rx="330" ry="135" fill="#F8BBD0" fill-opacity="0.4" stroke="#C2185B" stroke-width="3"/><text x="240" y="230" font-family="DejaVu Serif" font-size="27" fill="#1F4E79" font-weight="bold" text-anchor="middle">rectangles</text><text x="775" y="230" font-family="DejaVu Serif" font-size="27" fill="#C2185B" font-weight="bold" text-anchor="middle">losanges</text><text x="500" y="265" font-family="DejaVu Serif" font-size="28" fill="#2E7D32" font-weight="bold" text-anchor="middle">carrés</text><polygon points="465,290 535,290 535,360 465,360" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/></svg>