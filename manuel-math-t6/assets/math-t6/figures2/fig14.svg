<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer une expression sans parenthèses</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">48 ÷ 6 + 5 × 3 = 8 + 15 = 23 : on fait ÷ et × avant +.</text><rect x="150" y="153" width="170" height="54" rx="8" fill="#F8BBD0" fill-opacity="0.45" stroke="#C2185B" stroke-width="3"/><text x="235" y="190" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="middle">48 ÷ 6</text><text x="355" y="190" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="start">+</text><rect x="400" y="153" width="150" height="54" rx="8" fill="#F8BBD0" fill-opacity="0.45" stroke="#C2185B" stroke-width="3"/><text x="475" y="190" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="middle">5 × 3</text><line x1="235" y1="220" x2="235" y2="255" stroke="#2E7D32" stroke-width="4"/><polygon points="235,255 228.91048252244278,242.39374056706254 241.08951747755722,242.39374056706254" fill="#2E7D32"/><line x1="475" y1="220" x2="475" y2="255" stroke="#2E7D32" stroke-width="4"/><polygon points="475,255 468.91048252244275,242.39374056706254 481.08951747755725,242.39374056706254" fill="#2E7D32"/><text x="235" y="295" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">8</text><text x="355" y="295" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="start">+</text><text x="475" y="295" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">15</text><text x="600" y="295" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="start">=  23</text></svg>