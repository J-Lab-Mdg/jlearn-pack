<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Trouver une mesure à partir du périmètre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">P = 30 cm et L = 9 cm : L + l = 15, donc l = 15 − 9 = 6 cm.</text><polygon points="280,165 700,165 700,333 280,333" fill="white" stroke="#1F4E79" stroke-width="3.5"/><text x="490" y="375" font-family="DejaVu Serif" font-size="26" fill="#1F4E79" font-weight="bold" text-anchor="middle">L = 9 cm</text><text x="170" y="257" font-family="DejaVu Serif" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="start">l = ?</text><text x="490" y="149" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">P = 30 cm</text></svg>