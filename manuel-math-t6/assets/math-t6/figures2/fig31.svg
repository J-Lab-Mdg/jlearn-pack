<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Identifier une relation entre deux quantités</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">P = 4c est proportionnelle ; P = 2 000 + 1 500d ne l’est pas (prise en charge fixe).</text><line x1="120" y1="385" x2="440" y2="385" stroke="#2E7D32" stroke-width="4"/><polygon points="440,385 427.39374056706254,391.08951747755725 427.39374056706254,378.91048252244275" fill="#2E7D32"/><line x1="120" y1="385" x2="120" y2="155" stroke="#2E7D32" stroke-width="4"/><polygon points="120,155 126.08951747755722,167.60625943293746 113.91048252244278,167.60625943293746" fill="#2E7D32"/><line x1="120" y1="385" x2="400" y2="185" stroke="#2E7D32" stroke-width="4"/><text x="260" y="425" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">P = 4c : passe par l’origine</text><line x1="560" y1="385" x2="880" y2="385" stroke="#2E7D32" stroke-width="4"/><polygon points="880,385 867.3937405670625,391.08951747755725 867.3937405670625,378.91048252244275" fill="#2E7D32"/><line x1="560" y1="385" x2="560" y2="155" stroke="#2E7D32" stroke-width="4"/><polygon points="560,155 566.0895174775573,167.60625943293746 553.9104825224427,167.60625943293746" fill="#2E7D32"/><line x1="560" y1="305" x2="840" y2="170" stroke="#C2185B" stroke-width="4"/><circle cx="560" cy="305" r="7" fill="#C2185B"/><text x="720" y="425" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">P = 2 000 + 1 500d : décalée</text></svg>