<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer une expression avec parenthèses</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">5 × (12 − 7) + 3 = 5 × 5 + 3 = 28 : les parenthèses d’abord.</text><text x="150" y="190" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="start">5  ×</text><rect x="250" y="153" width="190" height="54" rx="8" fill="#F8BBD0" fill-opacity="0.45" stroke="#C2185B" stroke-width="3"/><text x="345" y="190" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="middle">(12 − 7)</text><text x="470" y="190" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="start">+  3</text><text x="590" y="190" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="normal" text-anchor="start">① parenthèses d’abord</text><line x1="345" y1="220" x2="345" y2="255" stroke="#2E7D32" stroke-width="4"/><polygon points="345,255 338.91048252244275,242.39374056706254 351.08951747755725,242.39374056706254" fill="#2E7D32"/><text x="150" y="295" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="start">5  ×  5  +  3  =  25 + 3  =  28</text><text x="640" y="295" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="normal" text-anchor="start">② puis × et +</text></svg>