<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Choisir une stratégie efficace de calcul mental</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">198 + 47 = (198 + 2) + (47 − 2) = 200 + 45 = 245 : compensation.</text><rect x="90" y="155" width="200" height="62" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="190" y="195" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">198 + 47</text><line x1="310" y1="186" x2="450" y2="186" stroke="#2E7D32" stroke-width="4"/><polygon points="450,186 437.39374056706254,192.08951747755722 437.39374056706254,179.91048252244278" fill="#2E7D32"/><text x="380" y="161" font-family="DejaVu Serif" font-size="25" fill="#2E7D32" font-weight="bold" text-anchor="middle">+2 / −2</text><rect x="470" y="155" width="220" height="62" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="580" y="195" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">200 + 45</text><text x="740" y="197" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="start">=  245</text></svg>