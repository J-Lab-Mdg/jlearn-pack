<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Résoudre des problèmes avec des opérations combinées</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">3 cahiers à 2 400 ariary et 1 stylo à 1 500 ariary : 3 × 2 400 + 1 500 = 8 700 ariary.</text><rect x="110" y="150" width="90" height="115" rx="6" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><line x1="125" y1="180" x2="185" y2="180" stroke="#1F4E79" stroke-width="2"/><line x1="125" y1="205" x2="185" y2="205" stroke="#1F4E79" stroke-width="2"/><rect x="225" y="150" width="90" height="115" rx="6" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><line x1="240" y1="180" x2="300" y2="180" stroke="#1F4E79" stroke-width="2"/><line x1="240" y1="205" x2="300" y2="205" stroke="#1F4E79" stroke-width="2"/><rect x="340" y="150" width="90" height="115" rx="6" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><line x1="355" y1="180" x2="415" y2="180" stroke="#1F4E79" stroke-width="2"/><line x1="355" y1="205" x2="415" y2="205" stroke="#1F4E79" stroke-width="2"/><text x="270" y="305" font-family="DejaVu Serif" font-size="26" fill="#1F4E79" font-weight="bold" text-anchor="middle">3 × 2 400 Ar</text><rect x="520" y="165" width="18" height="100" rx="8" fill="#B25000"/><polygon points="529,150 520,167 538,167" fill="#B25000"/><text x="530" y="305" font-family="DejaVu Serif" font-size="26" fill="#B25000" font-weight="bold" text-anchor="middle">+ 1 500 Ar</text><rect x="660" y="190" width="260" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="790" y="229" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">= 8 700 ariary</text></svg>