<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comprendre la relation y = ax</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Pour y = 3x : si x = 5, alors y = 3 × 5 = 15.</text><rect x="100" y="160" width="150" height="62" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="175" y="200" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">x = 5</text><line x1="270" y1="191" x2="390" y2="191" stroke="#2E7D32" stroke-width="4"/><polygon points="390,191 377.39374056706254,197.08951747755722 377.39374056706254,184.91048252244278" fill="#2E7D32"/><rect x="400" y="150" width="180" height="85" rx="10" fill="#F8BBD0" stroke="#C2185B" stroke-width="3"/><text x="490" y="201.5" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="middle">× 3</text><line x1="600" y1="191" x2="720" y2="191" stroke="#2E7D32" stroke-width="4"/><polygon points="720,191 707.3937405670625,197.08951747755722 707.3937405670625,184.91048252244278" fill="#2E7D32"/><rect x="730" y="160" width="170" height="62" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="815" y="200" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">y = 15</text></svg>