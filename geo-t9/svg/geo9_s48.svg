<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3e8ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".15"/></filter></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><path d="M0 0H1200V170Q900 220 600 170T0 190Z" fill="#7e22ce"/><text x="55" y="55" font-family="Arial" font-size="18" font-weight="700" fill="#fff" opacity=".9">GÉOGRAPHIE T9 • SCHÉMA 42</text><text x="600" y="103" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff"><tspan x="600" dy="0">Fécondité, espérance de vie et doublement</tspan></text><g><rect x="130" y="235" width="220" height="46" rx="23" fill="#fff" stroke="#7e22ce"/><text x="240" y="264" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#581c87">fécondité</text></g><g><rect x="375" y="235" width="220" height="46" rx="23" fill="#f3e8ff" stroke="#7e22ce"/><text x="485" y="264" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#581c87">espérance de vie</text></g><g><rect x="620" y="235" width="220" height="46" rx="23" fill="#fff" stroke="#7e22ce"/><text x="730" y="264" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#581c87">doublement</text></g><g><rect x="865" y="235" width="220" height="46" rx="23" fill="#f3e8ff" stroke="#7e22ce"/><text x="975" y="264" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#581c87">notion clé</text></g><g filter="url(#sh)"><g><rect x="55" y="310" width="525" height="145" rx="20" fill="#fff" stroke="#7e22ce" stroke-width="3"/><circle cx="93" cy="352" r="24" fill="#7e22ce"/><text x="93" y="360" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">1</text><text x="130" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#581c87" text-anchor="start"><tspan x="130" dy="0">La fécondité estime le nombre moyen</tspan><tspan x="130" dy="24">d’enfants par femme.</tspan></text></g><g><rect x="620" y="310" width="525" height="145" rx="20" fill="#fff" stroke="#7e22ce" stroke-width="3"/><circle cx="658" cy="352" r="24" fill="#7e22ce"/><text x="658" y="360" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">2</text><text x="695" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#581c87" text-anchor="start"><tspan x="695" dy="0">L’espérance de vie résume les</tspan><tspan x="695" dy="24">conditions de mortalité.</tspan></text></g><g><rect x="55" y="500" width="525" height="145" rx="20" fill="#fff" stroke="#7e22ce" stroke-width="3"/><circle cx="93" cy="542" r="24" fill="#7e22ce"/><text x="93" y="550" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">3</text><text x="130" y="535" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#581c87" text-anchor="start"><tspan x="130" dy="0">Le doublement dépend du rythme de</tspan><tspan x="130" dy="24">croissance.</tspan></text></g><g><rect x="620" y="500" width="525" height="145" rx="20" fill="#fff" stroke="#7e22ce" stroke-width="3"/><circle cx="658" cy="542" r="24" fill="#7e22ce"/><text x="658" y="550" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">4</text><text x="695" y="535" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#581c87" text-anchor="start"><tspan x="695" dy="0">Aucun indicateur ne suffit seul à</tspan><tspan x="695" dy="24">juger le bien-être.</tspan></text></g></g><rect x="330" y="654" width="540" height="32" rx="16" fill="#7e22ce"/><text x="600" y="676" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">NOTION CENTRALE : INDICATEUR DÉMOGRAPHIQUE</text></svg>