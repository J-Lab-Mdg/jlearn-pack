<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".15"/></filter></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><path d="M0 0H1200V170Q900 220 600 170T0 190Z" fill="#1d4ed8"/><text x="55" y="55" font-family="Arial" font-size="18" font-weight="700" fill="#fff" opacity=".9">GÉOGRAPHIE T9 • SCHÉMA 21</text><text x="600" y="103" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff"><tspan x="600" dy="0">Construire le développement et les transitions</tspan></text><g><rect x="130" y="235" width="220" height="46" rx="23" fill="#fff" stroke="#1d4ed8"/><text x="240" y="264" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a8a">argument</text></g><g><rect x="375" y="235" width="220" height="46" rx="23" fill="#dbeafe" stroke="#1d4ed8"/><text x="485" y="264" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a8a">exemple précis</text></g><g><rect x="620" y="235" width="220" height="46" rx="23" fill="#fff" stroke="#1d4ed8"/><text x="730" y="264" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a8a">transition</text></g><g><rect x="865" y="235" width="220" height="46" rx="23" fill="#dbeafe" stroke="#1d4ed8"/><text x="975" y="264" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a8a">notion clé</text></g><g filter="url(#sh)"><g><rect x="55" y="310" width="525" height="145" rx="20" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="93" cy="352" r="24" fill="#1d4ed8"/><text x="93" y="360" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">1</text><text x="130" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="start"><tspan x="130" dy="0">Chaque partie commence par une idée</tspan><tspan x="130" dy="24">directrice.</tspan></text></g><g><rect x="620" y="310" width="525" height="145" rx="20" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="658" cy="352" r="24" fill="#1d4ed8"/><text x="658" y="360" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">2</text><text x="695" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="start"><tspan x="695" dy="0">Arguments, faits et localisations</tspan><tspan x="695" dy="24">soutiennent la démonstration.</tspan></text></g><g><rect x="55" y="500" width="525" height="145" rx="20" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="93" cy="542" r="24" fill="#1d4ed8"/><text x="93" y="550" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">3</text><text x="130" y="535" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="start"><tspan x="130" dy="0">Les paragraphes évitent les listes</tspan><tspan x="130" dy="24">sans logique.</tspan></text></g><g><rect x="620" y="500" width="525" height="145" rx="20" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="658" cy="542" r="24" fill="#1d4ed8"/><text x="658" y="550" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">4</text><text x="695" y="535" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="start"><tspan x="695" dy="0">La transition fait le bilan puis</tspan><tspan x="695" dy="24">annonce la suite.</tspan></text></g></g><rect x="330" y="654" width="540" height="32" rx="16" fill="#1d4ed8"/><text x="600" y="676" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">NOTION CENTRALE : DÉVELOPPEMENT</text></svg>