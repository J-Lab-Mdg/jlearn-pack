<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Rationnel ou irrationnel ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Rationnel = quotient de deux entiers ; irrationnel = jamais un tel quotient.</text><rect x="90" y="160" width="380" height="230" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="284" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="530" y="160" width="380" height="230" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="720" y="284" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="280" y="200" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">RATIONNELS ℚ</text><text x="720" y="200" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">IRRATIONNELS</text><text x="280" y="250" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="middle">3/4 = 0,75</text><text x="280" y="290" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="middle">−5 = −5/1</text><text x="280" y="330" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">1/3 = 0,333… (périodique)</text><text x="280" y="367" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">décimal fini ou périodique</text><text x="720" y="250" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="middle">√2 = 1,41421356…</text><text x="720" y="290" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="middle">π = 3,14159265…</text><text x="720" y="330" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="middle">√7, √3, π…</text><text x="720" y="367" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">décimales sans fin ni période</text></svg>