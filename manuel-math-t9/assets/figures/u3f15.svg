<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Parallèles, sécantes, perpendiculaires</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Mêmes pentes → parallèles ; produit des pentes = −1 → perpendiculaires.</text><line x1="126" y1="360" x2="430" y2="360" stroke="#333" stroke-width="2.5"/><polygon points="430,360 417.39374056706254,366.08951747755725 417.39374056706254,353.91048252244275" fill="#333"/><line x1="140" y1="374" x2="140" y2="180" stroke="#333" stroke-width="2.5"/><polygon points="140,180 146.08951747755722,192.60625943293746 133.91048252244278,192.60625943293746" fill="#333"/><line x1="140" y1="340" x2="400" y2="210" stroke="#2E7D32" stroke-width="3"/><line x1="140" y1="280" x2="400" y2="150" stroke="#2E7D32" stroke-width="3"/><text x="280" y="395" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">a = a′ : parallèles</text><line x1="566" y1="360" x2="870" y2="360" stroke="#333" stroke-width="2.5"/><polygon points="870,360 857.3937405670625,366.08951747755725 857.3937405670625,353.91048252244275" fill="#333"/><line x1="580" y1="374" x2="580" y2="180" stroke="#333" stroke-width="2.5"/><polygon points="580,180 586.0895174775573,192.60625943293746 573.9104825224427,192.60625943293746" fill="#333"/><line x1="580" y1="330" x2="830" y2="205" stroke="#C2185B" stroke-width="3"/><line x1="740" y1="165" x2="825" y2="335" stroke="#1565C0" stroke-width="3"/><text x="725" y="395" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">a × a′ = −1 : perpendiculaires</text><text x="500" y="440" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">ex. : y = 2x + 1 ⊥ y = −0,5x + 3 car 2 × (−0,5) = −1</text></svg>