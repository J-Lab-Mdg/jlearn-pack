<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La valeur initiale</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">b = la valeur de y quand x = 0 : le point de départ.</text><line x1="156" y1="410" x2="590" y2="410" stroke="#333" stroke-width="2.5"/><polygon points="590,410 577.3937405670625,416.08951747755725 577.3937405670625,403.91048252244275" fill="#333"/><line x1="170" y1="424" x2="170" y2="180" stroke="#333" stroke-width="2.5"/><polygon points="170,180 176.08951747755722,192.60625943293746 163.91048252244278,192.60625943293746" fill="#333"/><line x1="170" y1="290" x2="560" y2="194" stroke="#2E7D32" stroke-width="3"/><circle cx="170" cy="290" r="9" fill="#C2185B"/><text x="278" y="278" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">b = 30 000 Ar</text><text x="760" y="210" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="bold" text-anchor="middle">épargne de Faly :</text><text x="760" y="247" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="normal" text-anchor="middle">30 000 Ar au départ,</text><text x="760" y="280" font-family="DejaVu Serif" font-size="18" fill="#2E7D32" font-weight="normal" text-anchor="middle">+ 4 000 Ar par semaine</text><text x="760" y="320" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">y = 4 000x + 30 000</text><text x="500" y="455" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">dans la table : b est le y de la colonne x = 0</text></svg>