<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La règle y = ax + b et ses deux paramètres</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">a incline la droite, b la soulève : deux réglages indépendants.</text><line x1="136" y1="400" x2="510" y2="400" stroke="#333" stroke-width="2.5"/><polygon points="510,400 497.39374056706254,406.08951747755725 497.39374056706254,393.91048252244275" fill="#333"/><line x1="150" y1="414" x2="150" y2="180" stroke="#333" stroke-width="2.5"/><polygon points="150,180 156.08951747755722,192.60625943293746 143.91048252244278,192.60625943293746" fill="#333"/><line x1="150" y1="340" x2="480" y2="274" stroke="#2E7D32" stroke-width="2.5"/><line x1="150" y1="340" x2="480" y2="202" stroke="#C2185B" stroke-width="2.5"/><text x="415" y="310" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">a petit</text><text x="400" y="185" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">a grand</text><line x1="606" y1="400" x2="950" y2="400" stroke="#333" stroke-width="2.5"/><polygon points="950,400 937.3937405670625,406.08951747755725 937.3937405670625,393.91048252244275" fill="#333"/><line x1="620" y1="414" x2="620" y2="180" stroke="#333" stroke-width="2.5"/><polygon points="620,180 626.0895174775573,192.60625943293746 613.9104825224427,192.60625943293746" fill="#333"/><line x1="620" y1="360" x2="920" y2="260" stroke="#1565C0" stroke-width="2.5"/><line x1="620" y1="280" x2="920" y2="180" stroke="#B25000" stroke-width="2.5"/><text x="770" y="435" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">même a, b différent :</text><text x="770" y="463" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">droites parallèles</text><text x="315" y="435" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">même b, a différent :</text><text x="315" y="463" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">l’inclinaison change</text></svg>