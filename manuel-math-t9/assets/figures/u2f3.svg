<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Multiplier et diviser des rationnels</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Produit : haut × haut, bas × bas ; quotient : on multiplie par l’inverse.</text><rect x="90" y="160" width="400" height="150" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="290" y="244" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="540" y="160" width="400" height="150" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="740" y="244" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="290" y="202" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">PRODUIT</text><text x="290" y="245" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">(−2/3) × (5/7) = −10/21</text><text x="290" y="285" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">signes contraires → négatif</text><text x="740" y="202" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">QUOTIENT</text><text x="740" y="245" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">(−2/3) ÷ (5/7) = −2/3 × 7/5</text><text x="740" y="285" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">= −14/15 : on retourne le diviseur</text><text x="500" y="365" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">règle des signes identique à celle des entiers relatifs</text></svg>