<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">√a est une puissance déguisée</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">√a = a puissance un demi : les lois des exposants s’appliquent aussi aux racines.</text><rect x="140" y="165" width="320" height="110" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="300" y="229" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="560" y="165" width="320" height="110" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="720" y="229" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="300" y="210" font-family="DejaVu Serif" font-size="19" fill="#1565C0" font-weight="bold" text-anchor="middle">définition</text><text x="300" y="250" font-family="DejaVu Serif" font-size="26" fill="#1565C0" font-weight="bold" text-anchor="middle">√a = a¹ᐟ²</text><text x="720" y="210" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">preuve par les lois</text><text x="720" y="250" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">(a¹ᐟ²)² = a¹ = a ✓</text><text x="500" y="335" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">conséquence : √a × √b = √(ab) — ex. √2 × √8 = √16 = 4</text><text x="500" y="371" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">mais attention : √(a + b) ≠ √a + √b !</text></svg>