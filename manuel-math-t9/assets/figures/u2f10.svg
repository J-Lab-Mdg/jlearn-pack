<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="467"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Calculer en notation scientifique</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Mantisses entre elles, puissances de 10 entre elles — puis on remet en forme.</text><rect x="80" y="155" width="290" height="58" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="225" y="193" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Opération</text><rect x="370" y="155" width="180" height="58" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="460" y="193" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Étape 1</text><rect x="550" y="155" width="230" height="58" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="193" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Étape 2</text><rect x="780" y="155" width="160" height="58" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="860" y="193" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Résultat</text><rect x="80" y="213" width="290" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="225" y="251" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">(2 × 10⁵) × (3 × 10⁴)</text><rect x="370" y="213" width="180" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="460" y="251" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2 × 3 = 6</text><rect x="550" y="213" width="230" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="251" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">10⁵ × 10⁴ = 10⁹</text><rect x="780" y="213" width="160" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="860" y="251" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">6 × 10⁹</text><rect x="80" y="271" width="290" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="225" y="309" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">(8 × 10⁷) ÷ (4 × 10²)</text><rect x="370" y="271" width="180" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="460" y="309" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">8 ÷ 4 = 2</text><rect x="550" y="271" width="230" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="309" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">10⁷ ÷ 10² = 10⁵</text><rect x="780" y="271" width="160" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="860" y="309" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2 × 10⁵</text><rect x="80" y="329" width="290" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="225" y="367" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">(5 × 10³) × (4 × 10⁶)</text><rect x="370" y="329" width="180" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="460" y="367" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5 × 4 = 20</text><rect x="550" y="329" width="230" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="367" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">10³ × 10⁶ = 10⁹</text><rect x="780" y="329" width="160" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="860" y="367" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2 × 10¹⁰ ✓</text><text x="500" y="432" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">dernière ligne : 20 × 10⁹ n’est pas scientifique (20 ≥ 10) → 2 × 10¹⁰</text></svg>