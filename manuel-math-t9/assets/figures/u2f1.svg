<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Estimer avant de calculer</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Un calcul approché en deux secondes contrôle le calcul exact.</text><rect x="100" y="160" width="380" height="110" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="290" y="224" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="540" y="160" width="380" height="110" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="730" y="224" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="290" y="205" font-family="DejaVu Serif" font-size="20" fill="#1565C0" font-weight="bold" text-anchor="middle">calcul exact demandé</text><text x="290" y="243" font-family="DejaVu Serif" font-size="24" fill="#1565C0" font-weight="bold" text-anchor="middle">19,8 × 5,1 = ?</text><text x="730" y="205" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">estimation immédiate</text><text x="730" y="243" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">20 × 5 = 100</text><text x="500" y="320" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">résultat exact : 100,98 — proche de 100 : le calcul est plausible</text><text x="500" y="356" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">si on avait trouvé 1 009,8 : virgule mal placée, à refaire !</text></svg>