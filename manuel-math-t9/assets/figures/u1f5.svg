<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="451"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Carré parfait et racine carrée</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">25 points forment un carré de côté 5 : 25 est un carré parfait et √25 = 5.</text><circle cx="170" cy="185" r="10" fill="#1565C0"/><circle cx="170" cy="229" r="10" fill="#1565C0"/><circle cx="170" cy="273" r="10" fill="#1565C0"/><circle cx="170" cy="317" r="10" fill="#1565C0"/><circle cx="170" cy="361" r="10" fill="#1565C0"/><circle cx="214" cy="185" r="10" fill="#1565C0"/><circle cx="214" cy="229" r="10" fill="#1565C0"/><circle cx="214" cy="273" r="10" fill="#1565C0"/><circle cx="214" cy="317" r="10" fill="#1565C0"/><circle cx="214" cy="361" r="10" fill="#1565C0"/><circle cx="258" cy="185" r="10" fill="#1565C0"/><circle cx="258" cy="229" r="10" fill="#1565C0"/><circle cx="258" cy="273" r="10" fill="#1565C0"/><circle cx="258" cy="317" r="10" fill="#1565C0"/><circle cx="258" cy="361" r="10" fill="#1565C0"/><circle cx="302" cy="185" r="10" fill="#1565C0"/><circle cx="302" cy="229" r="10" fill="#1565C0"/><circle cx="302" cy="273" r="10" fill="#1565C0"/><circle cx="302" cy="317" r="10" fill="#1565C0"/><circle cx="302" cy="361" r="10" fill="#1565C0"/><circle cx="346" cy="185" r="10" fill="#1565C0"/><circle cx="346" cy="229" r="10" fill="#1565C0"/><circle cx="346" cy="273" r="10" fill="#1565C0"/><circle cx="346" cy="317" r="10" fill="#1565C0"/><circle cx="346" cy="361" r="10" fill="#1565C0"/><rect x="144" y="159" width="228" height="228" fill="none" stroke="#2E7D32" stroke-width="3" rx="8"/><text x="258" y="413" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">côté 5 → aire 5² = 25</text><rect x="520" y="195" width="400" height="130" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="720" y="269" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="720" y="240" font-family="DejaVu Serif" font-size="25" fill="#B25000" font-weight="bold" text-anchor="middle">√25 = 5 car 5² = 25</text><text x="720" y="285" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">carrés parfaits : 1, 4, 9, 16, 25,</text><text x="720" y="315" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">36, 49, 64, 81, 100, 121, 144…</text></svg>