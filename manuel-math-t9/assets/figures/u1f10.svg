<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Notation scientifique et préfixes : même langage</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">3 500 000 g = 3,5 × 10⁶ g = 3,5 Mg : trois écritures, un seul nombre.</text><rect x="100" y="165" width="250" height="110" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="225" y="229" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="400" y="165" width="250" height="110" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="525" y="229" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="700" y="165" width="220" height="110" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="810" y="229" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="225" y="210" font-family="DejaVu Serif" font-size="19" fill="#1565C0" font-weight="bold" text-anchor="middle">nombre complet</text><text x="225" y="247" font-family="DejaVu Serif" font-size="23" fill="#1565C0" font-weight="bold" text-anchor="middle">3 500 000 g</text><text x="525" y="210" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">notation scientifique</text><text x="525" y="247" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">3,5 × 10⁶ g</text><text x="810" y="210" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">préfixe SI</text><text x="810" y="247" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">3,5 Mg</text><text x="500" y="335" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">attention : notation scientifique 1296 = 1,296 × 10³ ; notation exponentielle 1296 = 6⁴</text><text x="500" y="370" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">la première utilise TOUJOURS une puissance de 10 ; la seconde, n’importe quelle base</text></svg>