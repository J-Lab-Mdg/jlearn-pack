<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="467"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Encadrer √7 pas à pas</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On resserre l’étau : à l’unité, puis au dixième, puis au centième.</text><rect x="110" y="155" width="210" height="58" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="215" y="193" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Étape</text><rect x="320" y="155" width="310" height="58" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="475" y="193" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Encadrement</text><rect x="630" y="155" width="270" height="58" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="765" y="193" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Les carrés disent</text><rect x="110" y="213" width="210" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="215" y="251" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">à l’unité</text><rect x="320" y="213" width="310" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="475" y="251" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2 ≤ √7 ≤ 3</text><rect x="630" y="213" width="270" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="765" y="251" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">4 ≤ 7 ≤ 9</text><rect x="110" y="271" width="210" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="215" y="309" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">au dixième</text><rect x="320" y="271" width="310" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="475" y="309" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2,6 ≤ √7 ≤ 2,7</text><rect x="630" y="271" width="270" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="765" y="309" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">6,76 ≤ 7 ≤ 7,29</text><rect x="110" y="329" width="210" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="215" y="367" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">au centième</text><rect x="320" y="329" width="310" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="475" y="367" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2,64 ≤ √7 ≤ 2,65</text><rect x="630" y="329" width="270" height="58" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="765" y="367" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">6,9696 ≤ 7 ≤ 7,0225</text><text x="500" y="432" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">calculatrice : √7 = 2,6457513… — nos encadrements étaient justes !</text></svg>