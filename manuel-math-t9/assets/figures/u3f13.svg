<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Tracer y = 2x − 1 en deux pas</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Partir de b sur l’axe des y, puis monter de a pour chaque pas de 1 vers la droite.</text><line x1="236" y1="450" x2="680" y2="450" stroke="#333" stroke-width="2.5"/><polygon points="680,450 667.3937405670625,456.08951747755725 667.3937405670625,443.91048252244275" fill="#333"/><line x1="250" y1="464" x2="250" y2="160" stroke="#333" stroke-width="2.5"/><polygon points="250,160 256.08951747755725,172.60625943293746 243.91048252244278,172.60625943293746" fill="#333"/><circle cx="250" cy="445" r="0" fill="#fff"/><circle cx="250" cy="450" r="9" fill="#C2185B"/><text x="190" y="456" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">b = −1</text><line x1="250" y1="450" x2="305" y2="450" stroke="#B25000" stroke-width="2.5"/><line x1="305" y1="450" x2="305" y2="340" stroke="#2E7D32" stroke-width="2.5"/><text x="277.5" y="478" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">+1</text><text x="343" y="395" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">+2</text><circle cx="305" cy="340" r="9" fill="#C2185B"/><line x1="180" y1="590" x2="570" y2="450" stroke="#fff" stroke-width="0"/><line x1="190" y1="452.1818181818182" x2="0" y2="0" stroke="#fff" stroke-width="0"/><line x1="195" y1="560" x2="435" y2="80" stroke="#1565C0" stroke-width="3"/><text x="505" y="245" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">y = 2x − 1</text><text x="760" y="230" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">1. placer b sur l’axe y</text><text x="760" y="268" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">2. avancer 1, monter a</text><text x="760" y="306" font-family="DejaVu Serif" font-size="19" fill="#1565C0" font-weight="bold" text-anchor="middle">3. relier et prolonger</text></svg>