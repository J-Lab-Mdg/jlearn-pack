<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Rapport ou taux ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Mêmes unités qui s’effacent → rapport ; unités différentes qui restent → taux.</text><rect x="90" y="160" width="400" height="170" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="290" y="254" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="540" y="160" width="400" height="170" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="740" y="254" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="290" y="202" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">RAPPORT (nombre pur)</text><text x="290" y="248" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="middle">18 filles / 30 élèves</text><text x="290" y="288" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">= 3/5 : les « personnes »</text><text x="290" y="316" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">s’annulent</text><text x="740" y="202" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">TAUX (unité composée)</text><text x="740" y="248" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="middle">4 500 Ar pour 3 kg</text><text x="740" y="288" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">= 1 500 Ar/kg : l’unité</text><text x="740" y="316" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">Ar/kg reste collée</text></svg>