<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="483"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La pyramide des priorités</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Parenthèses, puis exposants, puis × et ÷, enfin + et −.</text><rect x="210" y="155" width="300" height="56" fill="#C2185B" opacity="0.15" stroke="#C2185B" stroke-width="2.5" rx="10"/><text x="360" y="192" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">1. PARENTHÈSES</text><rect x="150" y="227" width="420" height="56" fill="#B25000" opacity="0.15" stroke="#B25000" stroke-width="2.5" rx="10"/><text x="360" y="264" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">2. EXPOSANTS</text><rect x="90" y="299" width="540" height="56" fill="#1565C0" opacity="0.15" stroke="#1565C0" stroke-width="2.5" rx="10"/><text x="360" y="336" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">3. × et ÷</text><rect x="30" y="371" width="660" height="56" fill="#2E7D32" opacity="0.15" stroke="#2E7D32" stroke-width="2.5" rx="10"/><text x="360" y="408" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">4. + et −</text><text x="790" y="215" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="middle">avec 1/2 + 1/2 × (3/4)²</text><text x="790" y="255" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="normal" text-anchor="middle">(3/4)² = 9/16</text><text x="790" y="295" font-family="DejaVu Serif" font-size="20" fill="#1565C0" font-weight="normal" text-anchor="middle">1/2 × 9/16 = 9/32</text><text x="790" y="335" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">1/2 + 9/32 = 25/32</text></svg>