<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="519"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les lois des exposants</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Produit : on ajoute ; quotient : on soustrait ; puissance de puissance : on multiplie.</text><rect x="170" y="155" width="320" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="330" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Loi</text><rect x="490" y="155" width="340" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="660" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Exemple</text><rect x="170" y="209" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="330" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">aⁿ × aᵐ = aⁿ⁺ᵐ</text><rect x="490" y="209" width="340" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="660" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2³ × 2⁴ = 2⁷ = 128</text><rect x="170" y="263" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="330" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">aⁿ ÷ aᵐ = aⁿ⁻ᵐ</text><rect x="490" y="263" width="340" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="660" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5⁶ ÷ 5⁴ = 5² = 25</text><rect x="170" y="317" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="330" y="353" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">(aⁿ)ᵐ = aⁿˣᵐ</text><rect x="490" y="317" width="340" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="660" y="353" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">(3²)³ = 3⁶ = 729</text><rect x="170" y="371" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="330" y="407" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">aⁿ × bⁿ = (ab)ⁿ</text><rect x="490" y="371" width="340" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="660" y="407" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2⁴ × 5⁴ = 10⁴</text><rect x="170" y="425" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="330" y="461" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">a⁰ = 1 (a ≠ 0)</text><rect x="490" y="425" width="340" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="660" y="461" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">7⁰ = 1</text></svg>