<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Trois types de droites</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Horizontale y = k, verticale x = h, oblique y = ax + b.</text><line x1="166" y1="330" x2="700" y2="330" stroke="#333" stroke-width="2.5"/><polygon points="700,330 687.3937405670625,336.08951747755725 687.3937405670625,323.91048252244275" fill="#333"/><line x1="180" y1="344" x2="180" y2="175" stroke="#333" stroke-width="2.5"/><polygon points="180,175 186.08951747755722,187.60625943293746 173.91048252244278,187.60625943293746" fill="#333"/><line x1="190" y1="262" x2="680" y2="262" stroke="#2E7D32" stroke-width="3"/><text x="600" y="246" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">y = 2 (horizontale)</text><line x1="462" y1="445" x2="462" y2="205" stroke="#C2185B" stroke-width="3"/><text x="462" y="472" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">x = 3 (verticale)</text><line x1="190" y1="430" x2="670" y2="190" stroke="#1565C0" stroke-width="3"/><text x="610" y="182" font-family="DejaVu Serif" font-size="19" fill="#1565C0" font-weight="bold" text-anchor="middle">y = 0,5x − 1</text><text x="500" y="515" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">la verticale x = h n’est PAS une fonction : un seul x, une infinité de y !</text></svg>