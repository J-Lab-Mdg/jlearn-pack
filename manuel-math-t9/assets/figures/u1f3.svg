<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Valeur exacte, valeurs approchées</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">L’arrondi par défaut reste en dessous, l’arrondi par excès passe au-dessus.</text><text x="500" y="165" font-family="DejaVu Serif" font-size="23" fill="#1565C0" font-weight="bold" text-anchor="middle">1/3 = 0,333333… (valeur exacte : la fraction elle-même)</text><line x1="100" y1="275" x2="920" y2="275" stroke="#333" stroke-width="2.5"/><line x1="140" y1="261" x2="140" y2="289" stroke="#333" stroke-width="2"/><text x="140" y="321" font-family="DejaVu Serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">0,32</text><line x1="500.00000000000034" y1="261" x2="500.00000000000034" y2="289" stroke="#333" stroke-width="2"/><text x="500.00000000000034" y="321" font-family="DejaVu Serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">0,33</text><line x1="860.0000000000007" y1="261" x2="860.0000000000007" y2="289" stroke="#333" stroke-width="2"/><text x="860.0000000000007" y="321" font-family="DejaVu Serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">0,34</text><circle cx="619.9999999999991" cy="275" r="9" fill="#C2185B"/><text x="619.9999999999991" y="247" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">1/3</text><text x="500.00000000000034" y="215" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">par défaut : 0,33</text><text x="860.0000000000007" y="215" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">par excès : 0,34</text><text x="500" y="375" font-family="DejaVu Serif" font-size="20" fill="#1565C0" font-weight="bold" text-anchor="middle">au centième : 0,33 ≤ 1/3 ≤ 0,34 — l’arrondi retenu est 0,33 (le plus proche)</text></svg>