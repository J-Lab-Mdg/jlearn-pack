<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Du décimal à la fraction</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le nombre de décimales dicte la puissance de 10 au dénominateur.</text><rect x="110" y="180" width="200" height="90" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="210" y="234" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="410" y="180" width="220" height="90" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="520" y="234" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="730" y="180" width="180" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="820" y="234" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="210" y="235" font-family="DejaVu Serif" font-size="26" fill="#1565C0" font-weight="bold" text-anchor="middle">0,75</text><text x="520" y="235" font-family="DejaVu Serif" font-size="26" fill="#B25000" font-weight="bold" text-anchor="middle">75/100</text><text x="820" y="235" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">3/4</text><line x1="315" y1="225" x2="405" y2="225" stroke="#555" stroke-width="2.5"/><polygon points="405,225 392.39374056706254,231.08951747755722 392.39374056706254,218.91048252244278" fill="#555"/><line x1="635" y1="225" x2="725" y2="225" stroke="#555" stroke-width="2.5"/><polygon points="725,225 712.3937405670625,231.08951747755722 712.3937405670625,218.91048252244278" fill="#555"/><text x="360" y="205" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">2 décimales</text><text x="360" y="258" font-family="DejaVu Serif" font-size="18" fill="#555" font-weight="normal" text-anchor="middle">→ 10²</text><text x="680" y="205" font-family="DejaVu Serif" font-size="18" fill="#555" font-weight="normal" text-anchor="middle">÷ 25</text><text x="680" y="258" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">simplifier</text><text x="500" y="330" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">0,048 = 48/1000 = 6/125 : trois décimales → 10³ en bas</text></svg>