<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le taux de variation</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">a = variation de y ÷ variation de x : la pente de l’escalier.</text><line x1="156" y1="410" x2="630" y2="410" stroke="#333" stroke-width="2.5"/><polygon points="630,410 617.3937405670625,416.08951747755725 617.3937405670625,403.91048252244275" fill="#333"/><line x1="170" y1="424" x2="170" y2="180" stroke="#333" stroke-width="2.5"/><polygon points="170,180 176.08951747755722,192.60625943293746 163.91048252244278,192.60625943293746" fill="#333"/><line x1="170" y1="360" x2="600" y2="188" stroke="#1565C0" stroke-width="3"/><circle cx="260" cy="324" r="8" fill="#C2185B"/><circle cx="460" cy="244" r="8" fill="#C2185B"/><line x1="260" y1="324" x2="460" y2="324" stroke="#B25000" stroke-width="2.5"/><line x1="460" y1="324" x2="460" y2="244" stroke="#2E7D32" stroke-width="2.5"/><text x="360" y="354" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">Δx = 2</text><text x="515" y="291" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">Δy = 800</text><text x="745" y="220" font-family="DejaVu Serif" font-size="23" fill="#1565C0" font-weight="bold" text-anchor="middle">a = Δy ÷ Δx</text><text x="745" y="260" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">= 800 ÷ 2 = 400</text><text x="500" y="455" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">même escalier partout sur la droite : le taux est constant</text></svg>