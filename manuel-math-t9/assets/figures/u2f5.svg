<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La propriété fondamentale des proportions</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">a/b = c/d exactement quand a × d = b × c : les produits en croix.</text><text x="260" y="230" font-family="DejaVu Serif" font-size="26" fill="#1565C0" font-weight="bold" text-anchor="middle">3/5 = 12/20 ?</text><line x1="430" y1="195" x2="620" y2="265" stroke="#C2185B" stroke-width="2.5"/><line x1="430" y1="265" x2="620" y2="195" stroke="#2E7D32" stroke-width="2.5"/><text x="450" y="185" font-family="DejaVu Serif" font-size="24" fill="#333" font-weight="bold" text-anchor="middle">3</text><text x="450" y="295" font-family="DejaVu Serif" font-size="24" fill="#333" font-weight="bold" text-anchor="middle">5</text><text x="600" y="185" font-family="DejaVu Serif" font-size="24" fill="#333" font-weight="bold" text-anchor="middle">12</text><text x="600" y="295" font-family="DejaVu Serif" font-size="24" fill="#333" font-weight="bold" text-anchor="middle">20</text><text x="800" y="210" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">3 × 20 = 60</text><text x="800" y="250" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">5 × 12 = 60</text><text x="500" y="355" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">égaux → la proportion est vraie ; et si 3/5 = x/35, alors 5x = 105, x = 21</text></svg>