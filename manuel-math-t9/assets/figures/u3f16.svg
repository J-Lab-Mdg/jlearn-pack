<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Réduire une expression algébrique</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On regroupe les termes semblables : mêmes lettres, mêmes exposants.</text><text x="500" y="170" font-family="DejaVu Serif" font-size="25" fill="#1565C0" font-weight="bold" text-anchor="middle">3x² + 5x − 2 + x² − 3x + 7</text><line x1="500" y1="195" x2="500" y2="235" stroke="#555" stroke-width="2.5"/><polygon points="500,235 493.91048252244275,222.39374056706254 506.08951747755725,222.39374056706254" fill="#555"/><rect x="140" y="250" width="220" height="70" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="250" y="294" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="400" y="250" width="220" height="70" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="510" y="294" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="660" y="250" width="200" height="70" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="760" y="294" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="250" y="293" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">3x² + x² = 4x²</text><text x="510" y="293" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">5x − 3x = 2x</text><text x="760" y="293" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">−2 + 7 = 5</text><text x="500" y="375" font-family="DejaVu Serif" font-size="24" fill="#1565C0" font-weight="bold" text-anchor="middle">résultat réduit : 4x² + 2x + 5</text><text x="500" y="412" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">interdit : 4x² + 2x ne se regroupent pas (exposants différents) !</text></svg>