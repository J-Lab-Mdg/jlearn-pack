<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Arrondir ou tronquer ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Tronquer = couper net ; arrondir = couper en regardant le chiffre suivant.</text><text x="500" y="165" font-family="DejaVu Serif" font-size="26" fill="#1565C0" font-weight="bold" text-anchor="middle">√7 = 2,645751…</text><rect x="120" y="205" width="350" height="140" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="295" y="284" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="530" y="205" width="350" height="140" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="705" y="284" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="295" y="245" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">TRONQUÉ au millième</text><text x="295" y="290" font-family="DejaVu Serif" font-size="28" fill="#2E7D32" font-weight="bold" text-anchor="middle">2,645</text><text x="295" y="327" font-family="DejaVu Serif" font-size="18" fill="#555" font-weight="normal" text-anchor="middle">on coupe, sans regarder</text><text x="705" y="245" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">ARRONDI au millième</text><text x="705" y="290" font-family="DejaVu Serif" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">2,646</text><text x="705" y="327" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">le chiffre suivant est 7 ≥ 5 : on monte</text><text x="500" y="395" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">règle de l’arrondi : chiffre suivant 0-4 → on garde ; 5-9 → on augmente de 1</text></svg>