<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La variation partielle : y = ax + b</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une part fixe b, puis a par unité : la droite démarre au-dessus de O.</text><line x1="156" y1="410" x2="590" y2="410" stroke="#333" stroke-width="2.5"/><polygon points="590,410 577.3937405670625,416.08951747755725 577.3937405670625,403.91048252244275" fill="#333"/><line x1="170" y1="424" x2="170" y2="180" stroke="#333" stroke-width="2.5"/><polygon points="170,180 176.08951747755722,192.60625943293746 163.91048252244278,192.60625943293746" fill="#333"/><line x1="170" y1="340" x2="560" y2="195" stroke="#C2185B" stroke-width="3"/><circle cx="170" cy="340" r="8" fill="#B25000"/><text x="238" y="328" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">b = 2 000</text><text x="450" y="220" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">y = 500x + 2 000</text><text x="765" y="215" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="bold" text-anchor="middle">course en taxi :</text><text x="765" y="252" font-family="DejaVu Serif" font-size="18" fill="#B25000" font-weight="normal" text-anchor="middle">prise en charge 2 000 Ar</text><text x="765" y="286" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="normal" text-anchor="middle">+ 500 Ar par km</text><text x="500" y="455" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">x = 0 coûte déjà b : la droite coupe l’axe des y en b, pas en O</text></svg>