<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Trouver l’équation d’une droite par deux points</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">La pente d’abord, l’ordonnée à l’origine ensuite.</text><rect x="120" y="155" width="330" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="285" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Étape</text><rect x="450" y="155" width="430" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Avec A(1 ; 3) et B(4 ; 9)</text><rect x="120" y="211" width="330" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="285" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">pente a = Δy/Δx</text><rect x="450" y="211" width="430" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">a = (9 − 3)/(4 − 1) = 6/3 = 2</text><rect x="120" y="267" width="330" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="285" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">b par un point</text><rect x="450" y="267" width="430" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">3 = 2 × 1 + b → b = 1</text><rect x="120" y="323" width="330" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="285" y="360" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">équation</text><rect x="450" y="323" width="430" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="360" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">y = 2x + 1</text><rect x="120" y="379" width="330" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="285" y="416" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">contrôle avec B</text><rect x="450" y="379" width="430" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="665" y="416" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2 × 4 + 1 = 9 ✓</text></svg>