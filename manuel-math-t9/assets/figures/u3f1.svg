<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Variable indépendante, variable dépendante</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">x se choisit librement ; y se calcule à partir de x.</text><rect x="90" y="185" width="240" height="100" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="210" y="244" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="400" y="185" width="220" height="100" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="510" y="244" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="690" y="185" width="240" height="100" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="810" y="244" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="210" y="223" font-family="DejaVu Serif" font-size="19" fill="#1565C0" font-weight="bold" text-anchor="middle">x : heures de travail</text><text x="210" y="257" font-family="DejaVu Serif" font-size="19" fill="#1565C0" font-weight="bold" text-anchor="middle">INDÉPENDANTE</text><text x="510" y="223" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">règle</text><text x="510" y="257" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">y = 4 000 × x</text><text x="810" y="223" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">y : salaire en Ar</text><text x="810" y="257" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">DÉPENDANTE</text><line x1="335" y1="235" x2="395" y2="235" stroke="#555" stroke-width="2.5"/><polygon points="395,235 382.39374056706254,241.08951747755722 382.39374056706254,228.91048252244278" fill="#555"/><line x1="625" y1="235" x2="685" y2="235" stroke="#555" stroke-width="2.5"/><polygon points="685,235 672.3937405670625,241.08951747755722 672.3937405670625,228.91048252244278" fill="#555"/><text x="500" y="340" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">on choisit x, la règle répond y : y dépend de x</text></svg>