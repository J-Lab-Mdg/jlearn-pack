<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La variation directe : y = ax</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Droite qui PASSE par l’origine : double de x, double de y.</text><line x1="156" y1="410" x2="590" y2="410" stroke="#333" stroke-width="2.5"/><polygon points="590,410 577.3937405670625,416.08951747755725 577.3937405670625,403.91048252244275" fill="#333"/><line x1="170" y1="424" x2="170" y2="180" stroke="#333" stroke-width="2.5"/><polygon points="170,180 176.08951747755722,192.60625943293746 163.91048252244278,192.60625943293746" fill="#333"/><line x1="170" y1="410" x2="590" y2="218" stroke="#2E7D32" stroke-width="3"/><circle cx="290" cy="355" r="7" fill="#1565C0"/><circle cx="410" cy="300" r="7" fill="#1565C0"/><circle cx="530" cy="245" r="7" fill="#1565C0"/><circle cx="170" cy="410" r="8" fill="#C2185B"/><text x="138" y="420" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">O</text><text x="430" y="205" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">y = 1 500x</text><text x="760" y="220" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="middle">x kg → y Ar</text><text x="760" y="260" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">y ÷ x = 1 500</text><text x="760" y="300" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">toujours !</text><text x="500" y="455" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">proportionnalité : passage par l’origine + quotient constant</text></svg>