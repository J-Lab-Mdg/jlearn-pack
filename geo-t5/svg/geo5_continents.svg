<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les sept continents du globe terrestre</text>
  
    <rect x="60" y="120" width="880" height="360" rx="12" fill="#B3E5FC" stroke="#0277BD" stroke-width="4"/>
