    <text x="680" y="210" text-anchor="middle" font-size="23" font-weight="bold" fill="#4A148C">Asie</text>
    <ellipse cx="800" cy="390" rx="66" ry="42" fill="#F48FB1" stroke="#AD1457" stroke-width="3"/>
