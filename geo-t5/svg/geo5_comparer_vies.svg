<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Comparer la vie rurale et la vie urbaine</text>
  <rect x="60" y="100" width="880" height="56" rx="8" fill="#37474F"/>
  <text x="78" y="135" text-anchor="start" font-size="20" fill="#FFF" font-weight="bold">Critère</text>
  <text x="360" y="135" text-anchor="start" font-size="20" fill="#A5D6A7" font-weight="bold">À LA CAMPAGNE</text>
  <text x="680" y="135" text-anchor="start" font-size="20" fill="#90CAF9" font-weight="bold">À LA VILLE</text>
  <rect x="60" y="160" width="880" height="62" rx="8" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.5"/><text x="78" y="198" text-anchor="start" font-size="19" fill="#37474F" font-weight="bold">Le paysage</text><text x="360" y="198" text-anchor="start" font-size="18" fill="#1B5E20">rizières, prairies, forêts</text><text x="680" y="198" text-anchor="start" font-size="18" fill="#0D47A1">immeubles, rues, marchés</text>
  <rect x="60" y="224" width="880" height="62" rx="8" fill="#FDFBF3" stroke="#B0BEC5" stroke-width="1.5"/><text x="78" y="262" text-anchor="start" font-size="19" fill="#37474F" font-weight="bold">Les habitants</text><text x="360" y="262" text-anchor="start" font-size="18" fill="#1B5E20">peu nombreux, dispersés</text><text x="680" y="262" text-anchor="start" font-size="18" fill="#0D47A1">très nombreux, serrés</text>
  <rect x="60" y="288" width="880" height="62" rx="8" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.5"/><text x="78" y="326" text-anchor="start" font-size="19" fill="#37474F" font-weight="bold">Les logements</text><text x="360" y="326" text-anchor="start" font-size="18" fill="#1B5E20">cases et maisons espacées</text><text x="680" y="326" text-anchor="start" font-size="18" fill="#0D47A1">immeubles et quartiers denses</text>
  <rect x="60" y="352" width="880" height="62" rx="8" fill="#FDFBF3" stroke="#B0BEC5" stroke-width="1.5"/><text x="78" y="390" text-anchor="start" font-size="19" fill="#37474F" font-weight="bold">Les activités</text><text x="360" y="390" text-anchor="start" font-size="18" fill="#1B5E20">champs, élevage, pêche, artisanat</text><text x="680" y="390" text-anchor="start" font-size="18" fill="#0D47A1">usines, boutiques, bureaux, services</text>
  <rect x="60" y="416" width="880" height="62" rx="8" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.5"/><text x="78" y="454" text-anchor="start" font-size="19" fill="#37474F" font-weight="bold">Les services</text><text x="360" y="454" text-anchor="start" font-size="18" fill="#1B5E20">rares et parfois loin</text><text x="680" y="454" text-anchor="start" font-size="18" fill="#0D47A1">nombreux et proches</text>
  <rect x="60" y="480" width="880" height="62" rx="8" fill="#FDFBF3" stroke="#B0BEC5" stroke-width="1.5"/><text x="78" y="518" text-anchor="start" font-size="19" fill="#37474F" font-weight="bold">La vie quotidienne</text><text x="360" y="518" text-anchor="start" font-size="18" fill="#1B5E20">au rythme des saisons, calme</text><text x="680" y="518" text-anchor="start" font-size="18" fill="#0D47A1">au rythme des horaires, pressée</text>
  <text x="500" y="590" text-anchor="middle" font-size="22" fill="#263238" font-weight="bold">Deux milieux différents — mais complémentaires : la ville et la campagne s'échangent tout.</text>
  <text x="500" y="625" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Le tableau de synthèse de l'année : sers-t'en pour réviser toute l'unité 5.</text>
</svg>