<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les problèmes de l'eau</text>
  <rect x="40" y="90" width="295" height="400" rx="18" fill="#FFEBEE" stroke="#90A4AE" stroke-width="3"/>
  <text x="187" y="130" text-anchor="middle" font-size="21" fill="#C00000" font-weight="bold">La pollution</text>
  <rect x="120" y="330" width="135" height="70" fill="#B0BEC5" stroke="#546E7A" stroke-width="2.5"/><rect x="230" y="350" width="18" height="30" fill="#546E7A"/><path d="M 255 365 q 40 8 55 35" fill="none" stroke="#6D4C41" stroke-width="6"/><path d="M 110 420 q 77 16 150 0" fill="none" stroke="#4FC3F7" stroke-width="8"/><path d="M 160 405 l 8 10 M 190 408 l 6 9 M 220 412 l 7 8" stroke="#6D4C41" stroke-width="4"/>
  <text x="187" y="462" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">les déchets et les eaux sales</text>
  <text x="187" y="484" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">rendent l'eau dangereuse</text>
  <rect x="352" y="90" width="295" height="400" rx="18" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  <text x="500" y="130" text-anchor="middle" font-size="21" fill="#E65100" font-weight="bold">L'accès à l'eau potable</text>
  <path d="M 400 430 q 40 -20 80 -20 q 40 0 60 20" fill="none" stroke="#D7CCA8" stroke-width="10"/><circle cx="430" cy="360" r="14" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><rect x="470" y="350" width="22" height="34" rx="6" fill="#4FC3F7" stroke="#0277BD" stroke-width="2"/><path d="M 481 350 q -12 -8 -2 -16 M 481 350 q 12 -8 2 -16" fill="none" stroke="#263238" stroke-width="3"/>
  <text x="500" y="462" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">des familles marchent loin</text>
  <text x="500" y="484" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">pour chercher de l'eau</text>
  <rect x="664" y="90" width="295" height="400" rx="18" fill="#EFEBE9" stroke="#90A4AE" stroke-width="3"/>
  <text x="812" y="130" text-anchor="middle" font-size="21" fill="#5D4037" font-weight="bold">La dégradation</text>
  <path d="M 740 430 L 760 380 L 778 430 Z" fill="#BF360C" opacity="0.7"/><path d="M 762 430 L 782 370 L 800 430 Z" fill="#D84315" opacity="0.7"/><path d="M 720 430 h 180" stroke="#8D6E63" stroke-width="4"/><path d="M 850 430 q 20 -35 40 -10" fill="none" stroke="#4FC3F7" stroke-width="5"/><path d="M 748 412 l -6 10 M 785 400 l -7 12" stroke="#BF360C" stroke-width="3"/>
  <text x="812" y="462" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">l'érosion creuse des lavaka</text>
  <text x="812" y="484" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">et boue les rivières</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Polluer moins, protéger les sources et partager l'eau : des défis pour toute l'île.</text>
</svg>