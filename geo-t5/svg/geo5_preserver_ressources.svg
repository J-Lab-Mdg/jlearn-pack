<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Préserver les ressources naturelles</text>
  <rect x="45" y="90" width="290" height="180" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><rect x="150" y="240" width="80" height="26" rx="6" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/><rect x="117.3" y="215.2" width="5.4" height="19.8" fill="#795548"/><circle cx="120" cy="208" r="14.4" fill="#388E3C"/><rect x="167.9" y="212.6" width="4.199999999999999" height="15.399999999999999" fill="#795548"/><circle cx="170" cy="207" r="11.2" fill="#2E7D32"/><rect x="212.6" y="218.4" width="4.800000000000001" height="17.6" fill="#795548"/><circle cx="215" cy="212" r="12.8" fill="#388E3C"/><text x="190" y="238" text-anchor="middle" font-size="21" fill="#1B5E20" font-weight="bold">Reboiser</text><text x="190" y="260" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">planter des arbres chaque année</text>
  <rect x="355" y="90" width="290" height="180" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><path d="M 430 245 L 570 245" stroke="#558B2F" stroke-width="5"/><path d="M 500 245 v -35" stroke="#558B2F" stroke-width="4"/><circle cx="500" cy="196" r="22" fill="none" stroke="#C00000" stroke-width="4"/><line x1="485" y1="181" x2="515" y2="211" stroke="#C00000" stroke-width="4"/><text x="500" y="238" text-anchor="middle" font-size="21" fill="#1B5E20" font-weight="bold">Protéger</text><text x="500" y="260" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">parcs nationaux et réserves</text>
  <rect x="665" y="90" width="290" height="180" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><path d="M 740 245 h 60" stroke="#4FC3F7" stroke-width="6"/><path d="M 770 245 v -25" stroke="#4FC3F7" stroke-width="5"/><g><ellipse cx="770" cy="205" rx="14.4" ry="8.1" fill="#4FC3F7" stroke="#0277BD" stroke-width="1.5"/><path d="M 782.6 205 l 9 -6.3 l 0 12.6 Z" fill="#4FC3F7" stroke="#0277BD" stroke-width="1.5"/><circle cx="762.8" cy="203.2" r="1.62" fill="#263238"/></g><text x="850" y="210" text-anchor="middle" font-size="16" fill="#0277BD" font-weight="bold">petits =</text><text x="850" y="232" text-anchor="middle" font-size="16" fill="#0277BD" font-weight="bold">rejetés</text><text x="810" y="238" text-anchor="middle" font-size="21" fill="#1B5E20" font-weight="bold">Pêcher avec mesure</text><text x="810" y="260" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">respecter tailles et saisons</text>
  <rect x="45" y="300" width="290" height="180" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><rect x="130" y="420" width="22" height="52" rx="5" fill="#4FC3F7" stroke="#0277BD" stroke-width="2"/><path d="M 200 470 h 70 M 220 470 v -30 h 30 v 30" stroke="#90A4AE" stroke-width="5" fill="none"/><path d="M 235 440 q 10 -14 0 -24 q -10 -10 0 -20" stroke="#4FC3F7" stroke-width="4" fill="none"/><text x="190" y="448" text-anchor="middle" font-size="21" fill="#1B5E20" font-weight="bold">Économiser l'eau</text><text x="190" y="470" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">fermer le robinet, arroser le soir</text>
  <rect x="355" y="300" width="290" height="180" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><rect x="450" y="440" width="34" height="36" fill="#66BB6A" stroke="#2E7D32" stroke-width="2"/><rect x="492" y="440" width="34" height="36" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><rect x="534" y="440" width="34" height="36" fill="#4FC3F7" stroke="#0277BD" stroke-width="2"/><text x="500" y="430" text-anchor="middle" font-size="16" fill="#546E7A" font-weight="bold">trier les déchets</text><text x="500" y="448" text-anchor="middle" font-size="21" fill="#1B5E20" font-weight="bold">Ne pas polluer</text><text x="500" y="470" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">trier, ne rien jeter dans la nature</text>
  <rect x="665" y="300" width="290" height="180" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><circle cx="780" cy="440" r="17" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><circle cx="812" cy="440" r="17" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><circle cx="796" cy="414" r="17" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><text x="860" y="436" text-anchor="middle" font-size="16" fill="#546E7A" font-weight="bold">apprendre</text><text x="860" y="458" text-anchor="middle" font-size="16" fill="#546E7A" font-weight="bold">et transmettre</text><text x="810" y="448" text-anchor="middle" font-size="21" fill="#1B5E20" font-weight="bold">Sensibiliser</text><text x="810" y="470" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">les élèves expliquent aux familles</text>
  <text x="500" y="620" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Planter, protéger, économiser, trier, expliquer : chacun peut préserver les richesses de Madagascar.</text>
</svg>