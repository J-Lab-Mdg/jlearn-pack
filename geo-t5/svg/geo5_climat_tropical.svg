<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Le climat tropical de Madagascar</text>
  <rect x="40" y="80" width="920" height="350" rx="18" fill="#EAF4FB" stroke="#90A4AE" stroke-width="3"/>
  <circle cx="150" cy="190" r="48" fill="#FFD54F" stroke="#F9A825" stroke-width="3"/><line x1="203" y1="190" x2="216" y2="190" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="187.47665940288704" y1="227.476659402887" x2="196.66904755831214" y2="236.66904755831212" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="243" x2="150" y2="256" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="112.52334059711299" y1="227.47665940288704" x2="103.33095244168787" y2="236.66904755831214" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="97" y1="190" x2="84" y2="190" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="112.52334059711296" y1="152.523340597113" x2="103.33095244168786" y2="143.33095244168788" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="137" x2="150" y2="124" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="187.476659402887" y1="152.52334059711296" x2="196.66904755831212" y2="143.33095244168786" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="290" text-anchor="middle" font-size="22" fill="#E65100" font-weight="bold">Il fait chaud</text>
  <text x="150" y="318" text-anchor="middle" font-size="22" fill="#E65100" font-weight="bold">toute l'année</text>
  <g fill="#ECEFF1"><ellipse cx="430" cy="180" rx="52" ry="23.400000000000002"/><circle cx="404" cy="167" r="18.2"/><circle cx="445.6" cy="161.8" r="22.1"/></g><line x1="398.8" y1="206" x2="391" y2="237.2" stroke="#4FC3F7" stroke-width="4.55" stroke-linecap="round"/><line x1="419.6" y1="206" x2="411.8" y2="237.2" stroke="#4FC3F7" stroke-width="4.55" stroke-linecap="round"/><line x1="440.40000000000003" y1="206" x2="432.6" y2="237.2" stroke="#4FC3F7" stroke-width="4.55" stroke-linecap="round"/><line x1="461.20000000000005" y1="206" x2="453.4" y2="237.2" stroke="#4FC3F7" stroke-width="4.55" stroke-linecap="round"/>
  <text x="430" y="290" text-anchor="middle" font-size="22" fill="#01579B" font-weight="bold">avec une saison</text>
  <text x="430" y="318" text-anchor="middle" font-size="22" fill="#01579B" font-weight="bold">des pluies</text>
  <g fill="#ECEFF1"><ellipse cx="700" cy="165" rx="48" ry="21.599999999999998"/><circle cx="676" cy="153" r="16.8"/><circle cx="714.4" cy="148.2" r="20.4"/></g>
  <text x="700" y="290" text-anchor="middle" font-size="22" fill="#795548" font-weight="bold">et une saison</text>
  <text x="700" y="318" text-anchor="middle" font-size="22" fill="#795548" font-weight="bold">sèche</text>
  <text x="500" y="445" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">L'année à Madagascar</text>
  <rect x="120" y="300" width="63" height="70" fill="#4FC3F7" stroke="#FFFFFF" stroke-width="2"/><text x="151.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Jan</text><rect x="183" y="300" width="63" height="70" fill="#4FC3F7" stroke="#FFFFFF" stroke-width="2"/><text x="214.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Fév</text><rect x="246" y="300" width="63" height="70" fill="#4FC3F7" stroke="#FFFFFF" stroke-width="2"/><text x="277.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Mar</text><rect x="309" y="300" width="63" height="70" fill="#4FC3F7" stroke="#FFFFFF" stroke-width="2"/><text x="340.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Avr</text><rect x="372" y="300" width="63" height="70" fill="#FFD54F" stroke="#FFFFFF" stroke-width="2"/><text x="403.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Mai</text><rect x="435" y="300" width="63" height="70" fill="#FFD54F" stroke="#FFFFFF" stroke-width="2"/><text x="466.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Juin</text><rect x="498" y="300" width="63" height="70" fill="#FFD54F" stroke="#FFFFFF" stroke-width="2"/><text x="529.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Juil</text><rect x="561" y="300" width="63" height="70" fill="#FFD54F" stroke="#FFFFFF" stroke-width="2"/><text x="592.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Août</text><rect x="624" y="300" width="63" height="70" fill="#FFD54F" stroke="#FFFFFF" stroke-width="2"/><text x="655.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Sep</text><rect x="687" y="300" width="63" height="70" fill="#FFD54F" stroke="#FFFFFF" stroke-width="2"/><text x="718.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Oct</text><rect x="750" y="300" width="63" height="70" fill="#4FC3F7" stroke="#FFFFFF" stroke-width="2"/><text x="781.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Nov</text><rect x="813" y="300" width="63" height="70" fill="#4FC3F7" stroke="#FFFFFF" stroke-width="2"/><text x="844.5" y="396" text-anchor="middle" font-size="17" fill="#546E7A">Déc</text>
  <rect x="120" y="470" width="14" height="14" fill="#4FC3F7"/><text x="148" y="482" text-anchor="start" font-size="18" fill="#263238">saison chaude et pluvieuse (novembre à avril)</text>
  <rect x="570" y="470" width="14" height="14" fill="#FFD54F"/><text x="598" y="482" text-anchor="start" font-size="18" fill="#263238">saison fraîche et sèche (mai à octobre)</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Un climat tropical : chaleur toute l'année, alternance d'une saison des pluies et d'une saison sèche.</text>
</svg>