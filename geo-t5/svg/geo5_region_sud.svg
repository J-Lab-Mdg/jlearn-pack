<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Région naturelle : le Grand Sud</text>
