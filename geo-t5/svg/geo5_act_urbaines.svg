<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les activités en milieu urbain : les trois secteurs</text>
  <rect x="30" y="90" width="320" height="420" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 130 300 q 30 -12 65 0 Z" fill="#81C784" stroke="#558B2F" stroke-width="2"/><path d="M 150 296 v -10 M 165 297 v -10 M 180 298 v -10" stroke="#2E7D32" stroke-width="2"/><text x="190" y="330" text-anchor="middle" font-size="15" fill="#8D6E63" font-style="italic">maraîchage des villes</text><text x="190" y="130" text-anchor="middle" font-size="21" fill="#2E7D32" font-weight="bold">1. Le secteur primaire</text><text x="190" y="400" text-anchor="middle" font-size="18" fill="#546E7A">faible en ville :</text><text x="190" y="430" text-anchor="middle" font-size="18" fill="#546E7A">maraîchers, éleveurs</text><text x="190" y="460" text-anchor="middle" font-size="18" fill="#546E7A">de volailles,</text><text x="190" y="490" text-anchor="middle" font-size="18" fill="#546E7A">planteurs en périphérie</text>
  <rect x="340" y="90" width="320" height="420" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><rect x="420" y="200" width="160" height="120" fill="#CFD8DC" stroke="#546E7A" stroke-width="3"/><rect x="440" y="220" width="30" height="22" fill="#EF6C00"/><rect x="480" y="220" width="30" height="22" fill="#EF6C00"/><rect x="455" y="250" width="90" height="50" fill="#FFB74D" stroke="#BF360C" stroke-width="2"/><text x="500" y="345" text-anchor="middle" font-size="15" fill="#8D6E63" font-style="italic">usine et entrepôt</text><text x="500" y="130" text-anchor="middle" font-size="21" fill="#E65100" font-weight="bold">2. Le secteur secondaire</text><text x="500" y="400" text-anchor="middle" font-size="18" fill="#546E7A">usines, ateliers,</text><text x="500" y="430" text-anchor="middle" font-size="18" fill="#546E7A">chantiers de BTP,</text><text x="500" y="460" text-anchor="middle" font-size="18" fill="#546E7A">brasseries, textile,</text><text x="500" y="490" text-anchor="middle" font-size="18" fill="#546E7A">décorticage du riz</text>
  <rect x="650" y="90" width="320" height="420" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><rect x="730" y="200" width="60" height="110" fill="#90CAF9" stroke="#1565C0" stroke-width="2.5"/><g><rect x="796" y="253.2" width="48" height="33.6" rx="3" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/><line x1="820" y1="253.2" x2="820" y2="286.8" stroke="#0D47A1" stroke-width="2"/><line x1="803.2" y1="262.8" x2="812.8" y2="262.8" stroke="#FFF" stroke-width="2"/><line x1="827.2" y1="262.8" x2="836.8" y2="262.8" stroke="#FFF" stroke-width="2"/></g><rect x="869.2" y="309.2" width="21.599999999999998" height="21.599999999999998" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="3"/><rect x="873.4" y="318.2" width="13.2" height="3.5999999999999996" fill="#C62828"/><rect x="878.2" y="313.4" width="3.5999999999999996" height="13.2" fill="#C62828"/><text x="760" y="330" text-anchor="middle" font-size="14" fill="#1565C0" font-weight="bold">banque</text><text x="810" y="130" text-anchor="middle" font-size="21" fill="#1565C0" font-weight="bold">3. Le secteur tertiaire</text><text x="810" y="400" text-anchor="middle" font-size="18" fill="#546E7A">le grand secteur de la ville :</text><text x="810" y="430" text-anchor="middle" font-size="18" fill="#546E7A">boutiques, banques,</text><text x="810" y="460" text-anchor="middle" font-size="18" fill="#546E7A">transport, restauration,</text><text x="810" y="490" text-anchor="middle" font-size="18" fill="#546E7A">administration, écoles</text>
  <text x="500" y="555" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">En ville, les services dominent : le tertiaire est le premier pourvoyeur d'emplois.</text>
</svg>