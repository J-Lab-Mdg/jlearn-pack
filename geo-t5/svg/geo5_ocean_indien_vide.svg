<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Georgia, 'Times New Roman', serif">
  <text x="550" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">L'océan Indien à compléter</text>
  <rect x="40" y="90" width="1020" height="500" rx="18" fill="#EAF6FB" stroke="#90A4AE" stroke-width="3"/>
  <path d="M 60 210 L 210 186 L 330 250 L 356 372 L 292 512 L 214 556 L 162 428 L 106 320 Z" fill="#CFD8DC" stroke="#607D8B" stroke-width="3" stroke-linejoin="round"/>
  <text x="190" y="330" text-anchor="middle" font-size="30" fill="#1B5E20" font-weight="bold">……</text>
  <text x="190" y="354" text-anchor="middle" font-size="15" fill="#78909C" font-style="italic">le continent ?</text>
  <path d="M 640 96 L 726 104 L 764 168 L 706 240 L 652 176 Z" fill="#CFD8DC" stroke="#607D8B" stroke-width="3" stroke-linejoin="round"/>
  <text x="700" y="170" text-anchor="middle" font-size="24" fill="#1B5E20" font-weight="bold">……</text>
  <text x="700" y="192" text-anchor="middle" font-size="14" fill="#78909C" font-style="italic">grande péninsule d'Asie ?</text>
  <g transform="translate(520 400) scale(1.5) translate(-50 -100)"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2" stroke-linejoin="round"/></g>
  <text x="520" y="420" text-anchor="middle" font-size="26" fill="#C00000" font-weight="bold">……</text>
  <text x="520" y="444" text-anchor="middle" font-size="15" fill="#78909C" font-style="italic">la grande île ?</text>
  
  <circle cx="452" cy="268" r="19" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/>
  <text x="452" y="276" text-anchor="middle" font-size="23" font-weight="bold" fill="#37474F">1</text>
  
  <circle cx="474" cy="300" r="19" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/>
  <text x="474" y="308" text-anchor="middle" font-size="23" font-weight="bold" fill="#37474F">2</text>
  
  <circle cx="640" cy="320" r="19" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/>
  <text x="640" y="328" text-anchor="middle" font-size="23" font-weight="bold" fill="#37474F">3</text>
  
  <circle cx="596" cy="496" r="19" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/>
  <text x="596" y="504" text-anchor="middle" font-size="23" font-weight="bold" fill="#37474F">4</text>
  
  <circle cx="618" cy="522" r="19" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/>
  <text x="618" y="530" text-anchor="middle" font-size="23" font-weight="bold" fill="#37474F">5</text>
  <text x="390" y="130" text-anchor="middle" font-size="24" fill="#0277BD" font-weight="bold" font-style="italic">océan ……</text>
  <text x="880" y="130" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">les cinq îles voisines :</text>
  <text x="880" y="162" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">1. les Comores — 2. Mayotte</text>
  <text x="880" y="190" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">3. les Seychelles — 4. Maurice</text>
  <text x="880" y="218" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">5. La Réunion</text>
  <text x="550" y="630" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Écris le nom du continent, de l'océan, de la grande île et place les cinq îles voisines : laquelle est laquelle ?</text>
</svg>