<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">L'utilité du relief</text>
  <rect x="35" y="90" width="450" height="200" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 105 240 L 170 150 L 235 240 Z" fill="#A1887F" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/><path d="M 205 240 L 320 240 L 345 195 L 230 195 Z" fill="#C5E1A5" stroke="#558B2F" stroke-width="2"/><path d="M 248 240 q 6 -12 12 -18 q 6 6 12 18 Z" fill="#81C784"/><path d="M 272 226 q 6 -12 12 -18 q 6 6 12 18 Z" fill="#81C784"/><text x="260" y="124" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Pour l'agriculture</text><text x="260" y="248" text-anchor="middle" font-size="18" fill="#546E7A">plaines et vallées : rizières,</text><text x="260" y="272" text-anchor="middle" font-size="18" fill="#546E7A">plateaux : cultures et prairies</text>
  <rect x="535" y="90" width="450" height="200" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 620 245 L 680 160 L 740 245 Z" fill="#A1887F" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/><path d="M 640 248 Q 730 205 860 245" fill="none" stroke="#EF6C00" stroke-width="7" stroke-dasharray="16 10"/><rect x="850" y="216" width="40" height="20" rx="4" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><text x="760" y="124" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Pour le transport</text><text x="760" y="248" text-anchor="middle" font-size="18" fill="#546E7A">les vallées et les cols</text><text x="760" y="272" text-anchor="middle" font-size="18" fill="#546E7A">guident les routes</text>
  <rect x="35" y="315" width="450" height="200" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 145 470 L 190 400 L 235 470 Z" fill="#A1887F" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/><rect x="230" y="430" width="52" height="34" fill="#FFF3E0" stroke="#8D6E63" stroke-width="2"/><path d="M 230 430 L 256 412 L 282 430 Z" fill="#C00000"/><path d="M 310 470 q 0 -26 22 -26 q 22 0 22 26 Z" fill="#4FC3F7"/><text x="260" y="349" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Pour l'aménagement</text><text x="260" y="473" text-anchor="middle" font-size="18" fill="#546E7A">barrages dans les montagnes,</text><text x="260" y="497" text-anchor="middle" font-size="18" fill="#546E7A">villes sur les plateaux</text>
  <rect x="535" y="315" width="450" height="200" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 645 470 L 700 378 L 755 470 Z" fill="#8D6E63" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/><path d="M 745 470 L 745 430 M 738 430 h 14 M 738 448 h 14" stroke="#263238" stroke-width="3" fill="none"/><path d="M 780 470 h 46 v -22 h -46 Z" fill="#FF7043" stroke="#BF360C" stroke-width="2"/><text x="760" y="349" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Pour le tourisme</text><text x="760" y="473" text-anchor="middle" font-size="18" fill="#546E7A">paysages admirés des visiteurs :</text><text x="760" y="497" text-anchor="middle" font-size="18" fill="#546E7A">Isalo, Andringitra, Tsingy…</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Le relief n'est pas un obstacle : plaines, vallées et montagnes servent l'agriculture, les routes et le tourisme.</text>
</svg>