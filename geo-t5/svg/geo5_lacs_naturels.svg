<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les principaux lacs naturels</text>
  <rect x="40" y="90" width="530" height="420" rx="18" fill="#EAF4FB" stroke="#90A4AE" stroke-width="3"/>
  <g transform="translate(320 340) scale(2) translate(-50 -100)"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z" fill="#F1F8E9" stroke="#2E7D32" stroke-width="1.5" stroke-linejoin="round"/></g>
  <circle cx="346" cy="300" r="9" fill="#0288D1" stroke="#01579B" stroke-width="2"/>
  <circle cx="308" cy="330" r="7" fill="#0288D1" stroke="#01579B" stroke-width="2"/>
  <circle cx="280" cy="264" r="7" fill="#0288D1" stroke="#01579B" stroke-width="2"/>
  <circle cx="286" cy="494" r="7" fill="#0288D1" stroke="#01579B" stroke-width="2"/>
  <text x="372" y="288" text-anchor="start" font-size="20" fill="#263238" font-weight="bold">Alaotra</text>
  <text x="324" y="356" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Itasy</text>
  <text x="260" y="248" text-anchor="end" font-size="20" fill="#263238" font-weight="bold">Kinkony</text>
  <text x="260" y="484" text-anchor="end" font-size="17" fill="#263238" font-weight="bold">Tsimanampetsotsa</text>
  <rect x="610" y="120" width="350" height="350" rx="14" fill="#E1F5FE" stroke="#0277BD" stroke-width="3"/>
  <text x="785" y="155" text-anchor="middle" font-size="22" fill="#263238" font-weight="bold">À retenir</text>
  <text x="785" y="205" text-anchor="middle" font-size="21" fill="#263238">Le lac Alaotra est le plus grand</text>
  <text x="785" y="232" text-anchor="middle" font-size="21" fill="#263238">lac naturel de Madagascar :</text>
  <text x="785" y="259" text-anchor="middle" font-size="21" fill="#263238">le pays du riz et des lémuriens.</text>
  <text x="785" y="315" text-anchor="middle" font-size="21" fill="#263238">L'Itasy est un lac de volcan,</text>
  <text x="785" y="342" text-anchor="middle" font-size="21" fill="#263238">près d'Antananarivo.</text>
  <text x="785" y="398" text-anchor="middle" font-size="21" fill="#263238">Le Tsimanampetsotsa, au sud,</text>
  <text x="785" y="425" text-anchor="middle" font-size="21" fill="#263238">est un lac salé protégé.</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Un lac naturel est né sans l'intervention de l'homme : dans une dépression ou un ancien volcan.</text>
</svg>