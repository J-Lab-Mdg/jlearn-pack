<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les formes du relief malgache</text>
  <rect x="45" y="90" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 115 235 L 160 155 L 205 235 Z" fill="#A1887F" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/><path d="M 180 235 L 215 180 L 250 235 Z" fill="#A1887F" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/><path d="M 160 235 L 190 190 L 220 235 Z" fill="#BCAAA4" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/><text x="190" y="233" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Un massif</text><text x="190" y="255" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">un groupe de montagnes</text>
  <rect x="355" y="90" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 445 235 L 500 130 L 555 235 Z" fill="#A1887F" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/><path d="M 485 165 L 500 130 L 515 165 L 508 172 L 496 170 Z" fill="#FFFFFF"/><text x="500" y="233" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Une montagne</text><text x="500" y="255" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">un sommet élevé et pointu</text>
  <rect x="665" y="90" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 740 235 Q 810 175 880 235 Z" fill="#C5E1A5" stroke="#558B2F" stroke-width="2.5"/><text x="810" y="233" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Une colline</text><text x="810" y="255" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">une petite hauteur arrondie</text>
  <rect x="45" y="300" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 105 445 L 130 390 L 250 390 L 275 445 Z" fill="#D7CCA8" stroke="#8D6E63" stroke-width="2.5"/><text x="190" y="443" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Un plateau</text><text x="190" y="465" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">une étendue plate et élevée</text>
  <rect x="355" y="300" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><line x1="410" y1="445" x2="590" y2="445" stroke="#558B2F" stroke-width="3"/><rect x="457.9" y="429.6" width="4.199999999999999" height="15.399999999999999" fill="#795548"/><circle cx="460" cy="424" r="11.2" fill="#388E3C"/><rect x="520" y="415" width="34" height="30" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><text x="500" y="443" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Une plaine</text><text x="500" y="465" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">une étendue plate et basse</text>
  <rect x="665" y="300" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 730 445 L 790 380 L 850 445 Z" fill="#D7CCA8" stroke="#8D6E63" stroke-width="2.5"/><path d="M 890 445 L 830 380 L 790 445 Z" fill="#C5E1A5" stroke="#558B2F" stroke-width="2.5"/><path d="M 790 380 Q 810 415 830 445" fill="none" stroke="#4FC3F7" stroke-width="7"/><text x="810" y="443" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Une vallée</text><text x="810" y="465" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">creusée par une rivière</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Le relief de Madagascar offre toutes ces formes : massifs et montagnes, collines, plateaux, plaines et vallées.</text>
</svg>