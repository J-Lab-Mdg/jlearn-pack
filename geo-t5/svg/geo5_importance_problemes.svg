<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">L'importance et les problèmes des ressources</text>
  <text x="260" y="100" text-anchor="middle" font-size="23" fill="#1B5E20" font-weight="bold"> Elles font vivre le pays</text>
  <rect x="50" y="120" width="420" height="115" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 120 205 v -31.2" stroke="#558B2F" stroke-width="4.2"/><path d="M 120 188.2 q -19.2 -4.8 -24 -24 q 21.599999999999998 0 24 16.8 Z" fill="#66BB6A"/><path d="M 120 183.4 q 19.2 -4.8 24 -24 q -21.599999999999998 0 -24 16.8 Z" fill="#66BB6A"/><text x="260" y="175" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Nourrir les familles</text><text x="260" y="202" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">riz, poisson, viande, fruits</text>
  <rect x="50" y="250" width="420" height="115" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><rect x="150" y="320" width="46" height="30" rx="4" fill="#EF6C00" stroke="#BF360C" stroke-width="2"/><path d="M 165 320 L 165 322 M 181 320 L 181 322" stroke="#FFF" stroke-width="0"/><text x="150" y="315" text-anchor="middle" font-size="15" fill="#BF360C" font-weight="bold">export</text><text x="260" y="305" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Rapporter de l'argent</text><text x="260" y="332" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">vanille, girofle, litchis vendus au loin</text>
  <rect x="50" y="380" width="420" height="115" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><circle cx="140" cy="450" r="17" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><circle cx="172" cy="450" r="17" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><circle cx="156" cy="424" r="17" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/><text x="260" y="435" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Créer des emplois</text><text x="260" y="462" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">paysans, pêcheurs, mineurs, guides</text>
  <rect x="50" y="510" width="420" height="115" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 140 580 q -20 -14 -2 -22 M 140 560 q -20 -14 -2 -22 M 140 560 l 0 20" stroke="#F9A825" stroke-width="4" fill="none"/><text x="260" y="565" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Donner de l'énergie</text><text x="260" y="592" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">bois de chauffe, barrages</text>
  <text x="760" y="100" text-anchor="middle" font-size="23" fill="#C00000" font-weight="bold">Mais leur exploitation pose des problèmes</text>
  <rect x="550" y="120" width="420" height="115" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 640 190 L 660 140 L 678 190 Z" fill="#BF360C" opacity="0.75"/><path d="M 662 190 L 682 132 L 700 190 Z" fill="#D84315" opacity="0.75"/><text x="790" y="172" text-anchor="middle" font-size="16" fill="#5D4037" font-weight="bold"> coupe</text><text x="790" y="195" text-anchor="middle" font-size="16" fill="#5D4037" font-weight="bold"> abusive</text><text x="760" y="175" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Exploitation abusive</text><text x="760" y="202" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">bois précieux, surpêche, braconnage</text>
  <rect x="550" y="250" width="420" height="115" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 660 330 q 40 -12 75 0 Z" fill="#BF360C" opacity="0.6"/><path d="M 735 330 q 30 -30 60 -6 Z" fill="#D84315" opacity="0.6"/><line x1="645" y1="330" x2="830" y2="330" stroke="#8D6E63" stroke-width="4"/><text x="760" y="305" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Érosion et pollution</text><text x="760" y="332" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">lavaka, rivières boueuses, mines sales</text>
  <rect x="550" y="380" width="420" height="115" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><g><path d="M 700 430.8 L 716.8 445.2 L 700 469.2 L 683.2 445.2 Z" fill="#7E57C2" stroke="#4527A0" stroke-width="2"/><path d="M 700 430.8 L 700 469.2 M 683.2 445.2 L 716.8 445.2" stroke="#4527A0" stroke-width="1.5"/></g><text x="790" y="445" text-anchor="middle" font-size="16" fill="#5D4037" font-weight="bold"> épuisé</text><text x="790" y="468" text-anchor="middle" font-size="16" fill="#5D4037" font-weight="bold">un jour ?</text><text x="760" y="435" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Épuisement</text><text x="760" y="462" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">les minerais ne repoussent pas</text>
  <rect x="550" y="510" width="420" height="115" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><circle cx="700" cy="575" r="20" fill="none" stroke="#C00000" stroke-width="4"/><line x1="686" y1="561" x2="714" y2="589" stroke="#C00000" stroke-width="4"/><text x="790" y="570" text-anchor="middle" font-size="16" fill="#5D4037" font-weight="bold">disparaissent</text><text x="790" y="593" text-anchor="middle" font-size="16" fill="#5D4037" font-weight="bold">(lémuriens, tortues)</text><text x="760" y="565" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Animaux menacés</text><text x="760" y="592" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">braconnage et perte des forêts</text>
  <text x="500" y="680" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Les ressources font vivre Madagascar, mais une exploitation sans règle les détruit : prudence !</text>
</svg>