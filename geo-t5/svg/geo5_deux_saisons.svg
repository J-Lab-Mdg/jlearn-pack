<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les deux saisons à Madagascar</text>
  <rect x="40" y="90" width="440" height="400" rx="18" fill="#E1F5FE" stroke="#90A4AE" stroke-width="3"/>
  <g fill="#ECEFF1"><ellipse cx="260" cy="200" rx="64" ry="28.8"/><circle cx="228" cy="184" r="22.400000000000002"/><circle cx="279.2" cy="177.6" r="27.200000000000003"/></g><line x1="221.6" y1="232" x2="212" y2="270.4" stroke="#4FC3F7" stroke-width="5.6000000000000005" stroke-linecap="round"/><line x1="247.2" y1="232" x2="237.6" y2="270.4" stroke="#4FC3F7" stroke-width="5.6000000000000005" stroke-linecap="round"/><line x1="272.8" y1="232" x2="263.2" y2="270.4" stroke="#4FC3F7" stroke-width="5.6000000000000005" stroke-linecap="round"/><line x1="298.4" y1="232" x2="288.8" y2="270.4" stroke="#4FC3F7" stroke-width="5.6000000000000005" stroke-linecap="round"/>
  <circle cx="170" cy="260" r="30" fill="#FFD54F" stroke="#F9A825" stroke-width="3"/><line x1="205" y1="260" x2="218" y2="260" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="194.74873734152916" y1="284.74873734152914" x2="203.94112549695427" y2="293.94112549695427" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="170" y1="295" x2="170" y2="308" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="145.25126265847084" y1="284.74873734152914" x2="136.05887450304573" y2="293.94112549695427" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="135" y1="260" x2="122" y2="260" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="145.25126265847084" y1="235.25126265847084" x2="136.05887450304573" y2="226.05887450304573" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="170" y1="225" x2="170" y2="212" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="194.74873734152916" y1="235.25126265847084" x2="203.94112549695427" y2="226.05887450304573" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/>
  <text x="260" y="330" text-anchor="middle" font-size="23" fill="#01579B" font-weight="bold">La saison chaude</text>
  <text x="260" y="358" text-anchor="middle" font-size="23" fill="#01579B" font-weight="bold">et pluvieuse</text>
  <text x="260" y="405" text-anchor="middle" font-size="20" fill="#546E7A" font-style="italic">novembre à avril</text>
  <text x="260" y="445" text-anchor="middle" font-size="19" fill="#263238">grosses averses, chaleur,</text>
  <text x="260" y="470" text-anchor="middle" font-size="19" fill="#263238">cyclones parfois</text>
  <rect x="520" y="90" width="440" height="400" rx="18" fill="#FFFDE7" stroke="#90A4AE" stroke-width="3"/>
  <g fill="#ECEFF1"><ellipse cx="740" cy="190" rx="60" ry="27"/><circle cx="710" cy="175" r="21"/><circle cx="758" cy="169" r="25.5"/></g>
  <text x="740" y="300" text-anchor="middle" font-size="23" fill="#795548" font-weight="bold">La saison fraîche</text>
  <text x="740" y="328" text-anchor="middle" font-size="23" fill="#795548" font-weight="bold">et sèche</text>
  <text x="740" y="375" text-anchor="middle" font-size="20" fill="#546E7A" font-style="italic">mai à octobre</text>
  <text x="740" y="415" text-anchor="middle" font-size="19" fill="#263238">ciel dégagé, peu de pluie,</text>
  <text x="740" y="440" text-anchor="middle" font-size="19" fill="#263238">nuits fraîches sur les Hautes Terres</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">À Madagascar, l'année ne compte que deux saisons : une saison chaude et pluvieuse, une saison fraîche et sèche.</text>
</svg>