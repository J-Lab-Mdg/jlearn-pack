<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Région naturelle : le Nord</text>
  <rect x="40" y="90" width="520" height="420" rx="18" fill="#EAF4FB" stroke="#90A4AE" stroke-width="3"/>
  <g transform="translate(300 330) scale(1.95) translate(-50 -100)"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z" fill="#F1F8E9" stroke="#2E7D32" stroke-width="1.5384615384615385" stroke-linejoin="round"/></g>
  <defs><clipPath id="zrnord"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z"/></clipPath></defs><g clip-path="url(#zrnord)" transform="translate(300 330) scale(1.95) translate(-50 -100)"><rect x="0" y="0" width="100" height="48" fill="#4DD0E1" opacity="0.85"/></g>
  <text x="300" y="193.5" text-anchor="middle" font-size="21" fill="#263238" font-weight="bold">le Nord</text>
  <text x="298.05" y="322.2" text-anchor="middle" font-size="16" fill="#263238">★</text>
  <rect x="600" y="157" width="360" height="70" rx="10" fill="#FDFBF3" stroke="#90A4AE" stroke-width="2"/><text x="618" y="183" text-anchor="start" font-size="19" fill="#1E7B34" font-weight="bold">Relief</text><text x="618" y="207" text-anchor="start" font-size="16" fill="#546E7A">montagnes (Tsaratanana),</text><text x="618" y="227" text-anchor="start" font-size="16" fill="#546E7A">plaines côtières</text><rect x="600" y="239" width="360" height="70" rx="10" fill="#FDFBF3" stroke="#90A4AE" stroke-width="2"/><text x="618" y="265" text-anchor="start" font-size="19" fill="#1E7B34" font-weight="bold">Climat</text><text x="618" y="289" text-anchor="start" font-size="16" fill="#546E7A">variable selon l'altitude</text><rect x="600" y="321" width="360" height="70" rx="10" fill="#FDFBF3" stroke="#90A4AE" stroke-width="2"/><text x="618" y="347" text-anchor="start" font-size="19" fill="#1E7B34" font-weight="bold">Végétation</text><text x="618" y="371" text-anchor="start" font-size="16" fill="#546E7A">forêts, mangroves</text><rect x="600" y="403" width="360" height="70" rx="10" fill="#FDFBF3" stroke="#90A4AE" stroke-width="2"/><text x="618" y="429" text-anchor="start" font-size="19" fill="#1E7B34" font-weight="bold">Activités</text><text x="618" y="453" text-anchor="start" font-size="16" fill="#546E7A">cacao, vanille, canne à sucre,</text><text x="618" y="473" text-anchor="start" font-size="16" fill="#546E7A">tourisme (Nosy Be)</text>
  <text x="500" y="550" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Une région naturelle : une portion de l'île où le relief, le climat, la végétation et les activités se ressemblent.</text>
</svg>