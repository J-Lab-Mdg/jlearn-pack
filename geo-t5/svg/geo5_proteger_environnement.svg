<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Protéger l'environnement rural et urbain</text>
  <text x="500" y="85" text-anchor="middle" font-size="22" fill="#1B5E20" font-weight="bold">À la campagne</text>
  <rect x="45" y="105" width="290" height="190" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><rect x="156.7" y="235.8" width="6.6000000000000005" height="24.200000000000003" fill="#795548"/><circle cx="160" cy="227" r="17.6" fill="#388E3C"/><rect x="217.6" y="244.4" width="4.800000000000001" height="17.6" fill="#795548"/><circle cx="220" cy="238" r="12.8" fill="#2E7D32"/><path d="M 130 272 v 14 M 250 274 v 12" stroke="#558B2F" stroke-width="3"/><text x="190" y="261" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Reboiser les collines</text><text x="190" y="283" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">et interdire les feux</text>
  <rect x="355" y="105" width="290" height="190" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><path d="M 410 265 q 75 -15.400000000000002 150 0 Z" fill="#81C784" stroke="#558B2F" stroke-width="2"/><path d="M 418 263 v -11" stroke="#2E7D32" stroke-width="2.2"/><path d="M 443 263 v -11" stroke="#2E7D32" stroke-width="2.2"/><path d="M 468 263 v -11" stroke="#2E7D32" stroke-width="2.2"/><path d="M 493 263 v -11" stroke="#2E7D32" stroke-width="2.2"/><path d="M 518 263 v -11" stroke="#2E7D32" stroke-width="2.2"/><path d="M 445 268 v -12 M 500 270 v -12 M 555 268 v -12" stroke="#2E7D32" stroke-width="3"/><text x="500" y="261" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Entretenir les rizières</text><text x="500" y="283" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">curer les canaux, semer droit</text>
  <rect x="665" y="105" width="290" height="190" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><path d="M 760 270 q 25 -30 55 -6 q 20 18 -5 26 q -30 8 -50 -20 Z" fill="#4FC3F7" opacity="0.7"/><path d="M 775 258 q 10 -8 22 0 M 782 268 q 8 -6 16 0" stroke="#0277BD" stroke-width="3" fill="none"/><text x="810" y="261" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Protéger les rivières</text><text x="810" y="283" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">pas de lavage des bidons</text>
  <text x="500" y="330" text-anchor="middle" font-size="22" fill="#0D47A1" font-weight="bold">En ville</text>
  <rect x="45" y="350" width="290" height="190" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><g><rect x="146" y="482" width="28" height="26" rx="3" fill="#78909C" stroke="#37474F" stroke-width="2"/><rect x="142" y="476" width="36" height="6" rx="3" fill="#546E7A" stroke="#37474F" stroke-width="2"/><line x1="154" y1="488" x2="154" y2="504" stroke="#37474F" stroke-width="2"/><line x1="166" y1="488" x2="166" y2="504" stroke="#37474F" stroke-width="2"/></g><rect x="200" y="478" width="22" height="22" rx="3" fill="#66BB6A"/><rect x="226" y="478" width="22" height="22" rx="3" fill="#FFCC80"/><text x="190" y="520" text-anchor="middle" font-size="15" fill="#546E7A" font-weight="bold">trier</text><text x="190" y="506" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Trier les déchets</text><text x="190" y="528" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">recycler ce qui peut servir</text>
  <rect x="355" y="350" width="290" height="190" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><rect x="467" y="483" width="6" height="22" fill="#795548"/><circle cx="470" cy="475" r="16" fill="#388E3C"/><rect x="527.6" y="487.4" width="4.800000000000001" height="17.6" fill="#795548"/><circle cx="530" cy="481" r="12.8" fill="#2E7D32"/><path d="M 440 515 h 120" stroke="#558B2F" stroke-width="4"/><text x="500" y="506" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Planter des arbres</text><text x="500" y="528" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">des rues ombragées et propres</text>
  <rect x="665" y="350" width="290" height="190" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><g><rect x="749.2" y="488.8" width="41.6" height="9.600000000000001" rx="5" fill="#66BB6A" stroke="#1565C0" stroke-width="2"/><path d="M 758.8 488.8 L 765.2 480.8 L 778 480.8 L 782.8 488.8 Z" fill="#66BB6A" stroke="#1565C0" stroke-width="2"/><circle cx="758.8" cy="499.2" r="4.800000000000001" fill="#37474F"/><circle cx="781.2" cy="499.2" r="4.800000000000001" fill="#37474F"/></g><path d="M 830 470 q 20 -12 40 0" fill="none" stroke="#90CAF9" stroke-width="4"/><text x="800" y="440" text-anchor="middle" font-size="15" fill="#546E7A" font-weight="bold">moins de fumée</text><text x="810" y="506" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Moins polluer</text><text x="810" y="528" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">transports propres, moins de fumées</text>
  <text x="500" y="620" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Campagne ou ville, le même devoir : garder l'air, l'eau et la terre propres pour demain.</text>
</svg>