<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les zones climatiques (2) : la Côte Ouest et le Sud-Ouest</text>
  <rect x="40" y="90" width="530" height="420" rx="18" fill="#EAF4FB" stroke="#90A4AE" stroke-width="3"/>
  <g transform="translate(320 340) scale(2) translate(-50 -100)"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z" fill="#F1F8E9" stroke="#2E7D32" stroke-width="1.5" stroke-linejoin="round"/></g>
  <defs><clipPath id="z35"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z"/></clipPath></defs><g clip-path="url(#z35)" transform="translate(320 340) scale(2) translate(-50 -100)">
    <rect x="0" y="45" width="30" height="110" fill="#FFF176" opacity="0.9"/>
    <path d="M 15 140 L 100 155 L 100 200 L 15 185 Z" fill="#FF8A65" opacity="0.85"/></g>
  <text x="256" y="320" text-anchor="end" font-size="19" fill="#263238" font-weight="bold">Côte</text>
  <text x="256" y="356" text-anchor="end" font-size="19" fill="#263238" font-weight="bold">Ouest</text>
  <text x="330" y="484" text-anchor="middle" font-size="20" fill="#BF360C" font-weight="bold">Sud-Ouest</text>
  <text x="330" y="520" text-anchor="middle" font-size="17" fill="#BF360C">très sec</text>
  <rect x="610" y="130" width="350" height="330" rx="14" fill="#FFFDE7" stroke="#F9A825" stroke-width="3"/>
  <text x="785" y="165" text-anchor="middle" font-size="22" fill="#263238" font-weight="bold">Légende</text>
  <rect x="640" y="195" width="26" height="16" fill="#FFF176"/><text x="680" y="208" text-anchor="start" font-size="19" fill="#263238">climat sec : une longue</text>
  <text x="680" y="232" text-anchor="start" font-size="19" fill="#263238">saison sèche (Côte Ouest)</text>
  <rect x="640" y="262" width="26" height="16" fill="#FF8A65"/><text x="680" y="275" text-anchor="start" font-size="19" fill="#263238">climat très sec : semi-aride,</text>
  <text x="680" y="299" text-anchor="start" font-size="19" fill="#263238">grand Sud et Sud-Ouest</text>
  <text x="785" y="355" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">À l'ouest, il pleut moins ;</text>
  <text x="785" y="382" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">au sud-ouest (Toliara),</text>
  <text x="785" y="409" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">la sécheresse dure presque</text>
  <text x="785" y="436" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">toute l'année.</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">De la côte ouest au grand sud, les pluies diminuent : c'est le domaine des baobabs et des épineux.</text>
</svg>