<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Les activités en milieu rural : les trois secteurs</text>
  <rect x="30" y="90" width="320" height="420" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 150 280 v -41.6" stroke="#558B2F" stroke-width="5.6000000000000005"/><path d="M 150 257.6 q -25.6 -6.4 -32 -32 q 28.8 0 32 22.400000000000002 Z" fill="#66BB6A"/><path d="M 150 251.2 q 25.6 -6.4 32 -32 q -28.8 0 -32 22.400000000000002 Z" fill="#66BB6A"/><g><ellipse cx="240" cy="286" rx="20" ry="11" fill="#8D6E63" stroke="#5D4037" stroke-width="1.5"/><circle cx="260" cy="280" r="6" fill="#8D6E63" stroke="#5D4037" stroke-width="1.5"/><path d="M 255 275 q -4 -7 -8 -2 M 265 275 q 4 -7 8 -2" fill="none" stroke="#5D4037" stroke-width="2"/><line x1="228" y1="295" x2="228" y2="300" stroke="#5D4037" stroke-width="2.5"/><line x1="252" y1="295" x2="252" y2="300" stroke="#5D4037" stroke-width="2.5"/><line x1="236" y1="295" x2="236" y2="300" stroke="#5D4037" stroke-width="2.5"/><line x1="244" y1="295" x2="244" y2="300" stroke="#5D4037" stroke-width="2.5"/></g><path d="M 110 350 q 30 -12 65 0" fill="none" stroke="#4FC3F7" stroke-width="6"/><text x="190" y="130" text-anchor="middle" font-size="21" fill="#2E7D32" font-weight="bold">1. Le secteur primaire</text><text x="190" y="400" text-anchor="middle" font-size="18" fill="#546E7A">produire les matières</text><text x="190" y="430" text-anchor="middle" font-size="18" fill="#546E7A">premières :</text><text x="190" y="460" text-anchor="middle" font-size="18" fill="#546E7A">agriculture, élevage,</text><text x="190" y="490" text-anchor="middle" font-size="18" fill="#546E7A">pêche, forêt</text>
  <rect x="340" y="90" width="320" height="420" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><rect x="440" y="310" width="34" height="30" fill="#EF6C00" stroke="#BF360C" stroke-width="2"/><rect x="482" y="310" width="34" height="30" fill="#FFB74D" stroke="#BF360C" stroke-width="2"/><rect x="460" y="230" width="60" height="50" rx="6" fill="#BCAAA4" stroke="#5D4037" stroke-width="2"/><text x="500" y="355" text-anchor="middle" font-size="15" fill="#8D6E63" font-style="italic">atelier de tissage</text><text x="500" y="130" text-anchor="middle" font-size="21" fill="#E65100" font-weight="bold">2. Le secteur secondaire</text><text x="500" y="400" text-anchor="middle" font-size="18" fill="#546E7A">transformer les matières</text><text x="500" y="430" text-anchor="middle" font-size="18" fill="#546E7A">premières :</text><text x="500" y="460" text-anchor="middle" font-size="18" fill="#546E7A">artisanat, moulins à riz,</text><text x="500" y="490" text-anchor="middle" font-size="18" fill="#546E7A">briques, huile, savon</text>
  <rect x="650" y="90" width="320" height="420" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><g><rect x="744" y="261.8" width="52" height="36.4" rx="3" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/><line x1="770" y1="261.8" x2="770" y2="298.2" stroke="#0D47A1" stroke-width="2"/><line x1="751.8" y1="272.2" x2="762.2" y2="272.2" stroke="#FFF" stroke-width="2"/><line x1="777.8" y1="272.2" x2="788.2" y2="272.2" stroke="#FFF" stroke-width="2"/></g><rect x="810" y="250" width="70" height="50" rx="6" fill="#FFF3E0" stroke="#8D6E63" stroke-width="2"/><text x="845" y="280" text-anchor="middle" font-size="15" fill="#8D6E63" font-weight="bold">bureau</text><rect x="850.1" y="320.1" width="19.8" height="19.8" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="3"/><rect x="853.95" y="328.35" width="12.100000000000001" height="3.3000000000000003" fill="#C62828"/><rect x="858.35" y="323.95" width="3.3000000000000003" height="12.100000000000001" fill="#C62828"/><text x="810" y="130" text-anchor="middle" font-size="21" fill="#1565C0" font-weight="bold">3. Le secteur tertiaire</text><text x="810" y="400" text-anchor="middle" font-size="18" fill="#546E7A">rendre des services :</text><text x="810" y="430" text-anchor="middle" font-size="18" fill="#546E7A">instituteur, infirmier,</text><text x="810" y="460" text-anchor="middle" font-size="18" fill="#546E7A">marchands, transport,</text><text x="810" y="490" text-anchor="middle" font-size="18" fill="#546E7A">coiffeurs, agents</text>
  <text x="500" y="555" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Produire, transformer, servir : les trois familles de métiers se trouvent aussi à la campagne.</text>
</svg>