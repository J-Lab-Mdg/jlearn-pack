<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">L'utilité de la végétation</text>
  <rect x="25" y="90" width="350" height="210" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><path d="M 200 200 v -38" stroke="#558B2F" stroke-width="4"/><path d="M 200 168 q -16 -4 -22 -18 q 16 -2 22 10 q 6 -12 22 -10 q -6 14 -22 18" fill="#66BB6A"/><text x="200" y="276" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Nourrir : les cultures</text><text x="200" y="178" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">vanille, café, riz, fruits</text>
  <rect x="325" y="90" width="350" height="210" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><rect x="496.1" y="176.4" width="7.800000000000001" height="28.6" fill="#795548"/><circle cx="500" cy="166" r="20.8" fill="#388E3C"/><circle cx="545" cy="150" r="16" fill="#E1F5FE" stroke="#0277BD" stroke-width="2"/><text x="545" y="156" text-anchor="middle" font-size="15" fill="#0277BD" font-weight="bold">O₂</text><text x="500" y="276" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Protéger l'environnement</text><text x="500" y="178" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">l'arbre donne l'oxygène</text><text x="500" y="200" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">et retient la terre</text>
  <rect x="625" y="90" width="350" height="210" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><ellipse cx="800" cy="196" rx="16" ry="22" fill="#8D6E63"/><circle cx="800" cy="168" r="11" fill="#A1887F"/><circle cx="797" cy="165" r="2" fill="#263238"/><circle cx="804" cy="165" r="2" fill="#263238"/><path d="M 786 204 q -16 6 -12 26 q 10 -6 14 -14" fill="none" stroke="#8D6E63" stroke-width="7" stroke-linecap="round"/><text x="800" y="276" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Abriter la biodiversité</text><text x="800" y="178" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">les forêts abritent</text><text x="800" y="200" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">lémuriens et caméléons</text>
  <rect x="25" y="325" width="350" height="210" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><rect x="160" y="185" width="80" height="18" rx="6" fill="#A1887F" stroke="#5D4037" stroke-width="2"/><rect x="160" y="167" width="80" height="18" rx="6" fill="#BCAAA4" stroke="#5D4037" stroke-width="2"/><text x="200" y="511" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Fournir des ressources</text><text x="200" y="413" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">bois, bambou, plantes</text><text x="200" y="435" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">médicinales</text>
  <rect x="325" y="325" width="350" height="210" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><path d="M 450 210 h 100" stroke="#4FC3F7" stroke-width="5"/><path d="M 468 210 l 24 0 l -6 14 l -12 0 Z" fill="#8D6E63"/><rect x="530" y="192" width="26" height="18" fill="#EF6C00" stroke="#BF360C" stroke-width="2"/><text x="543" y="181" text-anchor="middle" font-size="14" fill="#BF360C" font-weight="bold">export</text><text x="500" y="511" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Faire vivre l'économie</text><text x="500" y="413" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">girofle, vanille, litchis</text><text x="500" y="435" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">vendus dans le monde</text>
  <rect x="625" y="325" width="350" height="210" rx="18" fill="#E8F5E9" stroke="#90A4AE" stroke-width="3"/><path d="M 800 220 v -34" stroke="#558B2F" stroke-width="4"/><circle cx="800" cy="172" r="26" fill="#66BB6A"/><path d="M 750 220 h 100" stroke="#8D6E63" stroke-width="4"/><text x="800" y="511" text-anchor="middle" font-size="20" fill="#1B5E20" font-weight="bold">Ombrer et nourrir le sol</text><text x="800" y="413" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">les feuilles mortes</text><text x="800" y="435" text-anchor="middle" font-size="16" fill="#546E7A" font-style="italic">enrichissent la terre</text>
  <text x="500" y="600" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">La végétation nourrit, protège, abrite les animaux et fait vivre l'économie malgache.</text>
</svg>