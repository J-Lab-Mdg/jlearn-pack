  <text x="275" y="480" text-anchor="middle" font-size="18" fill="#546E7A" font-style="italic">du fleuve</text>
  <g transform="translate(660 330) scale(1.9) translate(-50 -100)"><path d="M 58 2 L 71 16 L 79 42 L 75 60 L 80 92 L 78 126 L 71 156 L 61 178 L 52 197 L 41 174 L 32 148 L 25 118 L 20 88 L 21 60 L 24 38 L 34 16 L 47 5 Z" fill="#F1F8E9" stroke="#2E7D32" stroke-width="1.5789473684210527" stroke-linejoin="round"/></g>
