  <text x="694.2" y="330" text-anchor="start" font-size="19" fill="#263238" font-weight="bold">Tsiazompaniry</text>
  <text x="656.2" y="303.4" text-anchor="middle" font-size="17" fill="#263238">★</text>
  <text x="660" y="150" text-anchor="middle" font-size="20" fill="#C00000" font-weight="bold">Près d'Antananarivo</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Mantasoa et Tsiazompaniry sont des lacs de barrage : l'homme a construit un mur pour retenir l'eau.</text>
