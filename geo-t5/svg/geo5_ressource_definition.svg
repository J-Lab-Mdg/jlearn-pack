<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Qu'est-ce qu'une ressource naturelle ?</text>
  <rect x="250" y="70" width="500" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
  <text x="500" y="105" text-anchor="middle" font-size="23" fill="#1B5E20" font-weight="bold">Une richesse que la nature nous offre</text>
  <rect x="45" y="140" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 105 300 q 35 -14 80 0 q 35 12 75 -4" fill="none" stroke="#4FC3F7" stroke-width="9"/><g><ellipse cx="215" cy="270" rx="16" ry="9" fill="#4FC3F7" stroke="#0277BD" stroke-width="1.5"/><path d="M 229 270 l 10 -7 l 0 14 Z" fill="#4FC3F7" stroke="#0277BD" stroke-width="1.5"/><circle cx="207" cy="268" r="1.8" fill="#263238"/></g><text x="190" y="283" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">L'eau des rivières</text><text x="190" y="306" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">boire, irriguer, pêcher</text>
  <rect x="355" y="140" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><rect x="465.8" y="269.2" width="8.399999999999999" height="30.799999999999997" fill="#795548"/><circle cx="470" cy="258" r="22.4" fill="#388E3C"/><rect x="541.7" y="277.8" width="6.6000000000000005" height="24.200000000000003" fill="#795548"/><circle cx="545" cy="269" r="17.6" fill="#2E7D32"/><text x="500" y="283" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">La forêt</text><text x="500" y="306" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">bois, fruits, médicaments</text>
  <rect x="665" y="140" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><path d="M 770 305 h 80" stroke="#8D6E63" stroke-width="4"/><path d="M 790 305 q 3 -18 12 -24 q 10 8 12 24 Z" fill="#81C784" stroke="#558B2F" stroke-width="2"/><text x="810" y="283" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">La terre et le sol</text><text x="810" y="306" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">cultiver le riz et le maïs</text>
  <rect x="45" y="345" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><g><ellipse cx="190" cy="486.8" rx="26" ry="14.3" fill="#8D6E63" stroke="#5D4037" stroke-width="1.5"/><circle cx="216" cy="479" r="7.800000000000001" fill="#8D6E63" stroke="#5D4037" stroke-width="1.5"/><path d="M 209.5 472.5 q -5.2 -9.1 -10.4 -2.6 M 222.5 472.5 q 5.2 -9.1 10.4 -2.6" fill="none" stroke="#5D4037" stroke-width="2.6"/><line x1="174.4" y1="498.5" x2="174.4" y2="505" stroke="#5D4037" stroke-width="3.25"/><line x1="205.6" y1="498.5" x2="205.6" y2="505" stroke="#5D4037" stroke-width="3.25"/><line x1="184.8" y1="498.5" x2="184.8" y2="505" stroke="#5D4037" stroke-width="3.25"/><line x1="195.2" y1="498.5" x2="195.2" y2="505" stroke="#5D4037" stroke-width="3.25"/></g><text x="190" y="488" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Les animaux</text><text x="190" y="511" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">viande, lait, travail</text>
  <rect x="355" y="345" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><g><path d="M 470 439.2 L 488.2 454.8 L 470 480.8 L 451.8 454.8 Z" fill="#7E57C2" stroke="#4527A0" stroke-width="2"/><path d="M 470 439.2 L 470 480.8 M 451.8 454.8 L 488.2 454.8" stroke="#4527A0" stroke-width="1.5"/></g><line x1="545" y1="481" x2="545" y2="517" stroke="#795548" stroke-width="4"/><path d="M 525 485 q 20 -12 40 0" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round"/><text x="500" y="488" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Les minerais</text><text x="500" y="511" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">chromite, nickel, saphirs</text>
  <rect x="665" y="345" width="290" height="175" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/><circle cx="810" cy="455" r="40" fill="#FFD54F" stroke="#F9A825" stroke-width="3"/><line x1="855" y1="455" x2="868" y2="455" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="841.8198051533947" y1="486.8198051533946" x2="851.0121933088197" y2="496.01219330881975" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="810" y1="500" x2="810" y2="513" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="778.1801948466053" y1="486.81980515339467" x2="768.9878066911803" y2="496.01219330881975" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="765" y1="455" x2="752" y2="455" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="778.1801948466053" y1="423.1801948466054" x2="768.9878066911803" y2="413.98780669118025" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="810" y1="410" x2="810" y2="397" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><line x1="841.8198051533947" y1="423.18019484660533" x2="851.0121933088197" y2="413.98780669118025" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/><text x="810" y="488" text-anchor="middle" font-size="22" fill="#1E7B34" font-weight="bold">Le soleil et le vent</text><text x="810" y="511" text-anchor="middle" font-size="17" fill="#546E7A" font-style="italic">chaleur et énergie</text>
  <text x="500" y="640" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Une ressource naturelle : une richesse que la nature offre et que l'homme utilise pour vivre.</text>
</svg>