  <text x="264" y="244" text-anchor="end" font-size="18" fill="#263238" font-weight="bold">Marovoay</text>
  <text x="318" y="304" text-anchor="middle" font-size="17" fill="#263238" font-weight="bold">Betsimitatatra</text>
  <text x="268" y="280" text-anchor="end" font-size="17" fill="#795548" font-weight="bold">Tampoketsa</text>
