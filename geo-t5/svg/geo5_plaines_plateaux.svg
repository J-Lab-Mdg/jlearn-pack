  <text x="785" y="160" text-anchor="middle" font-size="22" fill="#263238" font-weight="bold">Légende</text>
  <ellipse cx="645" cy="200" rx="16" ry="10" fill="#A5D6A7" stroke="#558B2F" stroke-width="2"/><text x="665" y="207" text-anchor="start" font-size="19" fill="#263238">une plaine : étendue plate</text>
  <text x="665" y="231" text-anchor="start" font-size="19" fill="#263238">et basse, riche pour la riziculture</text>
  <ellipse cx="645" cy="272" rx="16" ry="10" fill="#D7CCA8" stroke="#8D6E63" stroke-width="2"/><text x="665" y="279" text-anchor="start" font-size="19" fill="#263238">un plateau : étendue plate</text>
  <text x="665" y="303" text-anchor="start" font-size="19" fill="#263238">et élevée, souvent herbeux</text>
  <text x="785" y="360" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Plaines : Marovoay, Alaotra,</text>
  <text x="785" y="387" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Betsimitatatra (Autour de Tana)</text>
  <text x="785" y="434" text-anchor="middle" font-size="20" fill="#263238" font-weight="bold">Plateaux : Tampoketsa, Ihorombe</text>
  <text x="500" y="540" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Les plaines humides nourrissent le riz ; les plateaux herbeux portent les prairies et le bétail.</text>
