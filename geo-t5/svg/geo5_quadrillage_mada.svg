<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Georgia, 'Times New Roman', serif"><text x="500" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E7B34">Tracer la carte de Madagascar (1) : le quadrillage</text>
  <rect x="30" y="60" width="940" height="600" rx="18" fill="#FDFBF3" stroke="#90A4AE" stroke-width="3"/>
  <line x1="345" y1="110" x2="345" y2="650" stroke="#37474F" stroke-width="2.5"/><line x1="435" y1="110" x2="435" y2="650" stroke="#37474F" stroke-width="2.5"/><line x1="525" y1="110" x2="525" y2="650" stroke="#37474F" stroke-width="2.5"/><line x1="615" y1="110" x2="615" y2="650" stroke="#37474F" stroke-width="2.5"/><line x1="345" y1="110" x2="615" y2="110" stroke="#37474F" stroke-width="2.5"/><line x1="345" y1="200" x2="615" y2="200" stroke="#37474F" stroke-width="2.5"/><line x1="345" y1="290" x2="615" y2="290" stroke="#37474F" stroke-width="2.5"/><line x1="345" y1="380" x2="615" y2="380" stroke="#37474F" stroke-width="2.5"/><line x1="345" y1="470" x2="615" y2="470" stroke="#37474F" stroke-width="2.5"/><line x1="345" y1="560" x2="615" y2="560" stroke="#37474F" stroke-width="2.5"/><line x1="345" y1="650" x2="615" y2="650" stroke="#37474F" stroke-width="2.5"/><text x="322" y="165" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">1</text><text x="322" y="255" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">2</text><text x="322" y="345" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">3</text><text x="322" y="435" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">4</text><text x="322" y="525" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">5</text><text x="322" y="615" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">6</text><text x="390" y="100" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">A</text><text x="480" y="100" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">B</text><text x="570" y="100" text-anchor="middle" font-size="20" fill="#37474F" font-weight="bold">C</text>
  <line x1="345" y1="78" x2="615" y2="78" stroke="#C00000" stroke-width="3"/>
  <text x="480" y="70" text-anchor="middle" font-size="20" fill="#C00000" font-weight="bold">9 cm</text>
  <line x1="630" y1="110" x2="630" y2="650" stroke="#C00000" stroke-width="3"/>
  <text x="644" y="384" text-anchor="start" font-size="20" fill="#C00000" font-weight="bold">18 cm</text>
  <text x="835" y="150" text-anchor="middle" font-size="23" fill="#1B5E20" font-weight="bold">Pour bien tracer la carte :</text>
  <text x="710" y="195" text-anchor="start" font-size="21" fill="#263238">Matériel : une feuille blanche,</text><text x="710" y="222" text-anchor="start" font-size="21" fill="#263238">un crayon, une règle graduée</text><text x="710" y="249" text-anchor="start" font-size="21" fill="#263238">et une gomme.</text>
  <text x="710" y="295" text-anchor="start" font-size="21" fill="#263238">Étape 1 : trace un rectangle</text><text x="710" y="322" text-anchor="start" font-size="21" fill="#263238">de 9 cm de large et 18 cm de haut.</text>
  <text x="710" y="365" text-anchor="start" font-size="21" fill="#263238">Étape 2 : partage le rectangle</text><text x="710" y="392" text-anchor="start" font-size="21" fill="#263238">en carrés de 3 cm de côté.</text>
  <text x="710" y="435" text-anchor="start" font-size="21" fill="#263238">Étape 3 : écris les lettres</text><text x="710" y="462" text-anchor="start" font-size="21" fill="#263238">A, B, C en haut des colonnes</text><text x="710" y="489" text-anchor="start" font-size="21" fill="#263238">et les numéros 1 à 6 à gauche.</text>
  <text x="500" y="700" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Le quadrillage 9 cm × 18 cm : des carreaux de 3 cm qui guideront le contour de Madagascar.</text>
</svg>