<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6A1B9A"/></marker></defs><rect width="1100" height="650" rx="28" fill="#F3E5F5"/><rect x="18" y="18" width="1064" height="614" rx="24" fill="none" stroke="#6A1B9A" stroke-width="4"/><circle cx="110" cy="555" r="40" fill="none" stroke="#6A1B9A" stroke-width="8" opacity=".18"/><ellipse cx="110" cy="555" rx="78" ry="22" fill="none" stroke="#6A1B9A" stroke-width="6" opacity=".18" transform="rotate(-18 110 555)"/><text x="550" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#4A148C" font-weight="700">L'interrelation entre les composantes de la Terre</text><line x1="550" y1="335" x2="260" y2="207" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="207" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="260" y2="482" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="482" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><rect x="50" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="260" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">La biosphère échange des gaz avec</text>
<text x="260" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">l'atmosphère par la respiration et la</text>
<text x="260" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">photosynthèse</text><rect x="630" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="840" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">L'atmosphère et l'hydrosphère échangent</text>
<text x="840" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">de l'eau par évaporation et</text>
<text x="840" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">précipitation</text><rect x="50" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="260" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">L'eau altère la lithosphère et</text>
<text x="260" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">transporte des éléments utiles aux êtres</text>
<text x="260" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">vivants</text><rect x="630" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="840" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Une modification importante d'une</text>
<text x="840" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">composante peut perturber l'ensemble du</text>
<text x="840" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">système terrestre</text><circle cx="550" cy="335" r="112" fill="#6A1B9A" stroke="#FFFFFF" stroke-width="10"/><text x="550" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#FFFFFF" font-weight="700">interrelation</text><text x="1040" y="615" text-anchor="end" font-family="Arial" font-size="17" fill="#4A148C">J-Learn · GEO T7 · S13</text></svg>