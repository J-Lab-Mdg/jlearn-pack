<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EF6C00"/></marker></defs><rect width="1100" height="650" rx="28" fill="#FFF3E0"/><rect x="18" y="18" width="1064" height="614" rx="24" fill="none" stroke="#EF6C00" stroke-width="4"/><g fill="#EF6C00" opacity=".15"><circle cx="80" cy="530" r="25"/><circle cx="150" cy="530" r="25"/><circle cx="115" cy="585" r="25"/><path d="M42 620c0-52 76-52 76 0M112 620c0-52 76-52 76 0M77 640c0-52 76-52 76 0"/></g><text x="550" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#E65100" font-weight="700">Les eaux marines</text><line x1="550" y1="335" x2="260" y2="207" stroke="#EF6C00" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="207" stroke="#EF6C00" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="260" y2="482" stroke="#EF6C00" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="482" stroke="#EF6C00" stroke-width="6" opacity=".45" marker-end="url(#a)"/><rect x="50" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#EF6C00" stroke-width="4"/><text x="260" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Un océan est plus vaste et profond</text>
<text x="260" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">qu'une mer, généralement plus proche des</text>
<text x="260" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">continents</text><rect x="630" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#EF6C00" stroke-width="4"/><text x="840" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">La salinité dépend notamment de</text>
<text x="840" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">l'évaporation, des pluies et des apports</text>
<text x="840" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">fluviaux</text><rect x="50" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#EF6C00" stroke-width="4"/><text x="260" y="468.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Les marées sont des variations</text>
<text x="260" y="495.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">périodiques du niveau de la mer</text><rect x="630" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#EF6C00" stroke-width="4"/><text x="840" y="468.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Les courants marins déplacent de grandes</text>
<text x="840" y="495.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">masses d'eau et influencent les climats</text><circle cx="550" cy="335" r="112" fill="#EF6C00" stroke="#FFFFFF" stroke-width="10"/><text x="550" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#FFFFFF" font-weight="700">eaux marines</text><text x="1040" y="615" text-anchor="end" font-family="Arial" font-size="17" fill="#E65100">J-Learn · GEO T7 · S31</text></svg>