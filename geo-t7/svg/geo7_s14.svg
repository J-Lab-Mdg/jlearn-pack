<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6A1B9A"/></marker></defs><rect width="1100" height="650" rx="28" fill="#F3E5F5"/><rect x="18" y="18" width="1064" height="614" rx="24" fill="none" stroke="#6A1B9A" stroke-width="4"/><circle cx="110" cy="555" r="40" fill="none" stroke="#6A1B9A" stroke-width="8" opacity=".18"/><ellipse cx="110" cy="555" rx="78" ry="22" fill="none" stroke="#6A1B9A" stroke-width="6" opacity=".18" transform="rotate(-18 110 555)"/><text x="550" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#4A148C" font-weight="700">La structure interne du globe</text><line x1="550" y1="335" x2="260" y2="207" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="207" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="260" y2="482" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="482" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><rect x="50" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="260" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">L'écorce est la couche rocheuse externe,</text>
<text x="260" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">mince sous les océans et plus épaisse</text>
<text x="260" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">sous les continents</text><rect x="630" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="840" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Le manteau s'étend sous l'écorce et</text>
<text x="840" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">représente la plus grande partie du</text>
<text x="840" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">volume terrestre</text><rect x="50" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="260" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Le noyau, très chaud et riche en métaux,</text>
<text x="260" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">comprend une partie externe et une</text>
<text x="260" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">partie interne</text><rect x="630" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="840" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Les propriétés et les mouvements</text>
<text x="840" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">internes expliquent une partie de</text>
<text x="840" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">l'activité tectonique</text><circle cx="550" cy="335" r="112" fill="#6A1B9A" stroke="#FFFFFF" stroke-width="10"/><text x="550" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#FFFFFF" font-weight="700">structure interne</text><text x="1040" y="615" text-anchor="end" font-family="Arial" font-size="17" fill="#4A148C">J-Learn · GEO T7 · S14</text></svg>