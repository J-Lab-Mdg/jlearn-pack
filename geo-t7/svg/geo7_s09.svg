<text x="260" y="220.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">d'étoiles, du gaz et de la poussière</text><rect x="630" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="840" y="193.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Le Système solaire comprend le Soleil et</text>
