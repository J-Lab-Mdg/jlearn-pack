<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="499"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les outils du calcul mental</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Quatre stratégies pour calculer vite et juste, sans poser.</text><rect x="60" y="155" width="300" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="210" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Stratégie</text><rect x="360" y="155" width="580" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="650" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Exemple</text><rect x="60" y="209" width="300" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="210" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">× 10, × 100, × 1 000</text><rect x="360" y="209" width="580" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="650" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">47 × 100 = 4 700 ; 35 000 ÷ 1 000 = 35</text><rect x="60" y="263" width="300" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="210" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Décomposer</text><rect x="360" y="263" width="580" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="650" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">48 + 27 = 48 + 20 + 7 = 75</text><rect x="60" y="317" width="300" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="210" y="353" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Doubles et moitiés</text><rect x="360" y="317" width="580" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="650" y="353" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">25 × 16 = 50 × 8 = 100 × 4 = 400</text><rect x="60" y="371" width="300" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="210" y="407" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Compensation</text><rect x="360" y="371" width="580" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="650" y="407" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">99 + 46 = 100 + 45 = 145</text><text x="500" y="467" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">le bon calculateur choisit la stratégie qui rend le calcul facile</text></svg>