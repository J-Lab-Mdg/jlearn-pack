<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="417"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Décomposer un nombre de plusieurs façons</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">68 425 peut s’écrire de différentes manières, toutes exactes.</text><rect x="120" y="155" width="760" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="190" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">68 425 = 60 000 + 8 000 + 400 + 20 + 5</text><rect x="120" y="225" width="760" height="52" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="260" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">68 425 = (6 × 10 000) + (8 × 1 000) + (4 × 100) + (2 × 10) + 5</text><rect x="120" y="295" width="760" height="52" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="330" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">68 425 = 68 milliers et 425 unités</text><text x="500" y="387" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">décomposer, c’est « ouvrir » le nombre ; composer, c’est le refermer</text></svg>