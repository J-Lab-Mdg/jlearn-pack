<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La démarche de l’enquête</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Quatre étapes : poser la question, prévoir une réponse, collecter, répondre.</text><rect x="30" y="160" width="200" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="130" y="201" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">1. Question</text><text x="130" y="260" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">« quel fruit préféré ? »</text><line x1="235" y1="192" x2="275" y2="192" stroke="#1F4E79" stroke-width="4"/><polygon points="275,192 262.39374056706254,198.08951747755722 262.39374056706254,185.91048252244278" fill="#1F4E79"/><rect x="280" y="160" width="200" height="64" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="380" y="201" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">2. Hypothèse</text><text x="380" y="260" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">« je prédis la banane »</text><line x1="485" y1="192" x2="525" y2="192" stroke="#1F4E79" stroke-width="4"/><polygon points="525,192 512.3937405670625,198.08951747755722 512.3937405670625,185.91048252244278" fill="#1F4E79"/><rect x="530" y="160" width="200" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="630" y="201" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">3. Collecte</text><text x="630" y="260" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">on interroge la classe</text><line x1="735" y1="192" x2="775" y2="192" stroke="#1F4E79" stroke-width="4"/><polygon points="775,192 762.3937405670625,198.08951747755722 762.3937405670625,185.91048252244278" fill="#1F4E79"/><rect x="780" y="160" width="200" height="64" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="880" y="201" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">4. Réponse</text><text x="880" y="260" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">les données tranchent</text><text x="500" y="318" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">la réponse vient des DONNÉES collectées — jamais de l’avis d’une seule personne !</text></svg>