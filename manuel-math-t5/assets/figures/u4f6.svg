<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="509"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Chaque outil a son métier</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Règle pour tracer droit, équerre pour l’angle droit, compas pour le rond.</text><rect x="20" y="155" width="210" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="125" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Outil</text><rect x="230" y="155" width="400" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="430" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Son métier</text><rect x="630" y="155" width="350" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="805" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Le geste</text><rect x="20" y="211" width="210" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="125" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">la règle</text><rect x="230" y="211" width="400" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="430" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">segments droits et mesures</text><rect x="630" y="211" width="350" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="805" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">tracer le long du bord</text><rect x="20" y="267" width="210" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="125" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">l’équerre</text><rect x="230" y="267" width="400" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="430" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">angles droits (tracer, vérifier)</text><rect x="630" y="267" width="350" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="805" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">coin droit sur le sommet</text><rect x="20" y="323" width="210" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="125" y="360" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">le compas</text><rect x="230" y="323" width="400" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="430" y="360" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">cercles et report de longueurs</text><rect x="630" y="323" width="350" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="805" y="360" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">pointe au centre, on tourne</text><rect x="20" y="379" width="210" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="125" y="416" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">le quadrillage</text><rect x="230" y="379" width="400" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="430" y="416" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">guider tracés et copies</text><rect x="630" y="379" width="350" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="805" y="416" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">compter les carreaux</text><text x="500" y="477" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">un tracé de géométrie se fait toujours au crayon fin, jamais à main levée</text></svg>