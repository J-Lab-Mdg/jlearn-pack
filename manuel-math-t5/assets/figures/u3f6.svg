<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le signe = est une balance</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">L’égalité ne dit pas « réponds ! » : elle dit « les deux côtés pèsent pareil ».</text><line x1="500" y1="200" x2="500" y2="295" stroke="#6D4C41" stroke-width="7"/><polygon points="440,315 560,315 540,295 460,295" fill="#D7CCC8" stroke="#6D4C41" stroke-width="3"/><line x1="260" y1="200" x2="740" y2="200" stroke="#6D4C41" stroke-width="6"/><line x1="260" y1="200" x2="260" y2="222" stroke="#6D4C41" stroke-width="4"/><line x1="740" y1="200" x2="740" y2="222" stroke="#6D4C41" stroke-width="4"/><rect x="170" y="222" width="180" height="52" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="260" y="257" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">7 + 5</text><rect x="650" y="222" width="180" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="740" y="257" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">10 + 2</text><text x="500" y="175" font-family="DejaVu Serif" font-size="42" fill="#1F4E79" font-weight="bold" text-anchor="middle">=</text><text x="500" y="365" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">7 + 5 = 10 + 2 : deux expressions différentes, une même valeur (12)</text></svg>