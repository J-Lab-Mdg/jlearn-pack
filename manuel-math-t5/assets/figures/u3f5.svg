<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La règle de trois</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">3 stylos coûtent 700 Ar ; combien coûtent 9 stylos ? (exemple du programme)</text><rect x="110" y="160" width="370" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="295" y="196" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">3 stylos → 700 Ar</text><rect x="520" y="160" width="370" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="705" y="196" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">9 stylos → ?</text><rect x="110" y="236" width="780" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="272" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">(9 × 700) ÷ 3 = 6 300 ÷ 3 = 2 100 Ar</text><text x="500" y="335" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">on multiplie par la nouvelle quantité, on divise par l’ancienne</text><text x="500" y="372" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">vérification : 9 stylos = 3 fois 3 stylos → 3 × 700 = 2 100 Ar ✓</text></svg>