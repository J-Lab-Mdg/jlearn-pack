<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La diagonale coupe le quadrilatère</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Un quadrilatère cache toujours deux triangles — la diagonale les révèle.</text><polygon points="120,370 420,370 380,190 160,190" fill="none" stroke="#1F4E79" stroke-width="4"/><line x1="120" y1="370" x2="380" y2="190" stroke="#C2185B" stroke-width="3.5" stroke-dasharray="12 9"/><text x="270" y="404" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">trapèze + sa diagonale</text><line x1="470" y1="280" x2="560" y2="280" stroke="#B25000" stroke-width="4"/><polygon points="560,280 547.3937405670625,286.08951747755725 547.3937405670625,273.91048252244275" fill="#B25000"/><polygon points="600,370 900,370 860,190" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/><polygon points="600,370 860,190 640,190" fill="#FDE7EF" stroke="#C2185B" stroke-width="3.5"/><text x="750" y="404" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">deux triangles</text><text x="500" y="446" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">tout polygone se découpe en triangles : le triangle est la brique de la géométrie</text></svg>