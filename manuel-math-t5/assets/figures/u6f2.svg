<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le tableau des effectifs</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Les 24 réponses deviennent un tableau : un bâton par réponse, puis l’effectif.</text><rect x="130" y="155" width="280" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="270" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">fruit préféré</text><rect x="410" y="155" width="320" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="570" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">dénombrement</text><rect x="730" y="155" width="180" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">effectif</text><rect x="130" y="209" width="280" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="270" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">mangue</text><rect x="410" y="209" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="570" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">IIII III</text><rect x="730" y="209" width="180" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">8</text><rect x="130" y="263" width="280" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="270" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">banane</text><rect x="410" y="263" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="570" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">IIII I</text><rect x="730" y="263" width="180" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="299" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">6</text><rect x="130" y="317" width="280" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="270" y="353" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">letchi</text><rect x="410" y="317" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="570" y="353" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">IIII II</text><rect x="730" y="317" width="180" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="353" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">7</text><rect x="130" y="371" width="280" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="270" y="407" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">ananas</text><rect x="410" y="371" width="320" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="570" y="407" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">III</text><rect x="730" y="371" width="180" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="407" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">3</text><text x="500" y="467" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">total : 8 + 6 + 7 + 3 = 24 — la somme retombe sur le nombre d’interrogés</text><text x="500" y="503" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">les bâtons se groupent par paquets de 5 pour se compter d’un coup d’œil</text></svg>