<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="472"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Interpréter : faire parler le diagramme</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Lire une valeur, comparer, totaliser, conclure — quatre gestes dans l’ordre.</text><line x1="70" y1="370" x2="590" y2="370" stroke="#2E7D32" stroke-width="4"/><polygon points="590,370 577.3937405670625,376.08951747755725 577.3937405670625,363.91048252244275" fill="#2E7D32"/><line x1="70" y1="370" x2="70" y2="165" stroke="#2E7D32" stroke-width="4"/><polygon points="70,165 76.08951747755722,177.60625943293746 63.91048252244278,177.60625943293746" fill="#2E7D32"/><polygon points="110,370 188,370 188,194 110,194" fill="#F8BBD0" stroke="#1F4E79" stroke-width="3"/><text x="149" y="184" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">8</text><text x="149" y="400" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">mangue</text><polygon points="230,370 308,370 308,238 230,238" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="269" y="228" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">6</text><text x="269" y="400" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">banane</text><polygon points="350,370 428,370 428,216 350,216" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="389" y="206" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">7</text><text x="389" y="400" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">letchi</text><polygon points="470,370 548,370 548,304 470,304" fill="#FFE3C2" stroke="#1F4E79" stroke-width="3"/><text x="509" y="294" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">3</text><text x="509" y="400" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">ananas</text><rect x="640" y="160" width="380" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="830" y="194" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">lire : banane = 6 élèves</text><rect x="640" y="220" width="380" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="830" y="254" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">comparer : 8 − 3 = 5 d’écart</text><rect x="640" y="280" width="380" height="50" rx="10" fill="#FFE3C2" stroke="#B25000" stroke-width="3"/><text x="830" y="314" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">totaliser : 8 + 6 + 7 + 3 = 24</text><rect x="640" y="340" width="380" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="830" y="374" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">conclure : hypothèse « banane » fausse</text><text x="525" y="442" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">l’œil critique vérifie toujours : axe partant de zéro ? barres de même largeur ?</text></svg>