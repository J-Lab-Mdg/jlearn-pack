<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Diviser avec quotient et reste</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">127 mangues partagées entre 5 bols : 25 chacune, et il en reste 2.</text><rect x="190" y="160" width="310" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="345" y="197" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">dividende 127</text><rect x="500" y="160" width="310" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="655" y="197" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">diviseur 5</text><rect x="190" y="216" width="310" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="345" y="253" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">reste 2</text><rect x="500" y="216" width="310" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="655" y="253" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">quotient 25</text><text x="500" y="320" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">127 = (5 × 25) + 2 : la preuve de la division</text><text x="500" y="358" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">le reste est TOUJOURS plus petit que le diviseur (2 &lt; 5)</text></svg>