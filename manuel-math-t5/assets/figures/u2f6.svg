<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="547"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La division posée, étape par étape : 127 ÷ 5</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">« Dans… combien de fois… ? » — la seule question à se répéter, colonne après colonne.</text><text x="230" y="201" font-family="DejaVu Serif" font-size="33" fill="#222" font-weight="bold" text-anchor="middle">1</text><text x="276" y="201" font-family="DejaVu Serif" font-size="33" fill="#222" font-weight="bold" text-anchor="middle">2</text><text x="322" y="201" font-family="DejaVu Serif" font-size="33" fill="#222" font-weight="bold" text-anchor="middle">7</text><line x1="376" y1="157" x2="376" y2="225" stroke="#1F4E79" stroke-width="4"/><line x1="376" y1="157" x2="480" y2="157" stroke="#1F4E79" stroke-width="4"/><text x="408" y="201" font-family="DejaVu Serif" font-size="33" fill="#C2185B" font-weight="bold" text-anchor="middle">5</text><text x="222" y="141" font-family="DejaVu Serif" font-size="34" fill="#2E7D32" font-weight="bold" text-anchor="middle">2</text><text x="268" y="141" font-family="DejaVu Serif" font-size="34" fill="#2E7D32" font-weight="bold" text-anchor="middle">5</text><text x="186" y="245" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="bold" text-anchor="middle">−</text><text x="230" y="245" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="bold" text-anchor="middle">1</text><text x="276" y="245" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="bold" text-anchor="middle">0</text><line x1="176" y1="261" x2="322" y2="261" stroke="#1F4E79" stroke-width="3"/><text x="268" y="291" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="bold" text-anchor="middle">2</text><text x="314" y="291" font-family="DejaVu Serif" font-size="30" fill="#B25000" font-weight="bold" text-anchor="middle">7</text><line x1="352" y1="273" x2="318" y2="283" stroke="#B25000" stroke-width="3.5"/><polygon points="318,283 328.375753642293,273.6008651273405 331.81226716534223,285.28501110570795" fill="#B25000"/><text x="186" y="335" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="bold" text-anchor="middle">−</text><text x="230" y="335" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="bold" text-anchor="middle">2</text><text x="276" y="335" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="bold" text-anchor="middle">5</text><line x1="176" y1="351" x2="322" y2="351" stroke="#1F4E79" stroke-width="3"/><text x="314" y="379" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">2</text><text x="590" y="145" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="start">Dans 12, combien de fois 5 ?</text><text x="590" y="175" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="start">→ 2 fois, car 2 × 5 = 10 ; 12 − 10 = 2</text><text x="590" y="205" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="start">J’abaisse le 7 : ça fait 27.</text><text x="590" y="235" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="start">Dans 27, combien de fois 5 ?</text><text x="590" y="265" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="start">→ 5 fois, car 5 × 5 = 25 ; 27 − 25 = 2</text><text x="590" y="295" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="start">Quotient 25, reste 2 (2 &lt; 5 ✓)</text><rect x="90" y="413" width="820" height="48" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="446" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">PREUVE ROYALE : (5 × 25) + 2 = 125 + 2 = 127 = le dividende ✓</text><rect x="90" y="477" width="820" height="46" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="509" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">RÈGLE D’OR : le reste est toujours plus petit que le diviseur — sinon le quotient est trop petit !</text></svg>