<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="454"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Multiplier et diviser des décimaux</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On calcule sans virgule, puis on replace la virgule en comptant les rangs.</text><rect x="90" y="160" width="820" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="198" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">2,5 × 1,2 : 25 × 12 = 300, puis 2 rangs décimaux → 3,00 = 3</text><rect x="90" y="240" width="820" height="58" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="278" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">7,2 ÷ 3 = 2,4 : on divise, la virgule descend à sa place</text><rect x="90" y="320" width="820" height="58" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="358" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">4,5 ÷ 1,5 = 45 ÷ 15 = 3 : on décale les DEUX virgules pareil</text><text x="500" y="422" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">compter les chiffres après les virgules des facteurs : autant dans le produit</text></svg>