<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="352"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La fraction 3/4 : trois parts sur quatre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le dénominateur découpe l’unité ; le numérateur colorie les parts prises.</text><rect x="150" y="160" width="700" height="80" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="150" y="160" width="175" height="80" fill="#F8BBD0"/><rect x="325" y="160" width="175" height="80" fill="#F8BBD0"/><rect x="500" y="160" width="175" height="80" fill="#F8BBD0"/><line x1="325" y1="160" x2="325" y2="240" stroke="#1F4E79" stroke-width="2"/><line x1="500" y1="160" x2="500" y2="240" stroke="#1F4E79" stroke-width="2"/><line x1="675" y1="160" x2="675" y2="240" stroke="#1F4E79" stroke-width="2"/><rect x="150" y="160" width="700" height="80" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="500" y="285" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">numérateur 3 = parts coloriées ; dénominateur 4 = parts égales du découpage</text><text x="500" y="322" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">3/4 se lit « trois quarts »</text></svg>