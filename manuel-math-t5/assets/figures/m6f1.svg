<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="557"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Fractions : les quatre opérations en images</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Même dénominateur : direct. Dénominateurs différents : on passe par le produit en croix.</text><rect x="120" y="143" width="200" height="40" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="120" y="143" width="40" height="40" fill="#F8BBD0"/><line x1="160" y1="143" x2="160" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="200" y1="143" x2="200" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="240" y1="143" x2="240" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="280" y1="143" x2="280" y2="183" stroke="#1F4E79" stroke-width="2"/><rect x="120" y="143" width="200" height="40" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="95" y="170" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">1/5</text><text x="340" y="170" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">+</text><rect x="370" y="143" width="200" height="40" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="370" y="143" width="40" height="40" fill="#F8BBD0"/><rect x="410" y="143" width="40" height="40" fill="#F8BBD0"/><line x1="410" y1="143" x2="410" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="450" y1="143" x2="450" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="490" y1="143" x2="490" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="530" y1="143" x2="530" y2="183" stroke="#1F4E79" stroke-width="2"/><rect x="370" y="143" width="200" height="40" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="345" y="170" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">2/5</text><text x="590" y="170" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">=</text><rect x="620" y="143" width="200" height="40" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="620" y="143" width="40" height="40" fill="#F8BBD0"/><rect x="660" y="143" width="40" height="40" fill="#F8BBD0"/><rect x="700" y="143" width="40" height="40" fill="#F8BBD0"/><line x1="660" y1="143" x2="660" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="700" y1="143" x2="700" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="740" y1="143" x2="740" y2="183" stroke="#1F4E79" stroke-width="2"/><line x1="780" y1="143" x2="780" y2="183" stroke="#1F4E79" stroke-width="2"/><rect x="620" y="143" width="200" height="40" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="595" y="170" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">3/5</text><text x="500" y="209" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">MÊME dénominateur : on additionne (ou soustrait) les numérateurs, sans toucher au bas</text><text x="180" y="273" font-family="DejaVu Serif" font-size="26" fill="#C2185B" font-weight="bold" text-anchor="middle">2</text><line x1="160" y1="285" x2="200" y2="285" stroke="#222" stroke-width="3.5"/><text x="180" y="317" font-family="DejaVu Serif" font-size="26" fill="#C2185B" font-weight="bold" text-anchor="middle">3</text><text x="250" y="293" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">+</text><text x="320" y="273" font-family="DejaVu Serif" font-size="26" fill="#B25000" font-weight="bold" text-anchor="middle">1</text><line x1="300" y1="285" x2="340" y2="285" stroke="#222" stroke-width="3.5"/><text x="320" y="317" font-family="DejaVu Serif" font-size="26" fill="#B25000" font-weight="bold" text-anchor="middle">5</text><line x1="206" y1="269" x2="306" y2="313" stroke="#C2185B" stroke-width="3"/><polygon points="306,313 292.00881740795097,313.4967994323101 296.9137850688711,302.3491456574916" fill="#C2185B"/><line x1="336" y1="269" x2="216" y2="313" stroke="#B25000" stroke-width="3"/><polygon points="216,313 225.7393737107266,302.942932846858 229.9320631162877,314.3775403165701" fill="#B25000"/><text x="420" y="293" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="bold" text-anchor="middle">=</text><text x="500" y="273" font-family="DejaVu Serif" font-size="24" fill="#1F4E79" font-weight="bold" text-anchor="middle">2 × 5 + 1 × 3</text><text x="500" y="317" font-family="DejaVu Serif" font-size="24" fill="#1F4E79" font-weight="bold" text-anchor="middle">3 × 5</text><line x1="452" y1="285" x2="548" y2="285" stroke="#1F4E79" stroke-width="3"/><text x="600" y="293" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="bold" text-anchor="middle">=</text><text x="670" y="273" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">13</text><line x1="650" y1="285" x2="690" y2="285" stroke="#222" stroke-width="3.5"/><text x="670" y="317" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">15</text><text x="500" y="349" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">DÉNOMINATEURS DIFFÉRENTS : les flèches croisées fabriquent le nouveau dénominateur</text><rect x="60" y="373" width="880" height="46" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="405" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">× : haut × haut, bas × bas — simplifier en croix AVANT : 2/3 × 3/4 = 1/2</text><rect x="60" y="433" width="880" height="46" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="465" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">÷ : multiplier par l’INVERSE (le haut et le bas échangent) : 2/3 ÷ 3/4 = 2/3 × 4/3 = 8/9</text><rect x="60" y="493" width="880" height="46" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="525" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">UN ENTIER devient n/1 : 3 − 2/5 = 15/5 − 2/5 = 13/5</text></svg>