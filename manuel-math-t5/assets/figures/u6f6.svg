<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="519"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">De l’effectif à la fréquence</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">20 tirages avec remise dans le sac : rouge 12 fois, bleu 6 fois, jaune 2 fois.</text><rect x="190" y="155" width="620" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="191" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">fréquence = effectif ÷ nombre total d’essais</text><text x="80" y="273" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="start">rouge</text><circle cx="180" cy="265" r="12" fill="#C2185B"/><circle cx="214" cy="265" r="12" fill="#C2185B"/><circle cx="248" cy="265" r="12" fill="#C2185B"/><circle cx="282" cy="265" r="12" fill="#C2185B"/><circle cx="316" cy="265" r="12" fill="#C2185B"/><circle cx="350" cy="265" r="12" fill="#C2185B"/><circle cx="384" cy="265" r="12" fill="#C2185B"/><circle cx="418" cy="265" r="12" fill="#C2185B"/><circle cx="452" cy="265" r="12" fill="#C2185B"/><circle cx="486" cy="265" r="12" fill="#C2185B"/><circle cx="520" cy="265" r="12" fill="#C2185B"/><circle cx="554" cy="265" r="12" fill="#C2185B"/><text x="640" y="273" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="start">12/20 = 3/5</text><text x="80" y="329" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="start">bleu</text><circle cx="180" cy="321" r="12" fill="#1F4E79"/><circle cx="214" cy="321" r="12" fill="#1F4E79"/><circle cx="248" cy="321" r="12" fill="#1F4E79"/><circle cx="282" cy="321" r="12" fill="#1F4E79"/><circle cx="316" cy="321" r="12" fill="#1F4E79"/><circle cx="350" cy="321" r="12" fill="#1F4E79"/><text x="640" y="329" font-family="DejaVu Serif" font-size="23" fill="#1F4E79" font-weight="bold" text-anchor="start">6/20 = 3/10</text><text x="80" y="385" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="start">jaune</text><circle cx="180" cy="377" r="12" fill="#B25000"/><circle cx="214" cy="377" r="12" fill="#B25000"/><text x="640" y="385" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="start">2/20 = 1/10</text><text x="500" y="451" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">estimation pour un sac de 10 jetons : 6 rouges, 3 bleus, 1 jaune</text><text x="500" y="487" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">plus on fait d’essais, plus l’estimation devient sûre</text></svg>