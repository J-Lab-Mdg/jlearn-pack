<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="447"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’aire du triangle : un demi-rectangle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">La diagonale coupe le rectangle en deux triangles égaux.</text><polygon points="120,335 420,335 420,165 120,165" fill="none" stroke="#1F4E79" stroke-width="3.5"/><polygon points="120,335 420,335 420,165" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><line x1="120" y1="335" x2="420" y2="165" stroke="#C2185B" stroke-width="3" stroke-dasharray="12 9"/><text x="270" y="370" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">base 6 cm</text><text x="455" y="253" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="start">hauteur</text><text x="455" y="277" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="start">4 cm</text><rect x="600" y="190" width="360" height="60" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="780" y="229" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">aire du triangle</text><rect x="600" y="260" width="360" height="60" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="780" y="299" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">= (base × hauteur) ÷ 2</text><text x="780" y="360" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">A = (6 × 4) ÷ 2 = 12 cm²</text><text x="500" y="415" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">le triangle vert est la moitié exacte du rectangle 6 × 4</text></svg>