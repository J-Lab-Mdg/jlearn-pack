<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="731"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les aires : triangle, trapèze, parallélogramme</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le triangle est un demi-rectangle ; chaque figure a sa formule d’aire.</text><polygon points="120,315 400,315 400,165 120,165" fill="none" stroke="#1F4E79" stroke-width="3.5"/><polygon points="120,315 400,315 400,165" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><line x1="120" y1="315" x2="400" y2="165" stroke="#C2185B" stroke-width="3" stroke-dasharray="12 9"/><text x="260" y="347" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">base 6 cm</text><text x="448" y="245" font-family="DejaVu Serif" font-size="18" fill="#1F4E79" font-weight="bold" text-anchor="start">h = 4 cm</text><text x="260" y="393" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">A = (b × h) ÷ 2 = (6 × 4) ÷ 2 = 12 cm²</text><rect x="620" y="185" width="350" height="56" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="795" y="222" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">triangle = (b × h) ÷ 2</text><rect x="620" y="257" width="350" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="795" y="294" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">la moitié exacte du rectangle !</text><polygon points="120,585 400,585 340,470 190,470" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3.5"/><line x1="265" y1="470" x2="265" y2="585" stroke="#C2185B" stroke-width="3" stroke-dasharray="12 9"/><text x="260" y="615" font-family="DejaVu Serif" font-size="18" fill="#1F4E79" font-weight="bold" text-anchor="middle">B = 9 cm</text><text x="265" y="457" font-family="DejaVu Serif" font-size="18" fill="#1F4E79" font-weight="bold" text-anchor="middle">b = 5 cm</text><text x="302" y="535" font-family="DejaVu Serif" font-size="17" fill="#C2185B" font-weight="bold" text-anchor="start">h = 4</text><polygon points="560,585 840,585 900,470 620,470" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/><line x1="650" y1="470" x2="650" y2="585" stroke="#C2185B" stroke-width="3" stroke-dasharray="12 9"/><text x="700" y="615" font-family="DejaVu Serif" font-size="18" fill="#2E7D32" font-weight="bold" text-anchor="middle">b = 9 cm</text><text x="658" y="535" font-family="DejaVu Serif" font-size="17" fill="#C2185B" font-weight="bold" text-anchor="start">h = 4</text><text x="500" y="665" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">trapèze : A = (B + b) × h ÷ 2 = (9 + 5) × 4 ÷ 2 = 28 cm²</text><text x="500" y="701" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">parallélogramme : A = b × h = 9 × 4 = 36 cm²</text></svg>