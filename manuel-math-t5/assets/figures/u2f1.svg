<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les quatre sens des opérations</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Avant de calculer, on reconnaît la situation : que fait-on vraiment ?</text><rect x="70" y="155" width="410" height="70" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="275" y="199" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">AJOUT : j’en mets en plus</text><rect x="520" y="155" width="410" height="70" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="725" y="199" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">RETRAIT : j’en enlève</text><rect x="70" y="250" width="410" height="70" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="275" y="294" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">RÉUNION : je rassemble tout</text><rect x="520" y="250" width="410" height="70" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="725" y="294" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">COMPARAISON : quel écart ?</text><text x="275" y="355" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">ajout, réunion → addition</text><text x="725" y="355" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">retrait, comparaison → soustraction</text></svg>