nt-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">3</text><text x="582" y="437" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="middle">ananas</text><text x="790" y="185" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="start">pictogramme :</text><text x="745" y="230" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="start">mangue</text><circle cx="870" cy="223" r="13" fill="#C2185B"/><circle cx="906" cy="223" r="13" fill="#C2185B"/><circle cx="942" cy="223" r="13" fill="#C2185B"/><circle cx="978" cy="223" r="13" fill="#C2185B"/><text x="745" y="280" font-family="DejaVu Serif" font-size="19" fill="#333" font-weight="normal" text-anchor="start">banane</text><circle cx="870" cy="273" r="13" fill="#2E7D32"/><circle cx="906" cy="273" r="13" fill="#2E7D32"/><circle cx="942" cy="273" r="13" fill="#2E7D32"/><rect x="735" y="310" width="280" height="46" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="875" y="342" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">légende : 1 rond = 2 élèves</text><text x="525" y="483" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">barres de même largeur, hauteur proportionnelle ; sans légende, pas de pictogramme !</text></svg>