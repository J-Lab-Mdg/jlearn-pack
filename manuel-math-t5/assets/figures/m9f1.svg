<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="649"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La checklist du CEPE — épreuve OPÉRATION</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Huit réflexes à vérifier avant de rendre ta copie.</text><rect x="120" y="145" width="30" height="30" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="190" y="169" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Lis le sujet DEUX FOIS avant de commencer</text><text x="105" y="169" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">1</text><rect x="120" y="201" width="30" height="30" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="190" y="225" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Traite les questions UNE PAR UNE (1, 2, 3…)</text><text x="105" y="225" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">2</text><rect x="120" y="257" width="30" height="30" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="190" y="281" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Identifie l’opération (+, −, ×, ÷) et cherche la question cachée</text><text x="105" y="281" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">3</text><rect x="120" y="313" width="30" height="30" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="190" y="337" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Relis la leçon si besoin (fractions, conversions…)</text><text x="105" y="337" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">4</text><rect x="120" y="369" width="30" height="30" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="190" y="393" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Brouillon propre : chiffres alignés, une opération par ligne</text><text x="105" y="393" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">5</text><rect x="120" y="425" width="30" height="30" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="190" y="449" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Convertis les unités AVANT de calculer (m et cm jamais mélangés !)</text><text x="105" y="449" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">6</text><rect x="120" y="481" width="30" height="30" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="190" y="505" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Vérifie : ordre de grandeur, puis preuve (croix par 9 pour × et ÷)</text><text x="105" y="505" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">7</text><rect x="120" y="537" width="30" height="30" rx="6" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="190" y="561" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Recopie et réponds en PHRASE COMPLÈTE, avec l’unité (Ar, m, kg…)</text><text x="105" y="561" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">8</text><text x="500" y="617" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">Coche-les dans ta tête — ou recopie-les sur ton brouillon !</text></svg>