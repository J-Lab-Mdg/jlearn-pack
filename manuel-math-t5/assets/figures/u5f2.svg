<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="723"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le périmètre : toutes les formules</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On additionne tous les côtés — ou on utilise la formule de chaque figure.</text><polygon points="100,325 360,325 360,165 100,165" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3.5"/><text x="230" y="357" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">8 m</text><text x="72" y="250" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">5 m</text><text x="230" y="405" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">rectangle : P = (L + l) × 2 = (8 + 5) × 2 = 26 m</text><polygon points="640,325 800,325 800,165 640,165" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/><text x="720" y="357" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">6 m</text><text x="720" y="405" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">carré : P = c × 4 = 6 × 4 = 24 m</text><polygon points="120,615 400,615 300,480" fill="#FDE7EF" stroke="#C2185B" stroke-width="3.5"/><text x="260" y="645" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">a = 9 m</text><text x="165" y="540" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">b = 6 m</text><text x="395" y="540" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">c = 5 m</text><text x="260" y="693" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">triangle : P = a + b + c = 9 + 6 + 5 = 20 m</text><polygon points="771.014083110324,591 700,632 628.985916889676,591 628.985916889676,509 700,468 771.014083110324,509" fill="#FFF3E0" stroke="#B25000" stroke-width="3.5"/><text x="700" y="557" font-family="DejaVu Serif" font-size="18" fill="#B25000" font-weight="bold" text-anchor="middle">côté 4 m</text><text x="700" y="693" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">polygone régulier : P = côté × nb de côtés = 4 × 6 = 24 m</text></svg>