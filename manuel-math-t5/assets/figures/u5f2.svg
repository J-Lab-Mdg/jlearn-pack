<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="497"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le périmètre : le tour complet</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On additionne tous les côtés — ou on utilise la formule de la figure.</text><polygon points="100,325 360,325 360,165 100,165" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3.5"/><text x="230" y="360" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">8 m</text><text x="72" y="250" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">5 m</text><text x="230" y="410" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">P = (8 + 5) × 2 = 26 m</text><polygon points="600,325 760,325 760,165 600,165" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/><text x="680" y="360" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">6 m</text><text x="680" y="410" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">P = 6 × 4 = 24 m</text><text x="500" y="465" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">rectangle : P = (longueur + largeur) × 2 ; carré : P = côté × 4</text></svg>