<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="473"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Classer les triangles par leurs côtés</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Les petits traits identiques marquent les côtés de même longueur.</text><polygon points="90,335 270,335 180,179" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/><line x1="180" y1="327" x2="180" y2="343" stroke="#2E7D32" stroke-width="3"/><line x1="128.0705153116112" y1="253.00222037208337" x2="141.9294846883888" y2="260.9977796279166" stroke="#2E7D32" stroke-width="3"/><line x1="218.0705153116112" y1="260.9977796279166" x2="231.9294846883888" y2="253.00222037208337" stroke="#2E7D32" stroke-width="3"/><text x="180" y="371" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">ÉQUILATÉRAL</text><text x="180" y="399" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">3 côtés égaux</text><polygon points="420,335 580,335 500,165" fill="#FDE7EF" stroke="#C2185B" stroke-width="3.5"/><line x1="452.76145038239207" y1="246.59362370936097" x2="467.23854961760793" y2="253.40637629063903" stroke="#C2185B" stroke-width="3"/><line x1="532.761450382392" y1="253.40637629063903" x2="547.238549617608" y2="246.59362370936097" stroke="#C2185B" stroke-width="3"/><line x1="495.5" y1="327" x2="495.5" y2="343" stroke="#888" stroke-width="3"/><line x1="504.5" y1="327" x2="504.5" y2="343" stroke="#888" stroke-width="3"/><text x="500" y="371" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">ISOCÈLE</text><text x="500" y="399" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">2 côtés égaux</text><polygon points="730,335 940,335 790,195" fill="#FFF3E0" stroke="#B25000" stroke-width="3.5"/><line x1="835" y1="327" x2="835" y2="343" stroke="#888" stroke-width="3"/><line x1="750.8742029162493" y1="265.9847982464479" x2="765.5805233965382" y2="272.2875070237146" stroke="#888" stroke-width="3"/><line x1="754.4194766034618" y1="257.7124929762854" x2="769.1257970837507" y2="264.0152017535521" stroke="#888" stroke-width="3"/><line x1="866.1209514113057" y1="276.9893063991831" x2="877.0380434170659" y2="265.29242210729717" stroke="#888" stroke-width="3"/><line x1="859.5414539971199" y1="270.84844214594295" x2="870.4585460028801" y2="259.15155785405705" stroke="#888" stroke-width="3"/><line x1="852.9619565829341" y1="264.70757789270283" x2="863.8790485886943" y2="253.01069360081692" stroke="#888" stroke-width="3"/><text x="835" y="371" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">SCALÈNE</text><text x="835" y="399" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">3 côtés différents</text><text x="500" y="441" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">on mesure (ou on compare) les trois côtés, puis on nomme la famille</text></svg>