<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="313"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Placer des fractions sur la droite</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Entre 0 et 1, chaque fraction a sa place exacte.</text><line x1="120" y1="185" x2="880" y2="185" stroke="#1F4E79" stroke-width="4"/><line x1="120" y1="171" x2="120" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="120" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">0</text><line x1="215" y1="171" x2="215" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="215" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle"></text><line x1="310" y1="171" x2="310" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="310" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">2/8</text><line x1="405" y1="171" x2="405" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="405" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle"></text><line x1="500" y1="171" x2="500" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="500" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">4/8</text><line x1="595" y1="171" x2="595" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="595" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle"></text><line x1="690" y1="171" x2="690" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="690" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">6/8</text><line x1="785" y1="171" x2="785" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="785" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle"></text><line x1="880" y1="171" x2="880" y2="199" stroke="#1F4E79" stroke-width="3"/><text x="880" y="231" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">1</text><circle cx="310" cy="185" r="10" fill="#C2185B"/><text x="310" y="157" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">1/4</text><circle cx="500" cy="185" r="10" fill="#2E7D32"/><text x="500" y="157" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">1/2</text><circle cx="690" cy="185" r="10" fill="#B25000"/><text x="690" y="157" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">3/4</text><text x="500" y="280" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">1/4 = 2/8 et 1/2 = 4/8 : les équivalentes tombent au même endroit</text></svg>