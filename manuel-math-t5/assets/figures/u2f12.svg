<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La priorité des opérations</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Sans règle commune, 5 + 3 × 2 aurait deux réponses. La règle tranche : 11.</text><rect x="130" y="160" width="740" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="197" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">1. Les PARENTHÈSES d’abord</text><line x1="500" y1="220" x2="500" y2="246" stroke="#B25000" stroke-width="4"/><polygon points="500,246 493.91048252244275,233.39374056706254 506.08951747755725,233.39374056706254" fill="#B25000"/><rect x="130" y="250" width="740" height="56" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="287" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">2. Puis les × et les ÷, de gauche à droite</text><line x1="500" y1="310" x2="500" y2="336" stroke="#B25000" stroke-width="4"/><polygon points="500,336 493.91048252244275,323.39374056706254 506.08951747755725,323.39374056706254" fill="#B25000"/><rect x="130" y="340" width="740" height="56" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="377" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">3. Enfin les + et les −, de gauche à droite</text><text x="500" y="445" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">5 + 3 × 2 = 5 + 6 = 11, mais (5 + 3) × 2 = 8 × 2 = 16</text></svg>