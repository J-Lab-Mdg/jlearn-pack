#1F4E79" stroke-width="2"/><polygon points="322,288 345,276.04 391,276.04 368,288" fill="#9FC3E8" stroke="#1F4E79" stroke-width="2"/><polygon points="368,288 391,276.04 391,322.04 368,334" fill="#7FA8D6" stroke="#1F4E79" stroke-width="2"/><rect x="368" y="288" width="46" height="46" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><polygon points="368,288 391,276.04 437,276.04 414,288" fill="#9FC3E8" stroke="#1F4E79" stroke-width="2"/><polygon points="414,288 437,276.04 437,322.04 414,334" fill="#7FA8D6" stroke="#1F4E79" stroke-width="2"/><text x="342" y="420" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">4 cubes</text><text x="514" y="360" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="start">3 rangées</text><text x="150" y="320" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="start">2 étages</text><rect x="640" y="210" width="330" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="805" y="247" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">pavé droit : V = L × l × h</text><text x="805" y="310" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">V = 4 × 3 × 2 = 24 cm³</text><text x="500" y="470" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">le volume se mesure en unités CUBES : le cm³ est un petit dé de 1 cm d’arête</text><rect x="125" y="535" width="80" height="80" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><polygon points="125,535 147,521 227,521 205,535" fill="#C5E1A5" stroke="#2E7D32" stroke-width="2.5"/><polygon points="205,535 227,521 227,601 205,615" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2.5"/><text x="170" y="645" font-family="DejaVu Serif" font-size="18" fill="#2E7D32" font-weight="bold" text-anchor="middle">cube : V = a × a × a</text><text x="170" y="671" font-family="DejaVu Serif" font-size="17" fill="#2E7D32" font-weight="normal" text-anchor="middle">aire totale = 6 × a²</text><polygon points="440,615 510,615 475,545" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><polygon points="510,615 560,597 525,527 475,545" fill="#9FC3E8" stroke="#1F4E79" stroke-width="2.5"/><line x1="440" y1="615" x2="490" y2="597" stroke="#1F4E79" stroke-width="2.5"/><line x1="490" y1="597" x2="560" y2="597" stroke="#1F4E79" stroke-width="2.5"/><text x="500" y="645" font-family="DejaVu Serif" font-size="18" fill="#1F4E79" font-weight="bold" text-anchor="middle">prisme : V = aire base × h</text><text x="500" y="671" font-family="DejaVu Serif" font-size="17" fill="#1F4E79" font-weight="normal" text-anchor="middle">latérale = périmètre base × h</text><rect x="785" y="535" width="90" height="70" fill="#D6E6F5" stroke="none"/><line x1="785" y1="535" x2="785" y2="605" stroke="#1F4E79" stroke-width="2.5"/><line x1="875" y1="535" x2="875" y2="605" stroke="#1F4E79" stroke-width="2.5"/><ellipse cx="830" cy="605" rx="45" ry="14" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><ellipse cx="830" cy="535" rx="45" ry="14" fill="#9FC3E8" stroke="#1F4E79" stroke-width="2.5"/><text x="830" y="645" font-family="DejaVu Serif" font-size="18" fill="#1F4E79" font-weight="bold" text-anchor="middle">cylindre : V = 3,14 × r² × h</text><text x="830" y="671" font-family="DejaVu Serif" font-size="17" fill="#1F4E79" font-weight="normal" text-anchor="middle">latérale = 2 × 3,14 × r × h</text><polygon points="115,820 175,832 230,816 170,808" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><polygon points="115,820 175,832 172,738" fill="#FFF3E0" stroke="#B25000" stroke-width="2.5"/><polygon points="175,832 230,816 172,738" fill="#FFE8C9" stroke="#B25000" stroke-width="2.5"/><text x="170" y="860" font-family="DejaVu Serif" font-size="18" fill="#B25000" font-weight="bold" text-anchor="middle">pyramide :</text><text x="170" y="886" font-family="DejaVu Serif" font-size="17" fill="#B25000" font-weight="normal" text-anchor="middle">V = aire base × h ÷ 3</text><polygon points="455,816 545,816 500,734" fill="#FDE7EF" stroke="#C2185B" stroke-width="2.5"/><ellipse cx="500" cy="816" rx="45" ry="14" fill="#F8BBD0" stroke="#C2185B" stroke-width="2.5"/><text x="500" y="860" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">cône :</text><text x="500" y="886" font-family="DejaVu Serif" font-size="17" fill="#C2185B" font-weight="normal" text-anchor="middle">V = 3,14 × r² × h ÷ 3</text><circle cx="830" cy="782" r="50" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><ellipse cx="830" cy="782" rx="50" ry="16" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="8 6"/><text x="830" y="860" font-family="DejaVu Serif" font-size="18" fill="#2E7D32" font-weight="bold" text-anchor="middle">boule (sphère) :</text><text x="830" y="886" font-family="DejaVu Serif" font-size="17" fill="#2E7D32" font-weight="normal" text-anchor="middle">aire = 4 × 3,14 × r²</text></svg>