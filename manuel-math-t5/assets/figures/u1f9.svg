<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="352"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">5/4 : plus grand que l’unité</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Cinq quarts remplissent une unité entière… et il reste un quart.</text><rect x="110" y="160" width="360" height="70" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="110" y="160" width="90" height="70" fill="#F8BBD0"/><rect x="200" y="160" width="90" height="70" fill="#F8BBD0"/><rect x="290" y="160" width="90" height="70" fill="#F8BBD0"/><rect x="380" y="160" width="90" height="70" fill="#F8BBD0"/><line x1="200" y1="160" x2="200" y2="230" stroke="#1F4E79" stroke-width="2"/><line x1="290" y1="160" x2="290" y2="230" stroke="#1F4E79" stroke-width="2"/><line x1="380" y1="160" x2="380" y2="230" stroke="#1F4E79" stroke-width="2"/><rect x="110" y="160" width="360" height="70" fill="none" stroke="#1F4E79" stroke-width="3"/><rect x="530" y="160" width="360" height="70" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="530" y="160" width="90" height="70" fill="#F8BBD0"/><line x1="620" y1="160" x2="620" y2="230" stroke="#1F4E79" stroke-width="2"/><line x1="710" y1="160" x2="710" y2="230" stroke="#1F4E79" stroke-width="2"/><line x1="800" y1="160" x2="800" y2="230" stroke="#1F4E79" stroke-width="2"/><rect x="530" y="160" width="360" height="70" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="290" y="265" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">4/4 = 1 entier</text><text x="710" y="265" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">et encore 1/4</text><text x="500" y="320" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">5/4 = 1 + 1/4, que l’on écrit aussi « 1 et 1/4 »</text></svg>