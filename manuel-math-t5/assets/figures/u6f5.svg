<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="381"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’expérience aléatoire et son tableau de dénombrement</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Un dé lancé 30 fois : chaque lancer est imprévisible, mais tout s’enregistre.</text><rect x="50" y="155" width="240" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="170" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">face du dé</text><rect x="290" y="155" width="118" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="349" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1</text><rect x="408" y="155" width="118" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="467" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">2</text><rect x="526" y="155" width="118" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="585" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">3</text><rect x="644" y="155" width="118" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="703" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">4</text><rect x="762" y="155" width="118" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="821" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">5</text><rect x="880" y="155" width="118" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="939" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">6</text><rect x="50" y="211" width="240" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="170" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">effectif</text><rect x="290" y="211" width="118" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="349" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">4</text><rect x="408" y="211" width="118" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="467" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">6</text><rect x="526" y="211" width="118" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="585" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5</text><rect x="644" y="211" width="118" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="703" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">7</text><rect x="762" y="211" width="118" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="821" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">3</text><rect x="880" y="211" width="118" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="939" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5</text><text x="500" y="312" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">total : 4 + 6 + 5 + 7 + 3 + 5 = 30 = le nombre de lancers</text><text x="500" y="349" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">imprévisible à chaque lancer… mais les six possibles sont connus d’avance !</text></svg>