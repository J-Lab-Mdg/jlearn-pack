<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="413"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Du rang de la figure au nombre d’objets</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Chaque tour d’allumettes suit la règle : nombre d’allumettes = 2 × rang.</text><line x1="150" y1="255" x2="150" y2="225" stroke="#B25000" stroke-width="5"/><line x1="172" y1="255" x2="172" y2="225" stroke="#B25000" stroke-width="5"/><text x="183" y="295" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">rang 1</text><text x="183" y="327" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">2 allumettes</text><line x1="360" y1="255" x2="360" y2="225" stroke="#B25000" stroke-width="5"/><line x1="382" y1="255" x2="382" y2="225" stroke="#B25000" stroke-width="5"/><line x1="404" y1="255" x2="404" y2="225" stroke="#B25000" stroke-width="5"/><line x1="426" y1="255" x2="426" y2="225" stroke="#B25000" stroke-width="5"/><text x="393" y="295" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">rang 2</text><text x="393" y="327" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">4 allumettes</text><line x1="570" y1="255" x2="570" y2="225" stroke="#B25000" stroke-width="5"/><line x1="592" y1="255" x2="592" y2="225" stroke="#B25000" stroke-width="5"/><line x1="614" y1="255" x2="614" y2="225" stroke="#B25000" stroke-width="5"/><line x1="636" y1="255" x2="636" y2="225" stroke="#B25000" stroke-width="5"/><line x1="570" y1="221" x2="570" y2="191" stroke="#B25000" stroke-width="5"/><line x1="592" y1="221" x2="592" y2="191" stroke="#B25000" stroke-width="5"/><text x="603" y="295" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">rang 3</text><text x="603" y="327" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">6 allumettes</text><line x1="780" y1="255" x2="780" y2="225" stroke="#B25000" stroke-width="5"/><line x1="802" y1="255" x2="802" y2="225" stroke="#B25000" stroke-width="5"/><line x1="824" y1="255" x2="824" y2="225" stroke="#B25000" stroke-width="5"/><line x1="846" y1="255" x2="846" y2="225" stroke="#B25000" stroke-width="5"/><line x1="780" y1="221" x2="780" y2="191" stroke="#B25000" stroke-width="5"/><line x1="802" y1="221" x2="802" y2="191" stroke="#B25000" stroke-width="5"/><line x1="824" y1="221" x2="824" y2="191" stroke="#B25000" stroke-width="5"/><line x1="846" y1="221" x2="846" y2="191" stroke="#B25000" stroke-width="5"/><text x="813" y="295" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">rang 4</text><text x="813" y="327" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">8 allumettes</text><text x="500" y="380" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">rang 1 → 2 ; rang 2 → 4 ; rang 3 → 6 ; rang 4 → 8 : la relation est « × 2 »</text></svg>