<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="591"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les mots-indices : le texte dit quelle opération choisir</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Certains mots de l’énoncé annoncent l’opération — mais méfiance : ils ne sont pas toujours honnêtes !</text><rect x="55" y="143" width="216" height="196" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="163" y="175" font-family="DejaVu Serif" font-size="18" fill="#2E7D32" font-weight="bold" text-anchor="middle">ADDITION  +</text><text x="163" y="209" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">en tout, ensemble,</text><text x="163" y="238" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">total, gagne, reçoit,</text><text x="163" y="267" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">réunit, ajoute, de plus</text><rect x="283" y="143" width="216" height="196" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="391" y="175" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">SOUSTRACTION  −</text><text x="391" y="209" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">reste, perd, donne,</text><text x="391" y="238" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">mange, dépense,</text><text x="391" y="267" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">de moins que,</text><text x="391" y="296" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">rendu (monnaie)</text><rect x="511" y="143" width="216" height="196" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="619" y="175" font-family="DejaVu Serif" font-size="18" fill="#1F4E79" font-weight="bold" text-anchor="middle">MULTIPLICATION  ×</text><text x="619" y="209" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">chacun, le kilo, le mètre</text><text x="619" y="238" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">(prix unitaire), fois,</text><text x="619" y="267" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">par jour, paquets de,</text><text x="619" y="296" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">rangées de</text><rect x="739" y="143" width="216" height="196" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="847" y="175" font-family="DejaVu Serif" font-size="18" fill="#B25000" font-weight="bold" text-anchor="middle">DIVISION  ÷</text><text x="847" y="209" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">partager, combien</text><text x="847" y="238" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">de fois, en sachets</text><text x="847" y="267" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">de, en équipes de,</text><text x="847" y="296" font-family="DejaVu Serif" font-size="16" fill="#222" font-weight="normal" text-anchor="middle">répartir, semaines</text><rect x="55" y="365" width="890" height="92" rx="10" fill="white" stroke="#C2185B" stroke-width="3.5"/><text x="500" y="395" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">PIÈGE : « de plus que » peut cacher une SOUSTRACTION !</text><text x="500" y="427" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">Hery a 3 billes de plus que Vola ; Hery en a 15 → Vola : 15 − 3 = 12</text><rect x="55" y="477" width="890" height="92" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/><text x="500" y="507" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">LA QUESTION CACHÉE : que dois-je calculer AVANT de répondre ?</text><text x="500" y="539" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">le total avant la monnaie rendue, les grammes avant le partage…</text></svg>