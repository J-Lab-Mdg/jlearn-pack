<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="443"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Deux triangles, trois figures</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Avec les mêmes deux triangles rectangles, on assemble des figures différentes.</text><polygon points="80,335 220,335 80,195" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><polygon points="220,335 220,195 80,195" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="150" y="367" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">un carré</text><polygon points="350,335 490,335 350,195" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><polygon points="490,335 630,335 490,195" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="490" y="367" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">un grand triangle</text><polygon points="840,335 980,335 840,195" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><polygon points="840,335 840,195 700,195" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="840" y="367" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">un parallélogramme</text><text x="500" y="411" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">mêmes pièces, assemblages différents : composer, c’est créer des figures nouvelles</text></svg>