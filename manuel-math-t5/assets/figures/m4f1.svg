<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="701"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le schéma de contrôle par 9</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Réduis chaque nombre, suis les flèches et compare.</text><text x="250" y="169" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">MULTIPLICATION : 47 × 73 = 3 431</text><text x="750" y="169" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">DIVISION : 425 ÷ 7 = 60, reste 5</text><line x1="192" y1="281" x2="308" y2="397" stroke="#1F4E79" stroke-width="5"/><line x1="192" y1="397" x2="308" y2="281" stroke="#1F4E79" stroke-width="5"/><line x1="250" y1="291" x2="298" y2="323" stroke="#C2185B" stroke-width="3"/><polygon points="298,323 284.1331015886072,321.07409022846036 290.8888146680431,310.94052060930653" fill="#C2185B"/><line x1="250" y1="387" x2="298" y2="355" stroke="#B25000" stroke-width="3"/><polygon points="298,355 290.8888146680431,367.05947939069347 284.1331015886072,356.92590977153964" fill="#B25000"/><line x1="202" y1="323" x2="242" y2="336" stroke="#2E7D32" stroke-width="3"/><polygon points="242,336 228.1288327604465,337.89491936829455 231.89320283958466,326.3122422017156" fill="#2E7D32"/><text x="250" y="265" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="middle">2</text><text x="250" y="441" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="middle">1</text><text x="158" y="351" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">2</text><text x="342" y="351" font-family="DejaVu Serif" font-size="32" fill="#B25000" font-weight="bold" text-anchor="middle">2</text><text x="250" y="237" font-family="DejaVu Serif" font-size="15" fill="#888" font-weight="bold" text-anchor="middle">H</text><text x="250" y="471" font-family="DejaVu Serif" font-size="15" fill="#888" font-weight="bold" text-anchor="middle">B</text><text x="114" y="351" font-family="DejaVu Serif" font-size="15" fill="#888" font-weight="bold" text-anchor="middle">G</text><text x="386" y="351" font-family="DejaVu Serif" font-size="15" fill="#888" font-weight="bold" text-anchor="middle">D</text><line x1="692" y1="281" x2="808" y2="397" stroke="#1F4E79" stroke-width="5"/><line x1="692" y1="397" x2="808" y2="281" stroke="#1F4E79" stroke-width="5"/><line x1="750" y1="291" x2="798" y2="323" stroke="#C2185B" stroke-width="3"/><polygon points="798,323 784.1331015886072,321.07409022846036 790.8888146680431,310.94052060930653" fill="#C2185B"/><line x1="750" y1="387" x2="798" y2="355" stroke="#B25000" stroke-width="3"/><polygon points="798,355 790.8888146680431,367.05947939069347 784.1331015886072,356.92590977153964" fill="#B25000"/><line x1="702" y1="323" x2="742" y2="336" stroke="#2E7D32" stroke-width="3"/><polygon points="742,336 728.1288327604465,337.89491936829455 731.8932028395847,326.3122422017156" fill="#2E7D32"/><text x="750" y="265" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="middle">7</text><text x="750" y="441" font-family="DejaVu Serif" font-size="32" fill="#C2185B" font-weight="bold" text-anchor="middle">6</text><text x="658" y="351" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">2</text><text x="842" y="351" font-family="DejaVu Serif" font-size="32" fill="#B25000" font-weight="bold" text-anchor="middle">2</text><text x="750" y="237" font-family="DejaVu Serif" font-size="15" fill="#888" font-weight="bold" text-anchor="middle">H</text><text x="750" y="471" font-family="DejaVu Serif" font-size="15" fill="#888" font-weight="bold" text-anchor="middle">B</text><text x="614" y="351" font-family="DejaVu Serif" font-size="15" fill="#888" font-weight="bold" text-anchor="middle">G</text><text x="886" y="351" font-family="DejaVu Serif" font-size="15" fill="#888" font-weight="bold" text-anchor="middle">D</text><text x="250" y="521" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">47 → 4+7 = 11 → 2 (H) ; 73 → 10 → 1 (B)</text><text x="250" y="549" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">produit 3 431 → 2 (G) ; D = H × B = 2 × 1 = 2 ✓</text><text x="750" y="521" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">diviseur 7 (H) ; quotient 60 → 6 (B)</text><text x="750" y="549" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="middle">dividende 425 → 2 (G) ; D = (H × B) + 5 = 47 → 2 ✓</text><rect x="80" y="573" width="840" height="46" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="605" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">MULTIPLICATION : D = H × B.  DIVISION : D = (H × B) + reste.  Si G = D → résultat ✓</text><rect x="80" y="635" width="840" height="46" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="667" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">RÉDUIRE : additionner les chiffres jusqu’à un seul : 3431 → 11 → 2 (les 9 se jettent !)</text></svg>