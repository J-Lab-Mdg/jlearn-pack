<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="348"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Une division, deux questions</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">24 ÷ 4 répond à deux questions très différentes… avec le même calcul !</text><rect x="70" y="160" width="410" height="110" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="275" y="224" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="275" y="195" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">PARTAGE</text><text x="275" y="228" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">24 mangues, 4 bols :</text><text x="275" y="255" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">combien DANS chaque bol ?</text><rect x="520" y="160" width="410" height="110" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="725" y="224" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="725" y="195" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">GROUPEMENT</text><text x="725" y="228" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">24 élèves, équipes de 4 :</text><text x="725" y="255" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">combien D’ÉQUIPES ?</text><text x="500" y="315" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">les deux réponses valent 24 ÷ 4 = 6</text></svg>