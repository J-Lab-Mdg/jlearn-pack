<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="384"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Deux familles de suites</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Motif répété : le même paquet revient ; motif croissant : ça grandit à chaque pas.</text><text x="70" y="172" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="start">répété :</text><circle cx="230" cy="160" r="20" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><circle cx="302" cy="160" r="20" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><polygon points="352,178 396,178 374,138" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><circle cx="446" cy="160" r="20" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><circle cx="518" cy="160" r="20" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><polygon points="568,178 612,178 590,138" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><circle cx="662" cy="160" r="20" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><circle cx="734" cy="160" r="20" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><polygon points="784,178 828,178 806,138" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="70" y="262" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="start">croissant :</text><circle cx="250" cy="255" r="11" fill="#1F4E79"/><text x="250" y="300" font-family="DejaVu Serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">1</text><circle cx="335" cy="255" r="11" fill="#1F4E79"/><circle cx="365" cy="255" r="11" fill="#1F4E79"/><text x="350" y="300" font-family="DejaVu Serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">2</text><circle cx="450" cy="255" r="11" fill="#1F4E79"/><circle cx="480" cy="255" r="11" fill="#1F4E79"/><circle cx="510" cy="255" r="11" fill="#1F4E79"/><text x="480" y="300" font-family="DejaVu Serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">3</text><circle cx="595" cy="255" r="11" fill="#1F4E79"/><circle cx="625" cy="255" r="11" fill="#1F4E79"/><circle cx="655" cy="255" r="11" fill="#1F4E79"/><circle cx="685" cy="255" r="11" fill="#1F4E79"/><text x="640" y="300" font-family="DejaVu Serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">4</text><text x="500" y="352" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">le motif du haut : « rond, rond, triangle » ; la règle du bas : « + 1 jeton à chaque figure »</text></svg>