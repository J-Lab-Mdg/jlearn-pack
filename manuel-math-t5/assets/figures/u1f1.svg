<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="385"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Lire un grand nombre par classes</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On sépare les chiffres par tranches de trois, en partant de la droite.</text><rect x="120" y="155" width="380" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="310" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Classe des mille</text><rect x="500" y="155" width="380" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="690" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Classe des unités</text><rect x="120" y="211" width="380" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="310" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">348</text><rect x="500" y="211" width="380" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="690" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">256</text><text x="500" y="317" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">348 256 se lit : « trois cent quarante-huit mille deux cent cinquante-six »</text><text x="500" y="355" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">1 000 000 = mille fois mille : un million</text></svg>