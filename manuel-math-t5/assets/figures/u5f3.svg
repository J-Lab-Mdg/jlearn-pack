<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="502"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La circonférence du cercle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le tour du cercle vaut environ 3,14 fois son diamètre.</text><circle cx="320" cy="315" r="125" fill="#D6E6F5" stroke="#1F4E79" stroke-width="4"/><line x1="195" y1="315" x2="445" y2="315" stroke="#C2185B" stroke-width="3.5"/><circle cx="320" cy="315" r="7" fill="#C2185B"/><text x="320" y="301" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">diamètre d = 70 cm</text><line x1="320" y1="315" x2="397.70124603383306" y2="217.08413629656457" stroke="#2E7D32" stroke-width="3.5"/><text x="406" y="241" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">rayon</text><rect x="560" y="220" width="380" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="750" y="257" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">d = 2 × rayon</text><rect x="560" y="300" width="380" height="56" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="750" y="337" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">C = d × 3,14</text><text x="750" y="405" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">C = 70 × 3,14 = 219,8 cm</text><text x="500" y="470" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">la roue de 70 cm avance de 2,198 m à chaque tour !</text></svg>