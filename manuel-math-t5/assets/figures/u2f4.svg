<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="388"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Vérifier sans refaire pareil</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Deux gardiens du calcul : l’opération inverse et l’ordre de grandeur.</text><rect x="90" y="160" width="820" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="199" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">PREUVE : 742 − 268 = 474, car 474 + 268 = 742</text><rect x="90" y="245" width="820" height="60" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="284" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">ESTIMATION : 742 − 268, c’est proche de 700 − 300 = 400</text><text x="500" y="355" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">si la preuve retombe juste ET que l’ordre de grandeur colle, le résultat est sûr</text></svg>