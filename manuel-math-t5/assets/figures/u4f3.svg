<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="473"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Classer les triangles par leurs angles</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Un seul angle suffit parfois à baptiser le triangle entier.</text><polygon points="90,335 290,335 90,185" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3.5"/><path d="M 114 335 L 114 311 L 90 311" fill="none" stroke="#C2185B" stroke-width="2.5"/><text x="190" y="371" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">RECTANGLE</text><text x="190" y="399" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">un angle droit</text><polygon points="420,335 600,335 520,175" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/><path d="M 458 335 A 38 38 0 0 0 440.21070741222553 302.8203899045154" fill="none" stroke="#2E7D32" stroke-width="3"/><path d="M 582.7633473858281 301.13412031766546 A 38 38 0 0 0 562 335" fill="none" stroke="#2E7D32" stroke-width="3"/><text x="510" y="371" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">TOUS ANGLES AIGUS</text><text x="510" y="399" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">trois angles fermés</text><polygon points="720,335 950,335 880,215" fill="#FFF3E0" stroke="#B25000" stroke-width="3.5"/><path d="M 760 335 A 40 40 0 0 0 755.1033024756149 315.8229784558319" fill="none" stroke="#B25000" stroke-width="3"/><path d="M 850.1621928957273 231.3004683125429 A 34 34 0 0 0 910.615201479991 229.78882815978181" fill="none" stroke="#C2185B" stroke-width="3"/><text x="835" y="371" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">UN ANGLE OBTUS</text><text x="835" y="399" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">un angle grand ouvert</text><text x="500" y="441" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">le triangle rectangle porte le coin de l’équerre dans son angle</text></svg>