<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="414"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Multiplier des fractions</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Fraction × entier : on répète ; fraction × fraction : on prend une part de part.</text><rect x="90" y="160" width="820" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="198" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">3 × 1/4 = 3/4 : trois fois un quart</text><rect x="90" y="240" width="820" height="58" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="278" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">1/2 × 3/4 = 3/8 : la moitié de trois quarts</text><text x="500" y="345" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">règle : numérateur × numérateur, dénominateur × dénominateur</text><text x="500" y="382" font-family="DejaVu Serif" font-size="24" fill="#1F4E79" font-weight="bold" text-anchor="middle">1/2 × 3/4 = (1 × 3) / (2 × 4) = 3/8</text></svg>