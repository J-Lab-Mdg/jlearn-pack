<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="432"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Trouver le nombre caché</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une équation est une égalité à trou : on cherche la valeur qui équilibre.</text><rect x="130" y="155" width="740" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="191" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">897 + □ = 917</text><rect x="130" y="229" width="740" height="54" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="265" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">essais : 10 ? → 907, trop petit ; 30 ? → 927, trop grand ; 20 ? → 917 ✓</text><rect x="130" y="303" width="740" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="339" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">vérification : 897 + 20 = 917 ✓   donc □ = 20</text><text x="500" y="400" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">autres équations du programme : 897 − □ = 847 (□ = 50) ; 897 ÷ □ = 299 (□ = 3)</text></svg>