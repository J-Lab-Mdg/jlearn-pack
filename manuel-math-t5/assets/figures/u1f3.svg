<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comparer deux grands nombres</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Même nombre de chiffres : on compare colonne par colonne depuis la gauche.</text><text x="290" y="190" font-family="DejaVu Serif" font-size="34" fill="#2E7D32" font-weight="bold" text-anchor="middle">4 5 8 2 1 7</text><text x="710" y="190" font-family="DejaVu Serif" font-size="34" fill="#1F4E79" font-weight="bold" text-anchor="middle">4 5 6 9 9 8</text><text x="500" y="190" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">?</text><rect x="150" y="220" width="280" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="290" y="256" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">4 = 4, puis 5 = 5</text><rect x="570" y="220" width="280" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="710" y="256" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">puis 8 > 6 : gagné !</text><text x="500" y="320" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">458 217 > 456 998</text><text x="500" y="360" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">et un nombre de 6 chiffres est toujours plus grand qu’un nombre de 5 chiffres</text></svg>