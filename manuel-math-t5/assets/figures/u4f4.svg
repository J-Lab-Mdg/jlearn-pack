<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="513"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La carte d’identité du triangle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">3 sommets, 3 côtés, 3 angles : tout se nomme avec les lettres A, B, C.</text><polygon points="300,405 700,405 560,195" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="300" cy="405" r="8" fill="#C2185B"/><circle cx="700" cy="405" r="8" fill="#C2185B"/><circle cx="560" cy="195" r="8" fill="#C2185B"/><text x="272" y="415" font-family="DejaVu Serif" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">A</text><text x="728" y="415" font-family="DejaVu Serif" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">B</text><text x="560" y="173" font-family="DejaVu Serif" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">C</text><text x="500" y="439" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">côté [AB]</text><text x="395" y="280" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">côté [AC]</text><text x="672" y="287" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">côté [BC]</text><path d="M 346 405 A 46 46 0 0 0 332.7020227485648 372.64914671678116" fill="none" stroke="#B25000" stroke-width="3"/><text x="372" y="373" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="bold" text-anchor="middle">angle A</text><text x="500" y="481" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">le triangle ABC : sommets A, B, C — côtés [AB], [BC], [CA] — angles en A, en B, en C</text></svg>