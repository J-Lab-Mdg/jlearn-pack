<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le tableau des masses</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Du gramme à la tonne : t, q, kg, hg, dag, g — et les grandes équivalences.</text><rect x="200" y="155" width="100" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="250" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">t</text><rect x="300" y="155" width="100" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="350" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">q</text><rect x="400" y="155" width="100" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="450" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">kg</text><rect x="500" y="155" width="100" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="550" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">hg</text><rect x="600" y="155" width="100" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="650" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">dag</text><rect x="700" y="155" width="100" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="750" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">g</text><rect x="200" y="209" width="100" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="250" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="300" y="209" width="100" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="350" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="400" y="209" width="100" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="450" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2</text><rect x="500" y="209" width="100" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="550" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5</text><rect x="600" y="209" width="100" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="650" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">0</text><rect x="700" y="209" width="100" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="750" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">0</text><text x="500" y="305" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">2 500 g = 2,5 kg (la virgule se place sous le kg)</text><text x="500" y="343" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">1 t = 1 000 kg ; 1 q (quintal) = 100 kg ; 1 kg = 1 000 g</text></svg>