<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="378"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Mesurer le temps</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Attention : le temps ne compte pas en dizaines… mais en 60 !</text><rect x="60" y="155" width="150" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="135" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1 min</text><rect x="210" y="155" width="150" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="285" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1 h</text><rect x="360" y="155" width="150" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="435" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1 jour</text><rect x="510" y="155" width="190" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="605" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1 semaine</text><rect x="700" y="155" width="240" height="54" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="191" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1 an</text><rect x="60" y="209" width="150" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="135" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">60 s</text><rect x="210" y="209" width="150" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="285" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">60 min</text><rect x="360" y="209" width="150" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="435" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">24 h</text><rect x="510" y="209" width="190" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="605" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">7 jours</text><rect x="700" y="209" width="240" height="54" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="245" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">12 mois / 365 j</text><text x="500" y="308" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">2 h 45 min + 1 h 30 min = 3 h 75 min = 4 h 15 min</text><text x="500" y="346" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">75 min dépasse 60 : on échange 60 min contre 1 h</text></svg>