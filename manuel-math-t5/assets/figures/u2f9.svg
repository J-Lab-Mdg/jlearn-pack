<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="411"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Diviser par une fraction</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Combien de quarts dans un demi ? La bande répond : deux.</text><rect x="150" y="155" width="700" height="56" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="150" y="155" width="350" height="56" fill="#F8BBD0"/><line x1="500" y1="155" x2="500" y2="211" stroke="#1F4E79" stroke-width="2"/><rect x="150" y="155" width="700" height="56" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="95" y="193" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">1/2</text><rect x="150" y="231" width="700" height="56" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="150" y="231" width="175" height="56" fill="#F8BBD0"/><rect x="325" y="231" width="175" height="56" fill="#F8BBD0"/><line x1="325" y1="231" x2="325" y2="287" stroke="#1F4E79" stroke-width="2"/><line x1="500" y1="231" x2="500" y2="287" stroke="#1F4E79" stroke-width="2"/><line x1="675" y1="231" x2="675" y2="287" stroke="#1F4E79" stroke-width="2"/><rect x="150" y="231" width="700" height="56" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="95" y="269" font-family="DejaVu Serif" font-size="26" fill="#C2185B" font-weight="bold" text-anchor="middle">1/4</text><text x="500" y="340" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">1/2 ÷ 1/4 = 2 : un demi contient deux quarts</text><text x="500" y="379" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">règle : diviser, c’est multiplier par la fraction renversée : 1/2 × 4/1 = 4/2 = 2</text></svg>