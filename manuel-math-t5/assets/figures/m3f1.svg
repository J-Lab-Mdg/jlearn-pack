<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1023"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Bien poser : trois règles d’or avant de calculer</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le calcul posé ne trompe pas — à condition de respecter ses règles.</text><rect x="60" y="145" width="420" height="130" rx="10" fill="white" stroke="#C00000" stroke-width="3.5"/><text x="270" y="183" font-family="DejaVu Serif" font-size="30" fill="#C00000" font-weight="bold" text-anchor="middle">12 m + 4 km</text><line x1="150" y1="157" x2="390" y2="197" stroke="#C00000" stroke-width="5"/><line x1="150" y1="197" x2="390" y2="157" stroke="#C00000" stroke-width="5"/><text x="270" y="223" font-family="DejaVu Serif" font-size="19" fill="#C00000" font-weight="bold" text-anchor="middle">INTERDIT ! On ne mélange jamais</text><text x="270" y="251" font-family="DejaVu Serif" font-size="19" fill="#C00000" font-weight="bold" text-anchor="middle">des unités différentes</text><rect x="520" y="145" width="420" height="130" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.5"/><text x="730" y="183" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">12 m + 4 000 m = 4 012 m</text><text x="730" y="223" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">on convertit D’ABORD :</text><text x="730" y="251" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">4 km = 4 000 m — puis on additionne</text><rect x="60" y="303" width="880" height="196" rx="10" fill="white" stroke="#1F4E79" stroke-width="3"/><text x="110" y="337" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="start">LES VIRGULES S’ALIGNENT</text><text x="430" y="343" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="bold" text-anchor="middle">12,75</text><text x="384" y="379" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">+</text><text x="436" y="379" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="bold" text-anchor="middle">3,50</text><line x1="390" y1="395" x2="470" y2="395" stroke="#1F4E79" stroke-width="3"/><text x="430" y="431" font-family="DejaVu Serif" font-size="26" fill="#2E7D32" font-weight="bold" text-anchor="middle">16,25</text><line x1="430" y1="321" x2="430" y2="451" stroke="#C2185B" stroke-width="2" stroke-dasharray="7 4"/><text x="640" y="343" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="start">chaque chiffre reste dans sa colonne</text><text x="640" y="373" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="start">unités sous unités, dixièmes sous dixièmes</text><text x="640" y="411" font-family="DejaVu Serif" font-size="18" fill="#222" font-weight="normal" text-anchor="start">on peut compléter avec des zéros :</text><text x="640" y="441" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="start">3,5 = 3,50</text><rect x="60" y="519" width="880" height="46" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="551" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">ATTENTION AUX ZÉROS : 13,01 × 40,1 — chaque zéro compte, aucun ne se perd !</text><rect x="60" y="581" width="880" height="46" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="613" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">ESTIME AVANT (13 × 40 ≈ 520), VÉRIFIE APRÈS (preuve, fiche 4)</text><text x="500" y="693" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="middle">MULTIPLICATION POSÉE : 693 × 94</text><text x="526" y="741" font-family="DejaVu Serif" font-size="31" fill="#222" font-weight="bold" text-anchor="middle">6</text><text x="574" y="741" font-family="DejaVu Serif" font-size="31" fill="#222" font-weight="bold" text-anchor="middle">9</text><text x="622" y="741" font-family="DejaVu Serif" font-size="31" fill="#222" font-weight="bold" text-anchor="middle">3</text><text x="478" y="787" font-family="DejaVu Serif" font-size="30" fill="#1F4E79" font-weight="bold" text-anchor="middle">×</text><text x="574" y="787" font-family="DejaVu Serif" font-size="31" fill="#222" font-weight="bold" text-anchor="middle">9</text><text x="622" y="787" font-family="DejaVu Serif" font-size="31" fill="#222" font-weight="bold" text-anchor="middle">4</text><line x1="440" y1="805" x2="680" y2="805" stroke="#1F4E79" stroke-width="3"/><text x="478" y="843" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">2</text><text x="526" y="843" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">7</text><text x="574" y="843" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">7</text><text x="622" y="843" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">2</text><line x1="627" y1="791" x2="627" y2="825" stroke="#C2185B" stroke-width="3"/><polygon points="627,825 620.9104825224427,812.3937405670625 633.0895174775573,812.3937405670625" fill="#C2185B"/><text x="430" y="885" font-family="DejaVu Serif" font-size="30" fill="#B25000" font-weight="bold" text-anchor="middle">6</text><text x="478" y="885" font-family="DejaVu Serif" font-size="30" fill="#B25000" font-weight="bold" text-anchor="middle">2</text><text x="526" y="885" font-family="DejaVu Serif" font-size="30" fill="#B25000" font-weight="bold" text-anchor="middle">3</text><text x="574" y="885" font-family="DejaVu Serif" font-size="30" fill="#B25000" font-weight="bold" text-anchor="middle">7</text><text x="622" y="885" font-family="DejaVu Serif" font-size="30" fill="#B25000" font-weight="bold" text-anchor="middle">0</text><line x1="579" y1="791" x2="579" y2="867" stroke="#B25000" stroke-width="3"/><polygon points="579,867 572.9104825224427,854.3937405670625 585.0895174775573,854.3937405670625" fill="#B25000"/><line x1="440" y1="903" x2="680" y2="903" stroke="#1F4E79" stroke-width="3"/><text x="430" y="943" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">6</text><text x="478" y="943" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">5</text><text x="526" y="943" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">1</text><text x="574" y="943" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">4</text><text x="622" y="943" font-family="DejaVu Serif" font-size="32" fill="#2E7D32" font-weight="bold" text-anchor="middle">2</text><text x="760" y="843" font-family="DejaVu Serif" font-size="17" fill="#C2185B" font-weight="bold" text-anchor="start">× 4 unités</text><text x="760" y="885" font-family="DejaVu Serif" font-size="17" fill="#B25000" font-weight="bold" text-anchor="start">× 9 dizaines</text><text x="500" y="987" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">les flèches montrent d’où vient chaque ligne</text></svg>