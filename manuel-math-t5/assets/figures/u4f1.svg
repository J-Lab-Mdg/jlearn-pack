<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="464"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Trois familles d’angles</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On compare chaque angle au coin de l’équerre : l’angle droit.</text><line x1="80" y1="320" x2="260" y2="320" stroke="#1F4E79" stroke-width="4"/><line x1="80" y1="320" x2="226.4981221992561" y2="215.41367110328508" stroke="#1F4E79" stroke-width="4"/><path d="M 132 320 A 52 52 0 0 0 122.32167974645176 289.78617165206015" fill="none" stroke="#C2185B" stroke-width="3"/><text x="170" y="360" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">AIGU</text><text x="170" y="390" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">plus fermé que l’angle droit</text><line x1="410" y1="320" x2="590" y2="320" stroke="#1F4E79" stroke-width="4"/><line x1="410" y1="320" x2="410" y2="150" stroke="#1F4E79" stroke-width="4"/><path d="M 436 320 L 436 294 L 410 294" fill="none" stroke="#C2185B" stroke-width="2.5"/><text x="500" y="360" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">DROIT</text><text x="500" y="390" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">le coin de l’équerre</text><line x1="740" y1="320" x2="920" y2="320" stroke="#1F4E79" stroke-width="4"/><line x1="740" y1="320" x2="620.0703161696317" y2="185.77306180819036" stroke="#1F4E79" stroke-width="4"/><path d="M 792 320 A 52 52 0 0 0 705.3536468934492 281.2233289668105" fill="none" stroke="#B25000" stroke-width="3"/><text x="830" y="360" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">OBTUS</text><text x="830" y="390" font-family="DejaVu Serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">plus ouvert que l’angle droit</text><text x="500" y="432" font-family="DejaVu Serif" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle">aigu &lt; droit &lt; obtus : l’équerre départage sans se tromper</text></svg>