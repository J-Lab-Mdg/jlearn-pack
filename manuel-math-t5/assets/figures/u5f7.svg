<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="434"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’aire : compter les carreaux</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le carrelage le montre : 5 rangées de 3 carreaux = 15 carreaux.</text><rect x="140" y="160" width="52" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><rect x="140" y="212" width="52" height="52" fill="#FDE7EF" stroke="#1F4E79" stroke-width="2"/><rect x="140" y="264" width="52" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><rect x="192" y="160" width="52" height="52" fill="#FDE7EF" stroke="#1F4E79" stroke-width="2"/><rect x="192" y="212" width="52" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><rect x="192" y="264" width="52" height="52" fill="#FDE7EF" stroke="#1F4E79" stroke-width="2"/><rect x="244" y="160" width="52" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><rect x="244" y="212" width="52" height="52" fill="#FDE7EF" stroke="#1F4E79" stroke-width="2"/><rect x="244" y="264" width="52" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><rect x="296" y="160" width="52" height="52" fill="#FDE7EF" stroke="#1F4E79" stroke-width="2"/><rect x="296" y="212" width="52" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><rect x="296" y="264" width="52" height="52" fill="#FDE7EF" stroke="#1F4E79" stroke-width="2"/><rect x="348" y="160" width="52" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><rect x="348" y="212" width="52" height="52" fill="#FDE7EF" stroke="#1F4E79" stroke-width="2"/><rect x="348" y="264" width="52" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2"/><text x="270" y="350" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">5 cm</text><text x="100" y="245" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">3 cm</text><rect x="520" y="180" width="420" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="730" y="217" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">aire du rectangle = L × l</text><rect x="520" y="260" width="420" height="56" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="730" y="297" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">aire du carré = côté × côté</text><text x="730" y="360" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">A = 5 × 3 = 15 cm²</text><text x="500" y="402" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">l’aire se mesure en unités CARRÉES : cm², m²…</text></svg>