<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C0392B"/></marker></defs><rect width="1200" height="780" fill="#fff"/><rect x="0" y="0" width="1200" height="110" fill="#16A085"/><text x="40" y="48" font-family="Arial" font-size="34" font-weight="700" fill="#fff">Préparer les signes de nuance</text><text x="40" y="86" font-family="Arial" font-size="26" fill="#EAF2F8">Séance 21 · Musique — Main haute = plus fort ; main basse = plus doux ; mouvement montant = crescendo.</text><rect x="180" y="520" width="60" height="40" fill="#E67E22"/><rect x="290" y="490" width="60" height="70" fill="#E67E22"/><rect x="400" y="450" width="60" height="110" fill="#E67E22"/><rect x="510" y="400" width="60" height="160" fill="#E67E22"/><rect x="620" y="350" width="60" height="210" fill="#1F4E79"/><rect x="730" y="400" width="60" height="160" fill="#1F4E79"/><rect x="840" y="450" width="60" height="110" fill="#1F4E79"/><rect x="950" y="490" width="60" height="70" fill="#1F4E79"/><text x="180" y="250" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1F4E79" text-anchor="start">Doux → fort → doux</text><text x="180" y="660" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1F4E79" text-anchor="start">Signes de main</text></svg>