<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C0392B"/></marker></defs><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="130" fill="#1F4E79"/><text x="40" y="46" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#fff">Dessiner un autre lieu de vie</text><text x="40" y="118" font-family="DejaVu Sans, Arial" font-size="25" fill="#EAF2F8">Séance 5 · Dessin</text><rect x="60" y="150" width="900" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="60" y="150" width="900" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="76" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Pratique : autre lieu de vie</text><rect x="110" y="210" width="800" height="420" rx="14" fill="#fff" stroke="#222" stroke-width="3"/><line x1="110" y1="330" x2="910" y2="330" stroke="#1F4E79" stroke-width="4" stroke-dasharray="10 8"/><text x="140" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#555" text-anchor="start">Cour d’école ou bord de rivière</text><text x="140" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F4E79" text-anchor="start">Garde les plans, change le lieu</text><rect x="1000" y="150" width="340" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="1000" y="150" width="340" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="1016" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Critères</text><text x="1020" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#2E7D32" text-anchor="start">✔ Plans</text><t