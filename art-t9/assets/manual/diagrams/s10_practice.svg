<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C0392B"/></marker></defs><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="130" fill="#8B5A2B"/><text x="40" y="46" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#fff">Améliorer l’instrument d’un autre binôme</text><text x="40" y="118" font-family="DejaVu Sans, Arial" font-size="25" fill="#EAF2F8">Séance 10 · Sculpture</text><rect x="60" y="150" width="620" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="60" y="150" width="620" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="76" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Avant : problème</text><g transform="translate(180,280) scale(1.2)"><path d="M0 40 L20 220 Q120 260 220 220 L240 40" fill="#D9B38C" stroke="#222" stroke-width="4"/><ellipse cx="120" cy="40" rx="120" ry="38" fill="#fff" stroke="#222" stroke-width="4"/></g><text x="140" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#C0392B" text-anchor="start">Membrane lâche / son mou</text><rect x="720" y="150" width="620" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="720" y="150" width="620" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="736" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Après : ajustement</text><g transform="translate(840,280) scale(1.2)"><path d="M0 40 L20 220 Q120 260 220 220 L240 40" fill="#D9B38C" stroke="#222" stroke-width="4"/><ellipse cx="120" cy="40" rx="120" ry="38" fill="#fff" stroke="#222" stroke-width="4"/></g><line x1="840" y1="360" x2="1080" y2="360" stroke="#C03