<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C0392B"/></marker></defs><rect width="1400" height="920" fill="#fff"/><rect width="1400" height="130" fill="#8B5A2B"/><text x="40" y="46" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#fff">Décorer un autre instrument</text><text x="40" y="118" font-family="DejaVu Sans, Arial" font-size="25" fill="#EAF2F8">Séance 9 · Sculpture</text><rect x="60" y="150" width="800" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="60" y="150" width="800" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="76" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Décorer le corps, pas la membrane</text><g transform="translate(220,260) scale(1.6)"><path d="M0 40 L20 220 Q120 260 220 220 L240 40" fill="#D9B38C" stroke="#222" stroke-width="4"/><ellipse cx="120" cy="40" rx="120" ry="38" fill="#fff" stroke="#222" stroke-width="4"/></g><path d="M280 480 l30 -40 l30 40z" fill="#2E7D32" stroke="#222" stroke-width="2"/><path d="M350 480 l30 -40 l30 40z" fill="#E67E22" stroke="#222" stroke-width="2"/><path d="M420 480 l30 -40 l30 40z" fill="#2E7D32" stroke="#222" stroke-width="2"/><path d="M490 480 l30 -40 l30 40z" fill="#E67E22" stroke="#222" stroke-width="2"/><path d="M560 480 l30 -40 l30 40z" fill="#2E7D32" stroke="#222" stroke-width="2"/><text x="180" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#222" text-anchor="start">Motifs en bas-relief sur le côté</text><rect x="900" y="150" width="440" height="540" rx="14" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="900" y="150" width="440" height="46" rx="14" fill="#F4F8FB" stroke="#1F4E79" stroke-width="3"/><text x="916" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="start">Zone sonore</text><text x="930" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#2E7D32" text-anchor="start">✔ Membrane libre</text><text x="930" y="340" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#2E7D32" text-anchor="start">✔ Décor léger</text><text x="930" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#C0392B" text-anchor="start">✗ Ne pas couvrir le</text><text x="930" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#C0392B" text-anchor="start">dessus</text><rect x="40" y="730" width="1320" height="160" rx="14" fill="#F4F8FB" stroke="#8B5A2B" stroke-width="2"/><text x="60" y="764" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#8B5A2B">Consigne / phrase clé</text><text x="60" y="802" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">Ajoute un motif en relief sur le corps d’un shaker ou tambour. Garde la zone</text><text x="60" y="840" font-family="DejaVu Sans, Arial" font-size="29" fill="#222">sonore libre et reteste.</text></svg>