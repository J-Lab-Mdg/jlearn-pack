<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="1100" height="700" fill="#FFFFFF"/><text x="550" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#1F4E79" font-weight="bold" text-anchor="middle">Présenter, observer et apprécier une chorégraphie</text><text x="550" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#4B5563" font-weight="normal" text-anchor="middle">Apprécier une danse</text><rect x="200" y="200" width="700" height="380" rx="12" fill="#F9FAFB" stroke="#374151" stroke-width="3"/><text x="250" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#1F2937" font-weight="normal" text-anchor="start">• Rythme</text><text x="250" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#1F2937" font-weight="normal" text-anchor="start">• Espace</text><text x="250" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#1F2937" font-weight="normal" text-anchor="start">• Mouvements</text><text x="250" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#1F2937" font-weight="normal" text-anchor="start">• Expression</text><text x="250" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#1F2937" font-weight="normal" text-anchor="start">• Sécurité</text><text x="550" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#1F2937" font-weight="normal" text-anchor="middle">Observer → relier → juger</text></svg>