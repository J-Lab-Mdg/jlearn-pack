<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710"><defs></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#1F4E79" text-anchor="middle" font-weight="bold">Essayer trois gris avec le même crayon</text><text x="600" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" fill="#333" text-anchor="middle" font-weight="normal">Observe les repères, puis remplis les grandes cases.</text><rect x="100" y="145" width="260" height="90" fill="#E6E6E6" stroke="#555" stroke-width="2"/><text x="230" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#222" text-anchor="middle" font-weight="bold">Gris clair</text><rect x="100" y="310" width="260" height="230" fill="white" stroke="#222" stroke-width="3"/><text x="230" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#333" text-anchor="middle" font-weight="normal">Pression très légère</text><rect x="470" y="145" width="260" height="90" fill="#A6A6A6" stroke="#555" stroke-width="2"/><text x="600" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#222" text-anchor="middle" font-weight="bold">Gris moyen</text><rect x="470" y="310" width="260" height="230" fill="white" stroke="#222" stroke-width="3"/><text x="600" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#333" text-anchor="middle" font-weight="normal">Pression moyenne</text><rect x="840" y="145" width="260" height="90" fill="#4D4D4D" stroke="#555" stroke-width="2"/><text x="970" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#222" text-anchor="middle" font-weight="bold">Gris foncé</text><rect x="840" y="310" width="260" height="230" fill="white" stroke="#222" stroke-width="3"/><text x="970" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#333" text-anchor="middle" font-weight="normal">Traits plus serrés / pression appuyée</text><text x="600" y="665" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#1E7B34" text-anchor="middle" font-weight="normal">Garde une zone blanche pour comparer. Évite de tout noircir d’un coup.</text></svg>