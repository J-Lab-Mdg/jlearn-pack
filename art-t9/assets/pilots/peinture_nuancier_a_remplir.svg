<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#1F4E79" text-anchor="middle" font-weight="bold">Nuancier de couleurs à remplir</text><text x="600" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#333" text-anchor="middle" font-weight="normal">Mélange, observe, puis colorie les cases.</text><rect x="100" y="150" width="260" height="90" rx="10" fill="#F4D03F" stroke="#333" stroke-width="3"/><text x="230" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#222" text-anchor="middle" font-weight="bold">Jaune</text><rect x="100" y="310" width="260" height="140" rx="10" fill="white" stroke="#333" stroke-width="3"/><rect x="460" y="150" width="260" height="90" rx="10" fill="#E74C3C" stroke="#333" stroke-width="3"/><text x="590" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#222" text-anchor="middle" font-weight="bold">Rouge</text><rect x="460" y="310" width="260" height="140" rx="10" fill="white" stroke="#333" stroke-width="3"/><rect x="820" y="150" width="260" height="90" rx="10" fill="#3498DB" stroke="#333" stroke-width="3"/><text x="950" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#222" text-anchor="middle" font-weight="bold">Bleu</text><rect x="820" y="310" width="260" height="140" rx="10" fill="white" stroke="#333" stroke-width="3"/><text x="600" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#1F4E79" text-anchor="middle" font-weight="normal">Secondaires : jaune + rouge = ?   rouge + bleu = ?   bleu + jaune = ?</text><rect x="100" y="530" width="260" height="120" rx="10" fill="white" stroke="#333" stroke-width="3"/><text x="230" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#222" text-anchor="middle" font-weight="normal">Orange ?</text><rect x="460" y="530" width="260" height="120" rx="10" fill="white" stroke="#333" stroke-width="3"/><text x="590" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#222" text-anchor="middle" font-weight="normal">Violet ?</text><rect x="820" y="530" width="260" height="120" rx="10" fill="white" stroke="#333" stroke-width="3"/><text x="950" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#222" text-anchor="middle" font-weight="normal">Vert ?</text><text x="600" y="770" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#1E7B34" text-anchor="middle" font-weight="normal">Ajoute une case chaude, une case froide, une case claire, une case foncée.</text></svg>