<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs></defs><rect width="100%" height="100%" fill="white"/><rect x="25" y="25" width="110" height="58" rx="12" fill="#1F4E79"/><text x="80" y="65" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="white" text-anchor="middle" font-weight="bold">a4</text><text x="600" y="140" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#1F4E79" text-anchor="middle" font-weight="bold">Accompagner avec percussion et respecter les nuances</text><rect x="100" y="260" width="220" height="160" rx="10" fill="#EAF3EA" stroke="#333" stroke-width="3"/><text x="210" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#1E7B34" text-anchor="middle" font-weight="bold">Percussion</text><rect x="360" y="260" width="220" height="160" rx="10" fill="#EAF3EA" stroke="#333" stroke-width="3"/><text x="470" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#1E7B34" text-anchor="middle" font-weight="bold">Fort/doux</text><rect x="620" y="260" width="220" height="160" rx="10" fill="#EAF3EA" stroke="#333" stroke-width="3"/><text x="730" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#1E7B34" text-anchor="middle" font-weight="bold">Ensemble</text><rect x="880" y="260" width="220" height="160" rx="10" fill="#EAF3EA" stroke="#333" stroke-width="3"/><text x="990" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#1E7B34" text-anchor="middle" font-weight="bold">Présenter</text><text x="600" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#666" text-anchor="middle" font-weight="normal">Modèle vivant ou support sonore ; l’enseignant garde la pulsation.</text></svg>