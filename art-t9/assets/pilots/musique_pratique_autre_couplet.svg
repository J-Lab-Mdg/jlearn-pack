<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#1F4E79" text-anchor="middle" font-weight="bold">Pratique : un autre couplet ou un autre rythme</text><rect x="120" y="160" width="960" height="180" rx="10" fill="#DDEEFF" stroke="#333" stroke-width="3"/><text x="600" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#1F4E79" text-anchor="middle" font-weight="normal">Choisis un autre couplet du chant régional ou un nouveau rythme.</text><rect x="120" y="400" width="960" height="180" rx="10" fill="#EAF3EA" stroke="#333" stroke-width="3"/><text x="600" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#1E7B34" text-anchor="middle" font-weight="normal">Garde la même pulsation, change une nuance : fort/doux ou long/court.</text></svg>