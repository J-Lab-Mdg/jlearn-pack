<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="29" font-weight="bold" fill="#1F4E79">Lumière, ombre et ombre portée sur un objet</text>
  <!-- light source -->
  <circle cx="120" cy="180" r="34" fill="#F4C20D" stroke="#B8860B" stroke-width="2"/>
  <g stroke="#F4C20D" stroke-width="4">
    <line x1="120" y1="120" x2="120" y2="96"/>
    <line x1="120" y1="240" x2="120" y2="264"/>
    <line x1="60" y1="180" x2="36" y2="180"/>
    <line x1="78" y1="138" x2="61" y2="121"/>
    <line x1="78" y1="222" x2="61" y2="239"/>
  </g>
  <line x1="160" y1="180" x2="330" y2="230" stroke="#F4C20D" stroke-width="4" stroke-dasharray="8 6"/>
  <polygon points="330,230 308,222 312,242" fill="#F4C20D"/>
  <text x="120" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#B8860B">Lumière</text>
  <!-- table line -->
  <line x1="250" y1="470" x2="1000" y2="470" stroke="#8a6d3b" stroke-width="4"/>
  <!-- cast shadow -->
  <ellipse cx="700" cy="478" rx="230" ry="26" fill="#4a4a4a" opacity="0.55"/>
  <!-- cylinder body with gradient -->
  <defs>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="0.35" stop-color="#c9c9c9"/>
      <stop offset="0.7" stop-color="#7d7d7d"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </linearGradient>
  </defs>
  <rect x="430" y="200" width="240" height="270" fill="url(#cyl)" stroke="#333" stroke-width="2"/>
  <ellipse cx="550" cy="200" rx="120" ry="34" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <ellipse cx="550" cy="470" rx="120" ry="34" fill="#3a3a3a" stroke="#333" stroke-width="2"/>
  <!-- labels -->
  <g font-family="Georgia, serif" font-size="20" fill="#000">
    <line x1="455" y1="300" x2="300" y2="330" stroke="#1E7B34" stroke-width="2"/>
    <text x="295" y="335" text-anchor="end" fill="#1E7B34">Côté éclairé (clair)</text>
    <line x1="640" y1="320" x2="820" y2="300" stroke="#C00000" stroke-width="2"/>
    <text x="825" y="300" fill="#C00000">Côté dans l'ombre (foncé)</text>
    <line x1="760" y1="480" x2="860" y2="540" stroke="#333" stroke-width="2"/>
    <text x="865" y="545" fill="#333">Ombre portée</text>
  </g>
  <text x="550" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#333">Le dégradé de gris + l'ombre portée donnent l'impression que le gobelet est posé sur la table.</text>
</svg>
