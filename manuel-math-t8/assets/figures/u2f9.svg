<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le dénominateur commun</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">1/2 + 1/3 : impossible tel quel ! On passe en sixièmes : 3/6 + 2/6 = 5/6.</text><rect x="80" y="165" width="240" height="60" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="80" y="165" width="40" height="60" fill="#A5D6A7"/><rect x="120" y="165" width="40" height="60" fill="#A5D6A7"/><rect x="160" y="165" width="40" height="60" fill="#A5D6A7"/><line x1="120" y1="165" x2="120" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="160" y1="165" x2="160" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="200" y1="165" x2="200" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="240" y1="165" x2="240" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="280" y1="165" x2="280" y2="225" stroke="#1F4E79" stroke-width="2"/><text x="200" y="265" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">3/6</text><text x="360" y="205" font-family="DejaVu Serif" font-size="32" fill="#333" font-weight="bold" text-anchor="middle">+</text><rect x="420" y="165" width="240" height="60" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="420" y="165" width="40" height="60" fill="#F8BBD0"/><rect x="460" y="165" width="40" height="60" fill="#F8BBD0"/><line x1="460" y1="165" x2="460" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="500" y1="165" x2="500" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="540" y1="165" x2="540" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="580" y1="165" x2="580" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="620" y1="165" x2="620" y2="225" stroke="#1F4E79" stroke-width="2"/><text x="540" y="265" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">2/6</text><text x="700" y="205" font-family="DejaVu Serif" font-size="32" fill="#333" font-weight="bold" text-anchor="middle">=</text><rect x="740" y="165" width="240" height="60" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="740" y="165" width="40" height="60" fill="#FFE0B2"/><rect x="780" y="165" width="40" height="60" fill="#FFE0B2"/><rect x="820" y="165" width="40" height="60" fill="#FFE0B2"/><rect x="860" y="165" width="40" height="60" fill="#FFE0B2"/><rect x="900" y="165" width="40" height="60" fill="#FFE0B2"/><line x1="780" y1="165" x2="780" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="820" y1="165" x2="820" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="860" y1="165" x2="860" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="900" y1="165" x2="900" y2="225" stroke="#1F4E79" stroke-width="2"/><line x1="940" y1="165" x2="940" y2="225" stroke="#1F4E79" stroke-width="2"/><text x="860" y="265" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">5/6</text><text x="500" y="325" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">6 est un multiple commun de 2 et de 3</text></svg>