<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La fréquence : l’effectif rapporté au total</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">fréquence = effectif ÷ effectif total — un nombre entre 0 et 1.</text><rect x="130" y="180" width="240" height="90" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="250" y="234" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="430" y="180" width="240" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="550" y="234" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="730" y="180" width="190" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="825" y="234" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="250" y="215" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">effectif</text><text x="250" y="250" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">15 à pied</text><text x="550" y="215" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">total</text><text x="550" y="250" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">25 élèves</text><text x="825" y="215" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">fréquence</text><text x="825" y="250" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">0,60 = 60 %</text><text x="405" y="230" font-family="DejaVu Serif" font-size="30" fill="#333" font-weight="bold" text-anchor="middle">÷</text><text x="705" y="230" font-family="DejaVu Serif" font-size="30" fill="#333" font-weight="bold" text-anchor="middle">=</text><text x="500" y="325" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">la somme de toutes les fréquences vaut toujours 1 (ou 100 %)</text></svg>