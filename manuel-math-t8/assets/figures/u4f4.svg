<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Construire M′, symétrique de M par rapport à O</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">M, O et M′ sont alignés, et OM = OM′ : O est le milieu de [MM′].</text><line x1="180" y1="315" x2="820" y2="175" stroke="#777" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="180" cy="315" r="8" fill="#1F4E79"/><text x="150" y="325" font-family="DejaVu Serif" font-size="24" fill="#1F4E79" font-weight="bold" text-anchor="middle">M</text><circle cx="500" cy="245" r="9" fill="#C2185B"/><text x="500" y="213" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">O</text><circle cx="820" cy="175" r="8" fill="#2E7D32"/><text x="852" y="183" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">M′</text><line x1="338.0767280907511" y1="271.20789984343367" x2="341.9232719092489" y2="288.79210015656633" stroke="#B25000" stroke-width="3"/><line x1="658.0767280907511" y1="201.20789984343364" x2="661.9232719092489" y2="218.79210015656636" stroke="#B25000" stroke-width="3"/><text x="500" y="385" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">alignement + distances égales : la règle graduée suffit !</text></svg>