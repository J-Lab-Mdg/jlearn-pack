<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La notation scientifique d’un petit nombre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Épaisseur d’un cheveu : 0,00052 m = 5,2 × 10⁻⁴ m.</text><rect x="70" y="160" width="300" height="85" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="220" y="211.5" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">0,00052</text><line x1="385" y1="202" x2="475" y2="202" stroke="#2E7D32" stroke-width="4"/><polygon points="475,202 462.39374056706254,208.08951747755722 462.39374056706254,195.91048252244278" fill="#2E7D32"/><rect x="490" y="160" width="300" height="85" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="640" y="211.5" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">5,2 × 10⁻⁴</text><text x="430" y="147" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">virgule avancée</text><text x="500" y="300" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">la virgule avance de 4 rangs : l’exposant est −4</text><text x="500" y="340" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">petit nombre (&lt; 1) → exposant négatif</text></svg>