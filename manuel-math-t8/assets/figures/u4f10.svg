<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le programme de construction</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Des instructions numérotées qu’un camarade suit sans voir ta figure.</text><rect x="150" y="155" width="700" height="62" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="500" y="195" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="500" y="194" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">1. Trace un segment [BC] de 6 cm.</text><rect x="150" y="233" width="700" height="62" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="273" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="500" y="272" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">2. Trace la médiatrice d de [BC].</text><rect x="150" y="311" width="700" height="62" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="500" y="351" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="500" y="350" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">3. Place A sur d, à 5 cm de B.</text><rect x="150" y="389" width="700" height="62" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="429" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="500" y="428" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">4. Relie A à B et A à C.</text><text x="500" y="495" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">résultat garanti : un triangle isocèle en A</text></svg>