<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’événement contraire</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">P(Ā) = 1 − P(A) : ce qui n’est pas A complète A jusqu’à 1.</text><path d="M 300 305 L 300 175 A 130 130 0 0 1 430 305 Z" fill="#C2185B" opacity="0.8"/><path d="M 300 305 L 430 305 A 130 130 0 1 1 300 175 Z" fill="#C8E6C9" stroke="none"/><circle cx="300" cy="305" r="130" fill="none" stroke="#555" stroke-width="2.5"/><text x="455" y="190" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">A : 1/4</text><text x="240" y="365" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">Ā : 3/4</text><rect x="560" y="215" width="370" height="100" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="745" y="274" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="745" y="253" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">P(A) + P(Ā) = 1</text><text x="745" y="291" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">P(Ā) = 1 − 1/4 = 3/4</text></svg>