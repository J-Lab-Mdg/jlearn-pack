<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Traduire une situation en règle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Part fixe → b ; part qui dépend de x → ax : la formule s’écrit seule.</text><rect x="80" y="165" width="330" height="100" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="245" y="224" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><line x1="425" y1="215" x2="545" y2="215" stroke="#2E7D32" stroke-width="4"/><polygon points="545,215 532.3937405670625,221.08951747755722 532.3937405670625,208.91048252244278" fill="#2E7D32"/><rect x="560" y="165" width="360" height="100" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="740" y="224" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="245" y="203" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">Abonnement 5 000 Ar</text><text x="245" y="238" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">+ 200 Ar par SMS</text><text x="740" y="221" font-family="DejaVu Serif" font-size="26" fill="#C2185B" font-weight="bold" text-anchor="middle">y = 200x + 5 000</text><text x="485" y="151" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">traduction</text><text x="500" y="320" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">fixe → b = 5 000 ; « par SMS » → a = 200</text></svg>