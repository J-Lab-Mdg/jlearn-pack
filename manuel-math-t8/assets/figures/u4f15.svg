<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’homothétie : agrandir depuis un centre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Depuis O, chaque point s’éloigne au double (k = 2) : la figure double de taille.</text><circle cx="120" cy="365" r="9" fill="#C2185B"/><text x="116" y="399" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">O</text><line x1="120" y1="365" x2="520" y2="185" stroke="#999" stroke-width="1.8" stroke-dasharray="5 6"/><line x1="120" y1="365" x2="720" y2="405" stroke="#999" stroke-width="1.8" stroke-dasharray="5 6"/><line x1="120" y1="365" x2="400" y2="425" stroke="#999" stroke-width="1.8" stroke-dasharray="5 6"/><polygon points="320,275 420,385 260,395" fill="#BBDEFB" stroke="#1565C0" stroke-width="3"/><polygon points="520,185 720,405 400,425" fill="none" stroke="#2E7D32" stroke-width="3.5"/><text x="320" y="261" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">A</text><text x="526" y="171" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">A′</text><text x="830" y="225" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">OA′ = 2 × OA</text></svg>