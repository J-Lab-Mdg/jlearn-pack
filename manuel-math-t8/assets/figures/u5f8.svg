<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Volume et capacité : deux langages, une grandeur</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">1 L = 1 dm³ : le litre est le volume d’un cube de 1 dm de côté.</text><rect x="170" y="160" width="190" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="265" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Volume</text><rect x="360" y="160" width="160" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="440" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1 m³</text><rect x="520" y="160" width="160" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="600" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1 dm³</text><rect x="680" y="160" width="150" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="755" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">1 cm³</text><rect x="170" y="222" width="190" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="265" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Capacité</text><rect x="360" y="222" width="160" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="440" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">1 000 L</text><rect x="520" y="222" width="160" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="600" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">1 L</text><rect x="680" y="222" width="150" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="755" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">1 mL</text><text x="500" y="340" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">m³ → dm³ → cm³ : × 1 000 à chaque pas ; L suit le dm³</text><text x="500" y="380" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">un bidon de 20 L = 20 dm³ = 0,02 m³</text></svg>