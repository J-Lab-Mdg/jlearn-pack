<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Rapport ou taux ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Rapport : mêmes unités, sans unité. Taux : unités différentes, avec unité.</text><rect x="80" y="160" width="400" height="150" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="244" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="280" y="200" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">RAPPORT</text><text x="280" y="240" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">15 filles / 25 élèves = 3/5</text><text x="280" y="278" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">sans unité</text><rect x="520" y="160" width="400" height="150" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="720" y="244" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="720" y="200" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">TAUX</text><text x="720" y="240" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">3 000 Ar pour 2 kg</text><text x="720" y="278" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">= 1 500 Ar/kg : avec unité</text></svg>