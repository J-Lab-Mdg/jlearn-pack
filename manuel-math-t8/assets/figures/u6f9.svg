<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La probabilité en situation d’équiprobabilité</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">P(A) = nombre de cas favorables ÷ nombre de cas possibles.</text><rect x="160" y="190" width="120" height="120" rx="18" fill="white" stroke="#333" stroke-width="3.5"/><circle cx="196" cy="226" r="10" fill="#333"/><circle cx="244" cy="226" r="10" fill="#333"/><circle cx="196" cy="274" r="10" fill="#333"/><circle cx="244" cy="274" r="10" fill="#333"/><circle cx="220" cy="250" r="10" fill="#333"/><text x="220" y="352" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">dé équilibré :</text><text x="220" y="378" font-family="DejaVu Serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">6 chances égales</text><rect x="480" y="190" width="440" height="110" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="700" y="254" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="700" y="230" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">P(obtenir un 5) = 1/6</text><text x="700" y="270" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">P(nombre pair) = 3/6 = 1/2</text><text x="640" y="360" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">la probabilité est toujours comprise entre 0 et 1</text></svg>