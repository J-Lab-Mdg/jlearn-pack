<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Trois écritures d’une même probabilité</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">1/4 = 0,25 = 25 % : fraction, décimal, pourcentage racontent la même chance.</text><rect x="130" y="180" width="220" height="90" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="240" y="234" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">1/4</text><rect x="400" y="180" width="220" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="510" y="234" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">0,25</text><rect x="670" y="180" width="220" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="780" y="234" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">25 %</text><text x="375" y="230" font-family="DejaVu Serif" font-size="30" fill="#333" font-weight="bold" text-anchor="middle">=</text><text x="645" y="230" font-family="DejaVu Serif" font-size="30" fill="#333" font-weight="bold" text-anchor="middle">=</text><text x="500" y="325" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">fraction → décimal : diviser ; décimal → % : multiplier par 100</text></svg>