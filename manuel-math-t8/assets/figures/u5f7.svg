<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le volume du cône : un tiers du cylindre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le cône remplit le tiers du cylindre de même base et de même hauteur.</text><ellipse cx="300" cy="365" rx="110" ry="28" fill="none" stroke="#1565C0" stroke-width="3"/><ellipse cx="300" cy="175" rx="110" ry="28" fill="none" stroke="#1565C0" stroke-width="3" stroke-dasharray="6 5"/><line x1="190" y1="175" x2="190" y2="365" stroke="#1565C0" stroke-width="3"/><line x1="410" y1="175" x2="410" y2="365" stroke="#1565C0" stroke-width="3"/><line x1="190" y1="365" x2="300" y2="175" stroke="#C2185B" stroke-width="3"/><line x1="410" y1="365" x2="300" y2="175" stroke="#C2185B" stroke-width="3"/><rect x="620" y="205" width="310" height="110" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="775" y="269" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="775" y="245" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">V = π × r² × h ÷ 3</text><text x="775" y="285" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">(un tiers du cylindre)</text><text x="500" y="440" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">r = 3 cm, h = 10 cm → V = π × 9 × 10 ÷ 3 ≈ 94,2 cm³</text></svg>