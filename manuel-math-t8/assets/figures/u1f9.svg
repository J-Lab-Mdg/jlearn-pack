<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le rapport entre deux quantités</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">2 jetons bleus pour 3 jetons rouges : le rapport est 2/3, ou 2 : 3.</text><circle cx="140" cy="195" r="24" fill="#1565C0"/><circle cx="210" cy="195" r="24" fill="#1565C0"/><circle cx="340" cy="195" r="24" fill="#C2185B"/><circle cx="410" cy="195" r="24" fill="#C2185B"/><circle cx="480" cy="195" r="24" fill="#C2185B"/><text x="175" y="260" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">2 bleus</text><text x="410" y="260" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">3 rouges</text><rect x="620" y="160" width="300" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="770" y="214" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">rapport = 2/3</text><text x="500" y="325" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">un rapport compare deux quantités de même nature : pas d’unité !</text></svg>