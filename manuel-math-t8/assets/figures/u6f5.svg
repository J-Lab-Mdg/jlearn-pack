<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le diagramme circulaire</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le disque entier = 100 % ; chaque secteur a un angle proportionnel à l’effectif.</text><path d="M 320 325 L 320 175 A 150 150 0 0 1 469.178284305241 340.679269490148 Z" fill="#2E7D32" opacity="0.8" stroke="white" stroke-width="2"/><text x="464.9132409680919" y="201.51953176002263" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">vert</text><path d="M 320 325 L 469.178284305241 340.679269490148 A 150 150 0 0 1 190.09618943233423 400.00000000000006 Z" fill="#C2185B" opacity="0.8" stroke="white" stroke-width="2"/><text x="360.54277970946316" y="522.7387821430921" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">rouge</text><path d="M 320 325 L 190.09618943233423 400.00000000000006 A 150 150 0 0 1 208.52827617839083 224.6304090461713 Z" fill="#1565C0" opacity="0.8" stroke="white" stroke-width="2"/><text x="126.06823040318667" y="311.61694966280766" font-family="DejaVu Serif" font-size="20" fill="#1565C0" font-weight="bold" text-anchor="middle">bleu</text><path d="M 320 325 L 208.52827617839083 224.6304090461713 A 150 150 0 0 1 320 175 Z" fill="#B25000" opacity="0.8" stroke="white" stroke-width="2"/><text x="240.6863546002188" y="153.8586357596929" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">jaune</text><text x="720" y="265" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">angle d’un secteur :</text><text x="720" y="300" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">(effectif ÷ total) × 360°</text><text x="720" y="355" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">rouge : 12/30 × 360° = 144°</text></svg>