<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Démontrer grâce à la symétrie</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Si la médiatrice de [BC] passe par A, la symétrie échange B et C : donc AB = AC.</text><polygon points="500,160 300,400 700,400" fill="#FFF9C4" stroke="#B25000" stroke-width="3"/><line x1="500" y1="150" x2="500" y2="424" stroke="#C2185B" stroke-width="3" stroke-dasharray="9 7"/><text x="500" y="138" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">A</text><text x="274" y="410" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">B</text><text x="726" y="410" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">C</text><line x1="406.91399151637637" y1="285.76165959698034" x2="393.08600848362363" y2="274.23834040301966" stroke="#2E7D32" stroke-width="3"/><line x1="606.9139915163764" y1="274.23834040301966" x2="593.0860084836236" y2="285.76165959698034" stroke="#2E7D32" stroke-width="3"/><text x="500" y="460" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">la symétrie conserve les distances → AB = AC : triangle isocèle, démontré !</text></svg>