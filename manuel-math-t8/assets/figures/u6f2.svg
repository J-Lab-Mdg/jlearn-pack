<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Modalités et effectifs</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Modalités = réponses possibles ; effectif = nombre d’individus par modalité.</text><rect x="120" y="160" width="280" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="260" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Couleur (modalité)</text><rect x="400" y="160" width="120" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="460" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">vert</text><rect x="520" y="160" width="130" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="585" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">rouge</text><rect x="650" y="160" width="120" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="710" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">bleu</text><rect x="770" y="160" width="120" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="830" y="200" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">jaune</text><rect x="120" y="222" width="280" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="260" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Effectif</text><rect x="400" y="222" width="120" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="460" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">8</text><rect x="520" y="222" width="130" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="585" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">12</text><rect x="650" y="222" width="120" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="710" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">6</text><rect x="770" y="222" width="120" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="830" y="262" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">4</text><text x="500" y="340" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">8 + 12 + 6 + 4 = 30 : la somme des effectifs = effectif total</text></svg>