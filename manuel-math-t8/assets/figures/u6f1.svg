<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Population, individu, caractère</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">La classe = population ; un élève = individu ; la couleur = caractère.</text><ellipse cx="300" cy="290" rx="230" ry="120" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><circle cx="185" cy="230" r="13" fill="#1565C0"/><circle cx="185" cy="290" r="13" fill="#1565C0"/><circle cx="185" cy="350" r="13" fill="#1565C0"/><circle cx="260" cy="230" r="13" fill="#1565C0"/><circle cx="260" cy="290" r="13" fill="#C2185B"/><circle cx="260" cy="350" r="13" fill="#1565C0"/><circle cx="335" cy="230" r="13" fill="#1565C0"/><circle cx="335" cy="290" r="13" fill="#1565C0"/><circle cx="335" cy="350" r="13" fill="#1565C0"/><circle cx="410" cy="230" r="13" fill="#1565C0"/><circle cx="410" cy="290" r="13" fill="#1565C0"/><circle cx="410" cy="350" r="13" fill="#1565C0"/><text x="300" y="445" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">POPULATION : la classe</text><line x1="430" y1="288" x2="580" y2="288" stroke="#C2185B" stroke-width="3"/><polygon points="580,288 567.3937405670625,294.08951747755725 567.3937405670625,281.91048252244275" fill="#C2185B"/><text x="700" y="260" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">INDIVIDU : un élève</text><text x="700" y="310" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">CARACTÈRE étudié :</text><text x="700" y="345" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="normal" text-anchor="middle">sa couleur préférée</text></svg>