<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La pyramide</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une base polygonale, un sommet, des faces latérales triangulaires.</text><polygon points="500,155 330,385 610,405" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><polygon points="500,155 610,405 700,335" fill="#FFE0B2" stroke="#B25000" stroke-width="3"/><line x1="330" y1="385" x2="420" y2="320" stroke="#B25000" stroke-width="2" stroke-dasharray="7 6"/><line x1="420" y1="320" x2="700" y2="335" stroke="#B25000" stroke-width="2" stroke-dasharray="7 6"/><line x1="500" y1="155" x2="420" y2="320" stroke="#B25000" stroke-width="2" stroke-dasharray="7 6"/><line x1="500" y1="155" x2="515" y2="360" stroke="#C2185B" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="515" cy="360" r="5" fill="#C2185B"/><text x="500" y="139" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">S (sommet)</text><text x="587" y="364" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">hauteur</text><text x="500" y="455" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">base carrée + 4 faces triangulaires qui se rejoignent en S</text></svg>