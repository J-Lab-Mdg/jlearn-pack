<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La relation y = ax + b</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Taxi : 2 000 Ar fixes + 1 500 Ar par km → y = 1 500x + 2 000.</text><rect x="90" y="160" width="280" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="230" y="214" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="420" y="160" width="280" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="560" y="214" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="750" y="160" width="180" height="90" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="840" y="214" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="230" y="197" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">part fixe b</text><text x="230" y="230" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">2 000 Ar</text><text x="560" y="197" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">part variable ax</text><text x="560" y="230" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">1 500 Ar × x km</text><text x="840" y="197" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">total y</text><text x="840" y="230" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">la course</text><text x="395" y="205" font-family="DejaVu Serif" font-size="30" fill="#333" font-weight="bold" text-anchor="middle">+</text><text x="727" y="205" font-family="DejaVu Serif" font-size="30" fill="#333" font-weight="bold" text-anchor="middle">=</text><text x="500" y="305" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">pour 4 km : y = 1 500 × 4 + 2 000 = 8 000 Ar</text></svg>