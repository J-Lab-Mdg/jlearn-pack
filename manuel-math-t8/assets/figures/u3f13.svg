<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Résoudre un problème par l’algèbre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Choisir l’inconnue, traduire, résoudre, vérifier : le plan en quatre étapes.</text><rect x="70" y="165" width="200" height="95" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="170" y="221.5" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="170" y="203" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">1. CHOISIR</text><text x="170" y="238" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="normal" text-anchor="middle">x = l’âge de Noro</text><line x1="277" y1="212" x2="295" y2="212" stroke="#555" stroke-width="2.5"/><polygon points="295,212 282.39374056706254,218.08951747755722 282.39374056706254,205.91048252244278" fill="#555"/><rect x="300" y="165" width="200" height="95" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="400" y="221.5" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="400" y="203" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">2. TRADUIRE</text><text x="400" y="238" font-family="DejaVu Serif" font-size="19" fill="#1565C0" font-weight="normal" text-anchor="middle">x + 7 = 20</text><line x1="507" y1="212" x2="525" y2="212" stroke="#555" stroke-width="2.5"/><polygon points="525,212 512.3937405670625,218.08951747755722 512.3937405670625,205.91048252244278" fill="#555"/><rect x="530" y="165" width="200" height="95" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="630" y="221.5" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="630" y="203" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">3. RÉSOUDRE</text><text x="630" y="238" font-family="DejaVu Serif" font-size="19" fill="#B25000" font-weight="normal" text-anchor="middle">x = 13</text><line x1="737" y1="212" x2="755" y2="212" stroke="#555" stroke-width="2.5"/><polygon points="755,212 742.3937405670625,218.08951747755722 742.3937405670625,205.91048252244278" fill="#555"/><rect x="760" y="165" width="200" height="95" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="860" y="221.5" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="860" y="203" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">4. VÉRIFIER</text><text x="860" y="238" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="normal" text-anchor="middle">13 + 7 = 20 ✓</text><text x="500" y="315" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">ne jamais sauter l’étape 4 : la vérification attrape les erreurs !</text></svg>