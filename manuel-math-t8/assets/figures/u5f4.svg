<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’aire latérale de la pyramide</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">4 faces triangulaires identiques : aire latérale = 4 × aire d’un triangle.</text><polygon points="120,290 230,290 175,170" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><polygon points="270,290 380,290 325,170" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><polygon points="420,290 530,290 475,170" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><polygon points="570,290 680,290 625,170" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><text x="390" y="340" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">4 triangles de base 6 cm et de hauteur 5 cm</text><rect x="740" y="190" width="190" height="85" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="835" y="241.5" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="835" y="222" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">A = 4 × (6×5÷2)</text><text x="835" y="255" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">= 60 cm²</text></svg>