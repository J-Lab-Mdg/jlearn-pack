<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Construire M′ par la translation qui amène A sur B</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Le quadrilatère ABM′M est un parallélogramme : M′ fait le même pas que A → B.</text><line x1="220" y1="335" x2="520" y2="225" stroke="#C2185B" stroke-width="3.5"/><polygon points="520,225 510.2606262892734,235.057067153142 506.0679368837123,223.62245968342992" fill="#C2185B"/><line x1="380" y1="395" x2="680" y2="285" stroke="#2E7D32" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="220" y1="335" x2="380" y2="395" stroke="#999" stroke-width="1.8" stroke-dasharray="5 6"/><line x1="520" y1="225" x2="680" y2="285" stroke="#999" stroke-width="1.8" stroke-dasharray="5 6"/><circle cx="220" cy="335" r="8" fill="#C2185B"/><circle cx="520" cy="225" r="8" fill="#C2185B"/><circle cx="380" cy="395" r="8" fill="#1F4E79"/><circle cx="680" cy="285" r="8" fill="#2E7D32"/><text x="194" y="341" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">A</text><text x="528" y="209" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">B</text><text x="370" y="427" font-family="DejaVu Serif" font-size="23" fill="#1F4E79" font-weight="bold" text-anchor="middle">M</text><text x="710" y="291" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">M′</text><text x="500" y="460" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">MM′ est parallèle à AB et de même longueur : ABM′M parallélogramme</text></svg>