<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Simplifier un rapport</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">12 : 18 se simplifie par 6 → 2 : 3, la forme la plus simple.</text><rect x="120" y="175" width="240" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="240" y="229" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">12 : 18</text><line x1="380" y1="220" x2="560" y2="220" stroke="#2E7D32" stroke-width="4"/><polygon points="560,220 547.3937405670625,226.08951747755722 547.3937405670625,213.91048252244278" fill="#2E7D32"/><rect x="580" y="175" width="240" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="700" y="229" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">2 : 3</text><text x="470" y="160" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">÷ 6 des deux côtés</text><text x="500" y="325" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">6 est le plus grand diviseur commun de 12 et 18</text></svg>