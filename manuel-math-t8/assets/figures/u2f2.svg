<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Diviser deux entiers relatifs</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">(−12) ÷ (+3) = −4 : on divise les distances à zéro, puis on applique le signe.</text><rect x="90" y="165" width="260" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="220" y="219" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">(−12) ÷ (+3)</text><line x1="370" y1="210" x2="540" y2="210" stroke="#2E7D32" stroke-width="4"/><polygon points="540,210 527.3937405670625,216.08951747755722 527.3937405670625,203.91048252244278" fill="#2E7D32"/><rect x="560" y="165" width="180" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="650" y="219" font-family="DejaVu Serif" font-size="32" fill="#222" font-weight="normal" text-anchor="middle">−4</text><text x="455" y="153" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">signes contraires</text><text x="500" y="315" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">même règle des signes que la multiplication</text></svg>