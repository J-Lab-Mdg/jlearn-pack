<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La moyenne d’une série</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On multiplie chaque note par son effectif, on additionne, on divise par le total.</text><rect x="150" y="155" width="230" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="265" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Note</text><rect x="380" y="155" width="115" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="437.5" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">8</text><rect x="495" y="155" width="115" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="552.5" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">10</text><rect x="610" y="155" width="115" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="667.5" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">12</text><rect x="725" y="155" width="115" height="56" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="782.5" y="192" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">15</text><rect x="150" y="211" width="230" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="265" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Effectif</text><rect x="380" y="211" width="115" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="437.5" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">3</text><rect x="495" y="211" width="115" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="552.5" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5</text><rect x="610" y="211" width="115" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="667.5" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">8</text><rect x="725" y="211" width="115" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="782.5" y="248" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">4</text><rect x="150" y="267" width="230" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="265" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Note × eff.</text><rect x="380" y="267" width="115" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="437.5" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">24</text><rect x="495" y="267" width="115" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="552.5" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">50</text><rect x="610" y="267" width="115" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="667.5" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">96</text><rect x="725" y="267" width="115" height="56" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="782.5" y="304" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">60</text><text x="500" y="375" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">moyenne = (24 + 50 + 96 + 60) ÷ 20 = 230 ÷ 20 = 11,5</text></svg>