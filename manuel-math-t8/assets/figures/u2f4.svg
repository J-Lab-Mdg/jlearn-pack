<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les parenthèses changent tout !</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">(−2)⁴ = +16, mais −2⁴ = −16 : sans parenthèses, le signe − reste dehors.</text><rect x="90" y="160" width="380" height="85" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="211.5" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="530" y="160" width="380" height="85" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="720" y="211.5" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="280" y="197" font-family="DejaVu Serif" font-size="23" fill="#2E7D32" font-weight="bold" text-anchor="middle">(−2)⁴ = (−2)(−2)(−2)(−2)</text><text x="280" y="230" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">= +16</text><text x="720" y="197" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="middle">−2⁴ = −(2 × 2 × 2 × 2)</text><text x="720" y="230" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">= −16</text><text x="500" y="300" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">exposant pair → positif ; exposant impair → négatif</text><text x="500" y="335" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">(−2)³ = −8 ; (−2)⁴ = +16 ; (−1)¹⁰⁰ = +1</text></svg>