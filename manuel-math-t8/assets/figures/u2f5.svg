<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La multiplication passe avant l’addition</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">5 + 3 × 4 : on calcule d’abord 3 × 4 = 12, puis 5 + 12 = 17.</text><rect x="130" y="160" width="220" height="80" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="240" y="209" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">5 + 3 × 4</text><line x1="370" y1="200" x2="500" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="500,200 487.39374056706254,206.08951747755722 487.39374056706254,193.91048252244278" fill="#2E7D32"/><rect x="520" y="160" width="160" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="600" y="209" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">5 + 12</text><line x1="700" y1="200" x2="790" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="790,200 777.3937405670625,206.08951747755722 777.3937405670625,193.91048252244278" fill="#2E7D32"/><rect x="805" y="160" width="120" height="80" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="865" y="209" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">17</text><text x="435" y="147" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">× d’abord</text><text x="500" y="295" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">surtout PAS de gauche à droite : 8 × 4 = 32 est faux !</text></svg>