<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Des égalités équivalentes</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">x + 5 = 9, 2x + 10 = 18, x = 4 : trois habits différents, la même solution.</text><rect x="90" y="165" width="250" height="80" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="215" y="214" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">x + 5 = 9</text><rect x="375" y="165" width="250" height="80" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="214" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">2x + 10 = 18</text><rect x="660" y="165" width="250" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="785" y="214" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">x = 4</text><text x="357" y="208" font-family="DejaVu Serif" font-size="30" fill="#555" font-weight="bold" text-anchor="middle">⇔</text><text x="643" y="208" font-family="DejaVu Serif" font-size="30" fill="#555" font-weight="bold" text-anchor="middle">⇔</text><text x="500" y="300" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">même solution x = 4 : on passe de l’une à l’autre par la même opération des deux côtés</text></svg>