<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Agrandissement (k = 2) et réduction (k = 1/2)</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">k plus grand que 1 : la figure grossit ; k entre 0 et 1 : elle rétrécit.</text><rect x="90" y="165" width="380" height="70" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="209" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="530" y="165" width="380" height="70" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="720" y="209" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="280" y="208" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">k = 2 : agrandissement ×2</text><text x="720" y="208" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">k = 1/2 : réduction ÷2</text><circle cx="500" cy="465" r="8" fill="#B25000"/><text x="500" y="497" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">O</text><polygon points="440,405 560,405 500,315" fill="#BBDEFB" stroke="#1565C0" stroke-width="3"/><polygon points="380,345 620,345 500,165" fill="none" stroke="#2E7D32" stroke-width="3"/><polygon points="470,435 530,435 500,390" fill="none" stroke="#C2185B" stroke-width="3"/><text x="205" y="325" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">image ×2</text><text x="760" y="425" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">image ×1/2</text></svg>