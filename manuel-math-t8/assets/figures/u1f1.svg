<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La notation scientifique d’un grand nombre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Distance Terre-Soleil : 149 600 000 km = 1,496 × 10⁸ km.</text><rect x="70" y="160" width="330" height="85" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="235" y="211.5" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">149 600 000</text><line x1="415" y1="202" x2="505" y2="202" stroke="#2E7D32" stroke-width="4"/><polygon points="505,202 492.39374056706254,208.08951747755722 492.39374056706254,195.91048252244278" fill="#2E7D32"/><rect x="520" y="160" width="300" height="85" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="670" y="211.5" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">1,496 × 10⁸</text><text x="460" y="147" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">virgule déplacée</text><text x="500" y="300" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">la virgule recule de 8 rangs : l’exposant est 8</text><text x="500" y="340" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">1 ≤ 1,496 &lt; 10 : un seul chiffre avant la virgule</text></svg>