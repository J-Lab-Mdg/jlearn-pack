<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La symétrie centrale : un demi-tour</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On fait tourner la figure d’un demi-tour (180°) autour du centre O.</text><circle cx="500" cy="295" r="9" fill="#C2185B"/><text x="500" y="335" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">O</text><polygon points="260,185 410,165 370,265" fill="#BBDEFB" stroke="#1565C0" stroke-width="3"/><polygon points="740,405 590,425 630,325" fill="#C8E6C9" stroke="#2E7D32" stroke-width="3"/><path d="M 440 225 A 92 92 0 0 1 560 365" fill="none" stroke="#B25000" stroke-width="3.5" marker-end="none" stroke-dasharray="4 7"/><text x="610" y="235" font-family="DejaVu Serif" font-size="24" fill="#B25000" font-weight="bold" text-anchor="middle">180°</text><text x="500" y="475" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">la figure image est retournée, « tête en bas »</text></svg>