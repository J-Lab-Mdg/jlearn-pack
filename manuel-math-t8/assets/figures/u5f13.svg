<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Agrandir : volumes × k³</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Arête doublée (k = 2) → volume multiplié par 8 (k³).</text><rect x="160" y="285" width="80" height="80" fill="#BBDEFB" stroke="#1565C0" stroke-width="2.5"/><polygon points="160,285 196,249 276,249 240,285" fill="#90CAF9" stroke="#1565C0" stroke-width="2.5"/><polygon points="240,285 276,249 276,329 240,365" fill="#90CAF9" stroke="#1565C0" stroke-width="2.5"/><text x="215" y="410" font-family="DejaVu Serif" font-size="20" fill="#1565C0" font-weight="bold" text-anchor="middle">1 cube</text><rect x="480" y="245" width="160" height="160" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2.5"/><polygon points="480,245 552,173 712,173 640,245" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2.5"/><polygon points="640,245 712,173 712,333 640,405" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2.5"/><line x1="560" y1="245" x2="560" y2="405" stroke="#2E7D32" stroke-width="1.5"/><line x1="480" y1="325" x2="640" y2="325" stroke="#2E7D32" stroke-width="1.5"/><text x="560" y="450" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">2 × 2 × 2 = 8 cubes</text><line x1="280" y1="315" x2="455" y2="315" stroke="#B25000" stroke-width="3"/><polygon points="455,315 442.39374056706254,321.08951747755725 442.39374056706254,308.91048252244275" fill="#B25000"/><text x="368" y="293" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">k = 2</text><text x="850" y="315" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">volume × k³ = × 8</text></svg>