<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La virgule glisse</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">× 10, 100, 1 000 : la virgule va à droite ; ÷ : elle va à gauche.</text><rect x="100" y="160" width="360" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="280" y="209" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="540" y="160" width="360" height="80" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="720" y="209" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="280" y="197" font-family="DejaVu Serif" font-size="25" fill="#2E7D32" font-weight="bold" text-anchor="middle">3,45 × 100 = 345</text><text x="280" y="230" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="normal" text-anchor="middle">2 rangs vers la droite</text><text x="720" y="197" font-family="DejaVu Serif" font-size="25" fill="#C2185B" font-weight="bold" text-anchor="middle">27 ÷ 1 000 = 0,027</text><text x="720" y="230" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="normal" text-anchor="middle">3 rangs vers la gauche</text><text x="500" y="295" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">on complète avec des zéros si les rangs manquent</text></svg>