<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Construire M′, symétrique de M par rapport à d</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">(MM′) est perpendiculaire à d, et M et M′ sont à égale distance de d.</text><line x1="500" y1="155" x2="500" y2="405" stroke="#C2185B" stroke-width="3.5"/><text x="504" y="437" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">d</text><line x1="170" y1="280" x2="830" y2="280" stroke="#777" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="170" cy="280" r="8" fill="#1F4E79"/><text x="140" y="288" font-family="DejaVu Serif" font-size="24" fill="#1F4E79" font-weight="bold" text-anchor="middle">M</text><circle cx="830" cy="280" r="8" fill="#2E7D32"/><text x="862" y="288" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">M′</text><circle cx="500" cy="280" r="7" fill="#C2185B"/><text x="524" y="264" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">H</text><line x1="335" y1="271" x2="335" y2="289" stroke="#B25000" stroke-width="3"/><line x1="665" y1="271" x2="665" y2="289" stroke="#B25000" stroke-width="3"/><path d="M 478 280 L 478 258 L 500 258" fill="none" stroke="#B25000" stroke-width="2.5"/><text x="500" y="473" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">même distance de part et d’autre : MH = HM′</text></svg>