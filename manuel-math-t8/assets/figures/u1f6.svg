<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comparer sans droite numérique</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Trois règles suffisent pour comparer deux entiers relatifs.</text><rect x="70" y="155" width="270" height="110" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="205" y="219" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="365" y="155" width="270" height="110" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="500" y="219" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="660" y="155" width="270" height="110" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="795" y="219" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="205" y="195" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">+ toujours</text><text x="205" y="230" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">plus grand que −</text><text x="500" y="195" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">deux positifs :</text><text x="500" y="230" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">ordre habituel</text><text x="795" y="195" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">deux négatifs :</text><text x="795" y="230" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">ordre inversé</text><text x="205" y="310" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-we