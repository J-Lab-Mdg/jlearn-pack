<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Diviser, c’est multiplier par l’inverse</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">2/3 ÷ 4/5 = 2/3 × 5/4 : la deuxième fraction se retourne.</text><rect x="130" y="165" width="250" height="85" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="255" y="216.5" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">2/3 ÷ 4/5</text><line x1="400" y1="207" x2="560" y2="207" stroke="#2E7D32" stroke-width="4"/><polygon points="560,207 547.3937405670625,213.08951747755722 547.3937405670625,200.91048252244278" fill="#2E7D32"/><rect x="580" y="165" width="250" height="85" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="705" y="216.5" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">2/3 × 5/4</text><text x="480" y="153" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">4/5 se retourne en 5/4</text><text x="500" y="305" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">résultat : (2 × 5) / (3 × 4) = 10/12 = 5/6</text></svg>