<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="468"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Translater un cercle, un segment, une droite</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">L’image d’un cercle est un cercle de MÊME rayon : il suffit de translater le centre.</text><circle cx="270" cy="285" r="95" fill="none" stroke="#1565C0" stroke-width="3.5"/><circle cx="690" cy="285" r="95" fill="none" stroke="#2E7D32" stroke-width="3.5"/><circle cx="270" cy="285" r="7" fill="#1565C0"/><circle cx="690" cy="285" r="7" fill="#2E7D32"/><line x1="285" y1="285" x2="672" y2="285" stroke="#B25000" stroke-width="3"/><polygon points="672,285 659.3937405670625,291.08951747755725 659.3937405670625,278.91048252244275" fill="#B25000"/><text x="270" y="174" font-family="DejaVu Serif" font-size="20" fill="#1565C0" font-weight="bold" text-anchor="middle">C (centre O, rayon r)</text><text x="690" y="174" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">C′ (centre O′, même rayon r)</text><text x="500" y="432" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">segment → segment égal et parallèle ; droite → droite parallèle</text></svg>