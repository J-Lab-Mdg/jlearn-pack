<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Décomposer pour calculer de tête</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">25 × 16 = 25 × 4 × 4 = 100 × 4 = 400 : aucun papier nécessaire !</text><rect x="110" y="160" width="200" height="80" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="210" y="209" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">25 × 16</text><line x1="330" y1="200" x2="420" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="420,200 407.39374056706254,206.08951747755722 407.39374056706254,193.91048252244278" fill="#2E7D32"/><rect x="435" y="160" width="230" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="550" y="209" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">25 × 4 × 4</text><line x1="685" y1="200" x2="760" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="760,200 747.3937405670625,206.08951747755722 747.3937405670625,193.91048252244278" fill="#2E7D32"/><rect x="775" y="160" width="170" height="80" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="860" y="209" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">400</text><text x="540" y="285" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">25 × 4 = 100 : une paire magique à repérer partout</text></svg>