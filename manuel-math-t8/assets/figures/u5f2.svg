<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le cône de révolution</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Un disque de base, un sommet au-dessus du centre, une surface courbe.</text><line x1="320" y1="400" x2="500" y2="150" stroke="#1565C0" stroke-width="3"/><line x1="680" y1="400" x2="500" y2="150" stroke="#1565C0" stroke-width="3"/><ellipse cx="500" cy="400" rx="180" ry="45" fill="none" stroke="#1565C0" stroke-width="3"/><line x1="500" y1="150" x2="500" y2="400" stroke="#C2185B" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="500" y1="400" x2="680" y2="400" stroke="#2E7D32" stroke-width="3"/><circle cx="500" cy="400" r="5" fill="#C2185B"/><text x="500" y="134" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">S</text><text x="468" y="275" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">h</text><text x="590" y="434" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">rayon r</text><text x="700" y="255" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">génératrice g</text><text x="500" y="490" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">g² = h² + r² : la pente du cône relie hauteur et rayon</text></svg>