<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Des rapports équivalents</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">2/3 = 8/12 : numérateur et dénominateur multipliés par le même nombre.</text><rect x="130" y="180" width="220" height="90" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="240" y="234" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">2/3</text><line x1="370" y1="225" x2="560" y2="225" stroke="#2E7D32" stroke-width="4"/><polygon points="560,225 547.3937405670625,231.08951747755722 547.3937405670625,218.91048252244278" fill="#2E7D32"/><rect x="580" y="180" width="220" height="90" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="690" y="234" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">8/12</text><text x="465" y="165" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">× 4 en haut et en bas</text><text x="500" y="330" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">le rapport ne change pas : 2 pour 3, c’est 8 pour 12</text></svg>