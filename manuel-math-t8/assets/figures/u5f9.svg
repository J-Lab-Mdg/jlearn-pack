<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les grandeurs produits</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Aire = L × l ; volume = aire × h ; énergie = puissance × temps.</text><rect x="170" y="160" width="280" height="170" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="310" y="365" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">L = 7 m</text><text x="120" y="250" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">l = 4 m</text><text x="310" y="250" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">A = 7 × 4 = 28 m²</text><rect x="560" y="180" width="370" height="120" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="745" y="249" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="745" y="215" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">grandeur produit :</text><text x="745" y="250" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">les UNITÉS se multiplient</text><text x="745" y="282" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="normal" text-anchor="middle">m × m = m² ; kW × h = kWh</text></svg>