<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le volume de la pyramide : un tiers du prisme</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Trois pyramides remplissent le prisme de même base et hauteur.</text><rect x="110" y="185" width="240" height="90" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="230" y="239" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="420" y="185" width="240" height="90" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="540" y="239" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><rect x="730" y="185" width="200" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="830" y="239" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="230" y="221" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">prisme</text><text x="230" y="255" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">V = B × h</text><text x="540" y="221" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">pyramide</text><text x="540" y="255" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">V = B × h ÷ 3</text><text x="830" y="221" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">rapport</text><text x="830" y="255" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">3 pour 1</text><text x="500" y="335" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">base 36 cm², hauteur 10 cm → V = 36 × 10 ÷ 3 = 120 cm³</text></svg>