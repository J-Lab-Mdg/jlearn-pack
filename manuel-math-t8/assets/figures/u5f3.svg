<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les patrons : le solide mis à plat</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Pyramide : un carré entouré de 4 triangles ; cône : un disque + un secteur.</text><rect x="200" y="220" width="140" height="140" fill="#FFF9C4" stroke="#B25000" stroke-width="2.5"/><polygon points="200,220 340,220 270,125" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><polygon points="200,360 340,360 270,455" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><polygon points="200,220 200,360 105,290" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><polygon points="340,220 340,360 435,290" fill="#FFE0B2" stroke="#B25000" stroke-width="2.5"/><text x="270" y="495" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">patron de la pyramide</text><path d="M 730 265 L 610 360 A 150 150 0 0 0 850 360 Z" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><circle cx="730" cy="465" r="52" fill="none" stroke="#1565C0" stroke-width="2.5"/><text x="730" y="560" font-family="DejaVu Serif" font-size="21" fill="#1565C0" font-weight="bold" text-anchor="middle">patron du cône : secteur + disque</text></svg>