<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Multiplier deux fractions : l’aire du rectangle</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">2/3 × 3/4 : un quadrillage 3 × 4 ; la zone double-hachurée compte 6 cases sur 12.</text><rect x="330" y="155" width="340" height="255" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="330" y="155" width="255" height="255" fill="#F8BBD0" opacity="0.65"/><rect x="330" y="155" width="340" height="170" fill="#A5D6A7" opacity="0.65"/><line x1="415" y1="155" x2="415" y2="410" stroke="#1F4E79" stroke-width="2"/><line x1="500" y1="155" x2="500" y2="410" stroke="#1F4E79" stroke-width="2"/><line x1="585" y1="155" x2="585" y2="410" stroke="#1F4E79" stroke-width="2"/><line x1="330" y1="240" x2="670" y2="240" stroke="#1F4E79" stroke-width="2"/><line x1="330" y1="325" x2="670" y2="325" stroke="#1F4E79" stroke-width="2"/><text x="500" y="450" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">3/4 en largeur (rose)</text><text x="170" y="282.5" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">2/3 en hauteur</text><text x="840" y="282.5" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">zone commune :</text><text x="840" y="314.5" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">6/12 = 1/2</text></svg>