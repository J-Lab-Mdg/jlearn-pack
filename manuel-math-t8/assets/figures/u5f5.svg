<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’aire latérale du cône</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Déplié, le cône devient un secteur : son aire vaut π × r × g.</text><path d="M 300 175 L 150 295 A 190 190 0 0 0 450 295 Z" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="190" y="215" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">g</text><rect x="600" y="205" width="330" height="100" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="765" y="264" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="765" y="243" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">Aire latérale</text><text x="765" y="280" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">A = π × r × g</text><text x="500" y="415" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">exemple : r = 3 cm, g = 5 cm → A = π × 3 × 5 ≈ 47,1 cm²</text></svg>