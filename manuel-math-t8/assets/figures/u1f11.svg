<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La proportion</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une proportion est l’égalité de deux rapports : 2/3 = 8/12, et 2 × 12 = 3 × 8.</text><text x="240" y="215" font-family="DejaVu Serif" font-size="34" fill="#1F4E79" font-weight="bold" text-anchor="middle">2/3  =  8/12</text><path d="M 160 240 Q 240 295 330 240" fill="none" stroke="#2E7D32" stroke-width="3"/><path d="M 160 175 Q 240 120 330 175" fill="none" stroke="#C2185B" stroke-width="3"/><rect x="480" y="155" width="440" height="60" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="700" y="194" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">2 × 12 = 24</text><rect x="480" y="230" width="440" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="700" y="269" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">3 × 8 = 24</text><text x="700" y="335" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">produits croisés égaux : c’est une proportion !</text></svg>