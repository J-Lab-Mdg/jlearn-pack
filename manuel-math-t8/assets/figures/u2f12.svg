<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Estimer avant de calculer</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">4,9 × 2,1 : on arrondit chaque facteur → 5 × 2 = 10. Résultat exact : 10,29.</text><rect x="110" y="160" width="220" height="80" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="220" y="209" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">4,9 × 2,1</text><line x1="350" y1="200" x2="460" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="460,200 447.39374056706254,206.08951747755722 447.39374056706254,193.91048252244278" fill="#2E7D32"/><rect x="480" y="160" width="180" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="570" y="209" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">5 × 2</text><line x1="680" y1="200" x2="760" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="760,200 747.3937405670625,206.08951747755722 747.3937405670625,193.91048252244278" fill="#2E7D32"/><rect x="775" y="160" width="150" height="80" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="850" y="209" font-family="DejaVu Serif" font-size="28" fill="#222" font-weight="normal" text-anchor="middle">≈ 10</text><text x="405" y="147" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">on arrondit</text><text x="500" y="295" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">l’estimation détecte les grosses erreurs de calcul</text></svg>