<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Agrandir : longueurs × k, aires × k²</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Côté doublé (k = 2) → aire quadruplée (k² = 4).</text><rect x="150" y="250" width="85" height="85" fill="#BBDEFB" stroke="#1565C0" stroke-width="3"/><text x="192.5" y="370" font-family="DejaVu Serif" font-size="20" fill="#1565C0" font-weight="bold" text-anchor="middle">1 × 1 = 1 carré</text><rect x="480" y="165" width="170" height="170" fill="#C8E6C9" stroke="#2E7D32" stroke-width="3"/><line x1="565" y1="165" x2="565" y2="335" stroke="#2E7D32" stroke-width="2"/><line x1="480" y1="250" x2="650" y2="250" stroke="#2E7D32" stroke-width="2"/><text x="565" y="370" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">2 × 2 = 4 carrés</text><line x1="265" y1="225" x2="455" y2="225" stroke="#B25000" stroke-width="3"/><polygon points="455,225 442.39374056706254,231.08951747755722 442.39374056706254,218.91048252244278" fill="#B25000"/><text x="360" y="205" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">k = 2</text><text x="810" y="245" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">aire × k²</text><text x="810" y="280" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">= × 4</text></svg>