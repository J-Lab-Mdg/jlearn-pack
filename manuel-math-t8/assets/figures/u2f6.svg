<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="508"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’ordre complet des priorités</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Parenthèses, puis exposants, puis × et ÷, puis + et −.</text><rect x="350" y="150" width="300" height="60" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="189" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="500" y="188" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">1. Parenthèses ( )</text><rect x="280" y="222" width="440" height="60" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="261" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="500" y="260" font-family="DejaVu Serif" font-size="22" fill="#B25000" font-weight="bold" text-anchor="middle">2. Exposants aⁿ</text><rect x="210" y="294" width="580" height="60" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="500" y="333" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="500" y="332" font-family="DejaVu Serif" font-size="22" fill="#1565C0" font-weight="bold" text-anchor="middle">3. × et ÷</text><rect x="140" y="366" width="720" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="405" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle"></text><text x="500" y="404" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">4. + et −</text><text x="500" y="468" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">(2 + 1)² × 2 − 5 = 9 × 2 − 5 = 18 − 5 = 13</text></svg>