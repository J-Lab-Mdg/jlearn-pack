<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Résoudre 2x + 3 = 11 en deux étapes</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On défait les opérations à l’envers : d’abord le + 3, ensuite le × 2.</text><rect x="110" y="160" width="240" height="80" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="230" y="209" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2x + 3 = 11</text><line x1="365" y1="200" x2="460" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="460,200 447.39374056706254,206.08951747755722 447.39374056706254,193.91048252244278" fill="#2E7D32"/><rect x="475" y="160" width="200" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="575" y="209" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2x = 8</text><line x1="690" y1="200" x2="775" y2="200" stroke="#2E7D32" stroke-width="4"/><polygon points="775,200 762.3937405670625,206.08951747755722 762.3937405670625,193.91048252244278" fill="#2E7D32"/><rect x="790" y="160" width="140" height="80" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="860" y="209" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">x = 4</text><text x="412" y="147" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">① − 3</text><text x="733" y="147" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="bold" text-anchor="middle">② ÷ 2</text><text x="500" y="295" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">vérification : 2 × 4 + 3 = 11 ✓</text></svg>