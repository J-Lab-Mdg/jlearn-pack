<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Multiplication et division : opérations réciproques</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">4 × (−3) = −12, donc (−12) ÷ (−3) = 4 et (−12) ÷ 4 = −3.</text><rect x="390" y="155" width="220" height="75" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="201.5" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">−12</text><rect x="180" y="305" width="200" height="75" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="280" y="351.5" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">4</text><rect x="620" y="305" width="200" height="75" rx="10" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="720" y="351.5" font-family="DejaVu Serif" font-size="30" fill="#222" font-weight="normal" text-anchor="middle">−3</text><line x1="395" y1="300" x2="460" y2="240" stroke="#2E7D32" stroke-width="3.5"/><line x1="605" y1="300" x2="540" y2="240" stroke="#2E7D32" stroke-width="3.5"/><text x="282" y="275" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">÷ (−3)</text><text x="722" y="275" font-family="DejaVu Serif" font-size="21" fill="#2E7D32" font-weight="bold" text-anchor="middle">÷ 4</text><text x="500" y="435" font-family="DejaVu Serif" font-size="23" fill="#B25000" font-weight="bold" text-anchor="middle">la division « défait » la multiplication</text></svg>