<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Frises et pavages : des symétries qui se répètent</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Un motif, des symétries, et la frise s’étire à l’infini — comme sur un lamba tissé.</text><line x1="80" y1="165" x2="920" y2="165" stroke="#888" stroke-width="2"/><line x1="80" y1="315" x2="920" y2="315" stroke="#888" stroke-width="2"/><polygon points="120,305 180,180 240,305" fill="#F8BBD0" stroke="#C2185B" stroke-width="2.5"/><polygon points="285,305 345,180 405,305" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2.5"/><polygon points="450,305 510,180 570,305" fill="#F8BBD0" stroke="#C2185B" stroke-width="2.5"/><polygon points="615,305 675,180 735,305" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2.5"/><polygon points="780,305 840,180 900,305" fill="#F8BBD0" stroke="#C2185B" stroke-width="2.5"/><line x1="367" y1="153" x2="367" y2="327" stroke="#B25000" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="698" y1="153" x2="698" y2="327" stroke="#B25000" stroke-width="2.5" stroke-dasharray="8 6"/><text x="500" y="370" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">axes verticaux entre les motifs : symétries axiales de la frise</text></svg>