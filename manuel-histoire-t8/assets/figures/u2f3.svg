<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le commerce triangulaire</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Trois continents, trois cargaisons : le circuit de la traite atlantique.</text><rect x="370" y="185" width="260" height="56" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="222" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">EUROPE</text><rect x="30" y="495" width="300" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="180" y="532" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">AFRIQUE</text><rect x="670" y="495" width="300" height="56" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="820" y="532" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">AMÉRIQUE</text><line x1="390" y1="245" x2="160" y2="487" stroke="#B25000" stroke-width="5"/><polygon points="160,487 164.27055305785137,473.6672442240895 173.09852472955117,482.0574652343826" fill="#B25000"/><line x1="330" y1="523" x2="665" y2="523" stroke="#B25000" stroke-width="5"/><polygon points="665,523 652.3937405670625,529.0895174775573 652.3937405670625,516.9104825224427" fill="#B25000"/><line x1="800" y1="487" x2="610" y2="245" stroke="#B25000" stroke-width="5"/><polygon points="610,245 622.5744717422795,251.15488914624908 612.9951266867077,258.67586253698727" fill="#B25000"/><text x="255" y="330" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="start">1. armes, tissus,</text><text x="255" y="357" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="start">alcool, verroterie</text><text x="500" y="605" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">2. captifs africains réduits en esclavage</text><text x="745" y="330" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="end">3. sucre, coton,</text><text x="745" y="357" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="bold" text-anchor="end">tabac, métaux</text><text x="500" y="645" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">un commerce fondé sur la traite des êtres humains</text></svg>