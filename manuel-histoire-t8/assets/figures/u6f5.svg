<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="533"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La marche vers l’indépendance</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">De 1947 au 26 juin 1960 : les étapes.</text><rect x="70" y="147" width="240" height="58" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="190" y="185" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">après 1947</text><line x1="310" y1="176" x2="348" y2="176" stroke="#B25000" stroke-width="3.5"/><polygon points="348,176 335.39374056706254,182.08951747755722 335.39374056706254,169.91048252244278" fill="#B25000"/><rect x="353" y="147" width="580" height="58" rx="10" fill="#FFFFFF" stroke="#C2185B" stroke-width="3"/><text x="643" y="185" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">répression, mais l’idée d’indépendance grandit</text><line x1="190" y1="205" x2="190" y2="231" stroke="#B25000" stroke-width="3"/><polygon points="190,231 183.91048252244278,218.39374056706254 196.08951747755722,218.39374056706254" fill="#B25000"/><rect x="70" y="231" width="240" height="58" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="190" y="269" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1956</text><line x1="310" y1="260" x2="348" y2="260" stroke="#B25000" stroke-width="3.5"/><polygon points="348,260 335.39374056706254,266.08951747755725 335.39374056706254,253.91048252244278" fill="#B25000"/><rect x="353" y="231" width="580" height="58" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="3"/><text x="643" y="269" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Loi-cadre : gouvernement local malgache</text><line x1="190" y1="289" x2="190" y2="315" stroke="#B25000" stroke-width="3"/><polygon points="190,315 183.91048252244278,302.39374056706254 196.08951747755722,302.39374056706254" fill="#B25000"/><rect x="70" y="315" width="240" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="190" y="353" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1958</text><line x1="310" y1="344" x2="348" y2="344" stroke="#B25000" stroke-width="3.5"/><polygon points="348,344 335.39374056706254,350.08951747755725 335.39374056706254,337.91048252244275" fill="#B25000"/><rect x="353" y="315" width="580" height="58" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/><text x="643" y="353" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">référendum : la République malgache est proclamée</text><line x1="190" y1="373" x2="190" y2="399" stroke="#B25000" stroke-width="3"/><polygon points="190,399 183.91048252244278,386.39374056706254 196.08951747755722,386.39374056706254" fill="#B25000"/><rect x="70" y="399" width="240" height="58" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="190" y="437" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">26 juin 1960</text><line x1="310" y1="428" x2="348" y2="428" stroke="#B25000" stroke-width="3.5"/><polygon points="348,428 335.39374056706254,434.08951747755725 335.39374056706254,421.91048252244275" fill="#B25000"/><rect x="353" y="399" width="580" height="58" rx="10" fill="#FFFFFF" stroke="#C2185B" stroke-width="3"/><text x="643" y="437" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">INDÉPENDANCE de Madagascar</text><text x="500" y="501" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">soixante-quatre ans après 1896, Madagascar redevient souverain</text></svg>