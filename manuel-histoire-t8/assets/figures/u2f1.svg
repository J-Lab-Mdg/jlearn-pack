<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="619"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les Temps modernes : 1492 – 1789</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une période encadrée par deux dates, portée par trois grands mouvements.</text><rect x="60" y="210" width="880" height="60" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="248" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="bold" text-anchor="middle">TEMPS MODERNES</text><text x="60" y="198" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="start">1492</text><text x="940" y="198" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="end">1789</text><text x="60" y="300" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="start">arrivée de Colomb en Amérique</text><text x="940" y="300" font-family="DejaVu Serif" font-size="20" fill="#333" font-weight="normal" text-anchor="end">Révolution française</text><text x="500" y="340" font-family="DejaVu Serif" font-size="23" fill="#1F4E79" font-weight="bold" text-anchor="middle">Trois grands mouvements marquent la période :</text><rect x="90" y="365" width="340" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="260" y="402" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">Grandes découvertes</text><text x="460" y="401" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="start">les Européens explorent les océans</text><rect x="90" y="443" width="340" height="56" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="260" y="480" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">Renaissance</text><text x="460" y="479" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="start">renouveau des arts et des sciences</text><rect x="90" y="521" width="340" height="56" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="260" y="558" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">Réforme</text><text x="460" y="557" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="start">division religieuse de l’Europe</text></svg>