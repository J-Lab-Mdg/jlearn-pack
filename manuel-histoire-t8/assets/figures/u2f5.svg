<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="636"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Madagascar aux Temps modernes</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">De Diégo Diaz à Beniowski : l’île entre dans les routes du monde.</text><rect x="70" y="150" width="220" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="180" y="186" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1500</text><line x1="290" y1="177" x2="330" y2="177" stroke="#B25000" stroke-width="3.5"/><polygon points="330,177 317.39374056706254,183.08951747755722 317.39374056706254,170.91048252244278" fill="#B25000"/><rect x="335" y="150" width="600" height="54" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/><text x="635" y="186" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">Diégo Diaz aborde l’île (Européens)</text><rect x="70" y="222" width="220" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="180" y="258" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">XVIᵉ-XVIIᵉ s.</text><line x1="290" y1="249" x2="330" y2="249" stroke="#B25000" stroke-width="3.5"/><polygon points="330,249 317.39374056706254,255.08951747755722 317.39374056706254,242.91048252244278" fill="#B25000"/><rect x="335" y="222" width="600" height="54" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="3"/><text x="635" y="258" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">comptoirs européens sur les côtes</text><rect x="70" y="294" width="220" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="180" y="330" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="mid