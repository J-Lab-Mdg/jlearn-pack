<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="609"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Protéger et transmettre les patrimoines historiques</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">De la définition à la mémoire collective : la chaîne de sauvegarde.</text><rect x="120" y="147" width="760" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="185" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">1. définir : reconnaître ce qui fait patrimoine</text><line x1="500" y1="205" x2="500" y2="225" stroke="#C2185B" stroke-width="4"/><polygon points="500,225 493.91048252244275,212.39374056706254 506.08951747755725,212.39374056706254" fill="#C2185B"/><rect x="120" y="225" width="760" height="58" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="263" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">2. sensibiliser : faire connaître sa valeur à tous</text><line x1="500" y1="283" x2="500" y2="303" stroke="#C2185B" stroke-width="4"/><polygon points="500,303 493.91048252244275,290.39374056706254 506.08951747755725,290.39374056706254" fill="#C2185B"/><rect x="120" y="303" width="760" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="341" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">3. protéger : appliquer la loi de protection</text><line x1="500" y1="361" x2="500" y2="381" stroke="#C2185B" stroke-width="4"/><polygon points="500,381 493.91048252244275,368.39374056706254 506.08951747755725,368.39374056706254" fill="#C2185B"/><rect x="120" y="381" width="760" height="58" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="419" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">4. transmettre : enseigner aux jeunes générations</text><line x1="500" y1="439" x2="500" y2="459" stroke="#C2185B" stroke-width="4"/><polygon points="500,459 493.91048252244275,446.39374056706254 506.08951747755725,446.39374056706254" fill="#C2185B"/><rect x="120" y="459" width="760" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="497" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">5. entretenir la mémoire collective de la nation</text><text x="500" y="547" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">coutumes, contes, danses, cuisine, savoir-faire : un trésor vivant</text><text x="500" y="579" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">chaque génération est le gardien du suivant</text></svg>