<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="633"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Le système économique colonial</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Économie de traite, travaux forcés, grandes compagnies.</text><text x="500" y="153" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">L’ÉCONOMIE DE TRAITE</text><rect x="110" y="173" width="780" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="208" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">exporte : matières premières (café, vanille) à bas prix</text><rect x="110" y="239" width="780" height="52" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="274" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">importe : produits fabriqués français au prix fort</text><text x="500" y="325" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">LE TRAVAIL FORCÉ</text><rect x="130" y="343" width="740" height="52" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="378" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">corvées : routes, chemin de fer, portage</text><rect x="130" y="409" width="740" height="52" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="444" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">SMOTIG (1926) : service de travail obligatoire</text><text x="500" y="499" font-family="DejaVu Serif" font-size="24" fill="#1F4E79" font-weight="bold" text-anchor="middle">LES GRANDES COMPAGNIES</text><rect x="130" y="517" width="740" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="552" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">compagnies havraise, lyonnaise, marseillaise</text><text x="500" y="603" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">elles contrôlent le commerce et rapatrient les profits en France</text></svg>