<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les origines de la colonisation</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Causes internes à Madagascar, causes externes en Europe.</text><text x="500" y="153" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">CAUSES INTERNES</text><rect x="130" y="171" width="740" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="205" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">la charte Lambert (1855)</text><rect x="130" y="237" width="740" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="271" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">l’héritage de Jean Laborde</text><rect x="130" y="303" width="740" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="337" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">la guerre franco-hova de 1895</text><rect x="130" y="369" width="740" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="403" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">l’abdication de Ranavalona III : fin de la royauté</text><text x="500" y="463" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">CAUSES EXTERNES</text><rect x="130" y="481" width="740" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="515" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">les rivalités coloniales européennes</text><rect x="130" y="547" width="740" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="581" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">conférence de Berlin (1885) et convention de Zanzibar</text><rect x="130" y="613" width="740" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="647" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">la révolution industrielle : matières premières, marchés</text><rect x="130" y="679" width="740" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="713" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">la « mission civilisatrice » de Jules Ferry</text><text x="500" y="763" font-family="DejaVu Serif" font-size="23" fill="#1F4E79" font-weight="bold" text-anchor="middle">1896 : Madagascar devient colonie française</text></svg>