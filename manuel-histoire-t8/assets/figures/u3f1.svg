<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="601"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">L’Ancien Régime : la société des trois ordres</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Une pyramide inégalitaire, sous un roi absolu.</text><rect x="350" y="155" width="300" height="56" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="500" y="192" font-family="DejaVu Serif" font-size="24" fill="#222" font-weight="normal" text-anchor="middle">LE ROI ABSOLU</text><line x1="500" y1="211" x2="500" y2="241" stroke="#B25000" stroke-width="4"/><polygon points="500,241 493.91048252244275,228.39374056706254 506.08951747755725,228.39374056706254" fill="#B25000"/><rect x="120" y="250" width="240" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="240" y="289" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">CLERGÉ</text><text x="390" y="288" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="start">prie — privilégié, ne paie pas d’impôts</text><rect x="120" y="340" width="240" height="60" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="240" y="379" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">NOBLESSE</text><text x="390" y="378" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="start">combat — privilégiée, perçoit des droits</text><rect x="120" y="430" width="240" height="60" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="240" y="469" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">TIERS ÉTAT</text><text x="390" y="468" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="start">travaille — paie tous les impôts (97 % du peuple)</text><text x="500" y="535" font-family="DejaVu Serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">agriculture traditionnelle, régime seigneurial, poids de l’Église</text><text x="500" y="569" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">exception : l’Angleterre pratique le parlementarisme</text></svg>