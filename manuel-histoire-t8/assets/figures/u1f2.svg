<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="707"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Produire une source orale : la chaîne complète</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Huit maillons, de la question de recherche au dossier présenté.</text><rect x="110" y="147" width="780" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="181" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1. poser la problématique (question de recherche)</text><line x1="500" y1="197" x2="500" y2="211" stroke="#C2185B" stroke-width="4"/><polygon points="500,211 493.91048252244275,198.39374056706254 506.08951747755725,198.39374056706254" fill="#C2185B"/><rect x="110" y="211" width="780" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="245" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">2. élaborer la grille d’entretien</text><line x1="500" y1="261" x2="500" y2="275" stroke="#C2185B" stroke-width="4"/><polygon points="500,275 493.91048252244275,262.39374056706254 506.08951747755725,262.39374056706254" fill="#C2185B"/><rect x="110" y="275" width="780" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="309" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">3. choisir les témoins et les supports</text><line x1="500" y1="325" x2="500" y2="339" stroke="#C2185B" stroke-width="4"/><polygon points="500,339 493.91048252244275,326.39374056706254 506.08951747755725,326.39374056706254" fill="#C2185B"/><rect x="110" y="339" width="780" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="373" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">4. mener l’entretien (noter, enregistrer)</text><line x1="500" y1="389" x2="500" y2="403" stroke="#C2185B" stroke-width="4"/><polygon points="500,403 493.91048252244275,390.39374056706254 506.08951747755725,390.39374056706254" fill="#C2185B"/><rect x="110" y="403" width="780" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="437" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">5. retranscrire fidèlement les paroles</text><line x1="500" y1="453" x2="500" y2="467" stroke="#C2185B" stroke-width="4"/><polygon points="500,467 493.91048252244275,454.39374056706254 506.08951747755725,454.39374056706254" fill="#C2185B"/><rect x="110" y="467" width="780" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="501" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">6. analyser : répondre à la problématique</text><line x1="500" y1="517" x2="500" y2="531" stroke="#C2185B" stroke-width="4"/><polygon points="500,531 493.91048252244275,518.3937405670625 506.08951747755725,518.3937405670625" fill="#C2185B"/><rect x="110" y="531" width="780" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="565" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">7. recouper avec d’autres sources écrites et orales</text><line x1="500" y1="581" x2="500" y2="595" stroke="#C2185B" stroke-width="4"/><polygon points="500,595 493.91048252244275,582.3937405670625 506.08951747755725,582.3937405670625" fill="#C2185B"/><rect x="110" y="595" width="780" height="50" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="629" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">8. constituer le dossier et le présenter à l’oral</text><text x="500" y="675" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">le dossier final devient une SOURCE pour d’autres historiens</text></svg>