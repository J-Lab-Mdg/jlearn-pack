<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="692"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Radama I : la création du Royaume de Madagascar</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Traités, armée, écoles : les grands changements.</text><rect x="70" y="150" width="230" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="185" y="186" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1810</text><line x1="300" y1="177" x2="338" y2="177" stroke="#B25000" stroke-width="3.5"/><polygon points="338,177 325.39374056706254,183.08951747755722 325.39374056706254,170.91048252244278" fill="#B25000"/><rect x="343" y="150" width="590" height="54" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/><text x="638" y="186" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">Radama I poursuit l’unification d’Andrianampoinimerina</text><rect x="70" y="220" width="230" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="185" y="256" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1817 et 1820</text><line x1="300" y1="247" x2="338" y2="247" stroke="#B25000" stroke-width="3.5"/><polygon points="338,247 325.39374056706254,253.08951747755722 325.39374056706254,240.91048252244278" fill="#B25000"/><rect x="343" y="220" width="590" height="54" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="3"/><text x="638" y="256" font-family="DejaVu Serif" font-size="20" fill="#222" font-weight="normal" text-anchor="middle">traités avec les Anglais : abolition de la traite</text><rect x="70" y="290" width="230" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="185" y="326" font-family="DejaVu Serif" font-size="22" fill="#222" fo