<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="643"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les souverains du Royaume de Madagascar</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Six règnes, de 1810 à 1896.</text><rect x="130" y="147" width="400" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="330" y="184" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">Radama I</text><line x1="530" y1="175" x2="568" y2="175" stroke="#B25000" stroke-width="3.5"/><polygon points="568,175 555.3937405670625,181.08951747755722 555.3937405670625,168.91048252244278" fill="#B25000"/><rect x="573" y="147" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/><text x="723" y="184" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1810 – 1828</text><rect x="130" y="221" width="400" height="56" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="330" y="258" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">Ranavalona I</text><line x1="530" y1="249" x2="568" y2="249" stroke="#B25000" stroke-width="3.5"/><polygon points="568,249 555.3937405670625,255.08951747755722 555.3937405670625,242.91048252244278" fill="#B25000"/><rect x="573" y="221" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#C2185B" stroke-width="3"/><text x="723" y="258" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">1828 – 1861</text><rect x="130" y="295" width="400" height="56" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="330" y="332" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">Radama II</text><line x1="530" y1="323" x2="568" y2="323" stroke="#