<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="726"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les règles d’or de l’entretien</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Avant, pendant : la conduite d’une enquête orale réussie.</text><text x="80" y="160" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="start">AVANT l’entretien</text><rect x="80" y="180" width="840" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="214" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">se concerter : répartir les rôles dans le groupe</text><rect x="80" y="246" width="840" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="280" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">préparer le thème, l’objet et les questions</text><text x="80" y="342" font-family="DejaVu Serif" font-size="24" fill="#1F4E79" font-weight="bold" text-anchor="start">PENDANT l’entretien</text><rect x="80" y="362" width="840" height="48" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="395" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">garder le contact visuel avec le témoin</text><rect x="80" y="424" width="840" height="48" rx="10" fill="#BBD4EE" stroke="#1F4E79" stroke-width="3"/><text x="500" y="457" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">faire preuve d’empathie : se mettre à sa place</text><rect x="80" y="486" width="840" height="48" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="519" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">poser UNE seule question à la fois</text><rect x="80" y="548" width="840" height="48" rx="10" fill="#BBD4EE" stroke="#1F4E79" stroke-width="3"/><text x="500" y="581" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">laisser le témoin raconter librement</text><rect x="80" y="610" width="840" height="48" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="643" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">recadrer poliment s’il s’éloigne du sujet</text><text x="500" y="692" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">écouter plus que parler — le témoin est la source</text></svg>