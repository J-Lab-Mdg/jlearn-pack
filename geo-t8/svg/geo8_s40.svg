<text x="260" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">suffisamment chaudes dans des conditions</text>
<text x="260" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">favorables</text><rect x="630" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#00838F" stroke-width="4"/><text x="840" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Le changement climatique peut renforcer</text>
