<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6A1B9A"/></marker></defs><rect width="1100" height="650" rx="28" fill="#F3E5F5"/><rect x="18" y="18" width="1064" height="614" rx="24" fill="none" stroke="#6A1B9A" stroke-width="4"/><circle cx="110" cy="555" r="40" fill="none" stroke="#6A1B9A" stroke-width="8" opacity=".18"/><ellipse cx="110" cy="555" rx="78" ry="22" fill="none" stroke="#6A1B9A" stroke-width="6" opacity=".18" transform="rotate(-18 110 555)"/><text x="550" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#4A148C" font-weight="700">Développer et conclure un commentaire de document</text><line x1="550" y1="335" x2="260" y2="207" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="207" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="260" y2="482" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="482" stroke="#6A1B9A" stroke-width="6" opacity=".45" marker-end="url(#a)"/><rect x="50" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="260" y="193.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Chaque partie répond à un axe du plan et</text>
<text x="260" y="220.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">commence par une idée claire</text><rect x="630" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="840" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Les références précises au document</text>
<text x="840" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">justifient l'analyse sans remplacer</text>
<text x="840" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">l'explication</text><rect x="50" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="260" y="468.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Une transition résume la partie achevée</text>
<text x="260" y="495.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">et annonce la suivante</text><rect x="630" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="4"/><text x="840" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">La conclusion répond à la question,</text>
<text x="840" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">présente l'intérêt du document et</text>
