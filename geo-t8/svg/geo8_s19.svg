<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2E7D32"/></marker></defs><rect width="1100" height="650" rx="28" fill="#E8F5E9"/><rect x="18" y="18" width="1064" height="614" rx="24" fill="none" stroke="#2E7D32" stroke-width="4"/><path d="M35 605l70-105 48 68 32-48 58 85z" fill="#2E7D32" opacity=".13"/><path d="M175 525c35-42 84 3 50 28 47-4 52 54 7 54h-82c-46 0-42-62 2-57 1-10 9-20 23-25z" fill="#2E7D32" opacity=".13"/><text x="550" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#1B5E20" font-weight="700">Les points communs des pays en développement</text><line x1="550" y1="335" x2="260" y2="207" stroke="#2E7D32" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="207" stroke="#2E7D32" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="260" y2="482" stroke="#2E7D32" stroke-width="6" opacity=".45" marker-end="url(#a)"/><line x1="550" y1="335" x2="840" y2="482" stroke="#2E7D32" stroke-width="6" opacity=".45" marker-end="url(#a)"/><rect x="50" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/><text x="260" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Beaucoup se situent dans les régions</text>
<text x="260" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">tropicales mais le climat n'explique pas</text>
<text x="260" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">seul leur situation</text><rect x="630" y="125" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/><text x="840" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">La pauvreté touche une part importante</text>
<text x="840" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">de la population et s'accompagne souvent</text>
<text x="840" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">de fortes inégalités</text><rect x="50" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/><text x="260" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">L'histoire coloniale a influencé</text>
<text x="260" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">frontières, économies et réseaux</text>
<text x="260" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">commerciaux</text><rect x="630" y="400" width="420" height="165" rx="24" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/><text x="840" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">L'agriculture et le secteur informel</text>
<text x="840" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">occupent souvent une place importante</text>
<text x="840" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">dans l'emploi</text><circle cx="550" cy="335" r="112" fill="#2E7D32" stroke="#FFFFFF" stroke-width="10"/><text x="550" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#FFFFFF" font-weight="700">points communs</text><text x="1040" y="615" text-anchor="end" font-family="Arial" font-size="17" fill="#1B5E20">J-Learn · GEO T8 · S19</text></svg>