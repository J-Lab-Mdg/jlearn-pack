<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="600"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La virgule sépare deux parties</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Dans 62,57 : 62 est la partie entière ; 57 est la partie décimale.</text><rect x="155" y="155" width="190" height="75" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="250" y="201.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">DIZAINES</text><rect x="345" y="155" width="190" height="75" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="440" y="201.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">UNITÉS</text><rect x="535" y="155" width="190" height="75" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="201.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">DIXIÈMES</text><rect x="725" y="155" width="190" height="75" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="201.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">CENTIÈMES</text><rect x="155" y="230" width="190" height="75" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="250" y="276.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">6</text><rect x="345" y="230" width="190" height="75" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="440" y="276.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2</text><rect x="535" y="230" width="190" height="75" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="276.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5</text><rect x="725" y="230" width="190" height="75" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="276.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">7</text><rect x="155" y="305" width="190" height="75" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="250" y="351.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">60</text><rect x="345" y="305" width="190" height="75" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="440" y="351.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">2</text><rect x="535" y="305" width="190" height="75" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="351.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">0,5</text><rect x="725" y="305" width="190" height="75" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="820" y="351.5" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">0,07</text><text x="665" y="430" font-family="DejaVu Serif" font-size="29" fill="#C2185B" font-weight="bold" text-anchor="middle">62,57 = 62 unités + 5 dixièmes + 7 centièmes</text><text x="665" y="510" font-family="DejaVu Serif" font-size="25" fill="#1F4E79" font-weight="normal" text-anchor="middle">62,57 se lit : soixante-deux virgule cinquante-sept.</text></svg>