<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="540"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comparer : la pointe va vers le plus petit</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">On compare d’abord le nombre de chiffres, puis les colonnes depuis la gauche.</text><rect x="95" y="150" width="300" height="90" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="245" y="204" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="middle">87 650</text><rect x="525" y="150" width="300" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="675" y="204" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="middle">87 605</text><text x="460" y="210" font-family="DejaVu Serif" font-size="58" fill="#C2185B" font-weight="bold" text-anchor="middle">></text><text x="245" y="285" font-family="DejaVu Serif" font-size="22" fill="#1F4E79" font-weight="normal" text-anchor="middle">mêmes dizaines de mille</text><text x="675" y="285" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">6 dizaines > 0 dizaine</text><text x="665" y="370" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">Ordre croissant : 504 000  &lt;  540 000  &lt;  545 000</text><text x="665" y="450" font-family="DejaVu Serif" font-size="26" fill="#B25000" font-weight="bold" text-anchor="middle">La pointe du signe &lt; regarde le plus petit.</text></svg>