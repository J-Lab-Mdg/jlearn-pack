<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="500"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Ouvrir et refermer un nombre</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Chaque chiffre donne une valeur selon sa colonne.</text><rect x="95" y="155" width="250" height="82" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="220" y="205" font-family="DejaVu Serif" font-size="34" fill="#222" font-weight="normal" text-anchor="middle">68 425</text><line x1="360" y1="196" x2="465" y2="196" stroke="#2E7D32" stroke-width="5"/><polygon points="465,196 452.39374056706254,202.08951747755722 452.39374056706254,189.91048252244278" fill="#2E7D32"/><rect x="500" y="145" width="180" height="72" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="590" y="190" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">60 000</text><rect x="700" y="145" width="150" height="72" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="775" y="190" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">8 000</text><rect x="870" y="145" width="125" height="72" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="932.5" y="190" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">400</text><rect x="1015" y="145" width="100" height="72" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="1065" y="190" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">20</text><rect x="1135" y="145" width="100" height="72" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="1185" y="190" font-family="DejaVu Serif" font-size="27" fill="#222" font-weight="normal" text-anchor="middle">5</text><text x="665" y="300" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">68 425 = 60 000 + 8 000 + 400 + 20 + 5</text><text x="665" y="375" font-family="DejaVu Serif" font-size="23" fill="#1F4E79" font-weight="normal" text-anchor="middle">On peut aussi utiliser × : (6 × 10 000) + (8 × 1 000) + (4 × 100) + (2 × 10) + 5</text></svg>