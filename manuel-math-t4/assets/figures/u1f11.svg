<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="550"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Comparer les nombres décimaux</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Ajoute des zéros à droite si nécessaire : 32,4 = 32,40 = 32,400.</text><rect x="120" y="150" width="210" height="82" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="225" y="200" font-family="DejaVu Serif" font-size="33" fill="#222" font-weight="normal" text-anchor="middle">32,4</text><text x="385" y="210" font-family="DejaVu Serif" font-size="48" fill="#2E7D32" font-weight="bold" text-anchor="middle">=</text><rect x="450" y="150" width="250" height="82" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="575" y="200" font-family="DejaVu Serif" font-size="33" fill="#222" font-weight="normal" text-anchor="middle">32,40</text><text x="760" y="210" font-family="DejaVu Serif" font-size="48" fill="#2E7D32" font-weight="bold" text-anchor="middle">=</text><rect x="825" y="150" width="290" height="82" rx="10" fill="#FFF8E1" stroke="#B25000" stroke-width="3"/><text x="970" y="200" font-family="DejaVu Serif" font-size="33" fill="#222" font-weight="normal" text-anchor="middle">32,400</text><text x="660" y="325" font-family="DejaVu Serif" font-size="38" fill="#C2185B" font-weight="bold" text-anchor="middle">32,4  >  32,365</text><text x="660" y="385" font-family="DejaVu Serif" font-size="30" fill="#1F4E79" font-weight="bold" text-anchor="middle">car 32,400  >  32,365</text><text x="660" y="470" font-family="DejaVu Serif" font-size="27" fill="#2E7D32" font-weight="bold" text-anchor="middle">Encadrement au centième : 8,36  &lt;  8,362  &lt;  8,37</text></svg>