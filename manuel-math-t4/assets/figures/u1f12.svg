<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="620"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les chiffres romains de I à M</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">I=1, V=5, X=10, L=50, C=100, D=500, M=1000</text><rect x="100" y="135" width="145" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="172.5" y="175" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">I</text><rect x="245" y="135" width="145" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="317.5" y="175" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">V</text><rect x="390" y="135" width="145" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="462.5" y="175" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">X</text><rect x="535" y="135" width="145" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="607.5" y="175" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">L</text><rect x="680" y="135" width="145" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="752.5" y="175" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">C</text><rect x="825" y="135" width="145" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="897.5" y="175" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">D</text><rect x="970" y="135" width="145" height="62" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="1042.5" y="175" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">M</text><rect x="100" y="197" width="145" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="172.5" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">1</text><rect x="245" y="197" width="145" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="317.5" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">5</text><rect x="390" y="197" width="145" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="462.5" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">10</text><rect x="535" y="197" width="145" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="607.5" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">50</text><rect x="680" y="197" width="145" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="752.5" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">100</text><rect x="825" y="197" width="145" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="897.5" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">500</text><rect x="970" y="197" width="145" height="62" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="1042.5" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">1 000</text><text x="665" y="320" font-family="DejaVu Serif" font-size="29" fill="#2E7D32" font-weight="bold" text-anchor="middle">Addition : VIII = 5 + 1 + 1 + 1 = 8</text><text x="665" y="385" font-family="DejaVu Serif" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">Soustraction : IV = 5 − 1 = 4   ;   XL = 50 − 10 = 40</text><text x="665" y="470" font-family="DejaVu Serif" font-size="34" fill="#1F4E79" font-weight="bold" text-anchor="middle">1 537 = M D X X X V I I = MDXXXVII</text><text x="665" y="535" font-family="DejaVu Serif" font-size="25" fill="#B25000" font-weight="bold" text-anchor="middle">I, X, C et M ne se répètent pas plus de trois fois.</text></svg>