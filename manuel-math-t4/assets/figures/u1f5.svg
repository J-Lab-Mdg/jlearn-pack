<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="610"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les cartons de valeur</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Superpose les cartons en les alignant du côté des unités.</text><text x="660" y="145" font-family="DejaVu Serif" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">Pour afficher 237</text><rect x="170" y="195" width="230" height="100" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="3"/><text x="285" y="254" font-family="DejaVu Serif" font-size="42" fill="#222" font-weight="normal" text-anchor="middle">200</text><rect x="470" y="195" width="180" height="100" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="560" y="254" font-family="DejaVu Serif" font-size="42" fill="#222" font-weight="normal" text-anchor="middle">30</text><rect x="720" y="195" width="145" height="100" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="792.5" y="254" font-family="DejaVu Serif" font-size="42" fill="#222" font-weight="normal" text-anchor="middle">7</text><line x1="285" y1="320" x2="285" y2="380" stroke="#2E7D32" stroke-width="4"/><polygon points="285,380 278.91048252244275,367.39374056706254 291.08951747755725,367.39374056706254" fill="#2E7D32"/><line x1="560" y1="320" x2="560" y2="380" stroke="#2E7D32" stroke-width="4"/><polygon points="560,380 553.9104825224427,367.39374056706254 566.0895174775573,367.39374056706254" fill="#2E7D32"/><line x1="790" y1="320" x2="790" y2="380" stroke="#2E7D32" stroke-width="4"/><polygon points="790,380 783.9104825224427,367.39374056706254 796.0895174775573,367.39374056706254" fill="#2E7D32"/><line x1="150" y1="410" x2="930" y2="410" stroke="#1F4E79" stroke-width="5"/><text x="285" y="465" font-family="DejaVu Serif" font-size="25" fill="#1F4E79" font-weight="bold" text-anchor="middle">C</text><text x="560" y="465" font-family="DejaVu Serif" font-size="25" fill="#1F4E79" font-weight="bold" text-anchor="middle">D</text><text x="790" y="465" font-family="DejaVu Serif" font-size="25" fill="#1F4E79" font-weight="bold" text-anchor="middle">U</text><text x="660" y="540" font-family="DejaVu Serif" font-size="34" fill="#C2185B" font-weight="bold" text-anchor="middle">200 + 30 + 7 = 237</text></svg>