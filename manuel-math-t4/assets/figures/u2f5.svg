<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="600"><rect width="100%" height="100%" fill="white"/><text x="42" y="46" font-family="DejaVu Serif" font-size="30" fill="#1F4E79" font-weight="bold" text-anchor="start">Comprendre la division</text><text x="44" y="84" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="start">Manipuler → représenter → calculer → expliquer.</text><text x="260" y="190" font-family="DejaVu Serif" font-size="52" fill="#1F4E79" font-weight="bold" text-anchor="middle">127</text><line x1="175" y1="215" x2="345" y2="215" stroke="#1F4E79" stroke-width="4"/><text x="260" y="275" font-family="DejaVu Serif" font-size="42" fill="#C2185B" font-weight="bold" text-anchor="middle">5</text><text x="600" y="190" font-family="DejaVu Serif" font-size="52" fill="#2E7D32" font-weight="bold" text-anchor="middle">25</text><text x="600" y="275" font-family="DejaVu Serif" font-size="32" fill="#1F4E79" font-weight="bold" text-anchor="middle">× 5</text><line x1="360" y1="220" x2="500" y2="220" stroke="#2E7D32" stroke-width="4"/><polygon points="500,220 487.39374056706254,226.08951747755722 487.39374056706254,213.91048252244278" fill="#2E7D32"/><text x="665" y="370" font-family="DejaVu Serif" font-size="28" fill="#B25000" font-weight="bold" text-anchor="middle">dans 12, combien de fois 5 ?</text><text x="665" y="450" font-family="DejaVu Serif" font-size="34" fill="#C2185B" font-weight="bold" text-anchor="middle">5 × 25 + 2 = 127</text></svg>