<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="600"><rect width="100%" height="100%" fill="white"/><text x="42" y="46" font-family="DejaVu Serif" font-size="30" fill="#1F4E79" font-weight="bold" text-anchor="start">Trouver une valeur manquante</text><text x="44" y="84" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="start">Manipuler → représenter → calculer → expliquer.</text><rect x="130" y="170" width="240" height="90" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="250" y="224" font-family="DejaVu Serif" font-size="36" fill="#222" font-weight="normal" text-anchor="middle">7 + 5</text><text x="450" y="230" font-family="DejaVu Serif" font-size="50" fill="#C2185B" font-weight="bold" text-anchor="middle">=</text><rect x="530" y="170" width="240" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="650" y="224" font-family="DejaVu Serif" font-size="36" fill="#222" font-weight="normal" text-anchor="middle">10 + 2</text><text x="665" y="390" font-family="DejaVu Serif" font-size="28" fill="#1F4E79" font-weight="bold" text-anchor="middle">les deux côtés ont la même valeur : 12</text></svg>