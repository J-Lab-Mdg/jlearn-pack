<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="613"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Piquets et intervalles : le piège des extrémités</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Toujours dessiner un petit schéma avant de répondre — le dessin ne se trompe jamais.</text><circle cx="140" cy="187" r="11" fill="#C2185B"/><circle cx="290" cy="187" r="11" fill="#C2185B"/><circle cx="440" cy="187" r="11" fill="#C2185B"/><circle cx="590" cy="187" r="11" fill="#C2185B"/><circle cx="740" cy="187" r="11" fill="#C2185B"/><line x1="152" y1="187" x2="278" y2="187" stroke="#1F4E79" stroke-width="4"/><line x1="302" y1="187" x2="428" y2="187" stroke="#1F4E79" stroke-width="4"/><line x1="452" y1="187" x2="578" y2="187" stroke="#1F4E79" stroke-width="4"/><line x1="602" y1="187" x2="728" y2="187" stroke="#1F4E79" stroke-width="4"/><text x="140" y="231" font-family="DejaVu Serif" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="middle">piquet</text><text x="500" y="231" font-family="DejaVu Serif" font-size="17" fill="#1F4E79" font-weight="bold" text-anchor="middle">intervalles</text><text x="740" y="231" font-family="DejaVu Serif" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="middle">piquet</text><text x="500" y="267" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">LIGNE OUVERTE : 5 piquets, 4 intervalles → piquets = intervalles + 1</text><line x1="140" y1="307" x2="740" y2="307" stroke="#1F4E79" stroke-width="4"/><line x1="140" y1="457" x2="740" y2="457" stroke="#1F4E79" stroke-width="4"/><line x1="140" y1="307" x2="140" y2="457" stroke="#1F4E79" stroke-width="4"/><line x1="740" y1="307" x2="740" y2="457" stroke="#1F4E79" stroke-width="4"/><circle cx="140" cy="307" r="11" fill="#2E7D32"/><circle cx="440" cy="307" r="11" fill="#2E7D32"/><circle cx="740" cy="307" r="11" fill="#2E7D32"/><circle cx="740" cy="382" r="11" fill="#2E7D32"/><circle cx="740" cy="457" r="11" fill="#2E7D32"/><circle cx="440" cy="457" r="11" fill="#2E7D32"/><circle cx="140" cy="457" r="11" fill="#2E7D32"/><circle cx="140" cy="382" r="11" fill="#2E7D32"/><text x="730" y="373" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="start">BOUCLE FERMÉE :</text><text x="730" y="403" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="start">8 piquets = 8 intervalles</text><text x="730" y="433" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="start">→ piquets = intervalles</text><rect x="60" y="497" width="880" height="46" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="500" y="529" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">Clôture de 30 m, un piquet tous les 5 m : 30 ÷ 5 = 6 intervalles → 7 piquets</text><rect x="60" y="555" width="880" height="46" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="587" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">Jardin CARRÉ de 20 m de côté, un arbre tous les 4 m : 80 ÷ 4 = 20 → 20 arbres</text></svg>