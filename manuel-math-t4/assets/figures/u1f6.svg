<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="630"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Une fraction partage l’unité</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Les parts doivent être égales. Ici, 3 parts sur 4 sont coloriées.</text><rect x="140" y="155" width="900" height="125" fill="white" stroke="#1F4E79" stroke-width="3"/><rect x="140" y="155" width="225" height="125" fill="#F8BBD0"/><rect x="365" y="155" width="225" height="125" fill="#F8BBD0"/><rect x="590" y="155" width="225" height="125" fill="#F8BBD0"/><line x1="365" y1="155" x2="365" y2="280" stroke="#1F4E79" stroke-width="2"/><line x1="590" y1="155" x2="590" y2="280" stroke="#1F4E79" stroke-width="2"/><line x1="815" y1="155" x2="815" y2="280" stroke="#1F4E79" stroke-width="2"/><rect x="140" y="155" width="900" height="125" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="252" y="325" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">part prise</text><text x="477" y="325" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">part prise</text><text x="702" y="325" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">part prise</text><text x="927" y="325" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">part non prise</text><text x="300" y="410" font-family="DejaVu Serif" font-size="52" fill="#C2185B" font-weight="bold" text-anchor="middle">3</text><line x1="265" y1="425" x2="335" y2="425" stroke="#1F4E79" stroke-width="3"/><text x="300" y="470" font-family="DejaVu Serif" font-size="52" fill="#1F4E79" font-weight="bold" text-anchor="middle">4</text><text x="390" y="414" font-family="DejaVu Serif" font-size="26" fill="#C2185B" font-weight="bold" text-anchor="start">numérateur : parts prises</text><text x="390" y="474" font-family="DejaVu Serif" font-size="26" fill="#1F4E79" font-weight="bold" text-anchor="start">dénominateur : parts égales</text><text x="660" y="555" font-family="DejaVu Serif" font-size="31" fill="#2E7D32" font-weight="bold" text-anchor="middle">Fraction de la bande coloriée : 3/4</text></svg>