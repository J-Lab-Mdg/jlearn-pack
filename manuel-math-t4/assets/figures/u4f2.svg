<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="600"><rect width="100%" height="100%" fill="white"/><text x="42" y="46" font-family="DejaVu Serif" font-size="30" fill="#1F4E79" font-weight="bold" text-anchor="start">Mesurer et comparer les angles</text><text x="44" y="84" font-family="DejaVu Serif" font-size="22" fill="#333" font-weight="normal" text-anchor="start">Manipuler → représenter → calculer → expliquer.</text><line x1="230" y1="390" x2="650" y2="390" stroke="#1F4E79" stroke-width="5"/><line x1="230" y1="390" x2="410" y2="150" stroke="#C2185B" stroke-width="5"/><text x="250" y="420" font-family="DejaVu Serif" font-size="23" fill="#1F4E79" font-weight="bold" text-anchor="start">sommet</text><text x="460" y="150" font-family="DejaVu Serif" font-size="23" fill="#C2185B" font-weight="bold" text-anchor="start">deux côtés</text><text x="880" y="280" font-family="DejaVu Serif" font-size="28" fill="#2E7D32" font-weight="bold" text-anchor="middle">aigu &lt; 90°</text><text x="880" y="350" font-family="DejaVu Serif" font-size="28" fill="#1F4E79" font-weight="bold" text-anchor="middle">droit = 90°</text><text x="880" y="420" font-family="DejaVu Serif" font-size="28" fill="#B25000" font-weight="bold" text-anchor="middle">obtus &gt; 90°</text></svg>