<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="469"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les durées : quand les retenues valent 60</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Heures avec heures, minutes avec minutes — et chaque fois que 60 arrive, on échange.</text><rect x="60" y="145" width="440" height="180" rx="10" fill="white" stroke="#2E7D32" stroke-width="3"/><text x="280" y="177" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">ADDITION (la retenue vaut 60)</text><text x="280" y="211" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="bold" text-anchor="middle">1 h 15 min + 50 min</text><text x="280" y="243" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="bold" text-anchor="middle">= 1 h 65 min</text><text x="280" y="275" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">65 min = 1 h 05 min</text><text x="280" y="307" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">= 2 h 05 min ✓</text><rect x="520" y="145" width="440" height="180" rx="10" fill="white" stroke="#C2185B" stroke-width="3"/><text x="740" y="177" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">SOUSTRACTION (l’emprunt vaut 60)</text><text x="740" y="211" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="bold" text-anchor="middle">2 h 30 min − 1 h 40 min</text><text x="740" y="243" font-family="DejaVu Serif" font-size="20" fill="#B25000" font-weight="bold" text-anchor="middle">30 &lt; 40 : j’emprunte 1 h</text><text x="740" y="275" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="bold" text-anchor="middle">1 h 90 min − 1 h 40 min</text><text x="740" y="307" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">= 50 min ✓</text><rect x="60" y="345" width="880" height="46" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="377" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">× et ÷ : tout convertir en MINUTES d’abord : 4 h 20 min = 260 min ; 260 ÷ 2 = 130 min = 2 h 10 min</text><rect x="60" y="405" width="880" height="46" rx="10" fill="#FFF3E0" stroke="#B25000" stroke-width="3"/><text x="500" y="437" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">PIÈGE : 1 h 30 n’est PAS 1,30 h (c’est 1,5 h) — jamais de virgule avec les heures !</text></svg>