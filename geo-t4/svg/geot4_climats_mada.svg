  <text x="790" y="515" text-anchor="middle" font-size="21" fill="#546E7A" font-style="italic">Le climat change selon les régions de l'île.</text>
  <text x="550" y="800" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Madagascar : climat humide à l'Est, frais sur les Hautes Terres, sec à l'Ouest et au Sud.</text>
