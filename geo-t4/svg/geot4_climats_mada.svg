  <text x="213" y="352" text-anchor="middle" font-size="19" font-weight="bold" fill="#01579B">HAUTES</text>
  <text x="213" y="376" text-anchor="middle" font-size="19" font-weight="bold" fill="#01579B">TERRES</text>
