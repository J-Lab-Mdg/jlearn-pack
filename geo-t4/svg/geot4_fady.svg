  <text x="900" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#37474F">ne pas entrer dans</text>
  <text x="900" y="426" text-anchor="middle" font-size="19" font-weight="bold" fill="#37474F">les lieux sacrés</text>
  <text x="550" y="530" text-anchor="middle" font-size="22" font-weight="bold" fill="#C62828">Le fady est une interdiction traditionnelle : on le respecte.</text>
  <text x="550" y="590" text-anchor="middle" font-size="24" fill="#546E7A" font-style="italic">Chaque région de Madagascar a ses fady : on les respecte partout où l'on va.</text>
