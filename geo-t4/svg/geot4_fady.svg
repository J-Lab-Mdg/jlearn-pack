  <text x="550" y="50" text-anchor="middle" font-size="34" font-weight="bold" fill="#1F4E79">Le respect des fady</text>
  <rect x="40" y="90" width="320" height="380" rx="16" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  
  <g transform="translate(180,300) rotate(15) scale(2)">
