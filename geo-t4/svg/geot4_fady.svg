  </g>
  <text x="550" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#37474F">ne pas pêcher</text>
  <text x="550" y="426" text-anchor="middle" font-size="19" font-weight="bold" fill="#37474F">certains jours</text>
  <rect x="740" y="90" width="320" height="380" rx="16" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  
  <g transform="translate(900,330) scale(1)">
