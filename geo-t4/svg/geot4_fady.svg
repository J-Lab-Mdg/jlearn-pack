  </g>
  <text x="200" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#37474F">ne pas travailler</text>
  <text x="200" y="426" text-anchor="middle" font-size="19" font-weight="bold" fill="#37474F">la terre certains jours</text>
  <rect x="390" y="90" width="320" height="380" rx="16" fill="#FFF8E1" stroke="#90A4AE" stroke-width="3"/>
  
