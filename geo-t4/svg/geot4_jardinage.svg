    <path d="M -12 -22 Q 0 -28 12 -22 L 10 6 L -10 6 Z" fill="#FFB74D" stroke="#8D6E63" stroke-width="2"/>
    <line x1="-10" y1="-18" x2="-20" y2="-4" stroke="#FFB74D" stroke-width="7" stroke-linecap="round"/>
