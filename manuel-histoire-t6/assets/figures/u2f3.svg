<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="588"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La Deuxième République (1975-1993)</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">La carte d’identité de la Repoblika Demokratika Malagasy.</text><rect x="60" y="150" width="260" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="185" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">élément</text><rect x="320" y="150" width="620" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="185" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Deuxième République</text><rect x="60" y="202" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">nom officiel</text><rect x="320" y="202" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Repoblika Demokratika Malagasy</text><rect x="60" y="254" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="289" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">naissance</text><rect x="320" y="254" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="289" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">30 décembre 1975</text><rect x="60" y="306" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="341" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">devise</text><rect x="320" y="306" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="341" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Tanindrazana - Tolom-piavotana - Fahafahana</text><rect x="60" y="358" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="393" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">texte fondateur</text><rect x="320" y="358" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="393" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">« boky mena », charte socialiste</text><rect x="60" y="410" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="445" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">chef d’État</text><rect x="320" y="410" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="445" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Didier Ratsiraka (30-12-1975 - août 1991)</text><rect x="60" y="462" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="497" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">fin</text><rect x="320" y="462" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="497" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">grandes manifestations populaires de 1991</text><text x="500" y="556" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">drapeau et hymne restent ceux de 1958 ; la devise, elle, change avec la République</text></svg>