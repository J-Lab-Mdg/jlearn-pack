<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="503"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La démarche historique</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Quatre étapes, toujours dans le même ordre : la méthode de travail de l’historien.</text><rect x="150" y="155" width="640" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="470" y="193" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">1. Rechercher et classer les sources</text><line x1="470" y1="215" x2="470" y2="225" stroke="#1F4E79" stroke-width="4"/><polygon points="470,225 463.91048252244275,212.39374056706254 476.08951747755725,212.39374056706254" fill="#1F4E79"/><rect x="150" y="227" width="640" height="58" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="470" y="265" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">2. Contrôler et vérifier les sources</text><line x1="470" y1="287" x2="470" y2="297" stroke="#1F4E79" stroke-width="4"/><polygon points="470,297 463.91048252244275,284.39374056706254 476.08951747755725,284.39374056706254" fill="#1F4E79"/><rect x="150" y="299" width="640" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="470" y="337" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">3. Comprendre et extraire les informations</text><line x1="470" y1="359" x2="470" y2="369" stroke="#1F4E79" stroke-width="4"/><polygon points="470,369 463.91048252244275,356.39374056706254 476.08951747755725,356.39374056706254" fill="#1F4E79"/><rect x="150" y="371" width="640" height="58" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="470" y="409" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">4. Analyser et interpréter</text><text x="470" y="471" font-family="DejaVu Serif" font-size="23" fill="#1F4E79" font-weight="bold" text-anchor="middle">comprendre le passé → expliquer le présent → améliorer le futur</text></svg>