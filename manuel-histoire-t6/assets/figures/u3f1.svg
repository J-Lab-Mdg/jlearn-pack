<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="491"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Bilatérale ou multilatérale ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Deux pays face à face, ou plusieurs pays autour d’une même table.</text><rect x="60" y="160" width="400" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="260" y="196" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">relation BILATÉRALE</text><text x="260" y="250" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">Madagascar ↔ un autre pays</text><rect x="540" y="160" width="400" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="740" y="196" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">relation MULTILATÉRALE</text><text x="740" y="250" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">Madagascar + plusieurs pays (organisation)</text><rect x="55" y="295" width="290" height="52" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="200" y="330" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">diplomatique</text><rect x="365" y="295" width="290" height="52" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="510" y="330" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">militaire</text><rect x="675" y="295" width="290" height="52" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="820" y="330" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">économique</text><rect x="55" y="361" width="290" height="52" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="200" y="396" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">commerciale</text><rect x="365" y="361" width="290" height="52" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="510" y="396" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">culturelle</text><rect x="675" y="361" width="290" height="52" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="820" y="396" font-family="DejaVu Serif" font-size="21" fill="#222" font-weight="normal" text-anchor="middle">technique</text><text x="500" y="459" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">six domaines de relation — qu’elles soient bilatérales ou multilatérales</text></svg>