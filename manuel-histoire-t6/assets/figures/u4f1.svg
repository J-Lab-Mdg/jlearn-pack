<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="421"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les deux familles du patrimoine</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Ce que l’on peut toucher… et ce qui se transmet sans se toucher.</text><rect x="70" y="155" width="400" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="270" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">patrimoine MATÉRIEL</text><rect x="530" y="155" width="400" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="730" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">patrimoine IMMATÉRIEL</text><text x="270" y="255" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">édifices et palais royaux</text><text x="270" y="291" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">tombeaux et temples</text><text x="270" y="327" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="normal" text-anchor="middle">places historiques, statues</text><text x="730" y="255" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">traditions et rituels</text><text x="730" y="291" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">arts (hira gasy, kabary…)</text><text x="730" y="327" font-family="DejaVu Serif" font-size="20" fill="#C2185B" font-weight="normal" text-anchor="middle">pratiques sociales</text><text x="500" y="389" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">patrimoine = les biens hérités du passé, à transmettre aux générations futures</text></svg>