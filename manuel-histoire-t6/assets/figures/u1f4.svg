<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="624"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les sources historiques</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Toute trace du passé est une source — à condition de la vérifier.</text><rect x="90" y="150" width="280" height="50" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="184" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">type de source</text><rect x="370" y="150" width="540" height="50" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="184" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">exemples</text><rect x="90" y="200" width="280" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="234" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">matérielle</text><rect x="370" y="200" width="540" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="234" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">monnaie, vase, bateau, outil</text><rect x="90" y="250" width="280" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="284" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">figurative</text><rect x="370" y="250" width="540" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="284" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">gravure, sculpture, dessin, caricature</text><rect x="90" y="300" width="280" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="334" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">vestige</text><rect x="370" y="300" width="540" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="334" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">fondations d’une ancienne cité, outils</text><rect x="90" y="350" width="280" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="384" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">écrite</text><rect x="370" y="350" width="540" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="384" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">manuscrit, archive, journal, lettre</text><rect x="90" y="400" width="280" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="434" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">orale</text><rect x="370" y="400" width="540" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="434" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">tradition orale, témoignage</text><rect x="90" y="450" width="280" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="484" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">photographique</text><rect x="370" y="450" width="540" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="484" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">photographie ancienne</text><rect x="90" y="500" width="280" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="230" y="534" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">audiovisuelle</text><rect x="370" y="500" width="540" height="50" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="640" y="534" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">film, bande sonore, vidéo</text><text x="500" y="592" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">une source ne parle jamais seule : l’historien croise toujours plusieurs sources !</text></svg>