<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="377"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les avantages de la protection</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Trois plans de bénéfices — économique, social, culturel.</text><rect x="30" y="155" width="300" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="180" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">ÉCONOMIQUE</text><text x="180" y="247" font-family="DejaVu Serif" font-size="18" fill="#2E7D32" font-weight="bold" text-anchor="middle">devises et revenus du tourisme</text><rect x="350" y="155" width="300" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">SOCIAL</text><text x="500" y="247" font-family="DejaVu Serif" font-size="18" fill="#1F4E79" font-weight="bold" text-anchor="middle">respect des lois, niveau de vie</text><rect x="670" y="155" width="300" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="820" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">CULTUREL</text><text x="820" y="247" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">patrimoines viables et transmis</text><text x="500" y="305" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">fin de l’exploitation irrationnelle + sensibilisation communautaire</text><text x="500" y="345" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">un patrimoine protégé rapporte chaque année — détruit, il ne rapporte qu’une fois</text></svg>