<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="501"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Pourquoi les dirigeants changent-ils si souvent ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Des facteurs qui s’accumulent… et des conséquences qui frappent tout le pays.</text><text x="240" y="163" font-family="DejaVu Serif" font-size="24" fill="#2E7D32" font-weight="bold" text-anchor="middle">FACTEURS</text><rect x="35" y="185" width="410" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="240" y="220" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">programme de l’État non réalisé</text><rect x="35" y="249" width="410" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="240" y="284" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">développement mitigé</text><rect x="35" y="313" width="410" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="240" y="348" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">corruption aggravée</text><rect x="35" y="377" width="410" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="240" y="412" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">crises cycliques et instabilité</text><text x="760" y="163" font-family="DejaVu Serif" font-size="24" fill="#C2185B" font-weight="bold" text-anchor="middle">CONSÉQUENCES</text><rect x="555" y="185" width="410" height="52" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="760" y="220" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">non-continuité de l’État</text><rect x="555" y="249" width="410" height="52" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="760" y="284" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">crise économique et chômage</text><rect x="555" y="313" width="410" height="52" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="760" y="348" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">pauvreté et insécurité accrues</text><rect x="555" y="377" width="410" height="52" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="760" y="412" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">perte de confiance des partenaires</text><line x1="455" y1="310" x2="545" y2="310" stroke="#1F4E79" stroke-width="5"/><polygon points="545,310 532.3937405670625,316.08951747755725 532.3937405670625,303.91048252244275" fill="#1F4E79"/><text x="500" y="469" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">crises de 1972, 1991, 2002 et 2009 : presque une par décennie</text></svg>