<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Ce que l’adhésion apporte à Madagascar</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Trois familles d’impacts, à connaître avec leurs exemples.</text><rect x="30" y="155" width="300" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="180" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">POLITIQUE</text><text x="180" y="247" font-family="DejaVu Serif" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="middle">aide à gérer les crises</text><rect x="350" y="155" width="300" height="54" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="500" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">ÉCONOMIQUE</text><text x="500" y="247" font-family="DejaVu Serif" font-size="19" fill="#1F4E79" font-weight="bold" text-anchor="middle">libre-échange et concurrence</text><rect x="670" y="155" width="300" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="820" y="191" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">SOCIO-CULTUREL</text><text x="820" y="247" font-family="DejaVu Serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">lutte contre la pauvreté</text><text x="500" y="300" font-family="DejaVu Serif" font-size="21" fill="#B25000" font-weight="bold" text-anchor="middle">et aussi : libre circulation des hommes, des idées et des cultures</text><text x="500" y="340" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">adhérer, c’est recevoir — mais aussi s’engager et respecter les règles communes</text></svg>