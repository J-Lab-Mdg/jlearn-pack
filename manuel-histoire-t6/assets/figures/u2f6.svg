<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Les trois pouvoirs de la République</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Chaque République organise l’État autour de trois pouvoirs séparés.</text><rect x="290" y="160" width="440" height="56" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="510" y="197" font-family="DejaVu Serif" font-size="26" fill="#222" font-weight="normal" text-anchor="middle">L’ÉTAT</text><line x1="510" y1="218" x2="185" y2="258" stroke="#777" stroke-width="3"/><polygon points="185,258 196.76798506007023,250.41616669315815 198.25571752717832,262.50399298841126" fill="#777"/><rect x="25" y="260" width="320" height="54" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="185" y="296" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">pouvoir EXÉCUTIF</text><text x="185" y="345" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">chef de l’État + gouvernement</text><text x="185" y="372" font-family="DejaVu Serif" font-size="18" fill="#2E7D32" font-weight="bold" text-anchor="middle">applique les lois</text><line x1="510" y1="218" x2="515" y2="258" stroke="#777" stroke-width="3"/><polygon points="515,258 507.3938924842316,246.2463993406883 519.4788794299142,244.735775972478" fill="#777"/><rect x="355" y="260" width="320" height="54" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="515" y="296" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">pouvoir LÉGISLATIF</text><text x="515" y="345" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">députés + sénateurs</text><text x="515" y="372" font-family="DejaVu Serif" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">vote les lois</text><line x1="510" y1="218" x2="845" y2="258" stroke="#777" stroke-width="3"/><polygon points="845,258 831.7606769907056,262.55195850767205 833.2046332537002,250.4588248050928" fill="#777"/><rect x="685" y="260" width="320" height="54" rx="10" fill="#FFE3C2" stroke="#B25000" stroke-width="3"/><text x="845" y="296" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">pouvoir JUDICIAIRE</text><text x="845" y="345" font-family="DejaVu Serif" font-size="18" fill="#333" font-weight="normal" text-anchor="middle">tribunaux, HCC, HCJ</text><text x="845" y="372" font-family="DejaVu Serif" font-size="18" fill="#B25000" font-weight="bold" text-anchor="middle">fait respecter les lois</text><text x="500" y="428" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">séparés pour s’équilibrer : aucun pouvoir ne doit dominer les deux autres</text></svg>