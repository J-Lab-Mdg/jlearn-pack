<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="588"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">La Première République (1958-1972)</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">La carte d’identité de la Repoblika Malagasy.</text><rect x="60" y="150" width="260" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="185" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">élément</text><rect x="320" y="150" width="620" height="52" fill="#D6E6F5" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="185" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="bold" text-anchor="middle">Première République</text><rect x="60" y="202" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">nom officiel</text><rect x="320" y="202" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="237" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Repoblika Malagasy</text><rect x="60" y="254" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="289" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">proclamation</text><rect x="320" y="254" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="289" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">14 octobre 1958 — indépendance : 26 juin 1960</text><rect x="60" y="306" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="341" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">devise</text><rect x="320" y="306" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="341" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Tanindrazana - Fahafahana - Fandrosoana</text><rect x="60" y="358" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="393" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">drapeau</text><rect x="320" y="358" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="393" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">blanc, rouge et vert</text><rect x="60" y="410" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="445" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">hymne national</text><rect x="320" y="410" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="445" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Ry tanindrazanay malala ô !</text><rect x="60" y="462" width="260" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="190" y="497" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">président</text><rect x="320" y="462" width="620" height="52" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="630" y="497" font-family="DejaVu Serif" font-size="25" fill="#222" font-weight="normal" text-anchor="middle">Philibert Tsiranana (14-10-1958 au 11-10-1972)</text><text x="500" y="556" font-family="DejaVu Serif" font-size="20" fill="#2E7D32" font-weight="bold" text-anchor="middle">le drapeau et l’hymne de 1958 n’ont jamais changé : ils unissent toutes les Républiques</text></svg>