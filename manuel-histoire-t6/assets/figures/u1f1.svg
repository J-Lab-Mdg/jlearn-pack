<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="487"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Qu’étudie l’Histoire ?</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">L’Histoire reconstitue le passé de l’humanité et des sociétés humaines.</text><rect x="30" y="155" width="470" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="265" y="194" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">les faits et les civilisations</text><rect x="535" y="155" width="470" height="60" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="770" y="194" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">les guerres</text><rect x="30" y="233" width="470" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="265" y="272" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">l’évolution de la société</text><rect x="535" y="233" width="470" height="60" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="770" y="272" font-family="DejaVu Serif" font-size="23" fill="#222" font-weight="normal" text-anchor="middle">les lois et les personnages</text><line x1="515" y1="320" x2="515" y2="350" stroke="#1F4E79" stroke-width="4"/><polygon points="515,350 508.91048252244275,337.39374056706254 521.0895174775573,337.39374056706254" fill="#1F4E79"/><rect x="100" y="355" width="830" height="58" rx="10" fill="#D6E6F5" stroke="#1F4E79" stroke-width="3"/><text x="515" y="393" font-family="DejaVu Serif" font-size="22" fill="#222" font-weight="normal" text-anchor="middle">chaque objet d’étude est situé dans le TEMPS et dans l’ESPACE</text><text x="515" y="455" font-family="DejaVu Serif" font-size="21" fill="#C2185B" font-weight="bold" text-anchor="middle">la vérité historique s’appuie sur des preuves — jamais sur des légendes ou des rumeurs</text></svg>