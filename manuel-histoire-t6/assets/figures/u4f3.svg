<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="431"><rect width="100%" height="100%" fill="white"/><text x="40" y="46" font-family="DejaVu Serif" font-size="31" font-weight="bold" fill="#1F4E79">Protéger et entretenir</text><text x="44" y="90" font-family="DejaVu Serif" font-size="23" fill="#333">Des gestes pour la nature, des gestes pour le patrimoine.</text><text x="260" y="163" font-family="DejaVu Serif" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">RICHESSES NATURELLES</text><rect x="45" y="183" width="430" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="260" y="217" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">protéger le sol et les eaux</text><rect x="45" y="245" width="430" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="260" y="279" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">protéger forêts, faune et flore</text><rect x="45" y="307" width="430" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="260" y="341" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">reboiser</text><text x="745" y="163" font-family="DejaVu Serif" font-size="22" fill="#C2185B" font-weight="bold" text-anchor="middle">PATRIMOINES</text><rect x="530" y="183" width="430" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="745" y="217" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">conserver en musées sécurisés</text><rect x="530" y="245" width="430" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="745" y="279" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">multiplier les aires protégées</text><rect x="530" y="307" width="430" height="50" rx="10" fill="#FDE7EF" stroke="#C2185B" stroke-width="3"/><text x="745" y="341" font-family="DejaVu Serif" font-size="19" fill="#222" font-weight="normal" text-anchor="middle">lutter contre les pollutions</text><text x="500" y="399" font-family="DejaVu Serif" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle">protéger, c’est respecter la loi — et la loi protège ce qui appartient à tous</text></svg>