<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360"><rect width="100%" height="100%" fill="white"/><text x="500" y="42" font-family="DejaVu Sans" font-size="28" fill="#1F4E79" font-weight="bold" text-anchor="middle">Division : quotient et reste</text><rect x="125" y="100" width="270" height="72" rx="0" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="260" y="146" font-family="DejaVu Sans" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">37 ÷ 5 = 7 reste 2</text><line x1="430" y1="136" x2="570" y2="136" stroke="#2E7D32" stroke-width="4"/><polygon points="570,136 558,129 558,143" fill="#2E7D32"/><rect x="600" y="100" width="250" height="72" rx="0" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="725" y="146" font-family="DejaVu Sans" font-size="28" fill="#2E7D32" font-weight="bold" text-anchor="middle">37 = 5 × 7 + 2</text><text x="500" y="260" font-family="DejaVu Sans" font-size="25" fill="#B25000" font-weight="bold" text-anchor="middle">Le reste doit être inférieur au diviseur.</text></svg>