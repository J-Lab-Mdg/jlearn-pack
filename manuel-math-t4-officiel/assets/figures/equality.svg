<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="100%" height="100%" fill="white"/><text x="500" y="42" font-family="DejaVu Sans" font-size="27" fill="#1F4E79" font-weight="bold" text-anchor="middle">Les deux membres ont la même valeur</text><rect x="120" y="100" width="250" height="70" rx="0" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="245" y="145" font-family="DejaVu Sans" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">7 + 5</text><text x="500" y="145" font-family="DejaVu Sans" font-size="38" fill="#2E7D32" font-weight="bold" text-anchor="middle">=</text><rect x="630" y="100" width="250" height="70" rx="0" fill="#E8F5E9" stroke="#1F4E79" stroke-width="3"/><text x="755" y="145" font-family="DejaVu Sans" font-size="30" fill="#C2185B" font-weight="bold" text-anchor="middle">12</text><text x="500" y="250" font-family="DejaVu Sans" font-size="27" fill="#1F4E79" font-weight="bold" text-anchor="middle">7 + 5 = 12 et 12 = 7 + 5</text></svg>