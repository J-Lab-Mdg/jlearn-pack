<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="100%" height="100%" fill="white"/><text x="500" y="42" font-family="DejaVu Sans" font-size="27" fill="#1F4E79" font-weight="bold" text-anchor="middle">Une fraction représente des parts égales</text><rect x="120" y="95" width="700" height="82" rx="0" fill="#fff" stroke="#1F4E79" stroke-width="3"/><rect x="120" y="95" width="175" height="82" fill="#FDE7EF"/><rect x="295" y="95" width="175" height="82" fill="#FDE7EF"/><rect x="470" y="95" width="175" height="82" fill="#FDE7EF"/><line x1="295" y1="95" x2="295" y2="177" stroke="#1F4E79" stroke-width="2"/><line x1="470" y1="95" x2="470" y2="177" stroke="#1F4E79" stroke-width="2"/><line x1="645" y1="95" x2="645" y2="177" stroke="#1F4E79" stroke-width="2"/><rect x="120" y="95" width="700" height="82" rx="0" fill="none" stroke="#1F4E79" stroke-width="3"/><text x="470" y="235" font-family="DejaVu Sans" font-size="28" fill="#C2185B" font-weight="bold" text-anchor="middle">3 parts prises sur 4 parts égales : 3/4</text><text x="470" y="280" font-family="DejaVu Sans" font-size="22" fill="#2E7D32" font-weight="bold" text-anchor="middle">numérateur = parts prises ; dénominateur = parts en tout</text></svg>