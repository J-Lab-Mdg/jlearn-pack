  <rect x="1115" y="135" width="205" height="212" rx="24" fill="#e6f2ed"/>
  <circle cx="1162" cy="183" r="15" fill="#d55d4a"/><text x="1190" y="191" font-size="22" font-weight="700">Manomboka</text>
