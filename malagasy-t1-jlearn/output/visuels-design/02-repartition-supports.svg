  <text x="105" y="1163" class="body">• toute la consigne déjà imprimée</text>
  <text x="105" y="1202" class="body">• un résumé grammatical</text>
  <text x="105" y="1241" class="body">• le texte oral de compréhension</text>

  <rect x="930" y="1005" width="805" height="276" rx="30" fill="#EAF5F0" stroke="#9DCDBD" stroke-width="2"/>
