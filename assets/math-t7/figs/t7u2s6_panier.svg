<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">3 × 12 + 5 : les tomates du marché</text>
<g font-family="serif">
<ellipse cx="180" cy="215" rx="58" ry="40" fill="#FCE4D6" stroke="#C2185B" stroke-width="3"/><circle cx="158" cy="200" r="10" fill="#C2185B"/><circle cx="180" cy="200" r="10" fill="#C2185B"/><circle cx="202" cy="200" r="10" fill="#C2185B"/><circle cx="158" cy="224" r="10" fill="#C2185B"/><circle cx="180" cy="224" r="10" fill="#C2185B"/><circle cx="202" cy="224" r="10" fill="#C2185B"/><text x="180" y="288" font-size="20" text-anchor="middle" fill="#333">12 tomates</text><ellipse cx="310" cy="215" rx="58" ry="40" fill="#FCE4D6" stroke="#C2185B" stroke-width="3"/><circle cx="288" cy="200" r="10" fill="#C2185B"/><circle cx="310" cy="200" r="10" fill="#C2185B"/><circle cx="332" cy="200" r="10" fill="#C2185B"/><circle cx="288" cy="224" r="10" fill="#C2185B"/><circle cx="310" cy="224" r="10" fill="#C2185B"/><circle cx="332" cy="224" r="10" fill="#C2185B"/><text x="310" y="288" font-size="20" text-anchor="middle" fill="#333">12 tomates</text><ellipse cx="440" cy="215" rx="58" ry="40" fill="#FCE4D6" stroke="#C2185B" stroke-width="3"/><circle cx="418" cy="200" r="10" fill="#C2185B"/><circle cx="440" cy="200" r="10" fill="#C2185B"/><circle cx="462" cy="200" r="10" fill="#C2185B"/><circle cx="418" cy="224" r="10" fill="#C2185B"/><circle cx="440" cy="224" r="10" fill="#C2185B"/><circle cx="462" cy="224" r="10" fill="#C2185B"/><text x="440" y="288" font-size="20" text-anchor="middle" fill="#333">12 tomates</text>
<circle cx="620" cy="200" r="10" fill="#C2185B"/><circle cx="645" cy="205" r="10" fill="#C2185B"/><circle cx="620" cy="230" r="10" fill="#C2185B"/><circle cx="645" cy="232" r="10" fill="#C2185B"/><circle cx="632" cy="216" r="10" fill="#C2185B"/>
<text x="632" y="288" font-size="20" text-anchor="middle" fill="#333">+ 5</text>
<rect x="700" y="130" width="250" height="175" rx="12" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3.5"/>
<text x="825" y="172" font-size="24" text-anchor="middle" fill="#1F4E79" font-weight="bold">3 × 12 + 5</text>
<text x="825" y="218" font-size="24" text-anchor="middle" fill="#222">= 36 + 5</text>
<text x="825" y="262" font-size="28" text-anchor="middle" fill="#1E7B34" font-weight="bold">= 41</text>
<text x="500" y="380" font-size="22" text-anchor="middle" fill="#333">La multiplication compte les paniers d’abord ; puis on ajoute le reste.</text>
</g></svg>