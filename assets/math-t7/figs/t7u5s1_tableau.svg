<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Convertir : placer le nombre dans le tableau</text>
<g font-family="serif">
<rect x="80" y="100" width="120" height="46" fill="#1F4E79"/><text x="140" y="131" font-size="22" text-anchor="middle" fill="white" font-weight="bold">km</text><rect x="200" y="100" width="120" height="46" fill="#1F4E79"/><text x="260" y="131" font-size="22" text-anchor="middle" fill="white" font-weight="bold">hm</text><rect x="320" y="100" width="120" height="46" fill="#1F4E79"/><text x="380" y="131" font-size="22" text-anchor="middle" fill="white" font-weight="bold">dam</text><rect x="440" y="100" width="120" height="46" fill="#1F4E79"/><text x="500" y="131" font-size="22" text-anchor="middle" fill="white" font-weight="bold">m</text><rect x="560" y="100" width="120" height="46" fill="#1F4E79"/><text x="620" y="131" font-size="22" text-anchor="middle" fill="white" font-weight="bold">dm</text><rect x="680" y="100" width="120" height="46" fill="#1F4E79"/><text x="740" y="131" font-size="22" text-anchor="middle" fill="white" font-weight="bold">cm</text><rect x="800" y="100" width="120" height="46" fill="#1F4E79"/><text x="860" y="131" font-size="22" text-anchor="middle" fill="white" font-weight="bold">mm</text>
<rect x="80" y="146" width="120" height="52" fill="#F7F3EE" stroke="#9AB" stroke-width="1.5"/><rect x="200" y="146" width="120" height="52" fill="#F7F3EE" stroke="#9AB" stroke-width="1.5"/><rect x="320" y="146" width="120" height="52" fill="#F7F3EE" stroke="#9AB" stroke-width="1.5"/><rect x="440" y="146" width="120" height="52" fill="#F7F3EE" stroke="#9AB" stroke-width="1.5"/><rect x="560" y="146" width="120" height="52" fill="#F7F3EE" stroke="#9AB" stroke-width="1.5"/><rect x="680" y="146" width="120" height="52" fill="#F7F3EE" stroke="#9AB" stroke-width="1.5"/><rect x="800" y="146" width="120" height="52" fill="#F7F3EE" stroke="#9AB" stroke-width="1.5"/>
<text x="140" y="182" font-size="27" text-anchor="middle" fill="#C2185B" font-weight="bold">2</text><text x="260" y="182" font-size="27" text-anchor="middle" fill="#C2185B" font-weight="bold">5</text><text x="380" y="182" font-size="27" text-anchor="middle" fill="#C2185B" font-weight="bold">0</text><text x="500" y="182" font-size="27" text-anchor="middle" fill="#C2185B" font-weight="bold">0</text>
<text x="955" y="182" font-size="24" fill="#555" text-anchor="end">← virgule en m</text>
<rect x="230" y="235" width="540" height="70" rx="12" fill="#E9F5EC" stroke="#1E7B34" stroke-width="3"/>
<text x="500" y="279" font-size="26" text-anchor="middle" fill="#1E7B34" font-weight="bold">2,5 km = 2 500 m</text>
<text x="500" y="335" font-size="21" text-anchor="middle" fill="#333">Les unités se posent sous l’unité donnée, puis on complète de zéros.</text>
<text x="500" y="385" font-size="22" text-anchor="middle" fill="#1F4E79" font-weight="bold">Retenir : 1 km = 1 000 m ; 1 m = 100 cm ; 1 cm = 10 mm.</text>
</g></svg>