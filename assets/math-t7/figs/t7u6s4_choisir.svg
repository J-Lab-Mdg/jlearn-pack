<text x="275" y="215" font-size="21" text-anchor="middle" fill="#222">comparer des catégories</text>
<rect x="165" y="250" width="55" height="55" fill="#1F4E79" opacity="0.8"/><rect x="240" y="220" width="55" height="85" fill="#1F4E79" opacity="0.8"/><rect x="315" y="265" width="55" height="40" fill="#1F4E79" opacity="0.8"/>
