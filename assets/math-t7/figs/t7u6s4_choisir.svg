<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Quel diagramme pour quelle question ?</text>
<g font-family="serif">
<rect x="70" y="125" width="410" height="220" rx="14" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3.5"/>
