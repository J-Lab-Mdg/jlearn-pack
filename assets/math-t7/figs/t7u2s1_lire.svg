<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Lire 2⁵ : cinq facteurs 2</text>
<g font-family="serif">
<text x="500" y="150" font-size="34" text-anchor="middle" fill="#222" font-weight="bold">2⁵ = 2 × 2 × 2 × 2 × 2</text>
<rect x="235" y="185" width="90" height="54" rx="10" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="280" y="221" font-size="30" text-anchor="middle" fill="#1F4E79" font-weight="bold">2</text><rect x="341" y="185" width="90" height="54" rx="10" fill="#FCE4D6" stroke="#1F4E79" stroke-width="3"/><text x="386" y="221" font-size="30" text-anchor="middle" fill="#1F4E79" font-weight="bold">2</text><rect x="447" y="185" width="90" height="54" rx="10" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="492" y="221" font-size="30" text-anchor="middle" fill="#1F4E79" font-weight="bold">2</text><rect x="553" y="185" width="90" height="54" rx="10" fill="#FCE4D6" stroke="#1F4E79" stroke-width="3"/><text x="598" y="221" font-size="30" text-anchor="middle" fill="#1F4E79" font-weight="bold">2</text><rect x="659" y="185" width="90" height="54" rx="10" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="704" y="221" font-size="30" text-anchor="middle" fill="#1F4E79" font-weight="bold">2</text>
<text x="230" y="300" font-size="24" text-anchor="middle" fill="#333">5 facteurs</text>
<path d="M235 320 Q 500 375 765 320" fill="none" stroke="#1E7B34" stroke-width="3"/>
<rect x="350" y="250" width="300" height="60" rx="12" fill="#E9F5EC" stroke="#1E7B34" stroke-width="3.5"/>
<text x="500" y="288" font-size="30" text-anchor="middle" fill="#1E7B34" font-weight="bold">= 32</text>
<text x="500" y="400" font-size="22" text-anchor="middle" fill="#333">Chaque facteur vaut 2 ; il y en a cinq : le produit vaut 32.</text>
</g></svg>