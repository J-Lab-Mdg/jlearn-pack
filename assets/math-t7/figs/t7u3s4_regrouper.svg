<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Même famille : 3x + 5x = 8x</text>
<g font-family="serif">
<rect x="110" y="150" width="82" height="82" rx="10" fill="#FCE4D6" stroke="#C2185B" stroke-width="3"/><text x="151" y="200" font-size="26" text-anchor="middle" fill="#C2185B" font-weight="bold">x</text><rect x="210" y="150" width="82" height="82" rx="10" fill="#FCE4D6" stroke="#C2185B" stroke-width="3"/><text x="251" y="200" font-size="26" text-anchor="middle" fill="#C2185B" font-weight="bold">x</text><rect x="310" y="150" width="82" height="82" rx="10" fill="#FCE4D6" stroke="#C2185B" stroke-width="3"/><text x="351" y="200" font-size="26" text-anchor="middle" fill="#C2185B" font-weight="bold">x</text>
<text x="430" y="205" font-size="40" text-anchor="middle" fill="#222">+</text>
<rect x="480" y="150" width="72" height="82" rx="10" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="516" y="200" font-size="26" text-anchor="middle" fill="#1F4E79" font-weight="bold">x</text><rect x="566" y="150" width="72" height="82" rx="10" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="602" y="200" font-size="26" text-anchor="middle" fill="#1F4E79" font-weight="bold">x</text><rect x="652" y="150" width="72" height="82" rx="10" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="688" y="200" font-size="26" text-anchor="middle" fill="#1F4E79" font-weight="bold">x</text><rect x="738" y="150" width="72" height="82" rx="10" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="774" y="200" font-size="26" text-anchor="middle" fill="#1F4E79" font-weight="bold">x</text><rect x="824" y="150" width="72" height="82" rx="10" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3"/><text x="860" y="200" font-size="26" text-anchor="middle" fill="#1F4E79" font-weight="bold">x</text>
<rect x="280" y="265" width="440" height="70" rx="12" fill="#E9F5EC" stroke="#1E7B34" stroke-width="3.5"/>
<text x="500" y="310" font-size="30" text-anchor="middle" fill="#1E7B34" font-weight="bold">3x + 5x = (3 + 5)x = 8x</text>
<text x="500" y="380" font-size="22" text-anchor="middle" fill="#333">Les paniers sont identiques : on additionne simplement les comptes.</text>
</g></svg>