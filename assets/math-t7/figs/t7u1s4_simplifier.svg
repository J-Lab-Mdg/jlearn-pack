<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Simplifier jusqu’à l’irréductible</text>
<g font-family="serif">
<rect x="55" y="120" width="190" height="150" rx="12" fill="#F7F3EE" stroke="#C00000" stroke-width="3.5"/><text x="150" y="215" font-size="40" text-anchor="middle" fill="#C00000" font-weight="bold">6/12</text><rect x="325" y="120" width="190" height="150" rx="12" fill="#F7F3EE" stroke="#C2185B" stroke-width="3.5"/><text x="420" y="215" font-size="40" text-anchor="middle" fill="#C2185B" font-weight="bold">3/6</text><rect x="595" y="120" width="190" height="150" rx="12" fill="#E9F5EC" stroke="#1E7B34" stroke-width="3.5"/><text x="690" y="215" font-size="40" text-anchor="middle" fill="#1E7B34" font-weight="bold">1/2</text>
<text x="285" y="205" font-size="26" text-anchor="middle" fill="#222" font-weight="bold">: 2</text>
<text x="555" y="205" font-size="26" text-anchor="middle" fill="#222" font-weight="bold">: 3</text>
<rect x="300" y="300" width="400" height="60" rx="12" fill="#E9F5EC" stroke="#1E7B34" stroke-width="3.5"/>
<text x="500" y="338" font-size="24" text-anchor="middle" fill="#1E7B34" font-weight="bold">1/2 est irréductible</text>
<text x="500" y="400" font-size="21" text-anchor="middle" fill="#333">On divise jusqu’à ce que plus aucun entier ne divise les deux termes.</text>
</g></svg>