<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Écritures simplifiées</text>
<g font-family="serif">
<rect x="110" y="130" width="180" height="120" rx="12" fill="#F7F3EE" stroke="#1F4E79" stroke-width="3"/><text x="200" y="175" font-size="22" text-anchor="middle" fill="#333">5 × a</text><text x="200" y="225" font-size="30" text-anchor="middle" fill="#C2185B" font-weight="bold">= 5a</text><rect x="320" y="130" width="180" height="120" rx="12" fill="#F7F3EE" stroke="#1F4E79" stroke-width="3"/><text x="410" y="175" font-size="22" text-anchor="middle" fill="#333">a × b</text><text x="410" y="225" font-size="30" text-anchor="middle" fill="#C2185B" font-weight="bold">= ab</text><rect x="530" y="130" width="180" height="120" rx="12" fill="#F7F3EE" stroke="#1F4E79" stroke-width="3"/><text x="620" y="175" font-size="22" text-anchor="middle" fill="#333">x × x</text><text x="620" y="225" font-size="30" text-anchor="middle" fill="#C2185B" font-weight="bold">= x²</text><rect x="740" y="130" width="180" height="120" rx="12" fill="#F7F3EE" stroke="#1F4E79" stroke-width="3"/><text x="830" y="175" font-size="22" text-anchor="middle" fill="#333">1 × x</text><text x="830" y="225" font-size="30" text-anchor="middle" fill="#C2185B" font-weight="bold">= x</text>
<rect x="220" y="290" width="560" height="64" rx="12" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3.5"/>
<text x="500" y="330" font-size="23" text-anchor="middle" fill="#1F4E79" font-weight="bold">le nombre d’abord : a × 5 s’écrit aussi 5a</text>
<text x="500" y="395" font-size="21" text-anchor="middle" fill="#333">1 × x s’écrit x tout court ; x × x se lit « x au carré ».</text>
</g></svg>