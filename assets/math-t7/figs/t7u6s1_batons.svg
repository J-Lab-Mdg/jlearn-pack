<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Dépouillement par paquets de cinq</text>
<g font-family="serif">
<text x="190" y="152" font-size="24" text-anchor="end" fill="#1F4E79" font-weight="bold">Soa</text><g stroke="#1F4E79" stroke-width="4"><line x1="225" y1="120" x2="225" y2="165"/><line x1="247" y1="120" x2="247" y2="165"/><line x1="269" y1="120" x2="269" y2="165"/><line x1="291" y1="120" x2="291" y2="165"/><line x1="215" y1="162" x2="300" y2="122"/></g><g stroke="#1F4E79" stroke-width="4"><line x1="335" y1="120" x2="335" y2="165"/><line x1="357" y1="120" x2="357" y2="165"/><line x1="379" y1="120" x2="379" y2="165"/><line x1="401" y1="120" x2="401" y2="165"/><line x1="325" y1="162" x2="410" y2="122"/></g><line x1="445" y1="120" x2="445" y2="165" stroke="#1F4E79" stroke-width="4"/><line x1="467" y1="120" x2="467" y2="165" stroke="#1F4E79" stroke-width="4"/><text x="504" y="152" font-size="24" fill="#1F4E79" font-weight="bold">= 12</text><text x="190" y="247" font-size="24" text-anchor="end" fill="#C2185B" font-weight="bold">Rado</text><g stroke="#C2185B" stroke-width="4"><line x1="225" y1="215" x2="225" y2="260"/><line x1="247" y1="215" x2="247" y2="260"/><line x1="269" y1="215" x2="269" y2="260"/><line x1="291" y1="215" x2="291" y2="260"/><line x1="215" y1="257" x2="300" y2="217"/></g><g stroke="#C2185B" stroke-width="4"><line x1="335" y1="215" x2="335" y2="260"/><line x1="357" y1="215" x2="357" y2="260"/><line x1="379" y1="215" x2="379" y2="260"/><line x1="401" y1="215" x2="401" y2="260"/><line x1="325" y1="257" x2="410" y2="217"/></g><text x="460" y="247" font-size="24" fill="#C2185B" font-weight="bold">= 10</text><text x="190" y="342" font-size="24" text-anchor="end" fill="#1E7B34" font-weight="bold">Tina</text><g stroke="#1E7B34" stroke-width="4"><line x1="225" y1="310" x2="225" y2="355"/><line x1="247" y1="310" x2="247" y2="355"/><line x1="269" y1="310" x2="269" y2="355"/><line x1="291" y1="310" x2="291" y2="355"/><line x1="215" y1="352" x2="300" y2="312"/></g><line x1="335" y1="310" x2="335" y2="355" stroke="#1E7B34" stroke-width="4"/><line x1="357" y1="310" x2="357" y2="355" stroke="#1E7B34" stroke-width="4"/><line x1="379" y1="310" x2="379" y2="355" stroke="#1E7B34" stroke-width="4"/><text x="416" y="342" font-size="24" fill="#1E7B34" font-weight="bold">= 8</text>
<rect x="640" y="115" width="300" height="245" rx="14" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3.5"/>
<text x="790" y="160" font-size="22" text-anchor="middle" fill="#1F4E79" font-weight="bold">chaque paquet barré</text>
<text x="790" y="198" font-size="22" text-anchor="middle" fill="#1F4E79" font-weight="bold">= 5 bulletins</text>
<text x="790" y="252" font-size="21" text-anchor="middle" fill="#222">Soa : 2 paquets + 2 = 12</text>
<text x="790" y="290" font-size="21" text-anchor="middle" fill="#222">Rado : 2 paquets = 10</text>
<text x="790" y="328" font-size="21" text-anchor="middle" fill="#222">Tina : 1 paquet + 3 = 8</text>
<text x="500" y="408" font-size="21" text-anchor="middle" fill="#333">Barrer le paquet de cinq ferme le comptage : rien ne se recompte.</text>
</g></svg>