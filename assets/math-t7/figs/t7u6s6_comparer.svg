<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Comparer les probabilités</text>
<g font-family="serif">
<rect x="120" y="125" width="140" height="60" rx="10" fill="#F7F3EE" stroke="#1F4E79" stroke-width="3"/><text x="190" y="164" font-size="24" text-anchor="middle" fill="#1F4E79" font-weight="bold">bleu</text><rect x="280" y="132" width="185" height="46" rx="8" fill="#1F4E79" opacity="0.85"/><text x="480" y="163" font-size="21" fill="#222" font-weight="bold">1/6 ≈ 0,17</text><rect x="120" y="210" width="140" height="60" rx="10" fill="#F7F3EE" stroke="#C00000" stroke-width="3"/><text x="190" y="249" font-size="24" text-anchor="middle" fill="#C00000" font-weight="bold">rouge</text><rect x="280" y="217" width="370" height="46" rx="8" fill="#C00000" opacity="0.85"/><text x="665" y="248" font-size="21" fill="#222" font-weight="bold">1/3 ≈ 0,33</text><rect x="120" y="295" width="140" height="60" rx="10" fill="#F7F3EE" stroke="#1E7B34" stroke-width="3"/><text x="190" y="334" font-size="24" text-anchor="middle" fill="#1E7B34" font-weight="bold">vert</text><rect x="280" y="302" width="555" height="46" rx="8" fill="#1E7B34" opacity="0.85"/><text x="850" y="333" font-size="21" fill="#222" font-weight="bold">1/2 = 0,50</text>
<text x="500" y="395" font-size="22" text-anchor="middle" fill="#333">Comparer les événements, c’est comparer leurs fractions : 1/6 &lt; 1/3 &lt; 1/2.</text>
</g></svg>