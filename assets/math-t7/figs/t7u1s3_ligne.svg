<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Placer une fraction sur la ligne</text>
<g font-family="serif">
<line x1="120" y1="205" x2="120" y2="245" stroke="#1F4E79" stroke-width="3.5"/><text x="120" y="282" font-size="26" text-anchor="middle" fill="#333">0</text><line x1="360" y1="205" x2="360" y2="245" stroke="#1F4E79" stroke-width="3.5"/><text x="360" y="282" font-size="26" text-anchor="middle" fill="#333">1</text><line x1="600" y1="205" x2="600" y2="245" stroke="#1F4E79" stroke-width="3.5"/><text x="600" y="282" font-size="26" text-anchor="middle" fill="#333">2</text><line x1="840" y1="205" x2="840" y2="245" stroke="#1F4E79" stroke-width="3.5"/><text x="840" y="282" font-size="26" text-anchor="middle" fill="#333">3</text><line x1="180" y1="214" x2="180" y2="236" stroke="#7A99AF" stroke-width="2.5"/><line x1="240" y1="214" x2="240" y2="236" stroke="#7A99AF" stroke-width="2.5"/><line x1="300" y1="214" x2="300" y2="236" stroke="#7A99AF" stroke-width="2.5"/><line x1="420" y1="214" x2="420" y2="236" stroke="#7A99AF" stroke-width="2.5"/><line x1="480" y1="214" x2="480" y2="236" stroke="#7A99AF" stroke-width="2.5"/><line x1="540" y1="214" x2="540" y2="236" stroke="#7A99AF" stroke-width="2.5"/><line x1="660" y1="214" x2="660" y2="236" stroke="#7A99AF" stroke-width="2.5"/><line x1="720" y1="214" x2="720" y2="236" stroke="#7A99AF" stroke-width="2.5"/><line x1="780" y1="214" x2="780" y2="236" stroke="#7A99AF" stroke-width="2.5"/>
<line x1="105" y1="225" x2="895" y2="225" stroke="#1F4E79" stroke-width="4"/>
<circle cx="540" cy="225" r="10" fill="#C2185B"/>
<text x="540" y="175" font-size="27" text-anchor="middle" fill="#C2185B" font-weight="bold">7/4</text>
<path d="M120 330 Q 330 385 540 330" fill="none" stroke="#1E7B34" stroke-width="3.5"/>
<text x="330" y="375" font-size="22" text-anchor="middle" fill="#1E7B34">7 parts d’un quart</text>
<rect x="620" y="120" width="330" height="90" rx="12" fill="#E9F5EC" stroke="#1E7B34" stroke-width="3"/>
<text x="785" y="158" font-size="22" text-anchor="middle" fill="#1E7B34" font-weight="bold">7/4 = 1 + 3/4</text>
<text x="785" y="192" font-size="19" text-anchor="middle" fill="#555">une unité + 3 quarts</text>
<text x="500" y="415" font-size="22" text-anchor="middle" fill="#333">La fraction peut dépasser 1 : on sort l’entier.</text>
</g></svg>