<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Les unités de volume : marches de mille</text>
<g font-family="serif">
<rect x="160" y="110" width="190" height="60" fill="#FCE4D6" stroke="#1F4E79" stroke-width="2.5"/><text x="255" y="150" font-size="25" text-anchor="middle" fill="#1F4E79" font-weight="bold">m³</text><rect x="350" y="160" width="190" height="60" fill="#EAF2F8" stroke="#1F4E79" stroke-width="2.5"/><text x="445" y="200" font-size="25" text-anchor="middle" fill="#1F4E79" font-weight="bold">dm³</text><rect x="540" y="210" width="190" height="60" fill="#FCE4D6" stroke="#1F4E79" stroke-width="2.5"/><text x="635" y="250" font-size="25" text-anchor="middle" fill="#1F4E79" font-weight="bold">cm³</text><rect x="730" y="260" width="190" height="60" fill="#EAF2F8" stroke="#1F4E79" stroke-width="2.5"/><text x="825" y="300" font-size="25" text-anchor="middle" fill="#1F4E79" font-weight="bold">mm³</text>
<text x="355" y="200" font-size="21" text-anchor="middle" fill="#C2185B" font-weight="bold">×1000</text><text x="545" y="250" font-size="21" text-anchor="middle" fill="#C2185B" font-weight="bold">×1000</text><text x="735" y="300" font-size="21" text-anchor="middle" fill="#C2185B" font-weight="bold">×1000</text>
<rect x="200" y="315" width="600" height="60" rx="12" fill="#E9F5EC" stroke="#1E7B34" stroke-width="3"/>
<text x="500" y="353" font-size="23" text-anchor="middle" fill="#1E7B34" font-weight="bold">1 m³ = 1 000 dm³ ; 1 dm³ = 1 000 cm³</text>
<text x="500" y="410" font-size="21" text-anchor="middle" fill="#333">Attention : les volumes passent de mille en mille, pas de dix en dix.</text>
</g></svg>