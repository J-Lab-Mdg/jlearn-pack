<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">De gauche à droite</text>
<g font-family="serif">
<rect x="140" y="115" width="720" height="70" rx="12" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3.5"/>
<text x="500" y="158" font-size="28" text-anchor="middle" fill="#1F4E79" font-weight="bold">−7 + 12 − 5 + 8</text>
