<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="serif" font-size="30" font-weight="bold" fill="#1F4E79">Les quatre étapes</text>
<g font-family="serif">
<circle cx="150" cy="175" r="34" fill="#1F4E79"/><text x="150" y="187" font-size="30" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="150" y="250" font-size="22" text-anchor="middle" fill="#1F4E79" font-weight="bold">Choisir l’inconnue</text><text x="150" y="288" font-size="17" text-anchor="middle" fill="#333">lettre + ce qu’elle désigne</text><path d="M192 175 L212 175" stroke="#C2185B" stroke-width="3.5"/><circle cx="385" cy="175" r="34" fill="#1F4E79"/><text x="385" y="187" font-size="30" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="385" y="250" font-size="22" text-anchor="middle" fill="#1F4E79" font-weight="bold">Traduire</text><text x="385" y="288" font-size="17" text-anchor="middle" fill="#333">chaque donnée → relation</text><path d="M427 175 L447 175" stroke="#C2185B" stroke-width="3.5"/><circle cx="620" cy="175" r="34" fill="#1F4E79"/><text x="620" y="187" font-size="30" text-anchor="middle" fill="#fff" font-weight="bold">3</text><text x="620" y="250" font-size="22" text-anchor="middle" fill="#1F4E79" font-weight="bold">Résoudre</text><text x="620" y="288" font-size="17" text-anchor="middle" fill="#333">propriétés de l’égalité</text><path d="M662 175 L682 175" stroke="#C2185B" stroke-width="3.5"/><circle cx="855" cy="175" r="34" fill="#1F4E79"/><text x="855" y="187" font-size="30" text-anchor="middle" fill="#fff" font-weight="bold">4</text><text x="855" y="250" font-size="22" text-anchor="middle" fill="#1F4E79" font-weight="bold">Vérifier</text><text x="855" y="288" font-size="17" text-anchor="middle" fill="#333">dans l’énoncé, phrase réponse</text>
<rect x="220" y="330" width="560" height="62" rx="12" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3.5"/>
<text x="500" y="369" font-size="22" text-anchor="middle" fill="#1F4E79" font-weight="bold">une méthode, toujours la même, quel que soit le problème</text>
</g></svg>