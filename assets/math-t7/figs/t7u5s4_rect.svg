e="#7A99AF" stroke-width="1.5"/><rect x="270" y="145" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="270" y="190" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="270" y="235" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="270" y="280" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="315" y="100" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="315" y="145" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="315" y="190" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="315" y="235" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="315" y="280" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="360" y="100" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="360" y="145" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="360" y="190" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="360" y="235" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="360" y="280" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="405" y="100" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="405" y="145" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="405" y="190" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/><rect x="405" y="235" width="45" height="45" fill="#FAFCFD" stroke="#7A99AF" stroke-width="1.5"/><rect x="405" y="280" width="45" height="45" fill="#EAF2F8" stroke="#7A99AF" stroke-width="1.5"/>
<rect x="90" y="100" width="360" height="225" fill="none" stroke="#1F4E79" stroke-width="4"/>
<text x="270" y="88" font-size="23" text-anchor="middle" fill="#1F4E79" font-weight="bold">L = 8 carreaux</text>
<text x="475" y="218" font-size="23" fill="#1F4E79" font-weight="bold">l = 5</text>
<rect x="540" y="110" width="400" height="215" rx="12" fill="#EAF2F8" stroke="#1F4E79" stroke-width="3.5"/>
<text x="740" y="155" font-size="23" text-anchor="middle" fill="#1F4E79" font-weight="bold">A = L × l</text>
<text x="740" y="203" font-size="23" text-anchor="middle" fill="#222">8 × 5 = 40</text>
<text x="740" y="252" font-size="25" text-anchor="middle" fill="#1F4E79" font-weight="bold">A = 40 cm²</text>
<text x="740" y="296" font-size="18" text-anchor="middle" fill="#555">si le carreau vaut 1 cm²</text>
<text x="500" y="400" font-size="23" text-anchor="middle" fill="#333">L’aire est le nombre de carreaux-unité : les rangées donnent la multiplication.</text>
